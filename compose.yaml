# The server's image is built on the agent image: docker build -t rollforward-agent agent, first.
services:
  rollforward:
    build: .
    restart: unless-stopped
    # a stop waits up to 10 s for what runs had sent to be answered
    stop_grace_period: 20s
    init: true
    ports: ["127.0.0.1:8780:8780"]
    env_file: .env
    volumes: ["data:/data"]
    # bubblewrap, for each run's sandbox, needs to mount /proc and make namespaces
    security_opt: [seccomp=unconfined, systempaths=unconfined]
volumes:
  data:
