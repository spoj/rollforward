services:
  rollforward:
    build: .
    restart: unless-stopped
    init: true
    ports: ["127.0.0.1:8780:8780"]
    env_file: .env
    volumes: ["data:/data"]
    # bubblewrap, for each run's sandbox, needs to mount /proc and make namespaces
    security_opt: [seccomp=unconfined, systempaths=unconfined]
volumes:
  data:
