// Your logins, each with what it offers a run, which you tick when you start or take over an instance.
function loginsHtml(s) {
  let h = `<div class="sub">Every login is yours alone. A run uses only its runner's logins, and only those ticked for its instance. Nothing here is a password: you sign in to each system yourself.</div>`;
  const m365 = s.logins.find(l => l.id === 'm365');
  if (me.m365 && !m365) h += `<h3>Microsoft 365</h3><div class="sub">Read-only: your mail and the shared mailboxes you can read, your OneDrive and the SharePoint sites you add.</div><div><a class="btn primary" href="/logins/m365/connect">Connect Microsoft 365</a></div>`;
  for (const l of s.logins.filter(l => l.kind === 'm365')) {
    h += `<h3>${esc(l.name)}</h3><div class="sub">${esc(l.account ?? '')}${l.account ? ' · ' : ''}${l.expired ? '<span class="q">expired: sign in again</span>' : `since ${esc(when(l.since))}`}</div>`
      + l.offers.map(o => `<div class="skill-row" style="display:flex;align-items:center"><span style="flex:1">${esc(o.name)}</span>${l.id === 'm365' ? `<button class="quiet" data-act="unoffer" data-id="${esc(o.id)}">Remove</button>` : ''}</div>`).join('');
    if (l.id === 'm365') h += `<div class="row2"><input type="text" id="offer-mailbox" placeholder="A shared mailbox, such as ap@example.com" style="flex:1"><button class="btn" data-act="offer-mailbox">Add</button></div>`
      + `<div class="row2"><input type="text" id="offer-site" placeholder="A SharePoint site's link" style="flex:1"><button class="btn" data-act="offer-site">Add</button></div>`;
    h += `<div class="row2">${l.id === 'm365' && l.expired ? '<a class="btn primary" href="/logins/m365/connect">Sign in again</a>' : ''}<button class="btn" data-act="signout-login" data-id="${esc(l.id)}">Sign out</button></div>`;
  }
  if (s.sites.length) h += `<h3>Websites</h3><div class="sub">Sign in yourself, in a browser shown here. Your login is what that browser keeps, its cookies, never your password; a run's browser starts from it and brings it back refreshed. It reaches only the hosts listed, but there it can do whatever you can: the agent is told only to read, and each run's log counts its writes.</div>`
    + s.sites.map(w => {
      const l = s.logins.find(l => l.id === `web:${w.id}`);
      return `<div class="skill-row" style="display:flex;align-items:center;gap:8px"><span style="flex:1">${esc(w.name)} <span class="sub">${esc([new URL(w.url).hostname, ...w.hosts].join(', '))}${l ? ` · since ${esc(when(l.since))}` : ''}</span></span>`
        + `<button class="btn" data-act="web-signin" data-id="${esc(w.id)}" data-name="${esc(w.name)}">${l ? 'Sign in again' : 'Sign in'}</button>${l ? `<button class="quiet" data-act="signout-login" data-id="${esc(l.id)}">Sign out</button>` : ''}</div>`;
    }).join('');
  if (!s.logins.length && !me.m365 && !s.sites.length) h += '<div class="sub">No logins yet.</div>';
  return h;
}

// Ticks: which of your logins an instance may use, asked whenever you start, copy or take over one, or allow wakes.
const ticksHtml = offers => offers.length ? offers.map(o => `<label class="skill-row"><input type="checkbox" class="tick" value="${esc(o.id)}"> ${esc(o.name)}</label>`).join('')
  : '<div class="sub">You have no logins yet; add them under Logins. The agent can still work with the files people bring.</div>';
const ticked = () => [...document.querySelectorAll('#pv input.tick:checked')].map(i => i.value);
const myOffers = async () => (await api('/logins')).flatMap(l => l.offers);

function startHtml(s) {
  return (s.label !== undefined ? `<h3>Label</h3><input type="text" id="slabel" value="${esc(s.label)}" placeholder="such as a date">` : '')
    + `<h3>Logins this instance may use</h3>` + ticksHtml(s.offers) + `<div><button class="btn primary" data-act="start-go">${esc(s.go)}</button></div>`;
}

// What waits on you: questions in instances you run, requests to start a series you can see, and chains of wakes that broke.
function waiting() {
  const out = [], at = (w, s, i) => `<a href="#/${i?.id ?? w.id}">${esc(w.name)} · ${esc(s.name)}${i ? ' · ' + esc(i.label) : ''}</a>`;
  for (const w of tree.filter(w => !w.archived)) for (const s of w.series.filter(s => !s.archived)) {
    for (const i of s.instances) {
      const n = i.questions.filter(e => e === me.email).length;
      if (n) out.push(`<div class="wt">${at(w, s, i)}: ${n} question${n > 1 ? 's' : ''} for you</div>`);
    }
    for (const r of s.requests) out.push(`<div class="wt">${at(w, s)}: ${esc(r.from.split('/').slice(-2).join(' · '))} asks to start ${esc(r.label)} <button class="btn" data-act="req-start" data-id="${esc(r.id)}">Start</button></div>`);
    if (s.allow_wakes === me.email && !s.instances.some(i => i.status === 'open') && !s.wake && !s.requests.length) out.push(`<div class="wt">${at(w, s)}: wakes itself, but nothing is open and no wake is set</div>`);
  }
  return [...out, ...expired.map(l => `<div class="wt">Your ${esc(l.name)} login has expired: <a data-act="logins">sign in again</a></div>`)];
}

async function openLogins() {
  const [logins, sites] = await Promise.all([api('/logins'), api('/websites')]);
  pv = { title: 'Logins', settings: { kind: 'logins', logins, sites } };

}

// A sign-in's live browser; closing it otherwise than by Save login throws it away.
function closePv() {
  if (pv?.signin) api(`/signins/${pv.signin}`, { method: 'DELETE' }).catch(() => {});
  pv = null;
  renderPv();
}

async function openStart(title, go, then, label) {
  pv = { title, settings: { kind: 'start', go, then, label, offers: await myOffers() } };
  renderPv();
  $('#slabel')?.focus();
}

async function preview(path, item) {
  const sheet = /\.(xlsx|xlsm|xls|csv|eml)$/i.test(path), text = /\.(md|txt|json|py|sql|log)$/i.test(path);
  const p = pv = { title: fname(path), path, item: item?.id, notes: item?.notes ?? [], sheet: 0, image: /\.(png|jpe?g|gif|webp|svg)$/i.test(path), was: item && data.log.findLast(e => e.op === 'point' && e.item === item.id && e.file === path)?.was, md: /\.md$/i.test(path), loading: sheet || text };
  renderPv();
  try {
    if (sheet) Object.assign(p, await api(fileUrl(path, 'preview')));
    if (text) p.text = await (await fetch(fileUrl(path))).text();
  } finally {
    p.loading = false;
    if (pv === p) renderPv();
  }
}

async function upload(files, pane, onto) {
  const path = instPath(), mine = files.map(f => ({ f, pane, path, pct: 0 })), before = new Set(data.doc.items.map(i => i.file));
  uploads.push(...mine);
  renderPanes();
  for (const u of mine) {
    await new Promise((ok, fail) => {
      const x = new XMLHttpRequest();
      x.open('POST', `${path}/upload?pane=${pane}&name=${enc(u.f.name)}${onto ? '&onto=' + enc(onto) : ''}`);
      x.upload.onprogress = e => { u.pct = 100 * e.loaded / e.total; renderPanes(); };
      x.onload = () => (x.status < 300 ? ok() : fail(new Error(x.responseText)));
      x.onerror = () => fail(new Error(`${u.f.name} didn't upload`));
      x.send(u.f);
    }).catch(e => toast(e.message));
    uploads = uploads.filter(x => x !== u);
  }
  await refresh();
  if (shown !== path) return;
  markSeen(data.doc.items.filter(i => i.file?.startsWith('upload/') && !before.has(i.file)));
  renderPanes();
}

document.addEventListener('click', async ev => {
  if (!ev.target.closest('#side, [data-act=menu]') || ev.target.closest('#side a')) $('#side').classList.remove('open');
  const sum = ev.target.closest('#trace summary');
  if (sum) {
    folds.set(sum.parentElement.dataset.key, !sum.parentElement.open);
    return void drawn.set($('#trace'), traceHtml());
  }
  const el = ev.target.closest('[data-act], .tile, #advbar');
  if (!el) {
    if (!ev.target.closest('#card, #pv')) { openItem = null; renderCard(); renderPanes(); }
    return;
  }
  if (el.id === 'advbar') { ui.adv = !ui.adv; if (ui.adv) lines = await api(instPath() + '/trace'); return renderAdv(); }
  if (el.classList.contains('tile')) {
    openItem = openItem === el.dataset.item ? null : el.dataset.item;
    markSeen(data.doc.items.filter(i => i.id === openItem));
    renderPanes();
    return renderCard();
  }
  const act = el.dataset.act;
  if (act === 'menu') $('#side').classList.toggle('open');
  if (act === 'log' || act === 'conv' || act === 'proc') {
    const open = !ui[act];
    Object.assign(ui, { log: false, conv: false, proc: false, on: null, ref: null, [act]: open });
    renderLog(); renderBar(); placeCard();
  }
  if (act === 'comment-on') { Object.assign(ui, { log: false, conv: true, proc: false, on: el.dataset.item, ref: null }); renderLog(); renderBar(); $('#newcomment')?.focus(); }
  if (act === 'comment' || act === 'reply-thread') {
    const box = act === 'comment' ? $('#newcomment') : el.closest('.thread').querySelector('textarea'), text = box.value.trim();
    const picked = act === 'comment' ? $('#newfiles') : el.closest('.thread').querySelector('input[type=file]');
    if (!text) return;
    const files = [];
    for (const f of picked.files) files.push((await api(`${instPath()}/attach?name=${enc(f.name)}`, { method: 'POST', body: f })).file);
    await api(`${instPath()}/comment`, { method: 'POST', body: JSON.stringify(act === 'comment' ? { text, files, ...(ui.on && { item: ui.on }), ...(ui.ref && { ref: ui.ref }) } : { thread: el.dataset.thread, text, files }) });
    box.value = '';
    ui.on = ui.ref = null;
    await refresh();
  }
  if (act === 'resolve') {
    await api(`${instPath()}/resolve`, { method: 'POST', body: JSON.stringify({ thread: el.dataset.thread }) });
    await refresh();
  }
  if (act === 'uncard') { openItem = null; renderCard(); renderPanes(); }
  if (act === 'opencard') { openItem = el.dataset.item; markSeen(data.doc.items.filter(i => i.id === openItem)); renderPanes(); renderCard(); }
  if (act === 'preview') await preview(el.dataset.file, data.doc.items.find(i => i.id === el.dataset.item));
  if (act === 'unpv') closePv();
  if (act === 'settings') {
    const s = cur.s, skillList = await api('/skills');
    pv = { title: 'Series settings', settings: { kind: 'series', offers: await myOffers(), cost: s.instances.reduce((t, i) => t + i.cost, 0), closed: s.instances.filter(i => i.status === 'closed').length, id: s.id, allow_wakes: s.allow_wakes, wake: s.wake, adhoc: s.adhoc, name: s.name, skills: s.skills ?? [], skillList, reads: s.reads, archived: s.archived } };
    renderPv();
  }
  if (act === 'skills') await openSkills();
  if (act === 'workspace-settings') await openWorkspaceSettings();
  if (act === 'signout') location.href = (await api('/auth/logout', { method: 'POST' })).next;
  if (act === 'wadd' || act === 'wremove' || act === 'wrole') {
    const s = pv.settings, p = act === 'wadd' ? $('#wperson').value.trim().toLowerCase() : el.dataset.p;
    if (!p) return;
    const owners = s.owners.filter(x => x !== p), members = s.members.filter(x => x !== p);
    if (act === 'wadd') members.push(p);
    if (act === 'wrole') (s.owners.includes(p) ? members : owners).push(p);
    await api(`/api/workspaces/${cur.w.id}`, { method: 'PUT', body: JSON.stringify({ owners, members }) });
    await refresh();
    await openWorkspaceSettings();
  }
  if (act === 'archive') {
    const s = pv.settings;
    await api(s.kind === 'series' ? seriesPath(cur) : `/api/workspaces/${cur.w.id}`, { method: 'PUT', body: JSON.stringify({ archived: !s.archived }) });
    pv = null;
    renderPv();
    await refresh();
  }
  if (act === 'savesettings') {
    const name = $('#sname').value.trim();
    const skills = [...document.querySelectorAll('#pv input.skill:checked')].map(i => i.value);
    await api(seriesPath(cur), { method: 'PUT', body: JSON.stringify({ name, skills, archived: pv.settings.archived, ...($('#swakes').checked !== !!pv.settings.allow_wakes && { allow_wakes: $('#swakes').checked, logins: ticked() }) }) });
    pv = null;
    renderPv();
    await refresh();
  }
  if (act === 'rename') {
    const label = (prompt('New label:', cur.i.label) || '').trim();
    if (!label || label === cur.i.label) return;
    await api(`${instPath()}/rename?as=${enc(label)}`, { method: 'POST' });
    await refresh();
  }
  if (act === 'wakes-mine') {
    await api(seriesPath(cur), { method: 'PUT', body: JSON.stringify({ allow_wakes: true, logins: ticked() }) });
    pv = null;
    renderPv();
    await refresh();
  }
  if (act === 'wake-move' || act === 'wake-cancel') {
    const id = pv.settings.id;
    if (act === 'wake-move') await api(`/api/wakes/${id}`, { method: 'PUT', body: JSON.stringify({ at: new Date($('#swake').value).toISOString() }) });
    else await api(`/api/wakes/${id}`, { method: 'DELETE' });
    pv = null;
    renderPv();
    await refresh();
  }
  if (act === 'req-start') await openStart('Start the instance asked for', 'Start', ({ logins }) => api(`/api/requests/${el.dataset.id}`, { method: 'POST', body: JSON.stringify({ logins }) }));
  if (act === 'req-drop') {
    await api(`/api/requests/${el.dataset.id}`, { method: 'DELETE' });
    await refresh();
  }
  if (act === 'promote') {
    const name = (prompt('Name of the new series, which later instances roll forward from:') || '').trim();
    if (!name) return;
    await api(`${instPath()}/promote`, { method: 'POST', body: JSON.stringify({ name }) });
    await refresh();
  }
  if (act === 'compare') {
    const p = pv;
    p.old ??= (await api(fileUrl(p.was, 'preview'))).sheets;
    p.cmp = !p.cmp;
    if (pv === p) renderPv();
  }
  if (act === 'duplicate') await openStart(`Copy ${cur.i.label}`, 'Copy', ({ label, logins }) => api(`${instPath()}/duplicate?as=${enc(label)}`, { method: 'POST', body: JSON.stringify({ logins }) }), `${cur.i.label} copy`);
  if (act === 'sheet') { pv.sheet = Number(el.dataset.k); renderPv(); }
  if (act === 'cell') {
    // A cell's notes, and, on an item's file in an open instance, a comment on that cell.
    const on = data?.doc.status === 'open' && pv.item;
    put($('#pvn'), `${esc(el.dataset.note ?? '')}${on ? `<div><button class="btn" data-act="comment-cell" data-ref="${esc(el.dataset.ref)}">Comment on ${esc(el.dataset.ref)}</button></div>` : ''}`);
  }
  if (act === 'comment-cell') {
    const item = pv.item;
    pv = null;
    renderPv();
    Object.assign(ui, { log: false, conv: true, proc: false, on: item, ref: el.dataset.ref });
    renderLog(); renderBar();
    $('#newcomment')?.focus();
  }
  if (act === 'toggle-closed') { showClosed = !showClosed; renderSide(); }
  if (act === 'toggle-archived') { showArchived = !showArchived; renderSide(); }
  if (act === 'add') {
    const p = $('#picker');
    p.dataset.pane = el.dataset.pane;
    p.dataset.onto = el.dataset.item ?? '';
    p.multiple = !el.dataset.item;
    p.value = '';
    p.click();
  }
  if (act === 'answer') {
    await api(`${instPath()}/answer`, { method: 'POST', body: JSON.stringify({ note: el.dataset.note, choice: Number(el.dataset.choice) }) });
    await refresh();
  }
  if (act === 'close') {
    const qs = data.doc.items.flatMap(i => i.notes ?? []).filter(n => n.options && questionState(n) === null);
    const msg = `Close ${cur.i.label}? It becomes an example for later instances.` + (qs.length ? '\n\nUnanswered questions take their defaults:\n' + qs.map(n => `• ${n.options[n.default ?? 0]}`).join('\n') : '');
    if (!confirm(msg)) return;
    await api(`${instPath()}/close`, { method: 'POST' });
    await refresh();
  }
  if (act === 'abandon') {
    if (!confirm(`Abandon ${cur.i.label}? It stays as it is, but isn't an example or a starting point for later instances.`)) return;
    await api(`${instPath()}/abandon`, { method: 'POST' });
    await refresh();
  }
  if (act === 'new-instance') await openStart('New instance', 'Start', ({ label, logins }) => api(seriesPath(cur), { method: 'POST', body: JSON.stringify({ label, logins }) }), '');
  if (act === 'takeover') await openStart(`Take over ${cur.i.label}`, 'Take over', ({ logins }) => api(`${instPath()}/takeover`, { method: 'POST', body: JSON.stringify({ logins }) }));
  if (act === 'start-go') {
    const s = pv.settings, label = $('#slabel')?.value.trim();
    if (label === '') return toast('Give it a label');
    const r = await s.then({ label, logins: ticked() });
    pv = null;
    renderPv();
    if (r?.id) go(r.id);
    else await refresh();
  }
  if (act === 'logins') await openLogins();
  if (act === 'tokens') await openTokens();
  if (act === 'people') {
    pv = { title: 'People', settings: { kind: 'people', users: await api('/users') } };
    renderPv();
  }
  if (act === 'new-token') {
    const name = $('#tname').value.trim();
    if (!name) return toast('Name the token, such as laptop');
    await openTokens((await api('/tokens', { method: 'POST', body: JSON.stringify({ name, days: Number($('#tdays').value) }) })).token);
  }
  if (act === 'revoke-token') {
    await api(`/tokens/${enc(el.dataset.id)}`, { method: 'DELETE' });
    await openTokens();
  }
  if (act === 'waiting') {
    pv = { title: 'Waiting on you', settings: { kind: 'waiting' } };
    renderPv();
  }
  if (act === 'guidance') {
    pv = { title: "The company's guidance", settings: { kind: 'guidance', guidance: (await api('/guidance')).text } };
    renderPv();
  }
  if (act === 'save-guidance') {
    const text = $('#guidance').value;
    await api(`/api/workspaces/${cur.w.id}`, { method: 'PUT', body: JSON.stringify({ guidance: text }) });
    pv.settings.guidance = text;
    toast('Guidance saved', 'ok');
    await refresh();
  }
  if (act === 'offer-mailbox' || act === 'offer-site') {
    const v = $(`#${act}`).value.trim();
    if (!v) return;
    await api('/logins/m365/offers', { method: 'POST', body: JSON.stringify(act === 'offer-site' ? { site: v } : { mailbox: v }) });
    pv.settings.logins = await api('/logins');
    renderPv();
  }
  if (act === 'unoffer') {
    await api(`/logins/m365/offers/${enc(el.dataset.id)}`, { method: 'DELETE' });
    pv.settings.logins = await api('/logins');
    renderPv();
  }
  if (act === 'web-signin') {
    pv = { title: `Sign in to ${el.dataset.name}`, signin: (await api(`/logins/web/${enc(el.dataset.id)}`, { method: 'POST' })).id };
    renderPv();
  }
  if (act === 'signin-save') {
    await api(`/signins/${pv.signin}`, { method: 'POST' });
    await openLogins();
  }
  if (act === 'signout-login') {
    await api(`/logins/${enc(el.dataset.id)}`, { method: 'DELETE' });
    pv.settings.logins = await api('/logins');
    renderPv();
  }
  if (act === 'new-series') {
    const name = (prompt('Name of the new series:') || '').trim();
    if (!name) return;
    go((await api('/api/series', { method: 'POST', body: JSON.stringify({ workspace: cur.w.id, name }) })).id);
  }
  if (act === 'new-workspace') {
    const name = (prompt('Name of the new workspace, such as a client:') || '').trim();
    if (!name) return;
    go((await api('/api/workspaces', { method: 'POST', body: JSON.stringify({ name }) })).id);
  }
});

$('#picker').addEventListener('change', e => upload([...e.target.files], e.target.dataset.pane, e.target.dataset.onto));
$('#interrupt').addEventListener('click', async () => {
  if (!data?.run) return;
  await api(`${instPath()}/interrupt`, { method: 'POST' });
  await refresh();
});

for (const type of ['dragover', 'dragleave', 'drop']) {
  $('#panes').addEventListener(type, e => {
    const pane = e.target.closest('.pane'), t = e.target.closest('.tile');
    if (!pane || data?.doc.status !== 'open' || !e.dataTransfer.types.includes('Files')) return;
    e.preventDefault();
    document.querySelectorAll('.drag').forEach(x => x.classList.remove('drag'));
    if (type === 'dragover') (t ?? pane).classList.add('drag');
    if (type === 'drop') upload([...e.dataTransfer.files], pane.dataset.pane, t?.dataset.item);
  });
}
addEventListener('dragover', e => { if (!e.defaultPrevented) { e.preventDefault(); e.dataTransfer.dropEffect = 'none'; } });
addEventListener('drop', e => e.preventDefault());
$('#panes').addEventListener('scroll', () => { placeCard(); drawEdges(); }, true);
$('#panes').addEventListener('mouseover', e => {
  const id = e.target.closest('.tile')?.dataset.item ?? null;
  if (id !== hover) { hover = id; drawEdges(); }
});
$('#panes').addEventListener('mouseleave', () => { hover = null; drawEdges(); });
new ResizeObserver(() => { placeCard(); drawEdges(); }).observe($('#panes'));
document.fonts.ready.then(drawEdges);

addEventListener('hashchange', () => {
  openItem = null; folds.clear(); prevSigs = {};
  $('#panes').scrollTop = $('#flow').scrollTop = $('#flow').scrollLeft = $('#outs').scrollTop = $('#log').scrollTop = 0;
  $('#trace').scrollTop = $('#trace').scrollHeight;
  closePv();
  $('#side').classList.remove('open');
  refresh();
});
addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (pv) closePv();
  else if ($('#side').classList.contains('open')) $('#side').classList.remove('open');
  else if (openItem) { openItem = null; renderCard(); renderPanes(); }
  else if (ui.log || ui.conv || ui.proc) { ui.log = ui.conv = ui.proc = false; renderLog(); renderBar(); }
  else if (ui.adv) { ui.adv = false; renderAdv(); }
});
// Microsoft sends people back to #logins after they connect Microsoft 365.
const backFromMicrosoft = location.hash === '#logins';
if (backFromMicrosoft) history.replaceState(null, '', '#/');
refresh().then(() => backFromMicrosoft && openLogins());
// The server names what changed: "tree" for names, settings, wakes and logins, else an instance by its id. The page catches up one
// refresh at a time, and when it comes back into view.
const pend = new Set();
let busy = false;
async function drain() {
  if (busy || document.hidden || !pend.size) return;
  busy = true;
  const ids = [...pend];
  pend.clear();
  await (ids.includes('tree') ? refresh() : patch(ids)).catch(console.error);
  busy = false;
  drain();
}
const events = new EventSource('/api/events');
events.onmessage = e => { pend.add(e.data); drain(); };
events.onopen = () => { pend.add('tree'); drain(); };
// The browser gives up on a stream that comes back with an error, as during a deploy or once the session has ended.
events.onerror = () => events.readyState === EventSource.CLOSED && setTimeout(() => location.reload(), 5000);
addEventListener('visibilitychange', drain);
</script>
</body>
