<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rollforward</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Tokens and rules: docs/design.md. Blue = uploaded by a person, ink = made by the agent, red = waiting on a reply. */
:root {
  --paper: #f6f7f8; --sheet: #ffffff; --rule: #e3e6ea; --rule-2: #cdd2d9;
  --ink: #15181d; --ink-2: #474e5b; --ink-3: #6b7280;
  --person: #1f48c7; --person-bg: #eef2fc; --red: #d42a1e; --edge: #a3aab4;
  --r1: 4px; --r2: 8px;
  --sans: "IBM Plex Sans", "Noto Sans", sans-serif; --mono: "IBM Plex Mono", "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; font: 14px/1.45 var(--sans); color: var(--ink); background: var(--paper); font-variant-numeric: tabular-nums; }
button { font: inherit; cursor: pointer; }
a { color: inherit; }
.app { --side: clamp(180px, var(--side-w, 256px), 30vw); --panel: clamp(280px, var(--panel-w, 352px), 50vw); display: grid; grid-template-columns: var(--side) 1fr auto; height: 100dvh; }
/* Pane widths: the sidebar's and the side panel's inner edges drag, between the bounds above, and a double-click resets them. */
.grip { position: fixed; top: 0; bottom: 0; z-index: 5; width: 6px; cursor: col-resize; touch-action: none; }
.grip:hover, .grip:active { background: var(--rule-2); }
.grip[data-pane=side] { left: calc(var(--side) - 6px); }
.grip[data-pane=panel] { right: calc(var(--panel) - 6px); }
.log:not(.open) ~ .grip[data-pane=panel] { display: none; }

.side { border-right: 1px solid var(--rule); padding: 14px 10px; display: flex; flex-direction: column; min-height: 0; background: var(--paper); }
.side .scroll { flex: 1; min-height: 0; overflow: auto; }
.chev { all: unset; position: relative; z-index: 1; cursor: pointer; flex: none; width: 22px; align-self: stretch; display: grid; place-items: center; border-radius: var(--r1); font-size: 13px; color: var(--ink-2); }
.chev:hover { background: var(--rule); color: var(--ink); }
.row:is(.ws, .ser) > .add { display: none; }
.row:is(.ws, .ser):is(:hover, .on) > .add { display: grid; }
.row:is(.ws, .ser):is(:hover, .on) > .age { display: none; }
.row.ws .nm { font-weight: 600; color: var(--ink); }
.row.ser .nm { color: #1f5f8b; }
.seg { display: flex; margin-left: auto; margin-right: 4px; border: 1px solid var(--rule-2); border-radius: var(--r1); overflow: hidden; }
.seg button { all: unset; cursor: pointer; padding: 1px 7px; font-size: 11.5px; color: var(--ink-3); }
.seg button.sel { background: var(--sheet); color: var(--ink); }
.row { display: flex; align-items: center; gap: 2px; min-height: 30px; padding: 0 4px 0 8px; border-radius: var(--r1); text-decoration: none; }
.row.grp { margin-top: 6px; border-top: 1px solid var(--rule); border-radius: 0; }
.row.grp .nm { font-style: italic; color: var(--ink-3); }
.ticks2 { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12.5px; color: var(--ink-2); margin: 6px 0; }
.row.wake, .row.req { font-size: 12px; color: var(--ink-2); }
/* A row keeps to one line: its name gives way, cut short with the whole of it on hover; what follows it never does. */
.row .nm { flex: 1 1 0; min-width: 0; display: flex; align-items: center; padding: 5px 0; text-decoration: none; }
.row .l { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .n { flex: none; color: var(--ink-3); font-size: 12px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; padding-left: 6px; }
/* A row with a link is a link all over, but for its buttons. */
.row:has(> a.nm), a.row { position: relative; }
.row > a.nm::before { content: ''; position: absolute; inset: 0; }
.row > .add { position: relative; }
.row:is(.ws, .ser, .waits):has(> a.nm):hover, a.row.inst:not(.on):hover { background: #eceff2; }
.head { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.ws { font-size: 14px; font-weight: 600; }
.tree { margin-left: 14px; padding-left: 4px; border-left: 1px solid var(--rule-2); }
.ser { font-size: 13.5px; color: var(--ink-2); }
.ser.on { color: var(--ink); font-weight: 600; }
.inst { font-size: 13px; color: var(--ink-2); }
.inst.on { background: #e7eaee; color: var(--ink); font-weight: 500; }
.inst .q, .waits .q { color: var(--red); }
.waits .q { margin-left: 5px; }
.cnt { min-width: 16px; padding: 0 5px; border-radius: 8px; background: var(--red); color: #fff; font-size: 10.5px; font-weight: 600; line-height: 16px; text-align: center; display: inline-block; }
.waits { margin-bottom: 8px; cursor: pointer; }
.wt { padding: 7px 0; border-bottom: 1px solid var(--rule); }
.wt .btn { margin-left: 8px; }
.inst.abandoned .nm { text-decoration: line-through; }
.archived .nm { color: var(--ink-3); }
.add { all: unset; cursor: pointer; flex: none; width: 24px; height: 24px; display: grid; place-items: center; border-radius: var(--r1); color: var(--ink-3); font-size: 17px; line-height: 1; }
.add:hover { background: var(--rule); color: var(--ink); }
.quiet { display: block; padding: 5px 8px; font-size: 12px; color: var(--ink-3); background: none; border: 0; text-align: left; }
.quiet:hover { color: var(--ink); }
.vl { padding: 14px 16px; display: grid; gap: 10px; align-content: start; font-size: 13.5px; }
.vl h3 { margin: 4px 0 0; font-size: 13px; font-weight: 600; }
.vl .sub { color: var(--ink-3); font-size: 12.5px; }
.vl hr { width: 100%; margin: 6px 0 0; border: 0; border-top: 1px solid var(--rule); }
.vl input[type=text] { font: inherit; padding: 7px 9px; border: 1px solid var(--rule-2); border-radius: var(--r1); }
.pv.small { inset: 12vh auto auto 50%; transform: translateX(-50%); width: min(420px, 92vw); max-height: 80dvh; }
.vl label { display: flex; align-items: center; gap: 8px; }
.adv-set { display: grid; gap: 10px; border-top: 1px solid var(--rule); padding-top: 10px; }
.adv-set summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
.twisty { all: unset; flex: none; width: 20px; height: 20px; display: grid; place-items: center; border-radius: var(--r1); color: var(--ink-2); font-size: 15px; cursor: pointer; }
button.twisty:hover { background: var(--rule); color: var(--ink); }
.vl textarea { font: 12.5px/1.5 var(--mono); padding: 7px 9px; border: 1px solid var(--rule-2); border-radius: var(--r1); resize: vertical; min-height: 4.5em; }
.vl :is(input[type=email], input[type=password], select) { font: inherit; padding: 7px 9px; border: 1px solid var(--rule-2); border-radius: var(--r1); background: var(--sheet); min-width: 0; max-width: 100%; }
.vl .row2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ut { border-collapse: collapse; font-size: 12.5px; width: 100%; }
.ut td, .ut th { border-top: 1px solid var(--rule); padding: 6px 6px 6px 0; text-align: left; vertical-align: top; }
.ut th { font-weight: 500; color: var(--ink-3); }
.ut select { max-width: 100px; }
.acct { padding-top: 10px; border-top: 1px solid var(--rule); margin-top: 10px; display: flex; align-items: center; gap: 2px; }
.me { flex: 1; min-width: 0; display: grid; padding: 6px 8px; border-radius: var(--r1); font-size: 12.5px; color: var(--ink-2); outline: none; }
.acts2 { display: none; align-items: center; }
.acct:is(:hover, :focus-within) .acts2 { display: flex; }
.pvtabs { display: flex; gap: 4px; padding: 0 12px; border-bottom: 1px solid var(--rule); }
.me .mail { color: var(--ink-3); font-size: 12px; word-break: break-all; }
@media (max-width: 560px) { .ut th:nth-child(3), .ut td:nth-child(3), .ut th:nth-child(4), .ut td:nth-child(4) { display: none; } }
.dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--red); display: inline-block; margin-left: 6px; vertical-align: 1px; }
.dot.u { background: var(--person); }
.row .nm.b { font-weight: 600; }
.row .age { flex: none; min-width: 22px; text-align: right; font-size: 11.5px; color: var(--ink-3); padding-left: 4px; }
.key { position: absolute; right: 16px; bottom: 12px; z-index: 4; font-size: 12px; color: var(--ink-3); background: var(--sheet); border: 1px solid var(--rule-2); border-radius: 12px; padding: 2px 10px; cursor: default; }
.legend { display: none; position: absolute; right: 0; bottom: calc(100% + 6px); width: max-content; font-size: 12px; color: var(--ink-2); background: var(--sheet); border: 1px solid var(--rule-2); border-radius: var(--r1); box-shadow: 0 6px 20px rgba(21,24,29,.12); padding: 10px 12px; gap: 4px; }
.key:is(:hover, :focus-within, .show) .legend { display: grid; }
.legend .keys { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--rule); color: var(--ink-3); display: grid; gap: 2px; }
.legend kbd { font: inherit; color: var(--ink); }
.legend i { font-style: normal; font-weight: 600; }
.legend .p { color: var(--person); }
.legend .tri { display: inline-block; width: 0; height: 0; border-top: 9px solid var(--ink-3); border-left: 9px solid transparent; margin-right: 6px; }
.legend .dash { display: inline-block; width: 16px; height: 10px; border: 1px dashed var(--ink-3); border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

/* The deployment's brand (rf brand) tops the sidebar: its logo and its text, or nothing when unset. */
.brand { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 0 8px 10px; border-bottom: 1px solid var(--rule); margin-bottom: 10px; font-size: 15px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.brand:empty { display: none; }
.brand img { display: block; max-height: 32px; max-width: 100%; }

.main { display: flex; flex-direction: column; min-width: 0; height: 100dvh; position: relative; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 28px; border-bottom: 1px solid var(--rule); background: var(--sheet); }
.menu { display: none; border: 1px solid var(--rule-2); background: var(--sheet); border-radius: var(--r1); padding: 6px 10px; }
.crumb { font-size: 13px; color: var(--ink-3); }
.bar h1 { margin: 2px 0 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.ren { all: unset; cursor: pointer; color: var(--ink-3); font-size: 15px; font-weight: 400; margin-left: 6px; }
.bar h1 .t { cursor: text; }
.bar h1:hover .ren { color: var(--ink); }
/* Whose an instance is: a chip by its title, which tells more on hover or a click, and their initials on others' rows. */
.owner { position: relative; display: inline-block; vertical-align: 3px; margin-left: 10px; padding: 1px 9px; border-radius: 10px; font-size: 12.5px; font-weight: 500; letter-spacing: 0; color: var(--person); background: var(--person-bg); cursor: default; }
.owner .about { display: none; position: absolute; left: 0; top: calc(100% + 6px); z-index: 5; width: max-content; max-width: 340px; font-weight: 400; color: var(--ink-2); background: var(--sheet); border: 1px solid var(--rule-2); border-radius: var(--r1); box-shadow: 0 6px 20px rgba(21,24,29,.12); padding: 8px 12px; line-height: 1.5; }
.owner:is(:hover, :focus-within) .about { display: block; }
.who { flex: none; display: inline-block; margin-left: 6px; padding: 0 4px; border-radius: 6px; font-size: 10px; font-weight: 600; line-height: 15px; vertical-align: 1px; color: var(--person); background: var(--person-bg); }
.state { margin-left: auto; font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn { border: 1px solid var(--rule-2); background: var(--sheet); color: var(--ink); border-radius: var(--r1); padding: 7px 12px; font-size: 13px; font-weight: 500; white-space: nowrap; text-decoration: none; display: inline-block; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.commit { background: var(--person); border-color: var(--person); color: #fff; }
.btn.danger { color: var(--red); border-color: var(--red); }
.btn.share { background: var(--person); border-color: var(--person); color: #fff; transition: background .3s, border-color .3s; }
.btn.share.armed { background: #b45309; border-color: #b45309; }
.warn { display: grid; gap: 8px; border: 1px solid #b45309; background: #fff7ed; border-radius: var(--r1); padding: 10px 12px; font-size: 13px; }
.btn:disabled { background: var(--sheet); color: var(--ink-3); border-color: var(--rule-2); cursor: default; }
.btn.sel { background: var(--paper); box-shadow: inset 0 1px 2px rgba(0,0,0,.08); }
.btn:hover:not(:disabled) { border-color: var(--ink-3); background: var(--paper); }
.btn.primary:hover:not(:disabled) { background: #2b3039; border-color: #2b3039; }
.btn.commit:hover:not(:disabled) { background: #1a3eae; border-color: #1a3eae; }
.btn.danger:hover:not(:disabled) { background: #fdf1f0; border-color: var(--red); }
[aria-busy=true] { pointer-events: none; opacity: .6; cursor: progress; }

.panes { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: minmax(0, 1fr); position: relative; }
.pane { padding: 22px 28px 20px; display: flex; flex-direction: column; position: relative; overflow: auto; min-width: 0; scrollbar-gutter: stable; }
/* Always-visible scrollbars, so a long list of inputs or outputs shows it goes on (Edge's overlay scrollbars hide until hovered). */
.pane::-webkit-scrollbar { width: 10px; height: 10px; }
.pane::-webkit-scrollbar-track { background: var(--rule); }
.pane::-webkit-scrollbar-thumb { background: var(--edge); border: 2px solid var(--rule); border-radius: 6px; }
.pane::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }
@supports not selector(::-webkit-scrollbar) { .pane { scrollbar-width: thin; scrollbar-color: var(--edge) var(--rule); } }
.flow { grid-area: 1 / 1; }
.outs { grid-area: 1 / 2; overflow: hidden auto; border-left: 1px solid var(--rule); }
.cols { display: flex; gap: 64px; align-items: start; }
.col { width: 216px; flex: none; display: grid; gap: 10px; align-content: start; }
.edges { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.edges path { fill: none; stroke: var(--edge); stroke-width: 1.25; }
.edges path.hot { stroke: var(--ink); stroke-width: 1.5; }
.edges marker path { fill: var(--edge); stroke: none; }
.edges #arrow-hot path { fill: var(--ink); }
.pane.busy::before { content: ''; position: absolute; top: 0; left: -30%; width: 30%; height: 2px; background: var(--ink); animation: stripe 1.4s ease-in-out infinite; }
@keyframes stripe { to { left: 100%; } }
.pane.drag::after { content: '+ Add'; position: absolute; top: 20px; right: 28px; font-weight: 600; color: var(--person); }
.pane.drag .ph .btn { visibility: hidden; }
.pane.drag { background: var(--person-bg); }
/* A pane's heading, with + Add files, stays in view while its tiles scroll under it. */
.ph { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; min-height: 26px; margin: -22px 0 4px; padding: 22px 0 6px; position: sticky; top: -22px; z-index: 4; background: var(--paper); }
.pane.drag .ph { background: var(--person-bg); }
.ph h2 { margin: 0; font-size: 15px; font-weight: 600; }
.ph .c { font-size: 13px; color: var(--ink-3); }
.ph .btn { margin-left: auto; padding: 4px 10px; font-size: 12px; }
.tile { position: relative; z-index: 2; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r1); padding: 11px 12px 10px; min-height: 96px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; text-align: left; }
.tile.on, .tile.drag { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.ext { font: 500 10px/1 var(--mono); letter-spacing: .04em; color: var(--ink-3); display: flex; justify-content: space-between; align-items: baseline; }
.nc { font: 500 11.5px/1 var(--sans); letter-spacing: 0; color: var(--ink-3); padding-right: 10px; }
.nc.q, .legend .tri.q { color: var(--red); border-top-color: var(--red); }
.fn { font-size: 13px; font-weight: 500; line-height: 1.32; word-break: break-word; }
.file { font-size: 12px; color: var(--ink-3); word-break: break-word; }
.from { display: none; font-size: 12px; color: var(--ink-3); }
.tile.person .fn, .tile.person .meta b { color: var(--person); }
.meta { margin-top: auto; font-size: 12px; color: var(--ink-3); }
.meta b { font-weight: 500; color: var(--ink); }
.corner { position: absolute; top: -1px; right: -1px; width: 0; height: 0; border-top: 12px solid var(--ink-3); border-left: 12px solid transparent; border-top-right-radius: var(--r1); }
.tile.ghost { background: transparent; border: 1px dashed var(--rule-2); }
.tile.ghost .fn { color: var(--ink-2); font-weight: 400; }
.tile.fresh::before { content: ''; position: absolute; top: 9px; left: -4px; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); }
.tile.flash { animation: flash 1.4s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 4px var(--rule-2); } }
.corner.ask { border-top-color: var(--red); animation: ask 1.6s ease-in-out infinite; }
@keyframes ask { 50% { opacity: .3; } }
.prog { margin-top: auto; height: 3px; background: var(--rule); border-radius: 2px; }
.prog i { display: block; height: 100%; background: var(--person); border-radius: 2px; }
#toasts { position: fixed; inset: auto auto 64px 50%; transform: translateX(-50%); margin: 0; padding: 0; border: 0; background: none; overflow: visible; display: grid; gap: 6px; justify-items: center; }
#toasts:not(:popover-open) { display: none; }
.toast { background: var(--red); color: #fff; padding: 9px 14px; border-radius: var(--r1); font-size: 13px; max-width: min(560px, 92vw); white-space: pre-wrap; animation: fade 6s forwards; }
.toast.ok { background: var(--ink); }
@keyframes fade { 85% { opacity: 1; } to { opacity: 0; } }
.hint { margin-top: auto; padding-top: 18px; font-size: 12px; color: var(--ink-3); }
.hl { font-size: 12px; line-height: 1.35; }
.dst, .sent { font-size: 11.5px; color: var(--ink-2); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sent { color: #1f6f43; }
.src { font-size: 11.5px; color: var(--ink-3); word-break: break-all; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.also { margin-top: 16px; font-size: 12.5px; display: grid; gap: 4px; }
.also .ah { font-size: 12px; color: var(--ink-3); }
.also .via { color: var(--ink-3); }
a[data-act=preview], a[data-act=opencard], .vl a[data-act] { text-decoration: underline; cursor: pointer; }
.cites { margin-top: 6px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.pv { position: fixed; inset: 4vh 4vw; margin: 0; width: auto; height: auto; background: var(--sheet); border-radius: var(--r2); box-shadow: 0 6px 24px rgba(21,24,29,.18); display: flex; flex-direction: column; }
.pv:not([open]) { display: none; }
dialog { padding: 0; border: 1px solid var(--rule-2); color: var(--ink); max-width: none; max-height: none; }
dialog::backdrop { background: rgba(21,24,29,.3); }
.saved { font-size: 12px; color: var(--ink-3); }
.dlg { width: min(400px, 92vw); padding: 18px 20px 16px; border-radius: var(--r2); box-shadow: 0 6px 24px rgba(21,24,29,.18); }
.dlg h3 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
.dlg p { margin: 0 0 12px; font-size: 13px; color: var(--ink-2); white-space: pre-wrap; }
.dlg input { width: 100%; font: inherit; padding: 7px 9px; border: 1px solid var(--rule-2); border-radius: var(--r1); }
.dlg .err { margin-top: 8px; font-size: 12.5px; color: var(--red); }
.dlg .err:empty { display: none; }
.dlg .foot { display: flex; flex-direction: row-reverse; gap: 8px; margin-top: 16px; }
.pop { position: fixed; z-index: 70; min-width: 180px; padding: 4px; display: grid; background: var(--sheet); border: 1px solid var(--rule-2); border-radius: var(--r2); box-shadow: 0 6px 24px rgba(21,24,29,.16); }
.pop button { all: unset; padding: 7px 10px; border-radius: var(--r1); font-size: 13px; color: var(--ink); cursor: pointer; }
.pop button:is(:hover, :focus-visible):not(:disabled) { background: var(--paper); outline: none; }
.pop button.danger { color: var(--red); }
.pop button:disabled { color: var(--ink-3); cursor: default; }
.pop hr { margin: 4px 0; border: 0; border-top: 1px solid var(--rule); }
.inline { flex: 1; min-width: 8ch; field-sizing: content; font: inherit; padding: 0; border: 0; border-bottom: 1.5px solid var(--person); border-radius: 0; background: transparent; color: var(--ink); }
.pvh { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--rule); }
.pvh b { font-size: 13px; word-break: break-all; margin-right: auto; }
.tabs { display: flex; gap: 6px; padding: 8px 14px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); }
.tabs .btn { padding: 4px 9px; font-size: 12px; }
.pvb { flex: 1; min-height: 0; overflow: auto; }
.pvb .say { padding: 14px 18px; white-space: pre-wrap; font-size: 13.5px; }
.pvb pre { white-space: pre-wrap; word-break: break-word; font: 12.5px/1.5 var(--mono); padding: 14px 16px; margin: 0; }
.pvb img { max-width: 100%; display: block; margin: 12px auto; }
.sh { border-collapse: collapse; font: 12px/1.3 var(--mono); }
.sh th, .sh td { border: 1px solid var(--rule); padding: 3px 6px; white-space: nowrap; }
.sh th { position: sticky; top: 0; background: var(--paper); color: var(--ink-3); font-weight: 500; z-index: 2; }
.sh th:first-child { left: 0; z-index: 3; }
.sh td.rn { position: sticky; left: 0; z-index: 1; background: var(--paper); color: var(--ink-3); text-align: right; }
.sh td.num { text-align: right; }
.sh td.fx { color: var(--ink-3); font-style: italic; }
.sh td.chg { background: #fdf0c4; cursor: pointer; }
.sh td.noted { position: relative; cursor: pointer; }
.sh td.noted::after { content: ''; position: absolute; top: -1px; right: -1px; border-top: 9px solid var(--ink-3); border-left: 9px solid transparent; }
.sh td.noted.q::after { border-top-color: var(--red); }
.pvn { padding: 10px 16px; border-top: 1px solid var(--rule); font-size: 13px; white-space: pre-wrap; }
.pvn:empty { display: none; }
.empty { color: var(--ink-3); font-size: 13px; padding: 40px 28px; }

.card { position: fixed; z-index: 20; width: 396px; max-height: 80dvh; overflow: auto; background: var(--sheet); border: 1px solid var(--rule-2); border-radius: var(--r2); box-shadow: 0 3px 10px rgba(21,24,29,.10); padding: 14px 16px 12px; }
.card .cf { font-weight: 600; font-size: 13px; word-break: break-word; }
.card .cp { font-size: 12px; color: var(--ink-3); margin: 2px 0 10px; }
.card .cp b { font-weight: 500; color: var(--ink); }
.card .cp b.p { color: var(--person); }
.nb { border-top: 1px solid var(--rule); padding: 10px 0 2px; font-size: 13px; white-space: pre-wrap; }
.ref { font: 500 11px/1.6 var(--mono); color: var(--ink); background: #eceff3; border-radius: 3px; padding: 1px 5px; margin-right: 6px; }
.nb.waits { border-left: 3px solid var(--red); padding-left: 8px; }
.by { font-size: 11.5px; color: var(--ink-3); white-space: normal; margin-top: 4px; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; border-top: 1px solid var(--rule); padding-top: 10px; margin-top: 8px; }

.log details { color: var(--ink-2); }
.log details :is(details, .ln, .say, .shots) { margin: 4px 0 0 14px; font-size: 12.5px; }
.log .say { color: var(--ink); white-space: pre-wrap; }
.say table { border-collapse: collapse; margin: 4px 0; white-space: normal; }
.say td { border: 1px solid var(--rule); padding: 3px 8px; font-size: 12.5px; }
.say tr:first-child td { font-weight: 600; background: var(--sheet); }
.log summary { cursor: pointer; list-style: none; }
.log summary::-webkit-details-marker { display: none; }
.log summary::before { content: '▸'; display: inline-block; width: 14px; color: var(--ink-3); vertical-align: top; }
.log details[open] > summary::before { content: '▾'; }
.log summary b { color: var(--ink); font-weight: 500; }
.log .cmd { display: inline-block; max-width: calc(100% - 20px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: top; }
.log code, .log .res { font: 12px var(--mono); }
.log .res { color: var(--ink-3); padding-left: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log pre { margin: 4px 0 8px 14px; padding: 8px 10px; background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r1); white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; font: 11.5px/1.5 var(--mono); }
.bad { color: var(--red); }
.ln { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ln :is(.d, .f) { display: inline; margin-left: 6px; white-space: nowrap; }
.shots { display: flex; gap: 6px; overflow-x: auto; margin-top: 6px; }
.shots img { width: 112px; border: 1px solid var(--rule); border-radius: var(--r1); cursor: zoom-in; flex-shrink: 0; }
details[open] + .shots { display: none; }
.tot { padding: 10px 20px; font-size: 12.5px; color: var(--ink-3); border-bottom: 1px solid var(--rule); }
.spin { display: inline-block; width: 8px; height: 8px; border: 2px solid var(--rule-2); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; }
@keyframes spin { to { transform: rotate(360deg); } }

:focus-visible { outline: 2px solid var(--person); outline-offset: 1px; }
:is(input:not([type=checkbox]), textarea, select):focus { outline: none; border-color: var(--person); box-shadow: 0 0 0 3px var(--person-bg); }
.inline:focus { box-shadow: none; }
input[type=checkbox] { accent-color: var(--ink); }

.log { display: none; width: var(--panel); border-left: 1px solid var(--rule); background: var(--sheet); height: 100dvh; overflow: auto; }
.log.open { display: block; }
.conv { padding: 4px 20px 20px; display: grid; gap: 8px; }
.proc div { white-space: pre-wrap; font-size: 13px; line-height: 1.5; padding: 0 4px; }
.proc .ins { background: #e6f4ea; }
.proc .del { background: #fdecea; text-decoration: line-through; color: var(--ink-3); }
.conv h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin: 12px 0 0; }
.conv textarea { font: inherit; padding: 7px 9px; border: 1px solid var(--rule-2); border-radius: var(--r1); resize: vertical; width: 100%; }
.conv input[type=file] { font-size: 12px; color: var(--ink-3); }
.conv .post { white-space: pre-wrap; }
.thread { border: 1px solid var(--rule); border-radius: var(--r1); padding: 8px 10px; display: grid; gap: 6px; }
.thread.waits { border-color: var(--red); }
.thread .row2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.thread .quiet { padding: 2px 0; }
.thread.resolved { opacity: .6; }
.post.ask b::after { content: ' asks'; color: var(--red); font-weight: 500; }
.thread .on, .post .tm { color: var(--ink-3); font-size: 12px; }
.post b.p { color: var(--person, #1d4ed8); }
.log .lh { display: flex; align-items: flex-end; gap: 4px; padding: 8px 12px 0; border-bottom: 1px solid var(--rule); position: sticky; top: 0; z-index: 1; background: var(--sheet); }
.tab { border: 0; border-bottom: 2px solid transparent; background: none; padding: 8px 8px 9px; margin-bottom: -1px; font-family: inherit; font-size: 13px; font-weight: 500; color: var(--ink-3); cursor: pointer; white-space: nowrap; }
.tab.sel { color: var(--ink); border-bottom-color: var(--ink); }
.tab:hover, .log .lh .x:hover { color: var(--ink); }
.log .lh .x { margin: 0 0 6px auto; border: 0; background: none; padding: 2px 6px; font-size: 20px; line-height: 1; color: var(--ink-3); cursor: pointer; }
.e { display: grid; grid-template-columns: 46px 1fr; gap: 6px; padding: 10px 20px; border-bottom: 1px solid var(--rule); font-size: 13px; }
.e > div { min-width: 0; }
.e .tm { color: var(--ink-3); font-size: 12px; padding-top: 1px; }
.e .w { font-weight: 600; }
.e .w.p { color: var(--person); }
.e .d { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
.e .f { font: 11.5px var(--mono); color: var(--ink-3); margin-top: 3px; word-break: break-all; }

@media (max-width: 800px) {
  .app { display: block; }
  .grip { display: none; }
  .side { position: fixed; inset: 0 auto 0 0; width: 280px; z-index: 30; display: none; box-shadow: 0 0 40px rgba(0,0,0,.2); }
  .side.open { display: flex; }
  .menu { display: inline-block; }
  .bar { padding: 10px 14px; }
  .bar h1 { font-size: 17px; }
  .state { margin-left: 0; order: 5; width: 100%; }
  .bar .btn.top { padding: 6px 9px; font-size: 12px; }
  .panes { display: block; overflow: auto; }
  .pane { padding: 16px 14px; overflow: clip; }
  .ph { position: static; margin: 0 0 4px; padding: 0; background: none; }
  .outs { border-left: 0; border-bottom: 1px solid var(--rule); }
  .cols { display: block; }
  .col { width: auto; grid-template-columns: repeat(2, 1fr); }
  .col > :not(.tile) { grid-column: 1 / -1; }
  .col + .col { margin-top: 18px; }
  .ph:empty, .edges { display: none; }
  .from { display: block; }
  .hint { display: none; }
  .card { left: 0 !important; right: 0; bottom: 0; top: auto !important; width: auto; max-height: 75dvh; border-radius: 12px 12px 0 0; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  .log.open { position: fixed; inset: 0; width: auto; z-index: 25; }
  .pv, .pv.small { inset: 0; transform: none; width: auto; max-height: none; border: 0; border-radius: 0; }
  .sh td { max-width: 24ch; overflow: hidden; text-overflow: ellipsis; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"><div class="brand" id="brand"></div><div class="scroll" id="tree"></div><div class="acct" id="acct"></div></aside>
  <main class="main">
    <div class="bar" id="bar"></div>
    <div class="panes" id="panes">
      <section class="pane outs" id="outs" data-pane="out"></section>
      <section class="pane flow" id="flow" data-pane="in"></section>
      <svg class="edges" id="edges"></svg>
      <div class="key" tabindex="0">Key<div class="legend"><div><i class="p">Blue</i> uploaded by a person</div><div><i>Black</i> made by the agent</div><div><span class="tri"></span>comments</div><div><span class="tri q"></span>waiting on a reply</div><div><span class="dash"></span>expected, not there yet</div><div class="keys"><div><kbd>j k</kbd> move through the sidebar, <kbd>h l</kbd> fold and open, <kbd>Enter</kbd> go</div><div><kbd>1 2 3</kbd> the panel's tabs, <kbd>c</kbd> the comment box</div><div><kbd>Ctrl Enter</kbd> sends, <kbd>Esc</kbd> leaves a field, <kbd>?</kbd> shows this</div></div></div></div>
    </div>
  </main>
  <aside class="log" id="log"></aside>
  <div class="grip" data-pane="side" title="Drag to resize; double-click to reset"></div><div class="grip" data-pane="panel" title="Drag to resize; double-click to reset"></div>
</div>
<div class="card" id="card" hidden></div>
<dialog class="pv" id="pv"></dialog>
<dialog class="dlg" id="ask"></dialog>
<div class="pop" id="pop" role="menu" hidden></div>
<input type="file" id="picker" multiple hidden>
<div id="toasts" popover="manual"></div>
<script>
const $ = s => document.querySelector(s);
const enc = encodeURIComponent;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const usd = n => '$' + n.toFixed(2);
function took(e) {
  const s = Math.round((Date.parse(e.at) - Date.parse(data.log.find(r => r.op === 'run' && r.run === e.run).at)) / 1000);
  return `${s >= 60 ? Math.floor(s / 60) + 'm ' : ''}${s % 60}s`;
}
const when = iso => new Date(iso).toLocaleString([], { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
const hhmm = iso => iso ? new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }) : '';
const fname = f => f.split('/').pop();
function fileUrl(path, kind = 'files') {
  const m = path.match(/^\.\.\/([^/]+)\/(.*)$/), id = m ? cur.s.instances.find(i => i.label === m[1])?.id : cur.i.id;
  return `/${kind}/${id}/${(m ? m[2] : path).split('/').map(enc).join('/')}`;
}
const ext = f => (f && f.includes('.') ? f.split('.').pop() : '').toUpperCase();

let tree = [], expired = [], offers = [], cur = null, data = null, lines = [], linesKey = '', openItem = null, hover = null, showClosed = false, showArchived = false, pv = null, me = null;
let seen = {}, prevSigs = {}, uploads = [], shown = '', refreshes = 0, threads = [];
// Threads with a reply box open: those waiting on people have one anyway, the others once Reply is clicked.
const replying = new Set();
// An item's open threads; a new one shows on its tile as a change.
const talkOn = id => threads.filter(t => t.item === id && !t.resolved);
const sig = i => `${i.file}|${talkOn(i.id).length}|${i.headline ?? ''}`;

function markSeen(items) {
  for (const i of items) seen[i.id] = sig(i);
  localStorage[`seen:${instPath()}`] = JSON.stringify(seen);
}

// Toasts sit in the top layer, shown again for each one, so they come above a dialog that opened since.
function toast(text, kind = '') {
  const el = Object.assign(document.createElement('div'), { className: `toast ${kind}`, textContent: text }), box = $('#toasts');
  box.append(el);
  if (box.matches(':popover-open')) box.hidePopover();
  box.showPopover();
  setTimeout(() => { el.remove(); if (!box.children.length) box.hidePopover(); }, 6000);
}
const folds = new Map();
// The side panel opens beside the instance where there's room for both, on Conversation.
const ui = { open: innerWidth > 800, tab: 'conv', on: null, ref: null };
let proc = { key: '', html: '' };
const drawn = new WeakMap();

function put(el, html) {
  if (drawn.get(el) !== html) el.innerHTML = html;
  drawn.set(el, html);
}

// A call that fails throws the server's words; a toast shows them, unless the caller shows them itself.
async function api(path, opts) {
  const r = await fetch(path, opts);
  const t = await r.text();
  if (r.status === 401) location.reload();
  if (!r.ok) throw new Error(t);
  try { return JSON.parse(t); } catch { return t; }
}
addEventListener('unhandledrejection', e => toast(e.reason?.message ?? String(e.reason)));

// The page's address is #/ID, of an instance, a series or a workspace; cur holds the tree's entries for them.
const seriesPath = c => `/api/series/${c.s.id}`;
const instPath = () => `/api/instances/${cur.i.id}`;
const go = id => { location.hash = '#/' + id; };

// Newest activity first, as in a chat: an instance's latest log entry, now while it runs; a series' newest instance's, and a
// workspace's newest series'. A series' instances keep their labels' order.
const recent = i => i.running ? new Date().toISOString() : i.active, newest = xs => xs.reduce((m, x) => x > m ? x : m, '');
const sAct = s => newest(s.instances.map(recent)), wAct = w => newest(w.series.map(sAct)), byAct = f => (a, b) => (f(b) > f(a)) - (f(b) < f(a));
// How long ago, compactly, as a row's last activity: now, 5m, 3h, 2d, 7w.
const initials = name => {
  const w = name.replace(/^v-/i, '').match(/\p{L}+/gu);
  return (w.length > 1 ? w[0][0] + w[1][0] : w[0].slice(0, 2)).toUpperCase();
};
// A time to come, compactly: its time today, else its day.
const soon = iso => new Date(iso).toDateString() === new Date().toDateString() ? hhmm(iso) : new Date(iso).toLocaleDateString([], { day: 'numeric', month: 'short' });
const ago = iso => {
  const m = (Date.now() - Date.parse(iso)) / 60e3;
  return m < 1 ? 'now' : m < 60 ? `${m | 0}m` : m < 1440 ? `${m / 60 | 0}h` : m < 10080 ? `${m / 1440 | 0}d` : `${m / 10080 | 0}w`;
};

async function refresh() {
  me ??= await api('/me');
  const n = ++refreshes, [t, mine] = await Promise.all([api('/api'), api('/logins')]);
  const id = location.hash.slice(2), all = t.flatMap(w => [[w], ...w.series.flatMap(s => [[w, s], ...s.instances.map(i => [w, s, i])])]);
  let [w, s, i] = all.find(e => e.at(-1).id === id) ?? [t.find(w => !w.archived)];
  s ??= w?.series.filter(s => !s.archived).sort(byAct(sAct))[0];
  i ??= s?.instances.find(i => i.status === 'open') ?? s?.instances.at(-1);
  const path = i ? `/api/instances/${i.id}` : '', [d, st] = path ? await fetchInstance(path) : [null, null];
  if (n !== refreshes) return;
  [tree, expired, offers] = [t, mine.filter(l => l.expired), mine.flatMap(l => l.offers)];
  land(w && { w, s, i }, path, d, st);
}

// Instances changed: each one's row in the sidebar, and the open one's data. One the sidebar lacks takes a full refresh.
async function patch(ids) {
  const rows = tree.flatMap(w => w.series.flatMap(s => s.instances)), others = ids.filter(id => id !== cur?.i?.id);
  const sums = await Promise.all(others.map(id => api(`/api/instances/${id}/summary`)));
  if (sums.some(x => !rows.some(r => r.id === x.id))) return refresh();
  for (const x of sums) Object.assign(rows.find(r => r.id === x.id), x);
  if (others.length === ids.length) return render();
  const n = ++refreshes, path = shown, [[d, st], sum] = await Promise.all([fetchInstance(path), api(`${path}/summary`)]);
  if (n !== refreshes) return;
  Object.assign(cur.i, sum);
  land(cur, path, d, st);
}

// An instance's data, and its trace when the Ops log shows and the trace may have moved.
async function fetchInstance(path) {
  const d = await api(path), key = `${path}:${d.log.length}`;
  return [d, ui.open && ui.tab === 'log' && (d.run || key !== linesKey) ? [await api(path + '/trace'), key] : null];
}

function land(next, path, d, st) {
  const was = data && path === shown ? lastDone()?.seq ?? 0 : undefined;
  // A new selection opens its rows in the sidebar; from then on only their chevrons fold and open them.
  if (next?.w && next.w.id !== cur?.w.id) expandRow(next.w.id, true);
  if (next?.s && next.s.id !== cur?.s?.id) expandRow(next.s.id, true);
  [cur, data, shown] = [next, d, path];
  if (cur?.i) cur.i.unread = false;
  threads = threadsOf();
  if (st) [lines, linesKey] = st;
  const done = data && lastDone();
  if (done && was !== undefined && done.seq > was) toast(done.error ? `Run ${done.run} failed: ${done.error}` : `Run ${done.run} finished${done.summary ? ': ' + done.summary : ''}`, done.error ? '' : 'ok');
  render();
}

function render() {
  const qs = tree.filter(w => !w.archived).flatMap(w => w.series.filter(s => !s.archived).flatMap(s => s.instances)).reduce((t, i) => t + i.asks.filter(e => e === me.email).length, 0);
  document.title = `${qs ? `(${qs}) ` : ''}${cur?.i ? cur.i.label + ' \u00b7 ' : ''}${me.brand.text ?? 'rollforward'}`;
  renderBrand();
  renderSide();
  renderBar();
  renderPanes();
  renderLog();
  renderCard();
}

// The deployment's brand (rf brand): its logo and text top the sidebar; the text titles the page, and the logo is its icon.
function renderBrand() {
  const { text, logo } = me.brand;
  put($('#brand'), `${logo ? '<img src="/brand/logo" alt="">' : ''}${text ? `<span>${esc(text)}</span>` : ''}`);
  if (logo && !$('link[rel=icon]')) document.head.append(Object.assign(document.createElement('link'), { rel: 'icon', href: '/brand/logo' }));
}

// The sidebar's tree, folded as a file browser's: selecting a row opens it and leaves the others as they were, and its chevron folds
// it. Mine keeps to the workspaces you own or worked in, and the one you're in.
const expanded = new Set(JSON.parse(localStorage.expanded ?? '[]'));
function expandRow(id, open = !expanded.has(id)) {
  if (open) expanded.add(id); else expanded.delete(id);
  localStorage.expanded = JSON.stringify([...expanded]);
}

function renderSide() {
  if (editing) return;
  const listed = (x, on) => !x.archived || showArchived || on, mine = localStorage.workspaces !== 'all' && tree.some(w => w.mine);
  // A dot on a folded row: red for asks waiting on people, else blue for something new to you.
  const asks = s => !s.archived && s.instances.some(i => i.asks.length), news = s => !s.archived && s.instances.some(i => i.unread);
  const dot = (id, ss) => expanded.has(id) ? '' : ss.some(asks) ? '<span class="dot"></span>' : ss.some(news) ? '<span class="dot u"></span>' : '';
  // A row's last activity, or a spinner while a run goes.
  const age = (iso, running) => `<span class="age">${running ? '<span class="spin"></span>' : iso ? ago(iso) : ''}</span>`;
  const btn = (act, title, glyph, id = '') => `<button class="add" data-act="${act}" data-id="${id}" title="${title}">${glyph}</button>`;
  const chev = id => `<button class="chev" data-act="expand" data-id="${id}">${expanded.has(id) ? '\u25BE' : '\u25B8'}</button>`;
  const row = i => {
    const st = i.queued ? '\u29D7 queued' : i.asks.length ? `<span class="cnt" title="${i.asks.length} to answer">${i.asks.length}</span>` : i.wake ? `<span title="${when(i.wake)}">wakes ${soon(i.wake)}</span>` : i.status === 'open' ? '' : i.status;
    return `<a class="row inst ${i.status} ${cur?.i?.id === i.id ? 'on' : ''}" href="#/${i.id}" title="${esc(i.label)}"><span class="nm ${i.unread ? 'b' : ''}"><span class="l">${esc(i.label)}</span>${i.runner === me.email ? '' : `<span class="who" title="${esc(i.runner_name)} runs it">${esc(initials(i.runner_name))}</span>`}${i.unread && !i.asks.length ? '<span class="dot u"></span>' : ''}</span><span class="n">${st}</span>${age(i.active, i.running)}</a>`;
  };
  const waits = waiting().length;
  let h = waits ? `<div class="row waits"><a class="nm" data-act="waiting">Waiting on you<span class="q"> ${waits}</span></a></div>` : '';
  h += `<div class="row head"><span class="nm">Workspaces</span><span class="seg">${['mine', 'all'].map(v => `<button class="${(v === 'mine') === mine ? 'sel' : ''}" data-act="workspaces" data-id="${v}">${v === 'mine' ? 'Mine' : 'All'}</button>`).join('')}</span>${btn('new-workspace', 'New workspace', '+')}</div>`;
  for (const w of [...tree].sort(byAct(wAct))) {
    const won = cur?.w.id === w.id;
    if (!listed(w, won) || (mine && !w.mine && !won)) continue;
    h += `<div class="row ws ${won ? 'on' : ''} ${w.archived ? 'archived' : ''}">${chev(w.id)}<a class="nm" href="#/${w.id}" title="${esc(w.name)}"><span class="l">${esc(w.name)}</span>${dot(w.id, w.series)}</a>`
      + `<span class="n">${w.archived ? 'archived' : ''}</span>${age(wAct(w), w.series.some(s => s.instances.some(i => i.running)))}` + btn('workspace-settings', 'Settings', '\u2699', w.id) + btn('new-task', 'New task', '+', w.id) + '</div>';
    if (!expanded.has(w.id)) continue;
    h += '<div class="tree">';
    for (const s of w.series.filter(s => !s.single).sort(byAct(sAct))) {
      const on = cur?.s?.id === s.id, open = s.instances.filter(i => i.status === 'open');
      if (!listed(s, on)) continue;
      const note = s.archived ? 'archived' : s.requests.length ? `<span class="q">${s.requests.length} to start</span>` : open.length && !expanded.has(s.id) ? `${open.length} open` : s.wake && !expanded.has(s.id) ? `<span title="${when(s.wake.at)}">wakes ${soon(s.wake.at)}</span>` : '';
      h += `<div class="row ser ${on ? 'on' : ''} ${s.archived ? 'archived' : ''}">${chev(s.id)}<a class="nm" href="#/${s.id}" title="${esc(s.name)}"><span class="l">${esc(s.name)}</span>${dot(s.id, [s])}</a>`
        + `<span class="n">${note}</span>${age(sAct(s), s.instances.some(i => i.running))}` + btn('settings', 'Settings', '\u2699', s.id) + btn('new-instance', 'New instance', '+', s.id) + '</div>';
      if (!expanded.has(s.id)) continue;
      const closed = s.instances.length - open.length;
      h += '<div class="tree">';
      if (s.wake) h += `<div class="row wake"><span class="nm" title="Starts ${esc(s.wake.label)} ${when(s.wake.at)}"><span class="l">Starts ${esc(s.wake.label)} ${soon(s.wake.at)}</span></span><span class="n" title="${esc(s.wake.reason)}">wake</span></div>`;
      for (const r of s.requests) h += `<div class="row req"><span class="nm" title="${esc(`${r.from} asks to start ${r.label}: ${r.reason}`)}"><span class="l">${esc(r.from.split('/').slice(-2).join(' · '))} asks to start ${esc(r.label)}</span></span>`
        + `<button class="add" data-act="req-start" data-id="${r.id}" title="Start it">\u25B6</button><button class="add" data-act="req-drop" data-id="${r.id}" title="Dismiss">\u00D7</button></div>`;
      h += s.instances.filter(i => i.status === 'open' || showClosed || i.id === cur?.i?.id).map(row).join('');
      if (closed) h += `<button class="quiet" data-act="toggle-closed">${showClosed ? 'Hide' : 'Show'} closed (${closed})</button>`;
      h += '</div>';
    }
    // Tasks, each a series of its one instance, listed under a heading that is no series.
    const tasks = w.series.filter(s => s.single && listed(s, cur?.s?.id === s.id)).flatMap(s => s.instances).sort(byAct(recent)), done = tasks.filter(i => i.status !== 'open').length;
    if (tasks.length) h += '<div class="row grp"><span class="nm">Ungrouped</span></div>' + tasks.filter(i => i.status === 'open' || showClosed || i.id === cur?.i?.id).map(row).join('')
      + (done ? `<button class="quiet" data-act="toggle-closed">${showClosed ? 'Hide' : 'Show'} closed (${done})</button>` : '');
    h += '</div>';
  }
  const archived = tree.filter(w => w.archived).length + tree.filter(w => expanded.has(w.id)).flatMap(w => w.series).filter(s => s.archived).length;
  if (archived) h += `<button class="quiet" data-act="toggle-archived">${showArchived ? 'Hide' : 'Show'} archived (${archived})</button>`;
  // Keys move a focus through the rows' links (j, k), which a new drawing keeps.
  const kf = $('#tree').contains(document.activeElement) && document.activeElement.getAttribute('href');
  put($('#tree'), h);
  if (kf) $(`#tree [href="${kf}"]`)?.focus();
  put($('#acct'), `<div class="me" tabindex="0"><span>${esc(me.name)}${me.role === 'user' ? '' : ' · ' + me.role}</span><span class="mail">${esc(me.email)}</span></div>`
    + `<span class="acts2"><button class="add" data-act="logins" title="Logins, tokens${me.role === 'admin' ? ', people' : ''}">\u2699</button><button class="quiet" data-act="signout">Sign out</button></span>`);
}

function lastDone() { return data.log.findLast(e => e.op === 'done'); }

const stepText = s => `${s.do}${s.target ? ` ${s.target}` : ''}${s.value !== undefined ? ` = "${s.value}"` : ''}`;

function renderBar() {
  if (editing) return;
  const open = data?.doc.status === 'open', renamable = open && !cur.s.instances.some(i => i.running) && !cur.i.queued;
  let h = `<button class="menu" data-act="menu">☰</button>`;
  h += `<div><div class="crumb">${esc(cur?.w.name ?? '')}${cur?.s ? ' · ' + esc(cur.s.single ? 'Ungrouped' : cur.s.name) : ''}</div><h1>${renamable ? `<span class="t" data-act="rename" title="Rename">${esc(cur.i.label)}</span><button class="ren" data-act="rename" title="Rename">\u270E</button>` : esc(cur?.i?.label ?? 'No instance')}${data ? owner() : ''}</h1></div>`;
  if (data) {
    const d = lastDone(), talk = threads.filter(t => t.waits).length;
    const state = data.doc.status !== 'open' ? `${data.doc.status === 'closed' ? 'Closed' : 'Abandoned'} · read-only`
      : data.run ? `<span class="spin"></span>Agent working · run ${data.run.n}<button class="quiet" data-act="interrupt">Interrupt</button>`
      : data.queued ? '\u29D7 Queued' : d?.error ? `<span class="bad" title="${esc(d.error)}">Run ${d.run} failed · ${hhmm(d.at)}</span>`
      : d ? `Agent idle · last run ${hhmm(d.at)}` : 'Waiting for files';
    h += `<div class="state">${state}</div>`;
    if (!ui.open) h += `<button class="btn top" data-act="show-panel">Conversation${talk ? ` (${talk})` : ''}</button>`;
    const off = data.run ? 'disabled title="Available when the run ends"' : '';
    if (open) h += data.runner.by === me.email ? `<button class="btn commit top" data-act="close" ${off}>${cur.s.single ? 'Close task' : 'Close instance'}</button>`
      : `<button class="btn top" data-act="takeover" ${off || `title="${esc(data.runner.by)} runs it: their logins, their sign-off. Taking over makes it yours."`}>Take over</button>`;
    else h += cur.s.single ? '<button class="btn top" data-act="start-another">Start another based on this</button>' : '<button class="btn top" data-act="duplicate">Duplicate</button>';
    if (open) h += '<button class="btn top" data-act="menu-instance" title="Rename, abandon">\u22EF</button>';
  }
  put($('#bar'), h);
}

// The runner's chip: Yours, or their name; on hover or a click, what that means, since when, and the logins they ticked.
function owner() {
  const r = data.runner, mine = r.by === me.email, who = mine ? 'You' : esc(r.name), e = data.log.findLast(e => ['create', 'duplicate', 'takeover'].includes(e.op));
  const how = { create: 'Made it', duplicate: `Copied it from ${esc(e.from)}`, takeover: `Took it over from ${esc(e.from)}` }[e.op];
  return `<span class="owner" tabindex="0">${mine ? 'Yours' : esc(r.name)}<span class="about">`
    + (data.doc.status === 'open' ? `${who} run${mine ? '' : 's'} it: runs use ${mine ? 'your' : 'their'} logins, and only ${mine ? 'you' : 'they'} close it.` : `${who} ran it.`)
    + `<br>${how} ${when(e.at)}.<br>${r.ticked.length ? `Logins: ${esc(r.ticked.join(', '))}` : 'No logins ticked.'}</span></span>`;
}

function provenance(file) {
  if (file.startsWith('upload/')) {
    const e = data.log.find(e => e.op === 'upload' && e.file === file);
    return { person: true, by: e?.by ?? 'someone', at: e?.at };
  }
  const e = data.log.find(e => e.op === 'point' && e.file === file);
  return { person: false, by: 'Agent', at: e?.at };
}

function tile(item) {
  const on = talkOn(item.id), open = on.filter(t => t.waits).length;
  const count = open ? `${open} to answer` : on.length ? `${on.length} comment${on.length > 1 ? 's' : ''}` : '';
  const corner = on.length ? `<span class="corner ${open ? 'ask' : ''}"></span>` : '';
  const mark = `${seen[item.id] !== sig(item) ? 'fresh' : ''} ${prevSigs[item.id] && prevSigs[item.id] !== sig(item) ? 'flash' : ''}`;
  const from = item.from?.length ? `<div class="from">from ${item.from.map(f => esc(data.doc.items.find(i => i.id === f).name)).join(', ')}</div>` : '';
  if (!item.file) {
    return `<div class="tile ghost ${mark}" data-item="${esc(item.id)}">${corner}<div class="ext"><span>${esc(item.kind.toUpperCase())}</span><span class="nc ${open ? 'q' : ''}">${count}</span></div><div class="fn">${esc(item.name)}</div>${from}<div class="meta">${item.kind === 'input' ? 'Missing' : 'Not built yet'}</div></div>`;
  }
  const p = provenance(item.file), sent = data.log.findLast(e => e.op === 'delivered' && e.item === item.id);
  const v = data.log.filter(e => e.op === 'point' && e.item === item.id && e.file).length;
  return `<div class="tile ${p.person ? 'person' : 'agent'} ${openItem === item.id ? 'on' : ''} ${mark}" data-item="${esc(item.id)}">${corner}<div class="ext"><span>${esc(ext(item.file))}${v > 1 ? ' · v' + v : ''}</span><span class="nc ${open ? 'q' : ''}">${count}</span></div><div class="fn">${esc(item.name)}</div><div class="file">${esc(fname(item.file))}</div>${item.headline ? `<div class="hl">${esc(item.headline)}</div>` : ''}${item.source ? `<div class="src">${esc(item.source)}</div>` : ''}${item.destination ? `<div class="dst" title="${esc(item.destination)}">\u2192 ${esc(item.destination)}</div>` : ''}${sent ? `<div class="sent" title="${esc(sent.receipt)}">Sent ${hhmm(sent.at)} to ${esc(sent.to)}</div>` : ''}${from}<div class="meta"><b>${esc(p.by)}</b> · ${hhmm(p.at)}</div></div>`;
}

function renderPanes() {
  $('#outs').hidden = !data;
  if (!data) {
    put($('#flow'), `<div class="empty">${cur?.s ? 'No instance yet. Make one with + by the series.' : cur ? 'No series yet. Make one with + by the workspace.' : 'No workspace yet. Make one with + by Workspaces.'}</div>`);
    return drawEdges();
  }
  const open = data.doc.status === 'open', stored = localStorage[`seen:${instPath()}`], items = data.doc.items;
  seen = stored ? JSON.parse(stored) : {};
  if (!stored) markSeen(items);
  const byId = new Map(items.map(i => [i.id, i])), depth = new Map();
  const d = i => {
    if (!depth.has(i.id)) depth.set(i.id, 1 + Math.max(0, ...(i.from ?? []).map(f => byId.get(f)).filter(p => p.kind === 'step').map(d)));
    return depth.get(i.id);
  };
  const cols = [items.filter(i => i.kind === 'input')], steps = items.filter(i => i.kind === 'step'), outs = items.filter(i => i.kind === 'output');
  for (const i of steps) (cols[d(i)] ??= []).push(i);
  const head = (title, list, pane) => `<div class="ph"><h2>${title}</h2><span class="c">${list.length ? `${list.filter(i => i.file).length} of ${list.length}` : ''}</span>${open && pane ? `<button class="btn" data-act="add" data-pane="${pane}">+ Add files</button>` : ''}</div>`;
  const adding = pane => uploads.filter(u => u.pane === pane && u.path === instPath()).map(u => `<div class="tile ghost"><div class="ext"><span>UPLOADING</span></div><div class="fn">${esc(u.f.name)}</div><div class="prog"><i style="width:${u.pct}%"></i></div></div>`).join('');
  const shown = new Set(items.map(i => i.file)), also = new Map();
  for (const t of threads) for (const p of t.posts) for (const f of p.by === 'agent' ? p.files ?? [] : []) if (!shown.has(f) && !also.has(f)) also.set(f, t);
  const via = t => t.item ? `on <a data-act="opencard" data-item="${esc(t.item)}">${esc(items.find(i => i.id === t.item)?.name ?? t.item)}</a>` : `in <a data-act="thread" data-thread="${esc(t.id)}">a comment</a>`;
  const alsoUsed = also.size ? `<div class="also"><div class="ah">Also used</div>${[...also].map(([f, t]) => `<div><a data-act="preview" data-file="${esc(f)}">${esc(fname(f))}</a> <span class="via">· cited ${via(t)}</span></div>`).join('')}</div>` : '';
  put($('#flow'), `<div class="cols">${cols.map((col, k) => `<div class="col">${k === 0 ? head('Inputs', col, 'in') : k === 1 ? head('Steps', steps) : '<div class="ph"></div>'}${col.map(tile).join('')}${k === 0 ? adding('in') + alsoUsed : ''}</div>`).join('')}</div>`
    + (open ? '<div class="hint">Drop files to add them. The agent decides what each one is.</div>' : ''));
  put($('#outs'), `<div class="col">${head('Outputs', outs, 'out')}${outs.map(tile).join('')}${adding('out')}</div>${open ? '<div class="hint">Drop a revised output here.</div>' : ''}`);
  $('#outs').classList.toggle('busy', !!data.run);
  prevSigs = Object.fromEntries(items.map(i => [i.id, sig(i)]));
  drawEdges();
}

function drawEdges() {
  if (!data || innerWidth <= 800) return void ($('#edges').innerHTML = '');
  const box = $('#panes').getBoundingClientRect(), items = data.doc.items, hot = hover ?? openItem, up = new Set(), down = new Set();
  const climb = id => { for (const f of items.find(i => i.id === id)?.from ?? []) if (!up.has(f)) { up.add(f); climb(f); } };
  const fall = id => { for (const i of items) if (i.from?.includes(id) && !down.has(i.id)) { down.add(i.id); fall(i.id); } };
  if (hot) { climb(hot); fall(hot); }
  const rects = new Map(items.map(i => [i.id, document.querySelector(`#panes .tile[data-item="${CSS.escape(i.id)}"]`).getBoundingClientRect()]));
  const mid = id => rects.get(id).top + rects.get(id).height / 2, byY = ids => ids.sort((p, q) => mid(p) - mid(q));
  const parents = new Map(items.map(i => [i.id, byY([...i.from ?? []])])), children = new Map(items.map(i => [i.id, byY(items.filter(c => c.from?.includes(i.id)).map(c => c.id))]));
  const port = (id, ends, other) => rects.get(id).top + rects.get(id).height * (ends.get(id).indexOf(other) + 1) / (ends.get(id).length + 1);
  const cols = [...document.querySelectorAll('#flow .col')].map(c => [...c.querySelectorAll('.tile')].map(t => t.getBoundingClientRect())).filter(ts => ts.length);
  let h = '';
  for (const i of items) for (const f of i.from ?? []) {
    const a = rects.get(f), b = rects.get(i.id), y1 = port(f, children, i.id), y2 = port(i.id, parents, f), lit = i.id === hot || up.has(i.id) || f === hot || down.has(f);
    let d;
    if (b.left > a.right) {
      // Cross each column in between at its nearest gap, so a line never seems to enter a tile it passes.
      const pts = [[a.right, y1]];
      for (const ts of cols.filter(ts => ts[0].left > a.right && ts[0].right < b.left)) {
        const y = pts.at(-1)[1], gaps = [ts[0].top - 14, ...ts.slice(1).map((t, k) => (ts[k].bottom + t.top) / 2), ts.at(-1).bottom + 14];
        const g = gaps.reduce((best, v) => (Math.abs(v - y) < Math.abs(best - y) ? v : best));
        pts.push([ts[0].left, g], [ts[0].right, g]);
      }
      pts.push([b.left, y2]);
      d = `M${pts[0][0] - box.left},${pts[0][1] - box.top}` + pts.slice(1).map(([x, y], k) => {
        const [px, py] = pts[k], mx = (px + x) / 2 - box.left;
        return k % 2 ? ` L${x - box.left},${y - box.top}` : ` C${mx},${py - box.top} ${mx},${y - box.top} ${x - box.left},${y - box.top}`;
      }).join('');
    } else {
      const x1 = a.right - box.left, x2 = b.right - box.left, c = Math.max(x1, x2) + 36;
      d = `M${x1},${y1 - box.top} C${c},${y1 - box.top} ${c},${y2 - box.top} ${x2},${y2 - box.top}`;
    }
    h += `<path class="${lit ? 'hot' : ''}" d="${d}" marker-end="url(#${lit ? 'arrow-hot' : 'arrow'})"/>`;
  }
  $('#edges').innerHTML = `<defs>${['arrow', 'arrow-hot'].map(id => `<marker id="${id}" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 8,4 0,8z"/></marker>`).join('')}</defs>${h}`;
}

const logLine = e => `<div class="e"><span class="tm">${hhmm(e.at)}</span><div>${logText(e)}</div></div>`;

const plural = (n, word) => `${n} ${word}${n > 1 ? 's' : ''}`;
const actor = by => `<span class="w ${by !== 'server' && by !== 'agent' ? 'p' : ''}">${esc(by === 'agent' ? 'Agent' : by === 'server' ? 'Server' : by)}</span>`;
const shotsHtml = es => `<div class="shots">${es.map(e => `<img src="${fileUrl(e.file)}" loading="lazy" alt="" title="${esc(e.site)} \u00b7 ${hhmm(e.at)}" data-act="preview" data-file="${esc(e.file)}">`).join('')}</div>`;

function logText(e) {
  const w = actor(e.by);
  const item = id => esc(data.doc.items.find(i => i.id === id)?.name ?? id);
  const f = e.file ? `<div class="f"><a data-act="preview" data-file="${esc(e.file)}">${esc(e.file)}</a></div>` : '';
  return {
    create: () => `${w} opened the instance${e.from ? `<div class="d">Items carried over from ${esc(e.from)}.${e.fetch ? ' The agent starts fetching its inputs.' : ''}</div>` : ''}`,
    upload: () => `${w} uploaded ${e.pane === 'out' ? 'an output' : 'an input'}${e.onto ? ' onto ' + item(e.onto) : ''}${f}`,
    point: () => `${w} ${e.file ? 'showed' : 'cleared'} ${item(e.item)}${e.was ? `<div class="d">Replacing ${esc(fname(e.was))}</div>` : ''}${f}`,
    item: () => `${w} set up ${esc(e.name)}${e.from?.length ? `<div class="d">From ${e.from.map(item).join(', ')}</div>` : ''}${e.headline ? `<div class="d">${esc(e.headline)}</div>` : ''}${e.source ? `<div class="d">Source: ${esc(e.source)}</div>` : ''}${e.destination ? `<div class="d">Destination: ${esc(e.destination)}</div>` : ''}`,
    remove: () => `${w} removed ${esc(e.item)} from the screen`,
    run: () => `Run ${e.run} started${data.run?.n === e.run ? ` \u00b7 ${usd(data.run.cost)} so far` : ''}`,
    done: () => `Run ${e.run} finished${e.aborted ? ' (stopped)' : ''} · ${took(e)} · ${usd(e.cost)}${e.summary ? `<div class="d">${esc(e.summary)}</div>` : ''}${e.error ? `<div class="d">${esc(e.error)}</div>` : ''}`,
    interrupt: () => `${w} interrupted the run`,
    close: () => `${w} closed the instance${e.accepted ? `<div class="d">Accepting what the agent did for ${e.accepted.length} ask${e.accepted.length > 1 ? 's' : ''} still waiting</div>` : ''}`,
    abandon: () => `${w} abandoned the instance`,
    comment: () => `${w} ${e.note ? `left a note for ${esc(data.runner.by)}` : e.by !== 'agent' ? 'commented' : e.ask ? `asked${e.to ? ' ' + esc(e.to) : ''}` : 'said'}${e.item ? ` on ${item(e.item)}${e.ref ? ` at ${esc(e.ref)}` : ''}` : ''}<div class="d">${esc(e.text)}</div>`,
    resolve: () => `${w} resolved a thread${e.text ? `<div class="d">${esc(e.text)}</div>` : ''}`,
    report: () => `${w} reported on run ${e.run}<div class="d">${md(e.text)}</div>`,
    wake: () => `${e.note ? `${esc(e.from)} would wake it: a note for ${esc(data.runner.by)}` : `Woken${e.from ? ` by ${esc(e.from)}` : ''}`}<div class="d">${esc(e.reason)}</div>`,
    expired: () => `Waiting for ${esc(e.runner)} to sign in to ${esc(e.name ?? (e.login === 'm365' ? 'Microsoft 365' : e.login))} again${e.runner === me.email && !data.log.some(x => x.seq > e.seq && x.op === 'wake' && x.login === e.login) ? `<div>${signInHtml(e.login, e.name ?? e.login)}</div>` : ''}`,
    takeover: () => `${w} took over from ${esc(e.from)}${e.logins?.length ? `<div class="d">Logins: ${esc(e.logins.join(', '))}</div>` : ''}`,
    promote: () => `${w} made it a series, ${esc(e.series)}`,
    logins: () => `${w} ticked logins: ${esc(e.logins.join(', ') || 'none')}`,
    egress: () => `Run ${e.run} ${e.allowed ? 'reached' : 'was refused'} ${esc(e.host)}`,
    delivered: () => `${w} delivered ${item(e.item)} to ${esc(e.to)}<div class="d">${e.via === 'graph' ? 'Through Microsoft 365' : 'Through a website'} · ${esc(e.receipt)}</div>`,
    graph: () => `${w} read ${esc(e.path)} from Microsoft 365${e.status >= 300 ? `, which answered ${e.status}` : ''}${e.file ? `<div class="f"><a data-act="preview" data-file="${esc(e.file)}">${esc(e.file)}</a></div>` : ''}`,
    rename: () => e.by === 'server' ? `Named by its first prompt, from ${esc(e.from)}` : `${w} renamed the instance from ${esc(e.from)}`,
    duplicate: () => `${w} made this instance as a copy of ${esc(e.from)}`,
    browser: () => e.action === 'get' ? `${w} fetched ${esc(e.from)} from the browser on ${esc(e.site)}${f}` : `${w} closed run ${e.run}'s browser${e.site ? ` on ${esc(e.site)}, in ${esc(e.login)}'s login` : ''}<div class="d">${e.error ? esc(e.error) : `${e.requests} requests${e.writes ? `, ${e.writes} writes` : ''}${e.blocked ? `, ${e.blocked} blocked` : ''}`}</div>${f}`,
    shot: () => `Run ${e.run}'s browser on ${esc(e.site)}${shotsHtml([e])}`,
    browsers: () => `Run ${e.run}'s browsers did not all close<div class="d">${esc(e.error)}</div>`,
  }[e.op]?.() ?? `${w} ${esc(e.op)}`;
}

// The side panel's tabs: Conversation, Process and the Ops log.
function tabsHtml() {
  const talk = threads.filter(t => t.waits).length;
  return `<div class="lh">${[['conv', `Conversation${talk ? ` (${talk})` : ''}`], ['proc', 'Process'], ['log', 'Ops log']].map(([t, name]) => `<button class="tab ${ui.tab === t ? 'sel' : ''}" data-act="tab" data-tab="${t}">${name}</button>`).join('')}<button class="x" data-act="hide-panel" title="Close">\u00D7</button></div>`;
}

function renderLog() {
  $('#log').className = 'log' + (ui.open && data ? ' open' : '');
  if (!data || !ui.open) return;
  // A half-written comment or reply, or files picked for one, holds the conversation still until it's sent or cleared.
  const drafting = [...$('#log').querySelectorAll('textarea')].some(t => t.value.trim()) || [...$('#log').querySelectorAll('input[type=file]')].some(f => f.files.length);
  if (ui.tab === 'conv') {
    if (!drafting) put($('#log'), tabsHtml() + conversationHtml());
    if (ui.focus) $('#newcomment')?.focus();
    return void (ui.focus = false);
  }
  if (ui.tab === 'proc') {
    const key = `${cur.i.id}:${data.doc.rev}`;
    if (proc.key !== key) loadProcess(key);
    return put($('#log'), tabsHtml() + proc.html);
  }
  // Oldest first, opening at the latest, and kept there as entries come unless the reader has scrolled up.
  put($('#log'), tabsHtml() + opsHtml());
  if ($('#log').dataset.end !== 'no') $('#log').scrollTop = $('#log').scrollHeight;
}

const VERB = { read: 'Read', bash: 'Ran', edit: 'Edited', write: 'Wrote' };
const NOUN = { read: 'file', bash: 'command', edit: 'file', write: 'file' };
const firstLine = t => t.trim().split('\n')[0];
const inline = s => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');

function md(text) {
  let h = '', rows = [];
  const table = () => { if (rows.length) h += `<table>${rows.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</table>`; rows = []; };
  for (const l of esc(text).split('\n')) {
    if (l.trim().startsWith('|')) { if (!/^[\s|:-]+$/.test(l)) rows.push(l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim())); continue; }
    table();
    h += inline(l.replace(/^(\s*)[-*] /, '$1\u2022 ').replace(/^#+ (.*)/, '<b>$1</b>')) + '\n';
  }
  table();
  return h.trimEnd();
}
const fold = (key, dflt, head, body) => `<details data-key="${key}" ${folds.get(key) ?? dflt ? 'open' : ''}><summary>${head}</summary>${body}</details>`;

function lineHtml(s, i) {
  const res = s.result === undefined ? (data.run ? '<span class="spin"></span>' : 'no result')
    : s.error ? `<span class="bad">${esc(firstLine(s.result) || 'failed')}</span>`
    : s.kind === 'read' ? `${s.lines} lines`
    : firstLine(s.result) ? esc(firstLine(s.result)) + (s.lines > 1 ? ` +${s.lines - 1} lines` : '') : 'no output';
  const target = s.kind === 'bash' ? s.text : s.text.split(`/${cur.s.name}/`).pop();
  return fold(`s${i}`, false, `<span class="cmd"><b>${VERB[s.kind] ?? esc(s.kind)}</b> <code>${esc(firstLine(target))}</code></span><div class="res">⎿ ${res}</div>`,
    `<pre>${esc(s.text)}</pre>${s.result ? `<pre class="${s.error ? 'bad' : ''}">${esc(s.result)}</pre>` : ''}`);
}

// What a row of the agent's work did, by kind of entry, and what a person's entries of one kind in a row did.
const DID = {
  graph: n => `read ${plural(n, 'path')} from Microsoft 365`, point: n => `showed ${plural(n, 'file')}`, item: n => `set up ${plural(n, 'item')}`,
  remove: n => `removed ${plural(n, 'item')}`, get: n => `fetched ${plural(n, 'file')} from the browser`, browser: n => `closed ${plural(n, 'browser')}`,
  egress: n => `reached ${plural(n, 'host')}`, upload: n => `uploaded ${plural(n, 'file')}`, resolve: n => `resolved ${plural(n, 'thread')}`,
};
const ALONE = new Set(['comment', 'report', 'run', 'done']);

// The Ops log: the log's entries and, from the agent's session, its messages and tool calls, in time order. What the agent does
// between comments, reports and a run's start and end folds into one row, with what the server logged of the run, such as each
// screenshot of its browser, which the row shows; a person's entries of one kind in a row fold too. A run's trigger and the rf
// say and ask calls are left out, as their entries show them, and so is its last message, which is its report.
function opsHtml() {
  const reported = new Set(data.log.filter(e => e.op === 'report').map(e => e.text));
  const steps = lines.map((s, i) => ({ ...s, i })).filter(s => s.kind !== 'user' && !(s.kind === 'bash' && /\brf (say|ask)\b/.test(s.text)) && !(s.kind === 'say' && reported.has(s.text.trim())));
  const rows = [];
  for (const x of [...steps, ...data.log].sort((a, b) => Date.parse(a.at) - Date.parse(b.at))) {
    const key = ALONE.has(x.op) ? '' : !x.op || x.by === 'agent' || (x.by === 'server' && x.run) ? 'work' : `${x.op} ${x.by}`;
    if (key && rows.at(-1)?.key === key) rows.at(-1).xs.push(x);
    else rows.push({ key, xs: [x] });
  }
  const runs = data.log.filter(e => e.op === 'run').length, cost = data.log.reduce((t, e) => t + (e.cost ?? 0), 0) + (data.run?.cost ?? 0);
  return (runs ? `<div class="tot">${plural(runs, 'run')}, ${usd(cost)}</div>` : '') + rows.map((r, k) => rowHtml(r, !!data.run && k === rows.length - 1)).join('');
}

// A row of the Ops log: an entry or a step, or a fold of several, which opens to one line each.
function rowHtml({ key, xs }, live) {
  const x = xs[0], line = x => x.op === 'shot' ? shotsHtml([x]) : x.op ? `<div class="ln">${logText(x)}</div>` : x.kind === 'say' ? `<div class="say">${md(x.text)}</div>` : lineHtml(x, x.i);
  if (xs.length === 1) return x.op ? logLine(x) : `<div class="e"><span class="tm">${hhmm(x.at)}</span><div>${line(x)}</div></div>`;
  const shots = xs.filter(x => x.op === 'shot');
  const head = key === 'work' ? workHead(xs, live) : `${actor(x.by)} ${DID[x.op]?.(xs.length) ?? `${esc(x.op)} \u00D7${xs.length}`}`;
  return `<div class="e"><span class="tm">${hhmm(x.at)}</span><div>${fold(`r${x.seq ?? 's' + x.i}`, false, head, xs.map(line).join(''))}${shots.length ? shotsHtml(shots) : ''}</div></div>`;
}

function workHead(xs, live) {
  const steps = xs.filter(x => !x.op && x.kind !== 'say'), entries = xs.filter(x => x.op && x.op !== 'shot');
  const did = [
    ...Object.entries(Object.groupBy(steps, s => s.kind)).map(([k, g]) => `${(VERB[k] ?? esc(k)).toLowerCase()} ${plural(g.length, NOUN[k] ?? 'call')}`),
    ...Object.entries(Object.groupBy(entries, e => (e.action === 'get' ? 'get' : e.op))).map(([k, g]) => DID[k]?.(g.length) ?? `${esc(k)} \u00D7${g.length}`),
  ];
  const bad = steps.filter(s => s.error).length + entries.filter(e => e.status >= 300 || e.allowed === false || e.op === 'browsers').length;
  return `${actor('agent')} ${did.join(', ') || 'worked'}${bad ? ` \u00b7 <span class="bad">${bad} failed</span>` : ''}${live ? ' <span class="spin"></span>' : ''}`;
}

// Process: the instance's working/process.md, redlined against the instance it was made from, else the series' latest closed before it.
async function loadProcess(key) {
  proc.key = key;
  const from = data.log.find(e => e.op === 'create' || e.op === 'duplicate')?.from;
  const prev = from ?? cur.s.instances.filter(i => i.status === 'closed' && i.label < cur.i.label).map(i => i.label).sort().at(-1);
  const get = async path => { const r = await fetch(fileUrl(path)); return r.ok ? r.text() : ''; };
  const [now, was] = await Promise.all([get('working/process.md'), prev ? get(`../${prev}/working/process.md`) : '']);
  // Until this instance's agent writes its own, the process is still the one it starts from.
  const lines = now ? redline(was, now) : redline('', was), changed = lines.some(([k]) => k);
  proc.html = '<div class="conv">'
    + `<div class="sub">${!now && !was ? 'No process.md yet: the agent writes it as it learns the series.' : !now ? `As of ${esc(prev)}, until the agent updates it here.` : prev ? (changed ? `Changes since ${esc(prev)} are marked.` : `Unchanged since ${esc(prev)}.`) : 'The series\' first process.'}</div>`
    + `<div class="proc">${lines.map(([k, l]) => `<div class="${k}">${md(l) || '&nbsp;'}</div>`).join('')}</div></div>`;
  if (ui.tab === 'proc' && proc.key === key) renderLog();
}

function redline(a, b) {
  const x = a ? a.split('\n') : [], y = b ? b.split('\n') : [], n = x.length, m = y.length;
  const L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = x[i] === y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = [];
  for (let i = 0, j = 0; i < n || j < m;) {
    if (i < n && j < m && x[i] === y[j]) { out.push(['', y[j]]); i++; j++; }
    else if (j < m && (i === n || L[i][j + 1] >= L[i + 1][j])) out.push(['ins', y[j++]]);
    else out.push(['del', x[i++]]);
  }
  return a ? out : out.map(([, l]) => ['', l]);
}

// Threads from the log: a comment starts one, on an item (at a ref) or the instance, and later comments reply in it. In an open
// instance it waits on a person while its last word is the agent's ask, on whom the ask names or else the runner, and on the
// agent while its last word is a person's.
function threadsOf() {
  const out = new Map(), open = data?.doc.status === 'open';
  for (const e of data?.log ?? []) {
    if (e.op !== 'comment' && e.op !== 'resolve') continue;
    if (!out.has(e.thread)) out.set(e.thread, { id: e.thread, item: e.item, ref: e.ref, posts: [] });
    const t = out.get(e.thread);
    if (e.op === 'comment') t.posts.push(e);
    t.last = e;
  }
  for (const t of out.values()) Object.assign(t, {
    resolved: t.last.op === 'resolve',
    waits: open && t.last.op === 'comment' && (t.last.ask || t.last.note) ? t.last.to ?? data.runner.by : null,
    pending: open && t.last.op === 'comment' && t.last.by !== 'agent' && !t.last.note,
  });
  return [...out.values()];
}

const who = by => by === 'agent' ? 'Agent' : by === me.email ? 'you' : by;
const place = t => t.item ? `On <a data-act="opencard" data-item="${esc(t.item)}">${esc(data.doc.items.find(i => i.id === t.item)?.name ?? t.item)}</a>${t.ref ? ` at ${esc(t.ref)}` : ''}` : 'On the instance';

function threadHtml(t) {
  const state = t.waits ? ` \u00b7 waits on ${esc(who(t.waits))}` : t.pending ? ' \u00b7 <span class="spin"></span> the agent picks it up next' : t.resolved ? ` \u00b7 resolved by ${esc(who(t.last.by))}${t.last.text ? `: ${esc(t.last.text)}` : ''}` : '';
  return `<div class="thread ${t.resolved ? 'resolved' : ''} ${t.waits ? 'waits' : ''}" data-thread="${esc(t.id)}"><div class="on">${place(t)}${state}</div>`
    + t.posts.map(p => `<div class="post ${p.ask ? 'ask' : ''}"><b class="${p.by === 'agent' ? '' : 'p'}">${esc(who(p.by))}</b> <span class="tm">${hhmm(p.at)}${p.to ? ` \u00b7 to ${esc(who(p.to))}` : ''}${p.note ? ` \u00b7 a note for ${esc(who(data.runner.by))}` : ''}</span><div>${p.by === 'agent' ? md(p.text) : esc(p.text)}</div>${(p.files ?? []).map(f => `<div class="f"><a data-act="preview" data-file="${esc(f)}">${esc(fname(f))}</a></div>`).join('')}</div>`).join('')
    + (data.doc.status !== 'open' || t.resolved ? ''
      : t.waits || replying.has(t.id) ? `<textarea rows="2" placeholder="Reply"></textarea><input type="file" multiple><div class="row2"><button class="btn" data-act="reply-thread" data-thread="${esc(t.id)}">Reply</button><button class="btn" data-act="resolve" data-thread="${esc(t.id)}" title="Done with it, without waking the agent">Resolve</button></div>`
      : `<div class="row2"><button class="quiet" data-act="thread" data-thread="${esc(t.id)}">Reply</button><button class="quiet" data-act="resolve" data-thread="${esc(t.id)}" title="Done with it, without waking the agent">Resolve</button></div>`) + '</div>';
}

// The conversation: the threads waiting on people, the agent's latest report, then the other threads, the resolved last.
function conversationHtml() {
  const open = data.doc.status === 'open', name = id => esc(data.doc.items.find(i => i.id === id)?.name ?? id);
  const report = data.log.findLast(e => e.op === 'report'), rest = threads.filter(t => !t.waits).sort((a, b) => a.resolved - b.resolved);
  let h = '<div class="conv">';
  if (threads.some(t => t.waits)) h += `<h3>Waiting on people</h3>` + threads.filter(t => t.waits).map(threadHtml).join('');
  if (report) h += `<h3>Report, run ${report.run}</h3><div class="post">${md(report.text)}</div>`;
  if (rest.length) h += `<h3>Threads</h3>` + rest.map(threadHtml).join('');
  // Before its first run, its runner may tick its logins anew where they write its first prompt.
  const first = data.runner.by === me.email && !data.log.some(e => e.op === 'run');
  if (open) h += `<h3>${ui.on ? `Comment on ${name(ui.on)}${ui.ref ? ` at ${esc(ui.ref)}` : ''}` : 'Comment on the instance'}</h3>`
    + (first && offers.length ? `<div class="ticks2">Logins it may use:${offers.map(o => `<label><input type="checkbox" class="ctick" value="${esc(o.id)}" ${data.runner.logins.includes(o.id) ? 'checked' : ''}> ${esc(o.name)}</label>`).join('')}</div>` : '')
    + `<textarea id="newcomment" rows="3" placeholder="${first ? 'What should the agent do? Drop files here too' : data.runner.by === me.email || cur.s.shared_by === data.runner.by ? 'The agent replies in the thread' : `A note for ${esc(data.runner.by)}: the agent takes it up once they do`}"></textarea><input type="file" id="newfiles" multiple><div><button class="btn primary" data-act="comment">Comment</button></div>`;
  return h + '</div>';
}

function renderCard() {
  const card = $('#card');
  const item = openItem && data?.doc.items.find(i => i.id === openItem);
  if (!item) { card.hidden = true; return; }
  const open = data.doc.status === 'open';
  let h = `<div class="cf">${esc(item.file ? fname(item.file) : item.name)}</div>`;
  if (item.file) {
    const p = provenance(item.file);
    h += `<div class="cp"><b class="${p.person ? 'p' : ''}">${esc(p.by)}</b> ${p.person ? 'uploaded' : 'made'} it at ${hhmm(p.at)} · ${esc(item.name)}${item.source ? `<br>${esc(item.source)}` : ''}`
      + (item.kind === 'output' ? `<br>Destination: ${item.destination ? esc(item.destination) : 'stays here'}` : '')
      + data.log.filter(e => e.op === 'delivered' && e.item === item.id).map(e => `<br><span class="sent">Sent to ${esc(e.to)} ${when(e.at)} · ${esc(e.receipt)}</span>`).join('') + '</div>';
  } else h += `<div class="cp">${item.kind === 'input' ? 'Expected input, not there yet' : `${item.kind === 'step' ? 'Step' : 'Output'} not built yet`}</div>`;
  // The item's open threads, each as it began, with where it stands.
  for (const t of talkOn(item.id)) {
    const p = t.posts[0], more = t.posts.length - 1;
    h += `<div class="nb ${t.waits ? 'waits' : ''}">${t.ref ? `<span class="ref">${esc(t.ref)}</span>` : ''}${p.by === 'agent' ? '' : `<b>${esc(who(p.by))}</b>: `}${esc(p.text)}`
      + (p.files?.length ? `<div class="cites">${p.files.map(f => `<a data-act="preview" data-file="${esc(f)}">${esc(fname(f))}</a>`).join('')}</div>` : '')
      + `<div class="by">${more ? `${more} repl${more > 1 ? 'ies' : 'y'} \u00b7 ` : ''}${t.waits ? `Waits on ${esc(who(t.waits))} \u00b7 ` : t.pending ? '<span class="spin"></span> the agent picks it up next \u00b7 ' : ''}<a data-act="thread" data-thread="${esc(t.id)}">${open ? 'Reply' : 'Open'}</a></div></div>`;
  }
  h += '<div class="acts">';
  if (item.file) h += `<button class="btn" data-act="preview" data-file="${esc(item.file)}" data-item="${esc(item.id)}">Preview</button><a class="btn" href="${fileUrl(item.file)}">Download</a>`;
  if (open) h += `<button class="btn" data-act="add" data-item="${esc(item.id)}" data-pane="${item.kind === 'output' ? 'out' : 'in'}">Upload…</button>`;
  if (open) h += `<button class="btn" data-act="comment-on" data-item="${esc(item.id)}">Comment</button>`;
  h += `<button class="btn" data-act="uncard" style="margin-left:auto">Close</button></div>`;
  put(card, h);
  card.hidden = false;
  placeCard();
}

function placeCard() {
  const card = $('#card'), t = !card.hidden && document.querySelector(`.tile[data-item="${CSS.escape(openItem)}"]`);
  if (!t || innerWidth <= 800) return;
  const r = t.getBoundingClientRect(), w = card.offsetWidth, ch = card.offsetHeight;
  const right = r.right + 10 + w < innerWidth, left = !right && r.left - 10 - w >= 8;
  card.style.left = (right ? r.right + 10 : left ? r.left - 10 - w : Math.max(8, Math.min(r.left, innerWidth - w - 8))) + 'px';
  card.style.top = Math.max(8, Math.min(right || left ? r.top : r.bottom + 8, innerHeight - ch - 8)) + 'px';
}

const colName = c => (c >= 26 ? colName(Math.floor(c / 26) - 1) : '') + String.fromCharCode(65 + c % 26);
const num = v => v.toLocaleString(undefined, { maximumFractionDigits: 2 });

const cellText = v => v == null ? '' : typeof v === 'object' ? v.f : typeof v === 'number' ? num(v) : v;

function sheetTable(s, first) {
  const noted = new Map(), asks = new Set(), at = new Map();
  for (const t of pv.threads) {
    const r = (t.ref ?? '').match(/^(?:'?([^'!]+)'?!)?\$?([A-Z]{1,3})\$?(\d+)/);
    if (!r || (r[1] ? r[1] !== s.name : !first)) continue;
    const key = `${+r[3] - 1},${[...r[2]].reduce((t, ch) => t * 26 + ch.charCodeAt(0) - 64, 0) - 1}`;
    noted.set(key, (noted.has(key) ? noted.get(key) + '\n\n' : '') + t.posts.map(p => `${who(p.by)}: ${p.text}`).join('\n'));
    at.set(key, t.id);
    if (t.waits) asks.add(key);
  }
  const old = pv.cmp && (pv.old.find(o => o.name === s.name) ?? pv.old[pv.sheets.indexOf(s)]);
  const rows = Array.from({ length: Math.max(s.rows.length, old?.rows.length ?? 0) }, (_, r) => s.rows[r] ?? []);
