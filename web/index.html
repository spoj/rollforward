// Your logins, each with what it offers a run, which you tick when you start or take over an instance.
function loginsHtml(s) {
  let h = `<div class="sub">Every login is yours alone. A run uses only its runner's logins, and only those ticked for its instance. Nothing here is a password: you sign in to each system yourself.</div>`;
  const m365 = s.logins.find(l => l.id === 'm365');
  if (me.m365 && !m365) h += `<h3>Microsoft 365</h3><div class="sub">Read-only: your mail and the shared mailboxes you can read, your OneDrive and the SharePoint sites you add.</div><div><a class="btn primary" href="/logins/m365/connect">Connect Microsoft 365</a></div>`;
  if (!me.m365) h += `<h3>Microsoft 365</h3><div class="sub">Not set up on this server: it needs an app registered in Microsoft Entra ID, which an admin sets in the server's settings (README, Access).</div>`;
  for (const l of s.logins.filter(l => l.kind === 'm365')) {
    h += `<h3>${esc(l.name)}</h3><div class="sub">${esc(l.account ?? '')}${l.account ? ' · ' : ''}${l.expired ? '<span class="q">expired: sign in again</span>' : `since ${esc(when(l.since))}`}</div>`
      + l.offers.map(o => `<div class="skill-row" style="display:flex;align-items:center"><span style="flex:1">${esc(o.name)}</span>${l.id === 'm365' ? `<button class="quiet" data-act="unoffer" data-id="${esc(o.id)}">Remove</button>` : ''}</div>`).join('');
    if (l.id === 'm365') h += `<div class="row2"><input type="text" id="offer-mailbox" placeholder="A shared mailbox, such as ap@example.com" style="flex:1"><button class="btn" data-act="offer-mailbox">Add</button></div>`
      + `<div class="row2"><input type="text" id="offer-site" placeholder="A SharePoint site's link" style="flex:1"><button class="btn" data-act="offer-site">Add</button></div>`;
    h += `<div class="row2">${l.id === 'm365' && l.expired ? '<a class="btn primary" href="/logins/m365/connect">Sign in again</a>' : ''}<button class="btn" data-act="signout-login" data-id="${esc(l.id)}">Sign out</button></div>`;
  }
  if (s.sites.length) h += `<h3>Websites</h3><div class="sub">Sign in yourself, in a browser shown here. Your login is what that browser keeps, its cookies, never your password; a run's browser starts from it and brings it back refreshed. It reaches only the hosts listed, but there it can do whatever you can: the agent is told only to read, and each run's log counts its writes.</div>`
    + s.sites.map(w => {
      const l = s.logins.find(l => l.id === `web:${w.id}`);
      return `<div class="skill-row" style="display:flex;align-items:center;gap:8px"><span style="flex:1">${esc(w.name)} <span class="sub">${esc([new URL(w.url).hostname, ...w.hosts].join(', '))}${l ? ` · since ${esc(when(l.since))}` : ''}</span></span>`
        + `<button class="btn" data-act="web-signin" data-id="${esc(w.id)}" data-name="${esc(w.name)}">${l ? 'Sign in again' : 'Sign in'}</button>${l ? `<button class="quiet" data-act="signout-login" data-id="${esc(l.id)}">Sign out</button>` : ''}</div>`;
    }).join('');
  if (!s.sites.length) h += `<h3>Websites</h3><div class="sub">${me.browsers ? 'None yet: admins add a website with <code>rf website set ID URL --hosts ...</code>, and then everyone can sign in to it here.' : "Not set up on this server: website logins need the browser service (README, Websites), and then admins add websites with <code>rf website set</code>."}</div>`;
  return h;
}

// Ticks: which of your logins an instance may use, asked whenever you start, copy or take over one, or allow wakes.
const ticksHtml = (offers, on = []) => offers.length ? offers.map(o => `<label class="skill-row"><input type="checkbox" class="tick" value="${esc(o.id)}" ${on.includes(o.id) ? 'checked' : ''}> ${esc(o.name)}</label>`).join('')
  : '<div class="sub">You have no logins yet; add them under <a data-act="logins">Logins</a>. The agent can still work with the files people bring.</div>';
const ticked = () => [...document.querySelectorAll('#pv input.tick:checked')].map(i => i.value);
const myOffers = async () => (await api('/logins')).flatMap(l => l.offers);

function startHtml(s) {
  return (s.label !== undefined ? `<h3>Label</h3><input type="text" id="slabel" value="${esc(s.label)}" placeholder="such as a date">` : '')
    + `<h3>Logins this instance may use</h3>` + ticksHtml(s.offers) + `<div><button class="btn primary" data-act="start-go">${esc(s.go)}</button></div>`;
}

// What waits on you: the agent's asks for you, requests to start a series you can see, and chains of wakes that broke.
function waiting() {
  const out = [], at = (w, s, i) => `<a href="#/${i?.id ?? w.id}">${esc(w.name)} · ${esc(s.name)}${i ? ' · ' + esc(i.label) : ''}</a>`;
  for (const w of tree.filter(w => !w.archived)) for (const s of w.series.filter(s => !s.archived)) {
    for (const i of s.instances) {
      const n = i.asks.filter(e => e === me.email).length;
      if (n) out.push(`<div class="wt">${at(w, s, i)}: ${n} ask${n > 1 ? 's' : ''} for you</div>`);
    }
    for (const r of s.requests) out.push(`<div class="wt">${at(w, s)}: ${esc(r.from.split('/').slice(-2).join(' · '))} asks to start ${esc(r.label)} <button class="btn" data-act="req-start" data-id="${esc(r.id)}">Start</button></div>`);
    if (s.allow_wakes === me.email && !s.instances.some(i => i.status === 'open') && !s.wake && !s.requests.length) out.push(`<div class="wt">${at(w, s)}: wakes itself, but nothing is open and no wake is set</div>`);
  }
  return [...out, ...expired.map(l => `<div class="wt">Your ${esc(l.name)} login has expired: <a data-act="logins">sign in again</a></div>`)];
}

// A menu under the button that opened it. Items are [label, act, class, why it's off], or ['-'] for a rule; an item does what a
// button with its act does.
function openMenu(btn, items) {
  const m = $('#pop');
  m.innerHTML = items.filter(Boolean).map(([label, act, cls = '', off]) => label === '-' ? '<hr>'
    : `<button role="menuitem" class="${cls}" data-act="${act}" ${off ? `disabled title="${esc(off)}"` : ''}>${esc(label)}</button>`).join('');
  m.dataset.by = btn.dataset.act;
  m.hidden = false;
  const r = btn.getBoundingClientRect();
  m.style.left = `${Math.max(8, Math.min(r.left, innerWidth - m.offsetWidth - 8))}px`;
  m.style.top = `${r.bottom + 4 + m.offsetHeight < innerHeight ? r.bottom + 4 : Math.max(8, r.top - 4 - m.offsetHeight)}px`;
  m.querySelector('button:not(:disabled)')?.focus();
}

// The page's own dialog, to confirm or to ask for a name: it resolves with what act returns, or null if cancelled. Until act
// succeeds it stays open, saying why it didn't.
function ask({ title, text = '', value, placeholder = '', ok, kind = 'primary', act }) {
  const d = $('#ask');
  d.innerHTML = `<form method="dialog"><h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ''}`
    + (value === undefined ? '' : `<input type="text" value="${esc(value)}" placeholder="${esc(placeholder)}" required autocomplete="off">`)
    + `<div class="err"></div><div class="foot"><button class="btn ${kind}" value="ok">${esc(ok)}</button><button class="btn" formnovalidate>Cancel</button></div></form>`;
  d.showModal();
  d.querySelector('input')?.select();
  return new Promise(done => {
    d.onclose = () => done(null);
    d.querySelector('form').onsubmit = async e => {
      if (e.submitter.value !== 'ok') return;
      e.preventDefault();
      e.submitter.setAttribute('aria-busy', 'true');
      try {
        done(await act(value === undefined ? undefined : d.querySelector('input').value.trim()));
        d.close();
      } catch (err) {
        d.querySelector('.err').textContent = err.message;
      } finally {
        e.submitter.removeAttribute('aria-busy');
      }
    };
  });
}

// A name changes where it shows: Enter or leaving the field saves it, Escape keeps the old one. The bar and the sidebar wait.
let editing = null;
function editName(el, name, save) {
  const input = Object.assign(document.createElement('input'), { type: 'text', className: 'inline', value: name }), host = el.closest('#bar, #side');
  el.replaceWith(input);
  editing = input;
  input.select();
  const end = async keep => {
    if (editing !== input) return;
    editing = null;
    try {
      if (keep && input.value.trim() && input.value.trim() !== name) await save(input.value.trim()).then(refresh);
    } finally {
      drawn.delete(host);
      render();
    }
  };
  input.onkeydown = e => {
    if (e.key === 'Enter' && !e.isComposing) end(true);
    if (e.key === 'Escape') { e.stopPropagation(); end(false); }
  };
  input.onblur = () => end(true);
}

async function preview(path, item) {
  const sheet = /\.(xlsx|xlsm|xls|csv|eml)$/i.test(path), text = /\.(md|txt|json|py|sql|log)$/i.test(path);
  const p = pv = { title: fname(path), path, item: item?.id, threads: item ? talkOn(item.id) : [], sheet: 0, image: /\.(png|jpe?g|gif|webp|svg)$/i.test(path), was: item && data.log.findLast(e => e.op === 'point' && e.item === item.id && e.file === path)?.was, md: /\.md$/i.test(path), loading: sheet || text };
  renderPv();
  try {
    if (sheet) Object.assign(p, await api(fileUrl(path, 'preview')));
    if (text) p.text = await (await fetch(fileUrl(path))).text();
  } finally {
    p.loading = false;
    if (pv === p) renderPv();
  }
}

async function upload(files, pane, onto) {
  const path = instPath(), mine = files.map(f => ({ f, pane, path, pct: 0 })), before = new Set(data.doc.items.map(i => i.file));
  uploads.push(...mine);
  renderPanes();
  for (const u of mine) {
    await new Promise((ok, fail) => {
      const x = new XMLHttpRequest();
      x.open('POST', `${path}/upload?pane=${pane}&name=${enc(u.f.name)}${onto ? '&onto=' + enc(onto) : ''}`);
      x.upload.onprogress = e => { u.pct = 100 * e.loaded / e.total; renderPanes(); };
      x.onload = () => (x.status < 300 ? ok() : fail(new Error(x.responseText)));
      x.onerror = () => fail(new Error(`${u.f.name} didn't upload`));
      x.send(u.f);
    }).catch(e => toast(e.message));
    uploads = uploads.filter(x => x !== u);
  }
  await refresh();
  if (shown !== path) return;
  markSeen(data.doc.items.filter(i => i.file?.startsWith('upload/') && !before.has(i.file)));
  renderPanes();
}

  else if ($('#side').classList.contains('open')) $('#side').classList.remove('open');
  else if (openItem) { openItem = null; renderCard(); renderPanes(); }
  else if (ui.log || ui.conv || ui.proc) { ui.log = ui.conv = ui.proc = false; renderLog(); renderBar(); }
  else if (ui.adv) { ui.adv = false; renderAdv(); }
});
// Microsoft sends people back to #logins after they connect Microsoft 365.
const backFromMicrosoft = location.hash === '#logins';
if (backFromMicrosoft) history.replaceState(null, '', '#/');
refresh().then(() => backFromMicrosoft && openLogins());
// The server names what changed: "tree" for names, settings, wakes and logins, else an instance by its id. The page catches up one
// refresh at a time, and when it comes back into view.
const pend = new Set();
let busy = false;
async function drain() {
  if (busy || document.hidden || !pend.size) return;
  busy = true;
  const ids = [...pend];
  pend.clear();
  await (ids.includes('tree') ? refresh() : patch(ids)).catch(console.error);
  busy = false;
  drain();
}
const events = new EventSource('/api/events');
events.onmessage = e => { pend.add(e.data); drain(); };
events.onopen = () => { pend.add('tree'); drain(); };
// The browser gives up on a stream that comes back with an error, as during a deploy or once the session has ended.
events.onerror = () => events.readyState === EventSource.CLOSED && setTimeout(() => location.reload(), 5000);
addEventListener('visibilitychange', drain);
$('#log').addEventListener('scroll', e => { const el = e.currentTarget; el.dataset.end = el.scrollTop + el.clientHeight >= el.scrollHeight - 8 ? 'yes' : 'no'; });
</script>
