  if (item.file) h += `<button class="btn" data-act="preview" data-file="${esc(item.file)}" data-item="${esc(item.id)}">Open full</button><a class="btn" href="${fileUrl(item.file)}">Download</a>`;
  if (open && !wide) h += `<button class="btn" data-act="add" data-item="${esc(item.id)}" data-pane="${item.kind === 'output' ? 'out' : 'in'}">Upload…</button>`;
  if (open) h += `<button class="btn" data-act="comment-on" data-item="${esc(item.id)}">Comment</button>`;
  if (data.doc.status === 'closed' && !archived()) h += `<button class="btn" data-act="correct" data-item="${esc(item.id)}">Correct\u2026</button>`;
  h += `<button class="btn primary" data-act="uncard" style="margin-left:auto">Close</button></div>`;
  put(card, h);
  card.hidden = false;
  if (wide && (cardPv.att ?? cardPv).pdf) watchPages(card, cardPv.att ?? cardPv);
  placeCard();
}

// Beside its tile where there's room, else under it, and never over the side panel, whose comment box it would cover.
function placeCard() {
  const card = $('#card'), t = !card.hidden && document.querySelector(`:is(.tile, .lrow)[data-item="${CSS.escape(openItem)}"]`);
  if (!t || innerWidth <= 800) return;
  const r = t.getBoundingClientRect(), end = $('#panes').getBoundingClientRect().right, w = card.offsetWidth, ch = card.offsetHeight;
  const right = r.right + 10 + w < end, left = !right && r.left - 10 - w >= 8;
  card.style.left = (right ? r.right + 10 : left ? r.left - 10 - w : Math.max(8, Math.min(r.left, end - w - 8))) + 'px';
  card.style.top = Math.max(8, Math.min(right || left ? r.top : r.bottom + 8, innerHeight - ch - 8)) + 'px';
}

const colName = c => (c >= 26 ? colName(Math.floor(c / 26) - 1) : '') + String.fromCharCode(65 + c % 26);
const num = v => v.toLocaleString(undefined, { maximumFractionDigits: 2 });

const cellText = v => v == null ? '' : typeof v === 'object' ? v.f : typeof v === 'number' ? num(v) : v;

function sheetTable(p, s, first) {
  const noted = new Map(), asks = new Set(), at = new Map();
  for (const t of p.threads ?? []) {
    const raw = String(t.ref ?? ''), bang = raw.lastIndexOf('!');
    const rawSheet = bang < 0 ? undefined : raw.slice(0, bang);
    const sheet = rawSheet?.startsWith("'") && rawSheet.endsWith("'") ? rawSheet.slice(1, -1).replaceAll("''", "'") : rawSheet;
    const r = (bang < 0 ? raw : raw.slice(bang + 1)).match(/^\$?([A-Z]{1,3})\$?(\d+)(?:$|:)/);
    if (!r || (sheet !== undefined ? sheet !== s.name : !first)) continue;
    const key = `${+r[2] - 1},${[...r[1]].reduce((t, ch) => t * 26 + ch.charCodeAt(0) - 64, 0) - 1}`;
    noted.set(key, (noted.has(key) ? noted.get(key) + '\n\n' : '') + t.posts.map(p => `${nameOf(p.by)}: ${p.text}`).join('\n'));
    at.set(key, t.id);
    if (t.waits) asks.add(key);
  }
  const old = p.cmp && oldOf(p);
  const rows = Array.from({ length: Math.max(s.rows.length, old?.rows.length ?? 0) }, (_, r) => s.rows[r] ?? []);
  const width = Math.max(0, ...rows.map(r => r.length), ...(old?.rows ?? []).map(r => r.length));
  // As the workbook shows it: its number formats, bold, font colours and fills, column widths, merged cells, and no hidden rows or
  // columns.
  const look = s.look ?? {}, hidden = { rows: new Set(s.hidden?.rows), cols: new Set(s.hidden?.cols) }, span = new Map(), covered = new Set();
  const cols = Array.from({ length: width }, (_, c) => c).filter(c => !hidden.cols.has(c));
  for (let [r1, c1, r2, c2] of s.merged ?? []) {
    r2 = Math.min(r2, rows.length - 1);
    c2 = Math.min(c2, width - 1);
    for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) if (r > r1 || c > c1) covered.add(`${r},${c}`);
    span.set(`${r1},${c1}`, [rows.slice(r1, r2 + 1).filter((_, k) => !hidden.rows.has(r1 + k)).length, cols.filter(c => c >= c1 && c <= c2).length]);
  }
  let h = `<table class="sh"><colgroup><col>${cols.map(c => s.widths?.[c] ? `<col style="width:${Math.round(s.widths[c] * 7 + 5)}px">` : '<col>').join('')}</colgroup>`
    + `<tr><th></th>${cols.map(c => `<th>${colName(c)}</th>`).join('')}</tr>`;
  rows.forEach((row, r) => {
    if (hidden.rows.has(r)) return;
    h += `<tr><td class="rn">${r + 1}</td>`;
    for (const c of cols) {
      if (covered.has(`${r},${c}`)) continue;
      const v = row[c], was = old?.rows[r]?.[c] ?? null, lk = look[`${r},${c}`] ?? {}, sp = span.get(`${r},${c}`);
      const changed = old && JSON.stringify(was) !== JSON.stringify(v ?? null);
      const note = [noted.get(`${r},${c}`), changed ? `Was: ${cellText(was) || '(empty)'}` : ''].filter(Boolean).join('\n\n');
      const cls = `${typeof v === 'number' || lk.r ? 'num' : ''} ${v && typeof v === 'object' ? 'fx' : ''} ${noted.has(`${r},${c}`) ? 'noted' : ''} ${asks.has(`${r},${c}`) ? 'q' : ''} ${changed ? 'chg' : ''}`.trim();
      const style = `${lk.b ? 'font-weight:600;' : ''}${lk.fg ? `color:${lk.fg};` : ''}${lk.bg && !changed ? `background:${lk.bg};` : ''}`;
      h += `<td${cls ? ` class="${cls}"` : ''}${sp ? ` rowspan="${sp[0]}" colspan="${sp[1]}"` : ''}${style ? ` style="${esc(style)}"` : ''} data-act="cell" data-ref="${esc(`${s.name}!${colName(c)}${r + 1}`)}"${note ? ` data-note="${esc(note)}"` : ''}${at.has(`${r},${c}`) ? ` data-thread="${esc(at.get(`${r},${c}`))}"` : ''}>${esc(lk.t ?? cellText(v))}</td>`;
    }
    h += '</tr>';
  });
  return h + '</table>' + (s.truncated ? `<div class="empty">Showing the first ${s.rows.length} rows.</div>` : '');
}

function renderPv() {
  const d = $('#pv');
  if (!pv) return void (d.open && d.close());
  // Your account's dialog: Logins and Tokens, as tabs.
  const account = [['logins', 'Logins'], ['tokens', 'Tokens']], mine = account.some(([k]) => k === pv.settings?.kind);
  d.className = 'pv' + (pv.settings ? ' small' : '') + (mine || ['workspace', 'waiting', 'costs'].includes(pv.settings?.kind) ? ' wide' : '');
  let h = `<div class="pvh"><b>${esc(pv.title)}</b><span class="saved"></span>${pv.sheets && /\.(xlsx|xlsm|xls|csv)$/i.test(pv.was ?? '') ? `<button class="btn ${pv.cmp ? 'sel' : ''}" data-act="compare">${pv.cmp ? `Changes since ${esc(fname(pv.was))}` : 'Compare with previous'}</button>` : ''}${(pv.att ?? pv).doc ? '<button class="btn" data-act="layout">Exact layout</button>' : ''}${pv.path ? `<a class="btn" href="${fileUrl(pv.path)}">Download</a>` : ''}${pv.signin ? `<button class="btn primary" data-act="signin-save"${pv.signinExpired ? ' disabled' : ''}>${pv.vpn ? 'Connect' : 'Save login'}</button>` : ''}<button class="btn${pv.signin && !pv.signinExpired ? '' : ' primary'}" data-act="unpv">${pv.signin && !pv.signinExpired ? 'Cancel' : 'Close'}</button></div>`;
  if (mine) h += `<div class="pvtabs">${account.map(([k, name]) => `<button class="tab ${pv.settings.kind === k ? 'sel' : ''}" data-act="${k}">${name}</button>`).join('')}</div>`;
  if (pv.att) h += `<div class="sub" style="padding:8px 14px"><a data-act="attachment-back">\u2190 ${esc(pv.title)}</a> \u00b7 ${esc(pv.att.title)}</div>` + previewBody(pv.att);
  else if (pv.path) h += previewBody(pv);
  else if (pv.signin) h += pv.signinExpired ? '<div class="pvb"><div class="empty" role="status">Sign-in expired. Close this and sign in again.</div></div>'
    : `<div class="sub" style="padding:8px 14px">Sign in as you always do, then ${pv.vpn ? 'Connect' : 'Save login'}. Only you see this browser. It closes in <b id="signin-clock"></b>.${!pv.vpn && me.can.includes('keepalive') ? `<label style="display:block;margin-top:6px"><input type="checkbox" id="keep"> Keep the login alive until <input type="datetime-local" id="keep-until" value="${localInput(Date.now() + 7 * 864e5)}" max="${localInput(Date.now() + 7 * 864e5)}">, a week at most: the server opens the site every few minutes, so runs while you're away find you signed in.</label>` : ''}</div><div class="pvb"><iframe src="/signins/${pv.signin}/view?drive" title="${esc(pv.title)}" style="width:100%;height:100%;border:0"></iframe></div>`;
  else if (pv.settings?.kind === 'tokens') h += `<div class="pvb vl">${tokensHtml(pv.settings)}</div>`;
  else if (pv.settings?.kind === 'logins') h += `<div class="pvb vl">${loginsHtml(pv.settings)}</div>`;
  else if (pv.settings?.kind === 'wakes') h += `<div class="pvb vl">${wakesHtml(cur.i.id, cur.i.wakes, false)}</div>`;
  else if (pv.settings?.kind === 'notes') h += `<div class="pvb vl">${notesHtml(pv.settings)}</div>`;
  else if (pv.settings?.kind === 'waiting') h += `<div class="pvb vl">${waiting().join('') || '<div class="sub">Nothing waits on you.</div>'}</div>`;
  else if (pv.settings?.kind === 'costs') h += `<div class="pvb vl">${costsHtml(pv.settings)}</div>`;
  else if (pv.settings?.kind === 'start') h += `<div class="pvb vl">${startHtml(pv.settings)}</div>`;
  else if (pv.settings) {
    const s = pv.settings;
    h += '<div class="pvb vl">';
    if (s.kind === 'workspace') h += (s.manage ? `<h3>Name</h3><input type="text" id="wname" value="${esc(s.name)}">` : '') + peopleHtml(s)
      + (s.grants.length ? `<h3>Websites</h3><div class="sub">The logins people ask for runs here to use, and those its owners approved.</div>`
        + s.grants.map(g => grantHtml(g)).join('') : '')
      + readingHtml(s)
      + agentsHtml(s, 'Every agent in this workspace reads it at the start of each run: its conventions, and changes that cut across its series, such as a renamed entity.', s.manage)
      + (s.manage && !s.archived ? moveHtml(s) : '')
      + (s.manage ? `<div class="row2"><button class="btn${s.archived ? '' : ' danger'}" data-act="archive-workspace">${s.archived ? 'Restore workspace' : 'Archive workspace'}</button></div>` : '');
    if (s.kind === 'series') h += `<h3>Name</h3><input type="text" id="sname" value="${esc(s.name)}">`
      + `<h3>Who starts runs</h3>${startsHtml(s)}<h3>Wakes</h3>${wakesHtml(s.id, s.wakes, true)}`
      + `<h3>Cost</h3><div class="sub">This series' runs have cost ${usd(s.cost, s.estimated)} so far, ${usd(s.cost / Math.max(1, s.closed), s.estimated)} per closed instance.</div>`
      + (cur.w.archived ? (cur.w.manage ? '<div class="row2"><button class="btn" data-act="archive-workspace">Restore workspace</button></div>' : '') : `<div class="row2"><button class="btn${s.archived ? '' : ' danger'}" data-act="archive-series">${s.archived ? 'Restore series' : 'Archive series'}</button></div>`);
    h += '</div>';
  }
  d.innerHTML = h + `<div class="pvn${pv.signin ? ' err' : ''}" id="pvn"${pv.signin ? ' role="alert"' : ''}></div>`;
  if (pv.settings?.kind === 'workspace' ? cur.w.archived : pv.settings?.kind === 'series' && archived()) {
    d.querySelector('.pvb').insertAdjacentHTML('afterbegin', '<div class="sub">Archived · read-only</div>');
    for (const el of d.querySelectorAll('.pvb input, .pvb textarea, .pvb select')) el.disabled = true;
    for (const el of d.querySelectorAll('.pvb button:not([data-act=archive-series]):not([data-act=archive-workspace])')) el.remove();
  }
  mvSay();
  if (!d.open) d.showModal();
  if ((pv.att ?? pv).pdf) watchPages(d, pv.att ?? pv);
}

function grantHtml(g, cls = 'lsub') {
  const w = tree.find(w => w.id === g.workspace), ws = g.workspaceName ?? w?.name ?? g.workspace, pending = g.state === 'pending', mine = g.person === me.email, manage = me.role === 'admin' || w?.manage;
  const c = g.profile ?? g.check, flags = g.flags ?? c?.flags ?? [], what = c?.what ?? c?.summary;
  const why = g.adminWhy || (c?.category === 'general' ? 'This is a general-purpose website.' : c?.risk === 'high' ? 'The website is high risk.' : ''), adminOnly = g.adminOnly ?? !!why;
  const category = { company: 'Company system', vendor: 'Vendor system', bank: 'Bank system', government: 'Government system', general: 'General-purpose website' }[c?.category];
  return `<div class="${cls} grant" data-grant="${esc(g.id)}"><div>${person(g.person)} ${pending ? 'asks for' : 'lets'} runs in <a href="#/${esc(g.workspace)}">${esc(ws)}</a> ${pending ? 'to ' : ''}use their <b>${esc(g.site)}</b> login to ${esc(new URL(g.url).hostname)}.</div>`
    + `<div class="sub">${esc(g.url)}${category ? ` · ${category}` : ''}${!g.profile && c?.risk ? ` · ${esc(c.risk)} risk` : ''}</div>`
    + (what ? `<div class="sub">${esc(what)}</div>` : '')
    + (g.via ? `<div class="sub">Through ${esc(g.via)} VPN into the client's network.</div>` : '')
    + (!c || c.error ? `<div class="sub">Not checked${c?.error ? `: ${esc(c.error)}` : ''}.</div>` : '')
    + `<div>Runs may do whatever ${esc(nameOf(g.person))} can there, including submitting and approving.</div>`
    + `<div>Reason: ${esc(g.reason)}</div>`
    + (flags.length ? `<div class="sub">Flags: ${esc(flags.join('; '))}</div>` : '')
    + (!g.profile && g.check?.hosts?.length ? `<div class="sub">Other hosts in the earlier check: ${esc(g.check.hosts.join(', '))}.</div>` : '')
    + (pending && adminOnly ? `<div class="sub">Only an admin can approve. ${esc(why)}</div>` : '')
    + (!pending && g.by ? `<div class="sub">Approved by ${person(g.by)}${g.decided ? ` ${esc(when(g.decided))}` : ''}.${g.text ? ` ${esc(g.text)}` : ''}</div>` : '')
    + (g.use ? `<div class="sub">Opened in ${plural(g.use.runs, 'run')} · ${plural(g.use.wrote, 'run')} wrote · last used ${g.use.last ? esc(when(g.use.last)) : 'never'}.</div>` : '')
    + `<div class="row2">${pending && manage ? `${!adminOnly || me.role === 'admin' ? `<button class="btn" data-act="grant-approve" data-id="${esc(g.id)}">Approve</button>` : ''}<button class="btn" data-act="grant-deny" data-id="${esc(g.id)}">Deny</button>` : ''}`
    + `${pending && mine || !pending && (manage || mine) ? `<button class="quiet" data-act="grant-revoke" data-id="${esc(g.id)}">${pending ? 'Withdraw' : mine ? 'Stop using' : 'Revoke'}</button>` : ''}</div></div>`;
}

// Sharing a series lends your logins to whoever starts its runs, so it takes two clicks, the second saying what you take on. Once it's
// yours, the ticks save as they change.
function startsHtml(s) {
  const mine = s.shared_by === me.email, ws = esc(cur.w.name), arm = `<button class="btn share ${pv.arming ? 'armed' : ''}" data-act="share-arm">${s.shared_by ? 'Have them wake it as me instead' : `Let ${ws} wake this series`}</button>`;
  return `<div>${s.shared_by ? `People in ${ws} and their agents wake this series, as ${mine ? 'you, with these credentials:' : person(s.shared_by) + '.'}` : "Each instance's runner, and nobody else: others' comments are notes for them, and a wake asks someone to start the instance."}</div>`
    + (mine ? ticksHtml(s.logins, s.shared_logins) + '<div class="row2"><button class="btn" data-act="share-off">Stop</button></div>' : `<div class="row2">${arm}</div>`)
    + (pv.arming ? `<div class="warn"><h3>Credentials</h3>${ticksHtml(s.logins)}<div class="consent">By allowing, people in ${ws} and their agents can wake this series: start or continue its instances, with a short reason, and add notes and files. Those runs act as you, using the selected credentials, and do the series' usual work.</div><div><button class="btn danger" data-act="share-on">Allow ${ws} to wake this series</button></div></div>` : '');
}

// A series' notes, for its runs: the open ones, then those settled, folded, with who settled them, how and why; and a box to tell it
// something. The runners of its open instances, the workspace's owners and admins settle one by hand.
async function openNotes(id) {
  const [w, s] = tree.flatMap(w => w.series.filter(s => s.id === id).map(s => [w, s]))[0];
  pv = { title: `Notes on ${s.name}`, settings: { kind: 'notes', id, w, s, list: await api(`/api/series/${id}/notes`) } };
  renderPv();
}

function notesHtml({ id, w, s, list }) {
  const shut = archived(w, s), settles = !shut && (w.manage || s.instances.some(i => i.status === 'open' && i.runner === me.email));
  const by = e => e.by === 'agent' ? agentOf(e) : person(e.by), how = e => e.op === 'taken' ? 'Acted on' : 'Set aside';
  const body = n => `<div class="pb">${esc(n.text)}</div>` + (n.files ?? []).map(f => `<div class="f"><a href="/api/series/${id}/${f.split('/').map(enc).join('/')}">${esc(fname(f))}</a></div>`).join('');
  const open = list.filter(n => !n.settled), done = list.filter(n => n.settled);
  return `<div class="sub">Something for this series' agent to know: about the series as a whole, or while no period is open. A note doesn't start the agent. Each time it next works on ${esc(s.name)}, it reads the open notes, acts on them, and marks each one done or set aside, saying why.</div>`
    + (open.length ? '' : '<div class="sub">No open notes.</div>')
    + open.map(n => `<div class="note"><div class="sub"><b>${by(n)}</b> \u00b7 ${when(n.at)}</div>${body(n)}`
      + (settles ? `<div class="row2"><input type="text" placeholder="What was done, or why not"><button class="btn" data-act="note-taken" data-seq="${n.seq}">Mark done</button><button class="quiet" data-act="note-aside" data-seq="${n.seq}">Set aside</button></div>` : '') + '</div>').join('')
    + done.map(n => `<details class="note"><summary>${esc(firstLine(n.text))} \u00b7 ${how(n.settled)} by ${by(n.settled)}</summary><div class="sub"><b>${by(n)}</b> \u00b7 ${when(n.at)}</div>${body(n)}`
      + `<div class="sub">${how(n.settled)} by ${by(n.settled)} \u00b7 ${when(n.settled.at)}: ${esc(n.settled.text)}${seeHtml(n.settled.see)}</div></details>`).join('')
    + (shut ? '' : '<h3>Tell this series</h3><textarea id="notetext" rows="3" placeholder="Such as: from October, the bank file comes from the new portal"></textarea><input type="file" id="notefiles" multiple><div class="row2"><button class="btn primary" data-act="note-post">Tell</button></div>');
}

// Wakes for an instance or a series, each one-off or weekly on the days ticked at its time, editable in place, and a row to add one.
// A series' starts the instance it names, a weekly one's label holding the date it first fires or the one before it fires on.
const WEEK = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
function wakesHtml(target, list, series) {
  const row = (k = {}) => `<div class="wakerow" data-id="${k.id ?? ''}" data-target="${target}"><input type="datetime-local" class="wat" value="${k.at ? localInput(k.at) : ''}">`
    + (series ? `<input type="text" class="wlabel" placeholder="Label it starts" value="${esc(k.label ?? '')}">` : '')
    + `<input type="text" class="wtext" maxlength="500" placeholder="Message for the run (optional)" value="${esc(k.text ?? '')}">`
    + '<div class="row2">' + WEEK.map(d => `<label class="sub"><input type="checkbox" value="${d}" ${k.days?.includes(d) ? 'checked' : ''}>${d[0].toUpperCase() + d.slice(1)}</label>`).join('')
    + `<button class="btn" data-act="wake-save">${k.id ? 'Save' : 'Add'}</button>${k.id ? '<button class="quiet" data-act="wake-delete">Delete</button>' : ''}</div></div>`;
  return `<div class="sub">${series ? 'Each starts the instance it names, or continues it if the series has it.' : 'Each continues this instance.'} Tick days to repeat it weekly at its time.</div>${list.map(row).join('')}${row()}`;
}

// What this workspace's agents read, and which other workspaces' agents read it, as each one's owners let them, choosing among the
// workspaces they see; the owners of either side take a link off.
function readingHtml(s) {
  const others = tree.filter(w => w.id !== s.id && !w.archived && !s.readers.some(r => r.id === w.id));
  const link = (name, source, reader) => `<div class="lsub"><span>${esc(name)}</span>${s.manage ? `<button class="quiet" data-act="reader-drop" data-source="${source}" data-reader="${reader}">Take off</button>` : ''}</div>`;
  return `<h3>Reading</h3><div class="sub">Agents here read every series of this workspace${s.reads.length ? ', and those of the workspaces below, whose owners let them' : ''}. They write only here, and everyone here sees what they read.</div>`
    + s.reads.map(r => link(r.name, r.id, s.id)).join('')
    + `<div class="sub">${s.readers.length ? 'Agents in these workspaces read this one, and their people see what they read:' : "No other workspace's agents read this one."}</div>`
    + s.readers.map(r => link(r.name, s.id, r.id)).join('')
    + (s.manage && others.length ? `<div class="row2"><select id="reader">${others.map(w => `<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select><button class="btn" data-act="reader-add">Let its agents read this one</button></div>` : '');
}

// A merge or move, as Waiting on you and the settings say it.
const proposalText = p => p.kind === 'merge' ? `to merge ${esc(p.from)} into ${esc(p.to)}` : `to move ${esc(p.series)} from ${esc(p.from)} to ${esc(p.to)}`;

// Merging this workspace into another you see, or moving one of its series there, once a manager of that one accepts within a week;
// or the proposal open, which its proposer's side withdraws.
function moveHtml(s) {
  const p = s.proposal, others = tree.filter(w => w.id !== s.id && !w.archived);
  if (p) return `<h3>Merge or move</h3><div class="sub">${person(p.by)} proposed ${when(p.at)} ${proposalText(p)}, for its owners to accept within a week.</div>`
    + (p.id === s.id ? `<div class="row2"><button class="btn" data-act="proposal-drop" data-id="${p.id}">Withdraw</button></div>` : '');
  return !others.length ? '' : '<h3>Merge or move</h3><div class="sub">All of it, or one series, into another workspace you see, once one of its owners accepts.</div>'
    + `<div class="mv"><label><span class="sub">From</span><select id="mvwhat"><option value="">All of ${esc(s.name)}</option>${s.series.filter(x => !x.archived).map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label>`
    + `<svg class="mvarrow" width="16" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><path d="M12.01 19.9825C11.75 19.9825 11.5 19.8825 11.3 19.6925C10.91 19.3025 10.91 18.6725 11.3 18.2825L16.59 12.9925H5C4.45 12.9925 4 12.5425 4 11.9925C4 11.4425 4.45 10.9925 5 10.9925H16.59L11.3 5.7025C10.91 5.3125 10.91 4.6825 11.3 4.2925C11.69 3.9025 12.32 3.9025 12.71 4.2925L19.71 11.2925C19.81 11.3925 19.88 11.5025 19.93 11.6225C19.98 11.7425 20 11.8625 20.01 12.0025C20.01 12.1425 19.98 12.2725 19.93 12.3825C19.88 12.5025 19.81 12.6125 19.71 12.7125L12.71 19.7125C12.51 19.9125 12.26 20.0025 12 20.0025L12.01 19.9825Z" fill="currentColor"></path></svg><label><span class="sub">Into</span><select id="mvto">${others.map(w => `<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></label></div>`
    + '<div class="row2 mvgo"><span class="sub" id="mvsay"></span><button class="btn" data-act="propose" id="mvgo">Propose</button></div>';
}

// What Propose would ask, as the two choices stand: the whole workspace merged into the other, or a series moved there.
function mvSay() {
  const what = $('#mvwhat'), to = $('#mvto');
  if (!what || !to) return;
  const into = to.selectedOptions[0]?.text ?? '', series = what.value && what.selectedOptions[0].text;
  $('#mvsay').textContent = series ? `Moves ${series} into ${into}; whoever isn't in ${into} no longer sees it.` : `Merges ${pv.settings.name} into ${into}: everyone here joins it.`;
  $('#mvgo').textContent = series ? 'Propose move' : 'Propose merge';
}

// AGENTS.md, the company's or a workspace's: a text every agent in scope reads, which only admins, or the workspace's owners, change.
const agentsHtml = (s, sub, edit) => `<h3>AGENTS.md</h3><div class="sub">${sub}</div>`
  + (edit ? `<textarea id="agents" rows="8" placeholder="Such as: Fiscal months end on the last Saturday.">${esc(s.agents)}</textarea><div><button class="btn" data-act="save-agents">Save AGENTS.md</button></div>`
    : `<div class="sub">${s.agents ? esc(s.agents) : 'None yet.'}</div>`);

// A workspace's people, each an email or an Entra group's id: owners manage who is in it, and owners and members see and work in all
// of it. Owners come first, then members, the first five shown until Show all; each row's two buttons are of one width, on one line.
const PEOPLE_SHOWN = 5;
function peopleHtml(s) {
  const row = ([p, owner], k) => `<tr${k >= PEOPLE_SHOWN ? ' class="more"' : ''}><td>${person(p)}${p.includes('@') ? '' : ' · group'}</td><td>${owner ? 'Owner' : 'Member'}</td>`
    + (s.manage ? `<td><div class="pacts"><button class="btn" data-act="wrole" data-p="${esc(p)}">${owner ? 'Make member' : 'Make owner'}</button><button class="btn danger" data-act="wremove" data-p="${esc(p)}">Remove</button></div></td>` : '') + '</tr>';
  const people = [...s.owners.map(p => [p, true]), ...s.members.map(p => [p, false])], all = pv.peopleAll || s.archived;
  return `<h3>People</h3><div class="sub">Owners and members see and work in everything here, and its agents read across it. Owners manage who is in it.${people.length ? '' : ' No one is in it yet, so only admins see it.'}</div>`
    + `<table class="ut people${s.manage ? ' manage' : ''}${all ? '' : ' folded'}">${people.map(row).join('')}</table>`
    + (people.length > PEOPLE_SHOWN ? `<button class="quiet closed" data-act="people-all">${all ? `${ICON.up}Show fewer` : `${ICON.down}Show all`}<span class="tally">${people.length}</span></button>` : '')
    + (s.manage ? `<div class="row2"><input type="text" id="wperson" list="known" autocomplete="off" placeholder="A name or email, or an Entra group's id, as Finance HK <id>" style="flex:1"><datalist id="known">${Object.entries(me.names).map(([id, n]) => `<option value="${esc(`${n} <${id}>`)}">`).join('')}</datalist><button class="btn primary" data-act="wadd">Add</button></div>` : '');
}

// A datetime-local input's value, in the browser's time zone.
const localInput = iso => new Date(new Date(iso).getTime() - new Date(iso).getTimezoneOffset() * 60e3).toISOString().slice(0, 16);

function openWorkspaceSettings() {
  pv = { title: 'Workspace settings', settings: { ...cur.w, kind: 'workspace' } };
  renderPv();
}

async function openSeriesSettings() {
  const s = cur.s, logins = await api('/logins');
  pv = { title: 'Series settings', settings: { ...s, kind: 'series', logins, cost: s.instances.reduce((t, i) => t + i.cost, 0), estimated: s.instances.some(i => i.estimated), closed: s.instances.filter(i => i.status === 'closed').length } };
  renderPv();
}


function costsHtml(c) {
  const k = c.key;
  let h = '';
  if (k) {
    h += `<h3>OpenRouter key</h3>${k.low_credit ? `<div class="bad">${esc(lowCreditText(k))}</div>` : ''}`
      + `<div class="lline"><b>Key usage</b><span class="sub">${usd(k.usage)} used${k.limit !== null ? ` · ${usd(k.remaining)} remaining of ${usd(k.limit)} limit${k.reset ? ` (resets ${esc(k.reset)})` : ''}` : ' · no spending limit'}</span></div>`
      + (k.usage_daily !== null ? `<div class="lline"><b>Today (${esc(k.day)} UTC)</b><span class="sub">OpenRouter key: ${usd(k.usage_daily)} · Server recorded on key: ${usd(k.server_total, k.server_estimated)} · Unattributed: ${signedUsd(k.unattributed)}</span></div>` : '');
  } else h += '<h3>OpenRouter key</h3><div class="sub">Unavailable or no server key set.</div>';
  h += '<h3>Daily totals</h3>';
  if (!c.days.length) return h + '<div class="sub">No costs recorded yet.</div>';
  for (const d of c.days.slice().reverse()) {
    h += `<details class="tgroup" ${d === c.days.at(-1) ? 'open' : ''}><summary><b>${esc(d.day)}</b> · ${usd(d.cost, d.estimated)}<span class="sub">${plural(d.runs_count, 'run')}${d.server?.cost ? ` · server ${usd(d.server.cost, d.server.estimated)}` : ''}</span></summary>`;
    const ws = Object.entries(d.by_workspace);
    if (ws.length) h += '<div class="sub">Workspaces: ' + ws.map(([w, v]) => `${esc(w)} ${usd(v.cost, v.estimated)} (${v.runs})`).join(' · ') + '</div>';
    const ps = Object.entries(d.by_person);
    if (ps.length) h += '<div class="sub">People: ' + ps.map(([p, v]) => `${person(p)} ${usd(v.cost, v.estimated)} (${v.runs})`).join(' · ') + '</div>';
    for (const s of d.server?.items ?? []) h += `<div class="lsub"><span>Server · ${esc(s.kind)}${s.site ? `: <b>${esc(s.site)}</b>` : ''} (${person(s.person)}) · ${plural(s.calls, 'call')}</span><span>${usd(s.cost, s.estimated)}</span></div>`;

// What waits on you: the agent's asks and the notes for you, requests to start a series you can see, proposals to merge or move

  const out = tree.filter(w => !w.archived && w.manage && w.proposal?.into === w.id).map(({ proposal: p }) => `<div class="wt">${person(p.by)} proposes ${proposalText(p)}`

    for (const i of s.instances) {

      if (i.assigned) out.push(`<div class="wt">${person(i.assigned.by)} assigned you ${at(w, s, i)}</div>`);
      if (me.role === 'admin') for (const r of i.refused) out.push(`<div class="wt">${at(w, s, i)}: run ${r.run}'s browser on ${r.login === me.email ? '' : `${person(r.login)}'s `}${esc(r.site)} was refused`
        + r.hosts.map(x => ` <span class="creds">${esc(x)}${r.why[x] ? ` <span class="sub">${esc(r.why[x])}</span>` : ''} <a data-act="allow-host" data-site="${esc(r.site)}" data-host="${esc(x)}" data-person="${esc(r.login)}">Allow</a></span>`).join('') + '</div>');
      if (i.wrong && i.runner === me.email) out.push(`<div class="wt">${at(w, s, i)}: ${plural(i.wrong, 'correction')} say${i.wrong > 1 ? '' : 's'} it's wrong</div>`);

async function openLogins() {

// A menu under the button that opened it. Items are [label, act, class, why it's off], or ['-'] for a rule; an item does what a
// button with its act does.
// The page's own dialog, to confirm or to ask for a name: it resolves with what act returns, or null if cancelled. Until act
// succeeds it stays open, saying why it didn't.
// A dialog's buttons that have a value act, with the text it asks for, if any, and that value; `html` may hold more of them.
function ask({ title, text = '', html = '', value, placeholder = '', ok, kind = 'primary', act }) {
  const d = $('#ask');
  d.innerHTML = `<form method="dialog"><h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ''}${html}`
    + (value === undefined ? '' : `<input type="text" value="${esc(value)}" placeholder="${esc(placeholder)}" required autocomplete="off">`)
    + `<div class="err"></div><div class="foot">${ok ? `<button class="btn ${kind}" value="ok">${esc(ok)}</button>` : ''}<button class="btn" formnovalidate>Cancel</button></div></form>`;
  d.showModal();
  const input = d.querySelector('form > input');
  input?.select();
  return new Promise(done => {
    d.onclose = () => done(null);
    d.querySelector('form').onsubmit = async e => {
      if (!e.submitter.value) return;
      e.preventDefault();
      e.submitter.setAttribute('aria-busy', 'true');
      try {
        done(await act(input?.value.trim(), e.submitter.value));
        d.close();
      } catch (err) {
        d.querySelector('.err').textContent = err.message;
      } finally {
        e.submitter.removeAttribute('aria-busy');
      }
    };
  });
}

// A name changes where it shows: Enter or leaving the field saves it, Escape keeps the old one. The bar and the sidebar wait.
let editing = null;
function editName(el, name, save) {
  const input = Object.assign(document.createElement('input'), { type: 'text', className: 'inline', value: name }), host = el.closest('#bar, #side');
  el.replaceWith(input);
  editing = input;
  input.select();
  const end = async keep => {
    if (editing !== input) return;
    editing = null;
    try {
      if (keep && input.value.trim() && input.value.trim() !== name) await save(input.value.trim()).then(refresh);
    } finally {
      drawn.delete(host);
      render();
    }
  };
  input.onkeydown = e => {
    if (e.key === 'Enter' && !e.isComposing) end(true);
    if (e.key === 'Escape') { e.stopPropagation(); end(false); }
  };
  input.onblur = () => end(true);
}

// Closing a sign-in without saving or connecting throws its browser away.
function closePv() {
  if (pv?.signin) api(`/signins/${pv.signin}`, { method: 'DELETE' }).catch(e => toast(e.message));
  pv = null;
  renderPv();
}

async function openStart(title, go, then, label, on, ws, warn) {
  pv = { title, settings: { kind: 'start', go, then, label, on, ws, warn, logins: await api('/logins') } };
  renderPv();
  $('#slabel')?.focus();
}

// The earlier file's sheet of the same name, compared with the one shown.
const oldOf = p => p.old.find(o => o.name === p.sheets[p.sheet].name) ?? p.old[p.sheet];

// A workbook's sheets are read as they're first shown, as is, comparing, the earlier file's.
async function loadSheets(p) {
  for (const [src, s] of [[p.src, p.sheets[p.sheet]], [p.was && fileUrl(p.was, 'preview'), p.cmp && oldOf(p)]]) if (s && !s.rows) Object.assign(s, await api(`${src}${src.includes('?') ? '&' : '?'}sheet=${s.at}`));
}

// What a preview shows of its file, or of an attachment in it: a workbook's sheets, an email in a frame that runs nothing and loads
// nothing, an image, or text.
function previewBody(p) {
  if (p.sheets) return (p.sheets.length > 1 ? `<div class="tabs">${p.sheets.map((s, k) => `<button class="btn ${k === p.sheet ? 'sel' : ''} ${s.state ? 'dim' : ''}" data-act="sheet" data-k="${k}"${s.state ? ' title="Hidden in the workbook"' : ''}>${esc(s.name)}</button>`).join('')}</div>` : '')
    + `<div class="pvb">${sheetTable(p, p.sheets[p.sheet], (p.sheets[p.sheet].at ?? p.sheet) === 0)}</div>`;
  if (p.email) {
    const m = p.email;
    return `<div class="mh">${Object.entries(m.headers).map(([k, v]) => `<div><b>${esc(k)}</b> ${esc(v)}</div>`).join('')}`
      + (m.attachments.length ? `<div class="atts">${m.attachments.map(a => `<a data-act="attachment" data-k="${a.k}">${esc(a.name)}</a>`).join('')}</div>` : '') + '</div>'
      + (m.html == null ? `<div class="pvb"><pre>${esc(m.text)}</pre></div>` : `<iframe class="pvb mail" sandbox="allow-popups allow-popups-to-escape-sandbox" srcdoc="${esc(MAIL + m.html)}"></iframe>`);
  }
  if (p.image) return `<div class="pvb"><img src="${esc(p.image)}" alt=""></div>`;
  if (p.doc) return `<div class="pvb doc">${p.doc.map(b => b.h ? `<h${b.h}>${esc(b.text)}</h${b.h}>` : b.table ? `<table>${b.table.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`
    : b.li !== undefined ? `<p class="li" style="margin-left:${18 + b.level * 18}px">${esc(b.li)}</p>` : `<p>${esc(b.p)}</p>`).join('')}</div>`;
  if (p.pdf) return `<div class="pvb pages">${Array.from({ length: p.pdf.pages }, (_, k) => `<img data-page="${k + 1}" alt="Page ${k + 1}"${p.pdf.shown[k + 1] ? ` src="${esc(p.pdf.shown[k + 1])}"` : ''}>`).join('')}</div>`;
  if (p.text !== undefined) return `<div class="pvb">${p.md ? `<div class="say">${md(p.text, p.item && talkOn(p.item))}</div>` : `<pre>${esc(p.text)}</pre>`}</div>`;
  return `<div class="pvb"><div class="empty">${p.loading ? 'Loading…' : p.error ? esc(p.error) : 'No preview for this kind of file. Download it instead.'}</div></div>`;
}
// A PDF's pages, each fetched as it scrolls into view and kept apart from those the preview came with, so a card drawn again on each
// event draws the same, keeping its place; each watched once.
function watchPages(at, p) {
  const more = p.pdf.more ??= {}, seen = new IntersectionObserver(es => es.forEach(async e => {
    if (!e.isIntersecting) return;
    seen.unobserve(e.target);
    e.target.src = more[e.target.dataset.page] = (await api(`${p.src}${p.src.includes('?') ? '&' : '?'}page=${e.target.dataset.page}`)).image;
  }), { root: at.querySelector('.pages'), rootMargin: '600px' });
  for (const img of at.querySelectorAll('.pages img:not([src]):not([data-w])')) {
    img.dataset.w = '';
    if (more[img.dataset.page]) img.src = more[img.dataset.page];
    else seen.observe(img);
  }
}
const MAIL = `<!doctype html><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'"><base target="_blank"><style>body { font: 14px/1.5 system-ui, sans-serif; margin: 14px 18px; }</style>`;

// A preview of a file, an item's or not, before what it shows is fetched (load), for the dialog or an item's card.
function previewOf(path, item) {
  return {
    title: fname(path), path, src: fileUrl(path, 'preview'), item: item?.id, threads: item ? talkOn(item.id) : [], sheet: 0, image: /\.(png|jpe?g|gif|webp|svg)$/i.test(path) && fileUrl(path),
    was: item && data.log.findLast(e => e.op === 'point' && e.item === item.id && e.file === path)?.was, md: /\.md$/i.test(path), loading: /\.(xlsx|xlsm|xls|csv|eml|msg|pdf|docx|md|txt|json|py|sql|log)$/i.test(path),
  };
}

// What a preview shows: a text file as it is, a file of a kind the server reads, or any attachment, as the server reads it.
async function load(p) {
  try {
    if (/\.(md|txt|json|py|sql|log)$/i.test(p.path)) {
      const r = await fetch(fileUrl(p.path)), t = await r.text();
      if (r.status === 401) location.reload();
      if (!r.ok) throw new Error(t);
      p.text = t;
    }
    else if (!p.path || /\.(xlsx|xlsm|xls|csv|eml|msg|pdf|docx)$/i.test(p.path)) Object.assign(p, await api(p.src));
    if (p.sheets) p.sheet = p.sheets.findIndex(s => s.rows);
  } catch (e) {
    p.error = e.message;
  } finally {
    p.loading = false;
  }
}

async function preview(path, item) {
  const p = pv = previewOf(path, item);
  renderPv();
  await load(p);
  if (pv === p) renderPv();
}

async function upload(files, pane, onto) {
  const path = instPath(), mine = files.map(f => ({ f, pane, path, pct: 0 })), before = new Set(data.doc.items.map(i => i.file));
  uploads.push(...mine);
  renderPanes();
  for (const u of mine) {
    await new Promise((ok, fail) => {
      const x = new XMLHttpRequest();
      x.open('POST', `${path}/upload?pane=${pane}&name=${enc(u.f.name)}${onto ? '&onto=' + enc(onto) : ''}`);
      x.upload.onprogress = e => { u.pct = 100 * e.loaded / e.total; renderPanes(); };
      x.onload = () => (x.status < 300 ? ok() : fail(new Error(x.responseText)));
      x.onerror = () => fail(new Error(`${u.f.name} didn't upload`));
      x.send(u.f);
    }).catch(e => toast(e.message));
    uploads = uploads.filter(x => x !== u);
  }
  await refresh();
  if (shown !== path) return;
  markSeen(data.doc.items.filter(i => i.file?.startsWith('upload/') && !before.has(i.file)));
  renderPanes();
}

document.addEventListener('click', async ev => {
  if (!ev.target.closest('#sorter')) $('#sorter').open = false;
  if (!ev.target.closest('#user') && $('#user')) $('#user').open = false;
  if (!ev.target.closest('#side, [data-act=menu]') || ev.target.closest('#side a')) $('#side').classList.remove('open');
  // A fold opened or closed stays so as the panel is drawn again, which, the page now differing from what was drawn, it next is.
  const sum = ev.target.closest('#log details[data-key] > summary');
  if (sum) {
    ui.sect[sum.parentElement.dataset.key] = !sum.parentElement.open;
    drawn.delete($('#conv'));
  }
  const el = ev.target.closest('[data-act], .tile, .lrow');
  if (!el) {
    if (!ev.target.closest('#card, dialog')) { openItem = null; renderCard(); renderPanes(); }
    return;
  }
  if (!el.dataset.act) {
    openItem = openItem === el.dataset.item ? null : el.dataset.item;
    markSeen(data.doc.items.filter(i => i.id === openItem));
    renderPanes();
    return renderCard();
  }
  // What a click starts holds its button until it's done, so a second click can't repeat it.
  el.setAttribute('aria-busy', 'true');
  try { await onAct(el.dataset.act, el); } finally { el.removeAttribute('aria-busy'); }
});

// The preview a control is in, the dialog's or an item card's, and what shows it again.
const holder = el => (el.closest('#card') ? [cardPv, renderCard] : [pv, renderPv]);

// What a click on an element with data-act does.
async function onAct(act, el) {
  if (act === 'menu') $('#side').classList.toggle('open');
  if (act === 'people-all') { pv.peopleAll = !pv.peopleAll; renderPv(); }
  if (act === 'fold-side') { foldSide(!$('.app').classList.contains('folded')); renderSide(); }
  if (act === 'expand') { expandRow(el.dataset.id); renderSide(); }
  if (act === 'workspaces') { localStorage.workspaces = el.dataset.id; renderSide(); }
  if (act === 'mine-only') { localStorage[`mine:${me.email}`] = localStorage[`mine:${me.email}`] === 'on' ? '' : 'on'; renderSide(); }
  if (act === 'order') { localStorage.order = el.dataset.id; renderSide(); }
  // A row's settings and + act on that row, which they open first: after the hash change's own refresh starts, which this one
  // supersedes, so it lands before they act.
  if (['workspace-settings', 'new-task', 'settings', 'new-instance'].includes(act) && el.dataset.id && ![cur?.w.id, cur?.s?.id].includes(el.dataset.id)) {
    location.hash = `#/${el.dataset.id}`;
    await new Promise(ok => addEventListener('hashchange', ok, { once: true }));
    await refresh();
  }
  if (act === 'audit') await toggleAudit();
  if (act === 'watch') { ui.site = el.dataset.site; renderPlayer(); }
  if (act === 'drive') { ui.drive = ui.drive ? null : `${cur.i.id}/${el.dataset.site}`; renderPlayer(); }
  if (act === 'player') { localStorage.player = localStorage.player === 'folded' ? 'open' : 'folded'; renderPlayer(); }
  // A rule the process gained: the Process fold, open, in view.
  if (act === 'panel') {
    ui.open = !ui.open;
    draft.on = draft.ref = null;
    renderLog(); renderBar(); placeCard();
  }
  if (act === 'interrupt') { await api(`${instPath()}/interrupt`, { method: 'POST' }); await refresh(); }
  if (act === 'comment-on') { Object.assign(ui, { open: true, audit: false }); Object.assign(draft, { on: el.dataset.item, ref: null }); renderLog(); renderBar(); renderAudit(); $('#newcomment')?.focus(); }
  if (act === 'notes') await openNotes(el.dataset.id);
  if (act === 'note-post') {
    const { id } = pv.settings, text = $('#notetext').value.trim(), files = [];
    if (!text) return;
    for (const f of $('#notefiles').files) files.push((await api(`/api/series/${id}/attach?name=${enc(f.name)}`, { method: 'POST', body: f })).file);
    await api(`/api/series/${id}/notes`, { method: 'POST', body: JSON.stringify({ text, files }) });
    await openNotes(id);
  }
  if (act === 'note-taken' || act === 'note-aside') {
    const box = el.closest('.row2').querySelector('input');
    if (!box.value.trim()) return box.focus();
    await api(`/api/series/${pv.settings.id}/notes/n${el.dataset.seq}`, { method: 'POST', body: JSON.stringify({ how: act === 'note-taken' ? 'taken' : 'aside', text: box.value.trim() }) });
    await openNotes(pv.settings.id);
  }
  if (act === 'comment' || act === 'reply-post') {
    const at = act === 'comment' ? null : el.closest('.reply'), box = at ? at.querySelector('textarea') : $('#newcomment'), text = box.value.trim();
    const picked = at ? at.querySelector('input[type=file]') : $('#newfiles');
    if (!text) return;
    const path = instPath(), own = draft, files = [], place = at ? { thread: `c${el.dataset.seq}` } : { ...(own.on && { item: own.on }), ...(own.ref && { ref: own.ref }) };
    for (const f of picked.files) files.push((await api(`${path}/attach?name=${enc(f.name)}`, { method: 'POST', body: f })).file);
    await api(`${path}/comment`, { method: 'POST', body: JSON.stringify({ ...place, text, files }) });
    box.value = '';
    thumbs(picked, new DataTransfer().files);
    own.replying.delete(+el.dataset.seq);
    own.on = own.ref = null;
    await refresh();
  }
  // Approving a proposal is a sign-off, by the route's name.
  if (act === 'approve' || act === 'reject') {
    const box = el.closest('.reply'), own = draft;
    await api(`${instPath()}/${act === 'approve' ? 'signoff' : 'reject'}`, { method: 'POST', body: JSON.stringify({ thread: `c${el.dataset.seq}`, text: box.querySelector('textarea').value.trim() }) });
    for (const t of box.parentElement.querySelectorAll(':scope > .reply textarea')) t.value = '';
    thumbs(box.parentElement.querySelector(':scope > .reply input[type=file]'), new DataTransfer().files);
    own.replying.delete(+el.dataset.seq);
    await refresh();
  }
  // A comment's box, to reply, approve or reject, opened or closed where it is, the others closing; from elsewhere, such as Needs
  // you, opened, the comment shown alone if it's deeper than the conversation shows, unless a draft holds the conversation still.
  if (act === 'reply') {
    const seq = +el.dataset.seq, mode = el.dataset.mode ?? 'reply', toggle = !!el.closest('.post');
    if (!toggle) {
      closePv();
      Object.assign(ui, { open: true, audit: false });
      if (!$(`#conv .post[data-seq="${seq}"]`)) ui.alone = seq;
      renderLog(); renderBar();
    }
    const box = $(`#conv .post[data-seq="${seq}"] > .reply[data-mode="${mode}"]`);
    if (!box) return;
    const show = !toggle || box.hidden;
    for (const b of box.parentElement.querySelectorAll(':scope > .reply')) b.hidden = b !== box || !show;
    if (show) draft.replying.set(seq, mode);
    else draft.replying.delete(seq);
    if (show) box.querySelector('textarea').focus();
  }
  if (act === 'withdrawn') {
    const seq = +el.dataset.seq;
    ui.withdrawn[ui.withdrawn.has(seq) ? 'delete' : 'add'](seq);
    renderLog();
  }
  if (act === 'cref') {
    if (el.dataset.inst === cur.i.id) showComment(+el.dataset.seq);
    else location.hash = `#/${el.dataset.inst}/c${el.dataset.seq}`;
  }
  if (act === 'copylink') {
    await navigator.clipboard.writeText(`${location.origin}${location.pathname}#/${cur.i.id}/c${el.dataset.seq}`);
    toast(`Copied a link to c${el.dataset.seq}`, 'ok');
  }
  if (act === 'react') {
    const seq = el.dataset.seq === undefined ? undefined : +el.dataset.seq;
    await api(`${instPath()}/react`, { method: 'POST', body: JSON.stringify({ ...(seq !== undefined && { on: seq }), up: el.classList.contains('on') ? null : el.dataset.up === 'true' }) });
    await refresh();
  }
  if (act === 'more') { ui.full.add(+el.dataset.seq); renderLog(); }
  if (act === 'fold') {
    const k = `folds:${cur.i.id}`, folds = JSON.parse(localStorage[k] ?? '{}');
    if (el.dataset.end) folds[el.dataset.seq] = +el.dataset.end;
    else delete folds[el.dataset.seq];
    localStorage[k] = JSON.stringify(folds);
    renderLog();
  }
  if (act === 'alone') { ui.alone = el.dataset.seq ? +el.dataset.seq : null; renderLog(); $('#log').scrollTop = 0; }
  if (act === 'uncard') { openItem = null; renderCard(); renderPanes(); }
  if (act === 'view') { localStorage.view = el.dataset.id; renderPanes(); placeCard(); }
  if (act === 'sort') {
    const { pane, key } = el.dataset, was = ui.sort[pane];
    ui.sort[pane] = { key, dir: was?.key === key ? -was.dir : 1 };
    renderPanes();
  }
  if (act === 'opencard') { openItem = el.dataset.item; markSeen(data.doc.items.filter(i => i.id === openItem)); renderPanes(); renderCard(); }
  if (act === 'preview') await preview(el.dataset.file, data.doc.items.find(i => i.id === el.dataset.item));
  if (act === 'unpv') closePv();
  if (act === 'settings') await openSeriesSettings();
  if (act === 'workspace-settings') openWorkspaceSettings();
  if (act === 'signout') { drafts.clear(); sessionStorage.clear(); location.href = (await api('/auth/logout', { method: 'POST' })).next; }
  if (act === 'wadd' || act === 'wremove' || act === 'wrole') {
    // An addition is an email or an Entra group's id, alone or as a suggestion shows it, NAME <ID>, where NAME labels a group.
    const [, label, inside] = act === 'wadd' && /^(.*?)\s*<(.+)>$/.exec($('#wperson').value.trim()) || [];
    const s = pv.settings, p = act === 'wadd' ? (inside ?? $('#wperson').value).trim().toLowerCase() : el.dataset.p;
    if (!p) return;
    // The one change, which the server makes to the people as they are now, not as this dialog last saw them.
    const change = act === 'wremove' ? { remove: p } : { add: p, as: s.owners.includes(p) === (act === 'wadd') ? 'owner' : 'member' };
    await api(`/api/workspaces/${cur.w.id}`, { method: 'PUT', body: JSON.stringify({ ...change, ...(label && !p.includes('@') && { groups: { [p]: label } }) }) });
    me = await api('/me');
    await refresh();
    openWorkspaceSettings();
    saved();
  }
  if (act === 'archive-series' || act === 'archive-workspace') {
    const x = act === 'archive-series' ? cur.s : cur.w, flip = () => api(act === 'archive-series' ? seriesPath(cur) : `/api/workspaces/${cur.w.id}`, { method: 'PUT', body: JSON.stringify({ archived: !x.archived }) });
    if (x.archived) await flip();
    else if (!await ask({ title: `Archive ${x.name}?`, text: "It leaves the sidebar, except under Show archived. Nothing in it changes or runs until it's restored, and its wakes, weekly ones too, and requests to start an instance are cancelled for good: restoring brings none back.", ok: 'Archive', kind: 'danger', act: flip })) return;
    closePv();
    await refresh();
  }
  if (act === 'rename') { const path = instPath(); editName($('#bar h1 .t'), cur.i.label, label => api(`${path}/rename?as=${enc(label)}`, { method: 'POST' })); }
  if (act === 'share-arm') { pv.arming = !pv.arming; renderPv(); }
  if (act === 'share-on' || act === 'share-off') {
    await api(seriesPath(cur), { method: 'PUT', body: JSON.stringify(act === 'share-on' ? { share: true, logins: ticked() } : { share: false }) });
    await refresh();
    await openSeriesSettings();

  }
  // A wake edited is set anew, then the one it was cancelled, unless setting it moved that one.
  if (act === 'wake-save' || act === 'wake-delete') {
    const r = el.closest('.wakerow'), id = r.dataset.id, days = [...r.querySelectorAll('input:checked')].map(c => c.value).join(',');
    if (act === 'wake-save' && Number.isNaN(Date.parse(r.querySelector('.wat').value))) return toast('Pick a date and time');
    const made = act === 'wake-save' && await api(`/api/wakes/${r.dataset.target}`, { method: 'PUT', body: JSON.stringify({ at: new Date(r.querySelector('.wat').value).toISOString(), label: r.querySelector('.wlabel')?.value, days, text: r.querySelector('.wtext').value }) });
    if (id && made.id !== id) await api(`/api/wakes/${id}`, { method: 'DELETE' });

    if (pv.settings.kind === 'series') await openSeriesSettings();

  }
  if (act === 'wakes') {
    pv = { title: `Wakes of ${cur.i.label}`, settings: { kind: 'wakes' } };

  // A request to wake an instance wakes it as it is, with its runner's logins; one to start an instance asks theirs first.

  else if (act === 'req-start') await openStart('Start the instance asked for', 'Start', ({ logins }) => api(`/api/requests/${el.dataset.id}`, { method: 'POST', body: JSON.stringify({ logins }) }));
  if (act === 'propose') {
    const series = $('#mvwhat').value;
    await api(`/api/proposals/${cur.w.id}`, { method: 'PUT', body: JSON.stringify({ kind: series ? 'move' : 'merge', series, to: $('#mvto').value }) });

  if (act === 'reader-add' || act === 'reader-drop') {

  if (act === 'accept') {
    const id = el.dataset.id, p = await api(`/api/proposals/${id}`), merge = p.kind === 'merge';
    const html = `<ul>${p.series.map(x => `<li>${esc(x.from)} \u2192 ${esc(x.to)}${x.since ? ', made since it was proposed' : ''}</li>`).join('')}</ul>`
      + (p.agents ? `<h3>Its AGENTS.md, added to ${esc(p.to)}'s</h3><pre class="agents">${esc(p.agents)}</pre>` : '')
      + p.people.map(x => `<div class="row2"><select data-p="${esc(x)}"><option value="members">Member</option><option value="owners">Owner</option>${merge ? '' : '<option value="">Not added</option>'}</select> ${person(x)}</div>`).join('');
    const text = merge ? "Its series come here, its people join as members, and its AGENTS.md is added to this one's. Shared series stop being shared until their sharers share them here."
      : `It comes here, and stops being shared, if it is, until its sharer shares it here.${p.people.length ? ` Who runs its open instances but isn't in ${p.to}: added, they go on; left out, their runs wait until someone here takes those over.` : ''}`;
    if (await ask({
      title: merge ? `Merge ${p.from} into ${p.to}` : `Move ${p.series[0].from} to ${p.to}`, text, html, ok: 'Accept',
      act: () => {
        const as = { owners: [], members: [] };
        for (const s of $('#ask').querySelectorAll('select[data-p]')) if (s.value) as[s.value].push(s.dataset.p);
        return api(`/api/proposals/${id}`, { method: 'POST', body: JSON.stringify(as) });
      },
    }) === null) return;
    await refresh();
    renderPv();
  }
  if (act === 'req-drop') {
    await api(`/api/requests/${el.dataset.id}`, { method: 'DELETE' });
    await refresh();
  }
  if (act === 'compare') {
    const p = pv;
    p.old ??= (await api(fileUrl(p.was, 'preview'))).sheets;
    p.cmp = !p.cmp;
    await loadSheets(p);
    if (pv === p) renderPv();
  }
  if (act === 'sheet') {
    const [top, render] = holder(el), p = Object.assign(top.att ?? top, { sheet: Number(el.dataset.k) });
    await loadSheets(p);
    render();
  }
  // An email's attachment shows in its place, as a file of its own would, back to the email from above it.

// A comment's or a reply's files, as its images look, under the box: picked, dropped or pasted.
function thumbs(input, files) {

    old.remove();
  }
  const images = [...files].filter(f => f.type.startsWith('image/'));
  if (images.length) input.insertAdjacentHTML('afterend', `<div class="thumbs">${images.map(f => `<img src="${URL.createObjectURL(f)}" alt="${esc(f.name)}" title="${esc(f.name)}">`).join('')}</div>`);

  const rows = [...$('#tree').querySelectorAll('a[href]')], at = rows.indexOf(document.activeElement), row = document.activeElement.closest('#tree .row');
  const chev = row?.querySelector('.chev'), open = chev?.textContent === '\u25BE', key = { ArrowDown: 'j', ArrowUp: 'k', ArrowRight: 'l', ArrowLeft: 'h' }[e.key] ?? e.key;
  if (e.key.startsWith('Arrow') && at < 0) return; // the arrows scroll, unless the sidebar has the focus
  // A folded sidebar opens for the keys that move through it.
  if ('jkhl'.includes(key) && $('.app').classList.contains('folded')) { foldSide(false); renderSide(); }
  if (key === 'j' || key === 'k') (at < 0 ? rows.find(r => r.closest('.on')) ?? rows[0] : rows[at + (key === 'j' ? 1 : -1)])?.focus();
  else if (key === 'l' && chev) open ? rows[at + 1]?.focus() : chev.click();
  else if (key === 'h' && row) open ? chev.click() : row.closest('.tree')?.previousElementSibling.querySelector('a[href]').focus();
  else if (key === 'c' && data) {
    Object.assign(ui, { open: true, audit: false, focus: cur.i.id });
    draft.on = draft.ref = null;
    renderLog(); renderBar(); renderAudit(); placeCard();
  } else if (key === '?') $('.key').classList.toggle('show');
  else return;
  e.preventDefault();
}

addEventListener('keydown', e => {
  // Ctrl+Enter, or Cmd+Enter on a Mac, sends from the panel's comment and reply boxes, unless what it presses is still sending.
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.matches('#log textarea')) {
    e.preventDefault();
    const send = e.target.id === 'newcomment' ? $('#log [data-act=comment]') : e.target.closest('.reply').querySelector('.row2 .btn');
    return send?.hasAttribute('aria-busy') || send?.click();
  }
  if (e.key === 'Escape' && e.target.matches('textarea, input:not(.inline)') && !document.querySelector('dialog[open]')) return e.target.blur();
  if (!e.target.matches('input, textarea, select') && !e.ctrlKey && !e.metaKey && !e.altKey && !document.querySelector('dialog[open]')) navigate(e);
  // Enter in a one-line field presses its button, as in a form.
  if (e.key === 'Enter' && !e.isComposing && e.target.matches('.row2 input[type=text]')) e.target.closest('.row2').querySelector('.btn').click();
  if (e.key === 'Enter' && !e.isComposing && e.target.id === 'slabel') $('[data-act=start-go]').click();
  // A dialog closes itself on Escape.
  if (e.key !== 'Escape' || document.querySelector('dialog[open]')) return;
  if ($('#sorter').open) $('#sorter').open = false;
  else if ($('#user')?.open) $('#user').open = false;
  else if ($('#side').classList.contains('open')) $('#side').classList.remove('open');
  else if (openItem) { openItem = null; renderCard(); renderPanes(); }
  else if (ui.open) { ui.open = false; renderLog(); renderBar(); placeCard(); }
});
// Microsoft sends people back to #logins after they connect Microsoft 365.
$('#find').addEventListener('input', renderSide);
const backFromMicrosoft = location.hash === '#logins';
if (backFromMicrosoft) history.replaceState(null, '', '#/');
refresh().then(() => backFromMicrosoft && openLogins());
// The server names what changed: "tree" for names, settings, wakes and logins, else an instance by its id. The page catches up one
// refresh at a time, and when it comes back into view.
const pend = new Set();
let busy = false;
async function drain() {
  if (busy || document.hidden || !pend.size) return;
  busy = true;
  const ids = [...pend];
  pend.clear();
  await (ids.includes('tree') ? refresh() : patch(ids)).catch(console.error);
  busy = false;
  drain();
}
// The browser gives up on a stream that comes back with an error, as during a deploy behind a proxy or once the session has ended: the
// page asks who it is every 5 s until the server answers, reloading only to sign in again, and else listens again, catching up as it
// opens, so a restart keeps what is being written.
function listen() {
  const events = new EventSource('/api/events');
  events.onmessage = e => { pend.add(e.data); drain(); };
  events.onopen = () => { pend.add('tree'); drain(); };
  events.onerror = async () => {
    if (events.readyState !== EventSource.CLOSED) return;
    for (;;) {
      await new Promise(ok => setTimeout(ok, 5000));
      const r = await fetch('/me').catch(() => null);
      if (r?.status === 401) return location.reload();
      if (r?.ok) return listen();
    }
  };
}
listen();
addEventListener('visibilitychange', drain);
// The rows' ages move on as the minutes pass.
setInterval(renderSide, 60_000);
$('#log').addEventListener('scroll', e => { const el = e.currentTarget; el.dataset.end = el.scrollTop + el.clientHeight >= el.scrollHeight - 8 ? 'yes' : 'no'; });
// A link to another instance's comment names who wrote it and its first words as it's hovered, once that instance's log is fetched;
// a deleted instance's has none.
const logs = new Map();
document.addEventListener('mouseover', async e => {
  const a = e.target.closest('a.cref:not([title])'), inst = a?.dataset.inst;
  if (!a || inst === cur.i.id) return;
  if (!logs.has(inst)) logs.set(inst, fetch(`/files/${inst}/log.jsonl`).then(async r => r.ok ? (await r.text()).trim().split('\n').map(l => JSON.parse(l)) : []));
  const c = (await logs.get(inst))[a.dataset.seq - 1];
  if (c?.op === 'comment') a.title = `${nameOf(c.by)}: ${firstLine(c.text).slice(0, 80)}`;
});
// A post's image that loads once the log is at its end keeps it there.
$('#log').addEventListener('load', () => { if ($('#log').dataset.end !== 'no') $('#log').scrollTop = $('#log').scrollHeight; }, true);

// The sidebar folds to a rail, as this browser keeps it.
const foldSide = folded => { $('.app').classList.toggle('folded', folded); localStorage.side = folded ? 'folded' : ''; };
$('.app').classList.toggle('folded', localStorage.side === 'folded');

// Pane widths, kept in this browser: a grip's drag sets its pane's width, which the CSS bounds, and keeps what shows.
{
  const panes = { side: $('#side'), panel: $('#log') }, widths = JSON.parse(localStorage.widths ?? '{}');
  const show = k => widths[k] ? $('.app').style.setProperty(`--${k}-w`, `${widths[k]}px`) : $('.app').style.removeProperty(`--${k}-w`);
  const keep = k => { show(k); localStorage.widths = JSON.stringify(widths); };
  for (const grip of document.querySelectorAll('.grip')) {
    const k = grip.dataset.pane;
    show(k);
    grip.addEventListener('pointerdown', e => {
      e.preventDefault();
      grip.setPointerCapture(e.pointerId);
      const from = panes[k].offsetWidth, x = e.clientX;
      grip.onpointermove = m => { widths[k] = from + (k === 'side' ? m.clientX - x : x - m.clientX); show(k); };
    });
    grip.addEventListener('lostpointercapture', () => {
      grip.onpointermove = null;
      if (widths[k]) widths[k] = panes[k].offsetWidth;
      keep(k);
    });
    grip.addEventListener('dblclick', () => { delete widths[k]; keep(k); });
  }
}
</script>
