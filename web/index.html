  const width = Math.max(0, ...rows.map(r => r.length), ...(old?.rows ?? []).map(r => r.length));
  let h = `<table class="sh"><tr><th></th>${Array.from({ length: width }, (_, c) => `<th>${colName(c)}</th>`).join('')}</tr>`;
  rows.forEach((row, r) => {
    h += `<tr><td class="rn">${r + 1}</td>`;
    for (let c = 0; c < width; c++) {
      const v = row[c], was = old?.rows[r]?.[c] ?? null;
      const changed = old && JSON.stringify(was) !== JSON.stringify(v ?? null);
      const note = [noted.get(`${r},${c}`), changed ? `Was: ${cellText(was) || '(empty)'}` : ''].filter(Boolean).join('\n\n');
      const cls = `${typeof v === 'number' ? 'num' : ''} ${v && typeof v === 'object' ? 'fx' : ''} ${noted.has(`${r},${c}`) ? 'noted' : ''} ${asks.has(`${r},${c}`) ? 'q' : ''} ${changed ? 'chg' : ''}`.trim();
      h += `<td${cls ? ` class="${cls}"` : ''} data-act="cell" data-ref="${esc(`${s.name}!${colName(c)}${r + 1}`)}"${note ? ` data-note="${esc(note)}"` : ''}${at.has(`${r},${c}`) ? ` data-thread="${esc(at.get(`${r},${c}`))}"` : ''}>${esc(cellText(v))}</td>`;
    }
    h += '</tr>';
  });
  return h + '</table>' + (s.truncated ? `<div class="empty">Showing the first ${s.rows.length} rows.</div>` : '');
}

function renderPv() {
  const d = $('#pv');
  if (!pv) return void (d.open && d.close());
  d.className = 'pv' + (pv.settings ? ' small' : '');
  let h = `<div class="pvh"><b>${esc(pv.title)}</b><span class="saved"></span>${pv.sheets && /\.(xlsx|xlsm|xls|csv)$/i.test(pv.was ?? '') ? `<button class="btn ${pv.cmp ? 'sel' : ''}" data-act="compare">${pv.cmp ? `Changes since ${esc(fname(pv.was))}` : 'Compare with previous'}</button>` : ''}${pv.path ? `<a class="btn" href="${fileUrl(pv.path)}">Download</a>` : ''}${pv.signin ? '<button class="btn primary" data-act="signin-save">Save login</button>' : ''}<button class="btn" data-act="unpv">${pv.signin ? 'Cancel' : 'Close'}</button></div>`;
  // Your account's dialog: Logins, Tokens and, for admins, People, as tabs.
  const account = [['logins', 'Logins'], ['tokens', 'Tokens'], ...(me.role === 'admin' ? [['people', 'People']] : [])];
  if (account.some(([k]) => k === pv.settings?.kind)) h += `<div class="pvtabs">${account.map(([k, name]) => `<button class="tab ${pv.settings.kind === k ? 'sel' : ''}" data-act="${k}">${name}</button>`).join('')}</div>`;
  if (pv.sheets) {
    if (pv.sheets.length > 1) h += `<div class="tabs">${pv.sheets.map((s, k) => `<button class="btn ${k === pv.sheet ? 'sel' : ''}" data-act="sheet" data-k="${k}">${esc(s.name)}</button>`).join('')}</div>`;
    h += `<div class="pvb">${sheetTable(pv.sheets[pv.sheet], pv.sheet === 0)}</div>`;
  } else if (pv.email) {
    const m = pv.email;
    h += `<div class="pvb"><pre>${esc(Object.entries(m.headers).map(([k, v]) => `${k}: ${v}`).join('\n') + (m.attachments.length ? `\nAttachments: ${m.attachments.join(', ')}` : '') + '\n\n' + m.text)}</pre></div>`;
  } else if (pv.image) h += `<div class="pvb"><img src="${fileUrl(pv.path)}" alt=""></div>`;
  else if (pv.signin) h += `<div class="sub" style="padding:8px 14px">Sign in as you always do, then Save login. Only you see this browser.</div><div class="pvb"><iframe src="/signins/${pv.signin}/view?drive" style="width:100%;height:100%;border:0"></iframe></div>`;
  else if (pv.text !== undefined) h += `<div class="pvb">${pv.md ? `<div class="say">${md(pv.text)}</div>` : `<pre>${esc(pv.text)}</pre>`}</div>`;
  else if (pv.settings?.kind === 'tokens') h += `<div class="pvb vl">${tokensHtml(pv.settings)}</div>`;
  else if (pv.settings?.kind === 'people') h += `<div class="pvb vl"><div class="sub">Everyone who can sign in. Admins manage people with rf (Tokens): rf people, as a file to edit and set, and rf user add|role|disable|enable|signout|remove.</div><table class="ut"><tr><th>Person</th><th>Role</th><th>Workspaces</th><th>Last in</th></tr>${pv.settings.users.map(u => `<tr><td>${esc(u.name ?? '')}<div class="sub">${esc(u.email)}${u.disabled ? ' · disabled' : ''}</div></td><td>${esc(u.role)}</td><td class="sub">${esc(u.workspaces.join(', ')) || 'none'}</td><td class="sub">${esc(u.last_login ? when(u.last_login) : 'never')}</td></tr>`).join('')}</table></div>`;
  else if (pv.settings?.kind === 'logins') h += `<div class="pvb vl">${loginsHtml(pv.settings)}</div>`;
  else if (pv.settings?.kind === 'waiting') h += `<div class="pvb vl">${waiting().join('') || '<div class="sub">Nothing waits on you.</div>'}</div>`;
  else if (pv.settings?.kind === 'start') h += `<div class="pvb vl">${startHtml(pv.settings)}</div>`;
  else if (pv.settings) {

function openMenu(btn, items) {

  m.innerHTML = items.filter(Boolean).map(([label, act, cls = '', off]) => label === '-' ? '<hr>'
    : `<button role="menuitem" class="${cls}" data-act="${act}" ${off ? `disabled title="${esc(off)}"` : ''}>${esc(label)}</button>`).join('');

  m.style.top = `${r.bottom + 4 + m.offsetHeight < innerHeight ? r.bottom + 4 : Math.max(8, r.top - 4 - m.offsetHeight)}px`;
  m.querySelector('button:not(:disabled)')?.focus();
}

// The page's own dialog, to confirm or to ask for a name: it resolves with what act returns, or null if cancelled. Until act
// succeeds it stays open, saying why it didn't.
function ask({ title, text = '', value, placeholder = '', ok, alt, kind = 'primary', act }) {
  const d = $('#ask');
  d.innerHTML = `<form method="dialog"><h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ''}`
    + (value === undefined ? '' : `<input type="text" value="${esc(value)}" placeholder="${esc(placeholder)}" required autocomplete="off">`)
    + `<div class="err"></div><div class="foot"><button class="btn ${kind}" value="ok" ${alt ? 'formnovalidate' : ''}>${esc(ok)}</button>${alt ? `<button class="btn" value="alt">${esc(alt)}</button>` : ''}<button class="btn" formnovalidate>Cancel</button></div></form>`;
  d.showModal();
  d.querySelector('input')?.select();
  return new Promise(done => {
    d.onclose = () => done(null);
    d.querySelector('form').onsubmit = async e => {
      if (!['ok', 'alt'].includes(e.submitter.value)) return;
      e.preventDefault();
      e.submitter.setAttribute('aria-busy', 'true');
      try {
        done(await act(value === undefined ? undefined : d.querySelector('input').value.trim(), e.submitter.value === 'alt'));
        d.close();
      } catch (err) {
        d.querySelector('.err').textContent = err.message;
      } finally {
        e.submitter.removeAttribute('aria-busy');
      }
    };
  });
}

// A name changes where it shows: Enter or leaving the field saves it, Escape keeps the old one. The bar and the sidebar wait.
let editing = null;
function editName(el, name, save) {
  const input = Object.assign(document.createElement('input'), { type: 'text', className: 'inline', value: name }), host = el.closest('#bar, #side');
  el.replaceWith(input);
  editing = input;
  input.select();
  const end = async keep => {
    if (editing !== input) return;
    editing = null;
    try {
      if (keep && input.value.trim() && input.value.trim() !== name) await save(input.value.trim()).then(refresh);
    } finally {
      drawn.delete(host);
      render();
    }
  };
  input.onkeydown = e => {
    if (e.key === 'Enter' && !e.isComposing) end(true);
    if (e.key === 'Escape') { e.stopPropagation(); end(false); }
  };
  input.onblur = () => end(true);
}

async function upload(files, pane, onto) {
  const path = instPath(), mine = files.map(f => ({ f, pane, path, pct: 0 })), before = new Set(data.doc.items.map(i => i.file));
  uploads.push(...mine);
  renderPanes();
  for (const u of mine) {
    await new Promise((ok, fail) => {
      const x = new XMLHttpRequest();
      x.open('POST', `${path}/upload?pane=${pane}&name=${enc(u.f.name)}${onto ? '&onto=' + enc(onto) : ''}`);
      x.upload.onprogress = e => { u.pct = 100 * e.loaded / e.total; renderPanes(); };
      x.onload = () => (x.status < 300 ? ok() : fail(new Error(x.responseText)));
      x.onerror = () => fail(new Error(`${u.f.name} didn't upload`));
      x.send(u.f);
    }).catch(e => toast(e.message));
    uploads = uploads.filter(x => x !== u);
  }
  await refresh();
  if (shown !== path) return;
  markSeen(data.doc.items.filter(i => i.file?.startsWith('upload/') && !before.has(i.file)));
  renderPanes();
}

document.addEventListener('click', async ev => {
  const was = $('#pop').hidden ? null : $('#pop').dataset.by;
  $('#pop').hidden = true;
  if (!ev.target.closest('#side, [data-act=menu]') || ev.target.closest('#side a')) $('#side').classList.remove('open');
  const sum = ev.target.closest('#log summary');
  if (sum) {
    folds.set(sum.parentElement.dataset.key, !sum.parentElement.open);
    return void drawn.set($('#log'), tabsHtml() + opsHtml());
  }
  const el = ev.target.closest('[data-act], .tile');
  if (!el) {
    if (!ev.target.closest('#card, dialog, #pop')) { openItem = null; renderCard(); renderPanes(); }
    return;
  }
  if (el.classList.contains('tile')) {
    openItem = openItem === el.dataset.item ? null : el.dataset.item;
    markSeen(data.doc.items.filter(i => i.id === openItem));
    renderPanes();
    return renderCard();
  }
  // What a click starts holds its button until it's done, so a second click can't repeat it.
  el.setAttribute('aria-busy', 'true');
  try { await onAct(el.dataset.act, el, was); } finally { el.removeAttribute('aria-busy'); }
});

// What a click on an element with data-act does. A click on the button of the menu that's open only closes it.
async function onAct(act, el, was) {
  if (act.startsWith('menu-') && was === act) return;
  if (act === 'menu') $('#side').classList.toggle('open');
  if (act === 'expand') { expandRow(el.dataset.id); renderSide(); }
  if (act === 'workspaces') { localStorage.workspaces = el.dataset.id; renderSide(); }
  // A row's settings and + act on that row, which they open first.
  if (['workspace-settings', 'new-task', 'settings', 'new-instance'].includes(act) && el.dataset.id && ![cur?.w.id, cur?.s?.id].includes(el.dataset.id)) {
    location.hash = `#/${el.dataset.id}`;
    await refresh();
  }
  if (act === 'menu-instance') {
    const busy = cur.s.instances.some(i => i.running) || cur.i.queued;
    openMenu(el, [
      ['Rename', 'rename', '', busy && "Available when the series' run ends"], cur.s.single && ['Start another based on this', 'start-another'], data.runner.by === me.email && ['Logins it may use', 'ticks'],
      data.runner.by === me.email && ['-'], data.runner.by === me.email && ['Abandon', 'abandon', 'danger', data.run && 'Available when the run ends'],
    ]);
  }
  if (act === 'tab') {
    if (el.dataset.tab === 'log') [lines, linesKey] = [await api(instPath() + '/trace'), `${instPath()}:${data.log.length}`];
    $('#log').dataset.end = 'yes';
    Object.assign(ui, { tab: el.dataset.tab, on: null, ref: null });
    renderLog();
  }
  if (act === 'show-panel' || act === 'hide-panel') {
    Object.assign(ui, { open: act === 'show-panel', tab: 'conv', on: null, ref: null });
    renderLog(); renderBar(); placeCard();
  }
  if (act === 'interrupt') { await api(`${instPath()}/interrupt`, { method: 'POST' }); await refresh(); }
  if (act === 'comment-on') { Object.assign(ui, { open: true, tab: 'conv', on: el.dataset.item, ref: null }); renderLog(); renderBar(); $('#newcomment')?.focus(); }
  if (act === 'comment' || act === 'reply-thread') {
    const box = act === 'comment' ? $('#newcomment') : el.closest('.thread').querySelector('textarea'), text = box.value.trim();
    const picked = act === 'comment' ? $('#newfiles') : el.closest('.thread').querySelector('input[type=file]');
    if (!text) return;
    const files = [];
    for (const f of picked.files) files.push((await api(`${instPath()}/attach?name=${enc(f.name)}`, { method: 'POST', body: f })).file);
    await api(`${instPath()}/comment`, { method: 'POST', body: JSON.stringify(act === 'comment' ? { text, files, ...(ui.on && { item: ui.on }), ...(ui.ref && { ref: ui.ref }) } : { thread: el.dataset.thread, text, files }) });
    box.value = '';
    replying.delete(el.dataset.thread);
    ui.on = ui.ref = null;
    await refresh();
  }
  if (act === 'resolve') {
    await api(`${instPath()}/resolve`, { method: 'POST', body: JSON.stringify({ thread: el.dataset.thread }) });
    await refresh();
  }
  if (act === 'uncard') { openItem = null; renderCard(); renderPanes(); }
  if (act === 'opencard') { openItem = el.dataset.item; markSeen(data.doc.items.filter(i => i.id === openItem)); renderPanes(); renderCard(); }
  if (act === 'preview') await preview(el.dataset.file, data.doc.items.find(i => i.id === el.dataset.item));
  if (act === 'unpv') closePv();
  if (act === 'settings') await openSeriesSettings();
  if (act === 'workspace-settings') openWorkspaceSettings();
  if (act === 'signout') location.href = (await api('/auth/logout', { method: 'POST' })).next;
  if (act === 'wadd' || act === 'wremove' || act === 'wrole') {
    const s = pv.settings, p = act === 'wadd' ? $('#wperson').value.trim().toLowerCase() : el.dataset.p;
    if (!p) return;
    const owners = s.owners.filter(x => x !== p), members = s.members.filter(x => x !== p);
    if (act === 'wadd') members.push(p);
    if (act === 'wrole') (s.owners.includes(p) ? members : owners).push(p);
    await api(`/api/workspaces/${cur.w.id}`, { method: 'PUT', body: JSON.stringify({ owners, members }) });
    await refresh();
    openWorkspaceSettings();
    saved();
  }
  if (act === 'archive-series' || act === 'archive-workspace') {
    const x = act === 'archive-series' ? cur.s : cur.w, flip = () => api(act === 'archive-series' ? seriesPath(cur) : `/api/workspaces/${cur.w.id}`, { method: 'PUT', body: JSON.stringify({ archived: !x.archived }) });
    if (x.archived) await flip();
    else if (!await ask({ title: `Archive ${x.name}?`, text: 'It leaves the sidebar, except under Show archived. Nothing in it changes.', ok: 'Archive', act: flip })) return;
    closePv();
    await refresh();
  }
  if (act === 'rename') editName($('#bar h1 .t'), cur.i.label, label => api(`${instPath()}/rename?as=${enc(label)}`, { method: 'POST' }));
  if (act === 'share-arm') { pv.arming = !pv.arming; renderPv(); }
  if (act === 'share-on' || act === 'share-off' || act === 'wake-move' || act === 'wake-cancel') {
    if (act === 'share-on' || act === 'share-off') await api(seriesPath(cur), { method: 'PUT', body: JSON.stringify(act === 'share-on' ? { share: true, logins: ticked() } : { share: false }) });
    if (act === 'wake-move') await api(`/api/wakes/${cur.s.id}`, { method: 'PUT', body: JSON.stringify({ at: new Date($('#swake').value).toISOString() }) });
    if (act === 'wake-cancel') await api(`/api/wakes/${cur.s.id}`, { method: 'DELETE' });
    await refresh();
    await openSeriesSettings();
    saved();
  }
  if (act === 'req-start') await openStart('Start the instance asked for', 'Start', ({ logins }) => api(`/api/requests/${el.dataset.id}`, { method: 'POST', body: JSON.stringify({ logins }) }));
  if (act === 'req-drop') {
    await api(`/api/requests/${el.dataset.id}`, { method: 'DELETE' });
    await refresh();
  }
  if (act === 'compare') {
    const p = pv;
    p.old ??= (await api(fileUrl(p.was, 'preview'))).sheets;
    p.cmp = !p.cmp;
    if (pv === p) renderPv();
  }
  if (act === 'duplicate') await openStart(`Copy ${cur.i.label}`, 'Copy', ({ label, logins }) => api(`${instPath()}/duplicate?as=${enc(label)}`, { method: 'POST', body: JSON.stringify({ logins }) }), `${cur.i.label} copy`);
  if (act === 'sheet') { pv.sheet = Number(el.dataset.k); renderPv(); }
  if (act === 'cell') {
    // A cell's threads and what changed there; on an item's file in an open instance, a reply there, or a new comment.
    const on = data?.doc.status === 'open' && pv.item, t = el.dataset.thread;
    const go = t ? `<button class="btn" data-act="thread" data-thread="${esc(t)}">${on ? 'Reply' : 'Open the thread'}</button>` : on ? `<button class="btn" data-act="comment-cell" data-ref="${esc(el.dataset.ref)}">Comment on ${esc(el.dataset.ref)}</button>` : '';
    put($('#pvn'), `${esc(el.dataset.note ?? '')}${go && `<div>${go}</div>`}`);
  }
  if (act === 'thread') {
    replying.add(el.dataset.thread);
    closePv();
    Object.assign(ui, { open: true, tab: 'conv', on: null, ref: null });
    renderLog(); renderBar();
    const box = document.querySelector(`#log .thread[data-thread="${CSS.escape(el.dataset.thread)}"]`);
    box?.scrollIntoView({ block: 'center' });
    box?.querySelector('textarea')?.focus();
  }
  if (act === 'comment-cell') {
    const item = pv.item;
    pv = null;
    renderPv();
    Object.assign(ui, { open: true, tab: 'conv', on: item, ref: el.dataset.ref });
    renderLog(); renderBar();
    $('#newcomment')?.focus();
  }
  if (act === 'toggle-closed') { showClosed = !showClosed; renderSide(); }
  if (act === 'toggle-archived') { showArchived = !showArchived; renderSide(); }
  if (act === 'add') {
    const p = $('#picker');
    p.dataset.pane = el.dataset.pane;
    p.dataset.onto = el.dataset.item ?? '';
    p.multiple = !el.dataset.item;
    p.value = '';
    p.click();
  }
  if (act === 'close') {
    const waits = threads.filter(t => t.waits);
    const task = cur.s.single, text = (task ? 'If it will recur, make it a series under the name below: this task becomes its first instance, which later ones roll forward from.' : 'It becomes an example for later instances.')
      + (waits.length ? '\n\nClosing accepts what the agent did for each ask still waiting:\n' + waits.map(t => `• ${firstLine(t.last.text)}`).join('\n') : '');
    const close = async (name, promote) => {
      if (promote) await api(`${seriesPath(cur)}/promote`, { method: 'POST', body: JSON.stringify({ name }) });
      return api(`${instPath()}/close`, { method: 'POST' });
    };
    if (await ask({ title: `Close ${cur.i.label}?`, text, ...(task && { value: cur.i.label, alt: 'Make it a series and close' }), ok: task ? 'Close task' : 'Close instance', kind: 'commit', act: close })) await refresh();
  }
  if (act === 'abandon' && await ask({ title: `Abandon ${cur.i.label}?`, text: "It stays as it is, but isn't an example or a starting point for later instances.", ok: 'Abandon', kind: 'danger', act: () => api(`${instPath()}/abandon`, { method: 'POST' }) })) await refresh();
  if (act === 'new-instance') await openStart('New instance', 'Start', ({ label, logins }) => api(seriesPath(cur), { method: 'POST', body: JSON.stringify({ label, logins }) }), '');
  // A task starts at once, Untitled, with the logins last ticked, on its conversation, ready for the prompt that starts its run.
  if (act === 'new-task') {
    const offers = new Set((await myOffers()).map(o => o.id)), logins = JSON.parse(localStorage.ticks ?? '[]').filter(id => offers.has(id));
    const { instance } = await api('/api/series', { method: 'POST', body: JSON.stringify({ workspace: cur.w.id, single: true, logins }) });
    Object.assign(ui, { open: true, tab: 'conv', on: null, ref: null, focus: true });
    go(instance);
  }
  if (act === 'ticks') await openStart(`Logins ${cur.i.label} may use`, 'Save', ({ logins }) => api(`${instPath()}/logins`, { method: 'POST', body: JSON.stringify({ logins }) }), undefined, undefined, data.runner.logins);
  if (act === 'start-another') await openStart(`Start another based on ${cur.i.label}`, 'Start', async ({ label, logins, name }) => {
    await api(`${seriesPath(cur)}/promote`, { method: 'POST', body: JSON.stringify({ name }) });
    return api(seriesPath(cur), { method: 'POST', body: JSON.stringify({ label, logins }) });
  }, '', cur.i.label);
  if (act === 'takeover') await openStart(`Take over ${cur.i.label}`, 'Take over', ({ logins }) => api(`${instPath()}/takeover`, { method: 'POST', body: JSON.stringify({ logins }) }));
  if (act === 'start-go') {
    const s = pv.settings, label = $('#slabel')?.value.trim();
    if (label === '') return toast('Give it a label');
    localStorage.ticks = JSON.stringify(ticked());
    const r = await s.then({ label, logins: ticked(), name: $('#sseries')?.value.trim() });
    pv = null;
    renderPv();
    if (r?.id) go(r.id);
    else await refresh();
  }
  if (act === 'logins') await openLogins();
  if (act === 'tokens') await openTokens();
  if (act === 'people') {
    pv = { title: 'People', settings: { kind: 'people', users: await api('/users') } };
    renderPv();
  }
  if (act === 'new-token') {
    const name = $('#tname').value.trim();
    if (!name) return toast('Name the token, such as laptop');
    await openTokens((await api('/tokens', { method: 'POST', body: JSON.stringify({ name, days: Number($('#tdays').value) }) })).token);
  }
  if (act === 'revoke-token') {
    await api(`/tokens/${enc(el.dataset.id)}`, { method: 'DELETE' });
    await openTokens();
  }
  if (act === 'waiting') {
    pv = { title: 'Waiting on you', settings: { kind: 'waiting' } };
    renderPv();
  }
  if (act === 'save-agents') {
    const text = $('#agents').value;
    await api(`/api/workspaces/${cur.w.id}`, { method: 'PUT', body: JSON.stringify({ agents: text }) });
    pv.settings.agents = text;
    saved();
    await refresh();
  }
  if (act === 'offer-add') {
    const v = $('#offer-add').value.trim();
    if (!v) return;
    const failed = await api('/logins/m365/offers', { method: 'POST', body: JSON.stringify({ add: v }) }).then(() => null, e => e);
    pv.settings.logins = await api('/logins');
    // A login Microsoft no longer renews shows as expired, with Sign in again, in place of the error; others leave the box as it was.
    if (failed && !pv.settings.logins.find(l => l.id === 'm365')?.expired) throw failed;
    renderPv();
  }
  if (act === 'unoffer') {
    await api(`/logins/m365/offers/${enc(el.dataset.id)}`, { method: 'DELETE' });
    pv.settings.logins = await api('/logins');
    renderPv();
  }
  if (act === 'web-signin') {
    pv = { title: `Sign in to ${el.dataset.name}`, signin: (await api(`/logins/web/${enc(el.dataset.id)}`, { method: 'POST' })).id };
    renderPv();
  }
  if (act === 'signin-save') {
    await api(`/signins/${pv.signin}`, { method: 'POST' });
    await openLogins();
  }
  if (act === 'signout-login') {
    await api(`/logins/${enc(el.dataset.id)}`, { method: 'DELETE' });
    pv.settings.logins = await api('/logins');
    renderPv();
  }
  if (act === 'new-workspace') {
    const made = await ask({ title: 'New workspace', text: 'Such as a client. You become its owner.', value: '', placeholder: 'Name', ok: 'Make workspace', act: name => api('/api/workspaces', { method: 'POST', body: JSON.stringify({ name }) }) });
    if (made) go(made.id);
  }
}

$('#picker').addEventListener('change', e => upload([...e.target.files], e.target.dataset.pane, e.target.dataset.onto));
// Settings save as they change: a name once it's left or Enter is pressed, a tick at once.
document.addEventListener('change', async ev => {
  const el = ev.target;
  if (el.id === 'sname') await api(seriesPath(cur), { method: 'PUT', body: JSON.stringify({ name: el.value.trim() }) });
  else if (el.matches('#pv input.tick') && pv.settings.kind === 'series' && pv.settings.shared_by === me.email) await api(seriesPath(cur), { method: 'PUT', body: JSON.stringify({ share: true, logins: ticked() }) });
  else if (el.id === 'wname') await api(`/api/workspaces/${cur.w.id}`, { method: 'PUT', body: JSON.stringify({ name: el.value.trim() }) });
  else if (el.matches('#log input.ctick')) {
    const logins = [...document.querySelectorAll('#log input.ctick:checked')].map(i => i.value);
    localStorage.ticks = JSON.stringify(logins);
    await api(`${instPath()}/logins`, { method: 'POST', body: JSON.stringify({ logins }) });
    return refresh();
  }
  else return;
  saved();
  await refresh();
});
// The dialog closes on Escape and on a click beside it, but a sign-in's only on Escape or its buttons.
$('#pv').addEventListener('close', () => pv && closePv());
$('#pv').addEventListener('click', e => {
  const r = $('#pv').getBoundingClientRect();
  if (e.target === $('#pv') && !pv.signin && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)) closePv();
});

for (const type of ['dragover', 'dragleave', 'drop']) {
  $('#panes').addEventListener(type, e => {
    const pane = e.target.closest('.pane'), t = e.target.closest('.tile');
    if (!pane || data?.doc.status !== 'open' || !e.dataTransfer.types.includes('Files')) return;
    e.preventDefault();
    document.querySelectorAll('.drag').forEach(x => x.classList.remove('drag'));
    if (type === 'dragover') (t ?? pane).classList.add('drag');
    if (type === 'drop') upload([...e.dataTransfer.files], pane.dataset.pane, t?.dataset.item);
  });
}
// A comment's box takes dropped files as its attachments.
for (const type of ['dragover', 'drop']) {
  $('#log').addEventListener(type, e => {
    if (!e.target.closest('#newcomment, #newfiles') || !e.dataTransfer.types.includes('Files')) return;
    e.preventDefault();
    if (type === 'drop') $('#newfiles').files = e.dataTransfer.files;
  });
}
addEventListener('dragover', e => { if (!e.defaultPrevented) { e.preventDefault(); e.dataTransfer.dropEffect = 'none'; } });
addEventListener('drop', e => e.preventDefault());
$('#panes').addEventListener('scroll', () => { placeCard(); drawEdges(); }, true);
$('#panes').addEventListener('mouseover', e => {
  const id = e.target.closest('.tile')?.dataset.item ?? null;
  if (id !== hover) { hover = id; drawEdges(); }
});
$('#panes').addEventListener('mouseleave', () => { hover = null; drawEdges(); });
new ResizeObserver(() => { placeCard(); drawEdges(); }).observe($('#panes'));
document.fonts.ready.then(drawEdges);

addEventListener('hashchange', () => {
  openItem = null; folds.clear(); prevSigs = {};
  $('#panes').scrollTop = $('#flow').scrollTop = $('#flow').scrollLeft = $('#outs').scrollTop = $('#log').scrollTop = 0;
  $('#log').dataset.end = 'yes';
  closePv();
  $('#side').classList.remove('open');
  refresh();
});
// Keys, while no field has the focus: j and k (or the arrows) move through the sidebar's rows, l opens a row or goes into it, h
// folds it or goes to its parent, Enter goes to it; 1, 2 and 3 pick the panel's tab, c goes to the comment box, ? shows the keys.
function navigate(e) {
  const rows = [...$('#tree').querySelectorAll('a[href]')], at = rows.indexOf(document.activeElement), row = document.activeElement.closest('#tree .row');
  const chev = row?.querySelector('.chev'), open = chev?.textContent === '\u25BE', key = { ArrowDown: 'j', ArrowUp: 'k', ArrowRight: 'l', ArrowLeft: 'h' }[e.key] ?? e.key;
  if (e.key.startsWith('Arrow') && at < 0) return; // the arrows scroll, unless the sidebar has the focus
  if (key === 'j' || key === 'k') (at < 0 ? rows.find(r => r.closest('.on')) ?? rows[0] : rows[at + (key === 'j' ? 1 : -1)])?.focus();
  else if (key === 'l' && chev) open ? rows[at + 1]?.focus() : chev.click();
  else if (key === 'h' && row) open ? chev.click() : row.closest('.tree')?.previousElementSibling.querySelector('a[href]').focus();
  else if (['1', '2', '3', 'c'].includes(key) && data) {
    Object.assign(ui, { open: true, tab: key === 'c' ? 'conv' : ['conv', 'proc', 'log'][key - 1], on: null, ref: null, focus: key === 'c' });
    renderLog(); renderBar(); placeCard();
  } else if (key === '?') $('.key').classList.toggle('show');
  else return;
  e.preventDefault();
}

addEventListener('keydown', e => {
  // Ctrl+Enter, or Cmd+Enter on a Mac, sends from the panel's comment and reply boxes.
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.matches('#log textarea')) {
    e.preventDefault();
    return (e.target.id === 'newcomment' ? $('#log [data-act=comment]') : e.target.closest('.thread').querySelector('[data-act=reply-thread]')).click();
  }
  if (e.key === 'Escape' && e.target.matches('textarea, input:not(.inline)') && !document.querySelector('dialog[open]')) return e.target.blur();
  if ($('#pop').hidden && !e.target.matches('input, textarea, select') && !e.ctrlKey && !e.metaKey && !e.altKey && !document.querySelector('dialog[open]')) navigate(e);
  if (!$('#pop').hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    const items = [...$('#pop').querySelectorAll('button:not(:disabled)')], k = items.indexOf(document.activeElement);
    items.at((k + (e.key === 'ArrowDown' ? 1 : -1)) % items.length)?.focus();
    e.preventDefault();
  }
  // Enter in a one-line field presses its button, as in a form.
  if (e.key === 'Enter' && !e.isComposing && e.target.matches('.row2 input[type=text]')) e.target.closest('.row2').querySelector('.btn').click();
  if (e.key === 'Enter' && !e.isComposing && e.target.id === 'slabel') $('[data-act=start-go]').click();
  // A dialog closes itself on Escape.
  if (e.key !== 'Escape' || document.querySelector('dialog[open]')) return;
  if (!$('#pop').hidden) $('#pop').hidden = true;
  else if ($('#side').classList.contains('open')) $('#side').classList.remove('open');
  else if (openItem) { openItem = null; renderCard(); renderPanes(); }
  else if (ui.open) { ui.open = false; renderLog(); renderBar(); placeCard(); }
});
// Microsoft sends people back to #logins after they connect Microsoft 365.
const backFromMicrosoft = location.hash === '#logins';
if (backFromMicrosoft) history.replaceState(null, '', '#/');
refresh().then(() => backFromMicrosoft && openLogins());
// The server names what changed: "tree" for names, settings, wakes and logins, else an instance by its id. The page catches up one
// refresh at a time, and when it comes back into view.
const pend = new Set();
let busy = false;
async function drain() {
  if (busy || document.hidden || !pend.size) return;
  busy = true;
  const ids = [...pend];
  pend.clear();
  await (ids.includes('tree') ? refresh() : patch(ids)).catch(console.error);
  busy = false;
  drain();
}
const events = new EventSource('/api/events');
events.onmessage = e => { pend.add(e.data); drain(); };
events.onopen = () => { pend.add('tree'); drain(); };
// The browser gives up on a stream that comes back with an error, as during a deploy or once the session has ended.
events.onerror = () => events.readyState === EventSource.CLOSED && setTimeout(() => location.reload(), 5000);
addEventListener('visibilitychange', drain);
// The rows' ages move on as the minutes pass.
setInterval(renderSide, 60_000);
$('#log').addEventListener('scroll', e => { const el = e.currentTarget; el.dataset.end = el.scrollTop + el.clientHeight >= el.scrollHeight - 8 ? 'yes' : 'no'; });

// Pane widths, kept in this browser: a grip's drag sets its pane's width, which the CSS bounds, and keeps what shows.
{
  const panes = { side: $('#side'), panel: $('#log') }, widths = JSON.parse(localStorage.widths ?? '{}');
  const show = k => widths[k] ? $('.app').style.setProperty(`--${k}-w`, `${widths[k]}px`) : $('.app').style.removeProperty(`--${k}-w`);
  const keep = k => { show(k); localStorage.widths = JSON.stringify(widths); };
  for (const grip of document.querySelectorAll('.grip')) {
    const k = grip.dataset.pane;
    show(k);
    grip.addEventListener('pointerdown', e => {
      e.preventDefault();
      grip.setPointerCapture(e.pointerId);
      const from = panes[k].offsetWidth, x = e.clientX;
      grip.onpointermove = m => { widths[k] = from + (k === 'side' ? m.clientX - x : x - m.clientX); show(k); };
    });
    grip.addEventListener('lostpointercapture', () => {
      grip.onpointermove = null;
      if (widths[k]) widths[k] = panes[k].offsetWidth;
      keep(k);
    });
    grip.addEventListener('dblclick', () => { delete widths[k]; keep(k); });
  }
}
</script>
</body>
</html>
