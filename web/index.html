<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rollforward</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Tokens and rules: docs/design.md. Blue = uploaded by a person, ink = made by the agent, red = waiting on a reply. */
:root {
  --paper: #f6f7f8; --sheet: #ffffff; --rule: #e3e6ea; --rule-2: #cdd2d9;
  --ink: #15181d; --ink-2: #474e5b; --ink-3: #6b7280;
  --person: #1f48c7; --person-bg: #eef2fc; --red: #d42a1e; --edge: #a3aab4; --control: #e83;
  --r1: 4px; --r2: 8px;
  --sans: "IBM Plex Sans", "Noto Sans", sans-serif; --mono: "IBM Plex Mono", "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; font: 14px/1.45 var(--sans); color: var(--ink); background: var(--paper); font-variant-numeric: tabular-nums; }
button { font: inherit; cursor: pointer; }
a { color: inherit; }
.app { --side: clamp(180px, var(--side-w, 256px), 30vw); --panel: clamp(280px, var(--panel-w, 352px), 50vw); display: grid; grid-template-columns: var(--side) 1fr auto; height: 100dvh; }
/* Pane widths: the sidebar's and the side panel's inner edges drag, between the bounds above, and a double-click resets them. */
.grip { position: fixed; top: 0; bottom: 0; z-index: 5; width: 6px; cursor: col-resize; touch-action: none; }
.grip:hover, .grip:active { background: var(--rule-2); }
.grip[data-pane=side] { left: calc(var(--side) - 6px); }
.grip[data-pane=panel] { right: calc(var(--panel) - 6px); }
.log:not(.open) ~ .grip[data-pane=panel] { display: none; }

.side { border-right: 1px solid var(--rule); padding: 14px 10px; display: flex; flex-direction: column; min-height: 0; background: var(--paper); }
.side .scroll { flex: 1; min-height: 0; overflow: auto; }
.chev { all: unset; position: relative; z-index: 1; cursor: pointer; flex: none; width: 22px; align-self: stretch; display: grid; place-items: center; border-radius: var(--r1); font-size: 13px; color: var(--ink-2); }
.chev:hover { background: var(--rule); color: var(--ink); }
.row:is(.ws, .ser) > .add { display: none; }
.row:is(.ws, .ser):is(:hover, .on) > .add { display: grid; }
.row:is(.ws, .ser):is(:hover, .on) > .age { display: none; }
.row.ws .nm { font-weight: 600; color: var(--ink); }
.row.ser .nm { color: #1f5f8b; }
.seg { display: flex; margin-left: auto; margin-right: 4px; border: 1px solid var(--rule-2); border-radius: var(--r1); overflow: hidden; }
.seg button { all: unset; cursor: pointer; padding: 1px 7px; font-size: 11.5px; color: var(--ink-3); }
.seg button.sel { background: var(--sheet); color: var(--ink); }
.row { display: flex; align-items: center; gap: 2px; min-height: 30px; padding: 0 4px 0 8px; border-radius: var(--r1); text-decoration: none; }
.row.grp { margin-top: 6px; border-top: 1px solid var(--rule); border-radius: 0; }
.row.grp .nm { font-style: italic; color: var(--ink-3); }
.ticks2 { display: grid; gap: 4px; font-size: 12.5px; color: var(--ink-2); margin: 6px 0; }
.consent { color: var(--red); font-size: 12.5px; margin: 6px 0; }
.ticks2 label { display: flex; align-items: center; gap: 6px; }
.lline { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--rule); }
.lline b { flex: 0 0 9.5em; font-weight: 600; }
.lline .sub { flex: 1; }
.lsub { display: flex; align-items: center; gap: 8px; padding-left: 16px; }
.lsub > span { flex: 1; }
.tgroup summary { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.tgroup summary .sub::after { content: ' \25B8'; }
.log details.tgroup > summary::before, .log details.tgroup[open] > summary::before { content: none; }
.tgroup[open] summary .sub::after { content: ' \25BE'; }
.tgroup > label, .tkind > label { padding-left: 20px; }
.row.wake, .row.req { font-size: 12px; color: var(--ink-2); }
/* A row keeps to one line: its name gives way, cut short with the whole of it on hover; what follows it never does. */
.row .nm { flex: 1 1 0; min-width: 0; display: flex; align-items: center; padding: 5px 0; text-decoration: none; }
.row .l { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .n { flex: none; color: var(--ink-3); font-size: 12px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; padding-left: 6px; }
/* A row with a link is a link all over, but for its buttons. */
.row:has(> a.nm), a.row { position: relative; }
.row > a.nm::before { content: ''; position: absolute; inset: 0; }
.row > .add { position: relative; }
.row:is(.ws, .ser, .waits):has(> a.nm):hover, a.row.inst:not(.on):hover { background: #eceff2; }
.head { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
/* The sidebar's top: a filter as you type; a button whose menu chooses which workspaces show and in what order, marked while it's
   not as it starts; and + for a workspace. */
.find { display: flex; align-items: center; gap: 2px; padding: 0 0 8px; }
.find input { flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 4px 8px; border: 1px solid var(--rule-2); border-radius: var(--r1); background: var(--sheet); color: var(--ink); }
.sorter { position: relative; }
.sorter > summary::-webkit-details-marker { display: none; }
.sorter.on > summary { color: var(--ink); background: var(--rule); }
.sorter .pop { position: absolute; z-index: 5; top: 28px; right: 0; min-width: 170px; padding: 4px; background: var(--sheet); border: 1px solid var(--rule-2); border-radius: var(--r1); box-shadow: 0 6px 18px rgba(0, 0, 0, .12); }
.pop .head { padding: 6px 8px 2px; }
.pop .opt { all: unset; display: block; position: relative; cursor: pointer; padding: 4px 10px 4px 26px; border-radius: var(--r1); font-size: 13px; color: var(--ink); }
.pop .opt:hover { background: var(--paper); }
.pop .opt.sel::before { content: '\2713'; position: absolute; left: 9px; }
.side .empty { padding: 6px 8px; }
.ws { font-size: 14px; font-weight: 600; }
.tree { margin-left: 14px; padding-left: 4px; border-left: 1px solid var(--rule-2); }
.ser { font-size: 13.5px; color: var(--ink-2); }
.ser.on { color: var(--ink); font-weight: 600; }
.inst { font-size: 13px; color: var(--ink-2); }
.inst.on { background: #e7eaee; color: var(--ink); font-weight: 500; }
.inst .q, .waits .q { color: var(--red); }
.waits .q { margin-left: 5px; }
.cnt { min-width: 16px; padding: 0 5px; border-radius: 8px; background: var(--red); color: #fff; font-size: 10.5px; font-weight: 600; line-height: 16px; text-align: center; display: inline-block; }
.waits { margin-bottom: 8px; cursor: pointer; }
.wt { padding: 7px 0; border-bottom: 1px solid var(--rule); }
.wt .btn { margin-left: 8px; }
.inst.abandoned .nm { text-decoration: line-through; }
.archived .nm { color: var(--ink-3); }
.add { all: unset; cursor: pointer; flex: none; width: 24px; height: 24px; display: grid; place-items: center; border-radius: var(--r1); color: var(--ink-3); font-size: 17px; line-height: 1; }
.add:hover { background: var(--rule); color: var(--ink); }
.quiet { display: block; padding: 5px 8px; font-size: 12px; color: var(--ink-3); background: none; border: 0; text-align: left; }
.quiet:hover { color: var(--ink); }
.vl { padding: 14px 16px; display: grid; gap: 10px; align-content: start; font-size: 13.5px; }
.vl h3 { margin: 4px 0 0; font-size: 13px; font-weight: 600; }
.vl .sub { color: var(--ink-3); font-size: 12.5px; }
.vl hr { width: 100%; margin: 6px 0 0; border: 0; border-top: 1px solid var(--rule); }
.vl input[type=text] { font: inherit; padding: 7px 9px; border: 1px solid var(--rule-2); border-radius: var(--r1); }
.pv.small { inset: 12vh auto auto 50%; transform: translateX(-50%); width: min(420px, 92vw); max-height: 80dvh; }
.vl label { display: flex; align-items: center; gap: 8px; }
.adv-set { display: grid; gap: 10px; border-top: 1px solid var(--rule); padding-top: 10px; }
.adv-set summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
.twisty { all: unset; flex: none; width: 20px; height: 20px; display: grid; place-items: center; border-radius: var(--r1); color: var(--ink-2); font-size: 15px; cursor: pointer; }
button.twisty:hover { background: var(--rule); color: var(--ink); }
.vl textarea { font: 12.5px/1.5 var(--mono); padding: 7px 9px; border: 1px solid var(--rule-2); border-radius: var(--r1); resize: vertical; min-height: 4.5em; }
.vl :is(input[type=email], input[type=password], select) { font: inherit; padding: 7px 9px; border: 1px solid var(--rule-2); border-radius: var(--r1); background: var(--sheet); min-width: 0; max-width: 100%; }
.vl .row2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ut { border-collapse: collapse; font-size: 12.5px; width: 100%; }
.ut td, .ut th { border-top: 1px solid var(--rule); padding: 6px 6px 6px 0; text-align: left; vertical-align: top; }
.ut th { font-weight: 500; color: var(--ink-3); }
.ut select { max-width: 100px; }
.acct { padding-top: 10px; border-top: 1px solid var(--rule); margin-top: 10px; display: flex; align-items: center; gap: 2px; }
.me { flex: 1; min-width: 0; display: grid; padding: 6px 8px; border-radius: var(--r1); font-size: 12.5px; color: var(--ink-2); outline: none; }
.acts2 { display: none; align-items: center; }
.acct:is(:hover, :focus-within) .acts2 { display: flex; }
.pvtabs { display: flex; gap: 4px; padding: 0 12px; border-bottom: 1px solid var(--rule); }
.me .mail { color: var(--ink-3); font-size: 12px; word-break: break-all; }
.dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--red); display: inline-block; margin-left: 6px; vertical-align: 1px; }
.dot.u { background: var(--person); }
.row .nm.b { font-weight: 600; }
.row .age { flex: none; min-width: 22px; text-align: right; font-size: 11.5px; color: var(--ink-3); padding-left: 4px; }
.key { position: absolute; right: 16px; bottom: 12px; z-index: 4; font-size: 12px; color: var(--ink-3); background: var(--sheet); border: 1px solid var(--rule-2); border-radius: 12px; padding: 2px 10px; cursor: default; }
.legend { display: none; position: absolute; right: 0; bottom: calc(100% + 6px); width: max-content; font-size: 12px; color: var(--ink-2); background: var(--sheet); border: 1px solid var(--rule-2); border-radius: var(--r1); box-shadow: 0 6px 20px rgba(21,24,29,.12); padding: 10px 12px; gap: 4px; }
.key:is(:hover, :focus-within, .show) .legend { display: grid; }
.legend .keys { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--rule); color: var(--ink-3); display: grid; gap: 2px; }
.legend kbd { font: inherit; color: var(--ink); }
.legend i { font-style: normal; font-weight: 600; }
.legend .p { color: var(--person); }
.legend .tri { display: inline-block; width: 0; height: 0; border-top: 9px solid var(--ink-3); border-left: 9px solid transparent; margin-right: 6px; }
.legend .dash { display: inline-block; width: 16px; height: 10px; border: 1px dashed var(--ink-3); border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

/* The deployment's brand (rf brand) tops the sidebar: its logo and its text, or nothing when unset. */
.brand { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 0 8px 10px; border-bottom: 1px solid var(--rule); margin-bottom: 10px; font-size: 15px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.brand:empty { display: none; }
.brand img { display: block; max-height: 32px; max-width: 100%; }

.main { display: flex; flex-direction: column; min-width: 0; height: 100dvh; position: relative; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 28px; border-bottom: 1px solid var(--rule); background: var(--sheet); }
.menu { display: none; border: 1px solid var(--rule-2); background: var(--sheet); border-radius: var(--r1); padding: 6px 10px; }
.crumb { font-size: 13px; color: var(--ink-3); }
.bar h1 { margin: 2px 0 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.bar .ttl { flex: 1 1 0; }
.ren { all: unset; cursor: pointer; color: var(--ink-3); font-size: 15px; font-weight: 400; margin-left: 6px; }
.bar h1 .t { cursor: text; }
.bar h1:hover .ren { color: var(--ink); }
/* Whose an instance is: a chip by its title, which tells more on hover or a click, and their initials on others' rows. */
.owner { position: relative; display: inline-block; vertical-align: 3px; margin-left: 10px; padding: 1px 9px; border-radius: 10px; font-size: 12.5px; font-weight: 500; letter-spacing: 0; color: var(--person); background: var(--person-bg); cursor: default; }
.owner .about { display: none; position: absolute; left: 0; top: calc(100% + 6px); z-index: 5; width: max-content; max-width: 340px; font-weight: 400; color: var(--ink-2); background: var(--sheet); border: 1px solid var(--rule-2); border-radius: var(--r1); box-shadow: 0 6px 20px rgba(21,24,29,.12); padding: 8px 12px; line-height: 1.5; }
.owner:is(:hover, :focus-within) .about { display: block; }
.creds { vertical-align: 3px; margin-left: 6px; padding: 1px 9px; border: 1px solid var(--rule-2); border-radius: 10px; background: var(--sheet); font: 500 12.5px var(--sans); color: var(--ink-2); cursor: pointer; }
.creds:hover { color: var(--ink); border-color: var(--edge); }
.creds a { text-decoration: underline; cursor: pointer; }
.who { flex: none; display: inline-block; margin-left: 6px; padding: 0 4px; border-radius: 6px; font-size: 10px; font-weight: 600; line-height: 15px; vertical-align: 1px; color: var(--person); background: var(--person-bg); }
.state { margin-left: auto; font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.ptog { position: relative; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--rule-2); border-radius: var(--r1); background: var(--sheet); color: var(--ink-3); cursor: pointer; }
.ptog:hover, .ptog.on { color: var(--ink); }
.ptog .badge { position: absolute; top: -7px; right: -7px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--red); color: #fff; font: 600 10.5px/16px var(--sans); }
.btn { border: 1px solid var(--rule-2); background: var(--sheet); color: var(--ink); border-radius: var(--r1); padding: 7px 12px; font-size: 13px; font-weight: 500; white-space: nowrap; text-decoration: none; display: inline-block; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.commit { background: var(--person); border-color: var(--person); color: #fff; }
.btn.danger { color: var(--red); border-color: var(--red); }
.btn.share { background: var(--person); border-color: var(--person); color: #fff; transition: background .3s, border-color .3s; }
.btn.share.armed { background: #b45309; border-color: #b45309; }
.warn { display: grid; gap: 8px; border: 1px solid #b45309; background: #fff7ed; border-radius: var(--r1); padding: 10px 12px; font-size: 13px; }
.btn:disabled { background: var(--sheet); color: var(--ink-3); border-color: var(--rule-2); cursor: default; }
.btn.sel { background: var(--paper); box-shadow: inset 0 1px 2px rgba(0,0,0,.08); }
.btn:hover:not(:disabled) { border-color: var(--ink-3); background: var(--paper); }
.btn.primary:hover:not(:disabled) { background: #2b3039; border-color: #2b3039; }
.btn.commit:hover:not(:disabled) { background: #1a3eae; border-color: #1a3eae; }
.btn.danger:hover:not(:disabled) { background: #fdf1f0; border-color: var(--red); }
[aria-busy=true] { pointer-events: none; opacity: .6; cursor: progress; }

/* The instance's slices, Inputs, Outputs and Review, side by side, each scrolling on its own; in the list view, Inputs over Outputs,
   with Review beside them. */
.panes { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr); grid-template-areas: "ins outs steps"; position: relative; }
.panes.list { grid-template-columns: minmax(0, 1fr) minmax(240px, 28%); grid-template-rows: fit-content(55%) minmax(0, 1fr); grid-template-areas: "ins steps" "outs steps"; }
.pane { padding: 22px 28px 20px; display: flex; flex-direction: column; position: relative; overflow: auto; min-width: 0; scrollbar-gutter: stable; }
/* Always-visible scrollbars, so a long list of inputs or outputs shows it goes on (Edge's overlay scrollbars hide until hovered). */
.pane::-webkit-scrollbar { width: 10px; height: 10px; }
.pane::-webkit-scrollbar-track { background: var(--rule); }
.pane::-webkit-scrollbar-thumb { background: var(--edge); border: 2px solid var(--rule); border-radius: 6px; }
.pane::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }
@supports not selector(::-webkit-scrollbar) { .pane { scrollbar-width: thin; scrollbar-color: var(--edge) var(--rule); } }
.ins { grid-area: ins; }
.outs { grid-area: outs; border-left: 1px solid var(--rule); }
.steps { grid-area: steps; border-left: 1px solid var(--rule); }
.panes.list .outs { border-left: 0; border-top: 1px solid var(--rule); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; align-content: start; }
.tiles:empty { display: none; }
.view { position: absolute; right: 72px; bottom: 12px; z-index: 4; }
.view .seg { margin: 0; background: var(--paper); }
.view .seg button { padding: 3px 10px; font-size: 12px; }
.lst { width: 100%; border-collapse: collapse; font-size: 12.5px; background: var(--sheet); border: 1px solid var(--rule); margin-bottom: 10px; }
.lst th { text-align: left; font-weight: 500; color: var(--ink-3); padding: 6px 8px; border-bottom: 1px solid var(--rule-2); white-space: nowrap; cursor: pointer; user-select: none; }
.lst th:hover { color: var(--ink); }
.lst th[aria-sort=ascending]::after { content: ' \25B4'; }
.lst th[aria-sort=descending]::after { content: ' \25BE'; }
.lst td { padding: 5px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; overflow-wrap: break-word; }
.lst td:nth-child(n+3):not(:nth-child(5)) { white-space: nowrap; }
.lrow { cursor: pointer; }
.lrow:hover { background: #f5f6f8; }
.lrow.on, .lrow.drag { background: #e7eaee; }
.lrow.made { background: #eef0f3; box-shadow: inset 3px 0 0 var(--ink-2); }
.lrow .fn { display: block; }
.lst td:first-child { min-width: 9em; }
.lrow .file { display: block; font-size: 11.5px; }
.lrow.person .fn, .lrow.person td b { color: var(--person); }
.lrow td b { font-weight: 500; }
.lrow.ghost td { color: var(--ink-3); }
.lrow.fresh .fn::before { content: ''; display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: var(--ink); vertical-align: 1px; }
.lrow td.q { color: var(--red); }
.pane.busy::before { content: ''; position: absolute; top: 0; left: -30%; width: 30%; height: 2px; background: var(--ink); animation: stripe 1.4s ease-in-out infinite; }
@keyframes stripe { to { left: 100%; } }
.pane.drag::after { content: '+ Add'; position: absolute; top: 20px; right: 28px; font-weight: 600; color: var(--person); }
.pane.drag .ph .btn { visibility: hidden; }
.pane.drag { background: var(--person-bg); }
/* A pane's heading, with + Add files, stays in view while its tiles scroll under it. */
.ph { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; min-height: 26px; margin: -22px 0 4px; padding: 22px 0 6px; position: sticky; top: -22px; z-index: 4; background: var(--paper); }
.pane.drag .ph { background: var(--person-bg); }
.ph h2 { margin: 0; font-size: 15px; font-weight: 600; }
.ph .c { font-size: 13px; color: var(--ink-3); }
.ph .btn { margin-left: auto; padding: 4px 10px; font-size: 12px; }
.tile { position: relative; z-index: 2; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r1); padding: 11px 12px 10px; min-height: 96px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; text-align: left; }
.tile.on, .tile.drag { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.ext { font: 500 10px/1 var(--mono); letter-spacing: .04em; color: var(--ink-3); display: flex; justify-content: space-between; align-items: baseline; }
.nc { font: 500 11.5px/1 var(--sans); letter-spacing: 0; color: var(--ink-3); padding-right: 10px; }
.nc.q, .legend .tri.q { color: var(--red); border-top-color: var(--red); }
.fn { font-size: 13px; font-weight: 500; line-height: 1.32; word-break: break-word; }
.file { font-size: 12px; color: var(--ink-3); word-break: break-word; }
.tile.person .fn, .tile.person .meta b { color: var(--person); }
.meta { margin-top: auto; font-size: 12px; color: var(--ink-3); }
.meta b { font-weight: 500; color: var(--ink); }
.corner { position: absolute; top: -1px; right: -1px; width: 0; height: 0; border-top: 12px solid var(--ink-3); border-left: 12px solid transparent; border-top-right-radius: var(--r1); }
.tile.ghost { background: transparent; border: 1px dashed var(--rule-2); }
.tile.ghost .fn { color: var(--ink-2); font-weight: 400; }
/* Hovering a tile or a row marks what it's made from. */
.tile.made { border-color: var(--ink-2); background: #f1f3f5; }
.tile.fresh::before { content: ''; position: absolute; top: 9px; left: -4px; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); }
.tile.flash { animation: flash 1.4s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 4px var(--rule-2); } }
.corner.ask { border-top-color: var(--red); animation: ask 1.6s ease-in-out infinite; }

:focus-visible { outline: 2px solid var(--person); outline-offset: 1px; }

@media (max-width: 800px) {

<body>
<div class="app">
  <aside class="side" id="side"><div class="brand" id="brand"></div><div class="find"><input type="search" id="find" placeholder="Filter" autocomplete="off" spellcheck="false" aria-label="Filter workspaces, series and instances"><details class="sorter" id="sorter"><summary class="add" title="Show and sort"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 4h12M4.5 8h7M7 12h2"/></svg></summary><div class="pop" id="sortpop"></div></details><span id="newws"></span></div><div class="scroll" id="tree"></div><div class="acct" id="acct"></div></aside>
  <main class="main">
    <div class="bar" id="bar"></div>
    <div class="needs" id="needs" hidden></div>
    <div class="corrs" id="corrs" hidden></div>
    <div class="panes" id="panes">
      <section class="pane outs" id="outs" data-pane="out"></section>
      <section class="pane ins" id="ins" data-pane="in"></section>
      <section class="pane steps" id="steps" data-pane="in" hidden></section>
      <div class="view" id="view"></div>
      <div class="key" tabindex="0">Key<div class="legend"><div><i class="p">Blue</i> uploaded by a person</div><div><i>Black</i> made by the agent</div><div><span class="tri"></span>comments</div><div><span class="tri q"></span>waiting on a reply</div><div><span class="dash"></span>expected, not there yet</div><div class="keys"><div><kbd>j k</kbd> move through the sidebar, <kbd>h l</kbd> fold and open, <kbd>Enter</kbd> go</div><div><kbd>c</kbd> the comment box</div><div><kbd>Ctrl Enter</kbd> sends, <kbd>Esc</kbd> leaves a field, <kbd>?</kbd> shows this</div></div></div></div>
    </div>
    <div class="player" id="player" hidden></div>
  </main>
  <aside class="log" id="log"><div class="lh" id="lh"></div><div class="conv" id="conv"></div><section class="audit" id="audit" hidden></section></aside>
  <div class="grip" data-pane="side" title="Drag to resize; double-click to reset"></div><div class="grip" data-pane="panel" title="Drag to resize; double-click to reset"></div>
</div>
<div class="card" id="card" hidden></div>
<dialog class="pv" id="pv"></dialog>
<dialog class="dlg" id="ask"></dialog>
<input type="file" id="picker" multiple hidden>
<div id="toasts" popover="manual"></div>
<script>
const $ = s => document.querySelector(s);
const enc = encodeURIComponent;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const usd = n => '$' + n.toFixed(2);
function took(e) {
  const s = Math.round((Date.parse(e.at) - Date.parse(data.log.find(r => r.op === 'run' && r.run === e.run).at)) / 1000);
  return `${s >= 60 ? Math.floor(s / 60) + 'm ' : ''}${s % 60}s`;
}
const when = iso => new Date(iso).toLocaleString([], { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
const hhmm = iso => iso ? new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }) : '';
const fname = f => f.split('/').pop();
function fileUrl(path, kind = 'files') {
  const m = path.match(/^\.\.\/([^/]+)\/(.*)$/), id = m ? cur.s.instances.find(i => i.label === m[1])?.id : cur.i.id;
  return `/${kind}/${id}/${(m ? m[2] : path).split('/').map(enc).join('/')}`;
}
const ext = f => (f && f.includes('.') ? f.split('.').pop() : '').toUpperCase();

let cardPv = null;
// showClosed holds the series, and the workspaces for their Ungrouped tasks, whose closed instances the sidebar lists.
let tree = [], expired = [], myLogins = [], cur = null, data = null, lines = [], linesKey = '', openItem = null, hover = null, showClosed = new Set(), showArchived = false, pv = null, me = null;
let seen = {}, prevSigs = {}, uploads = [], shown = '', refreshes = 0, threads = [];
// Threads with a reply box open: those waiting on people have one anyway, the others once Reply is clicked.
const replying = new Set();
// An item's open threads; a new one shows on its tile as a change.
const talkOn = id => threads.filter(t => t.item === id && !t.resolved);
const sig = i => `${i.file}|${talkOn(i.id).length}|${i.headline ?? ''}`;

function markSeen(items) {
  for (const i of items) seen[i.id] = sig(i);
  localStorage[`seen:${instPath()}`] = JSON.stringify(seen);
}

// Toasts sit in the top layer, shown again for each one, so they come above a dialog that opened since.
function toast(text, kind = '') {
  const el = Object.assign(document.createElement('div'), { className: `toast ${kind}`, textContent: text }), box = $('#toasts');
  box.append(el);
  if (box.matches(':popover-open')) box.hidePopover();

// The side panel opens beside the instance where there's room for both; the audit is closed until asked for. sect holds which of the
// panel's folds are open, where someone opened or closed them; site, which of the run's browsers the player shows, and drive, the
// one you took control of, as instance/site.
const ui = { open: innerWidth > 800, on: null, ref: null, audit: false, sect: {}, site: null, drive: null, sort: {} };
// The process, as the conversation shows it.
let docs = { key: '' };
const drawn = new WeakMap();

function put(el, html) {
  if (drawn.get(el) !== html) el.innerHTML = html;
  drawn.set(el, html);
}

// A call that fails throws the server's words; a toast shows them, unless the caller shows them itself.
async function api(path, opts) {
  const r = await fetch(path, opts);
  const t = await r.text();
  if (r.status === 401) location.reload();
  if (!r.ok) throw new Error(t);
  try { return JSON.parse(t); } catch { return t; }
}
addEventListener('unhandledrejection', e => toast(e.reason?.message ?? String(e.reason)));

// The page's address is #/ID, of an instance, a series or a workspace; cur holds the tree's entries for them.
const seriesPath = c => `/api/series/${c.s.id}`;
const instPath = () => `/api/instances/${cur.i.id}`;
const go = id => { location.hash = '#/' + id; };

// Newest activity first, as in a chat: an instance's latest log entry, now while it runs; a series' newest instance's, and a
// workspace's newest series'. A series' instances keep their labels' order.
const recent = i => i.running ? new Date().toISOString() : i.active, newest = xs => xs.reduce((m, x) => x > m ? x : m, '');
const sAct = s => newest(s.instances.map(recent)), wAct = w => newest(w.series.map(sAct)), byAct = f => (a, b) => (f(b) > f(a)) - (f(b) < f(a));
// How long ago, compactly, as a row's last activity: now, 5m, 3h, 2d, 7w.
const initials = name => {
  const w = name.replace(/^v-/i, '').match(/\p{L}+/gu);
  return (w.length > 1 ? w[0][0] + w[1][0] : w[0].slice(0, 2)).toUpperCase();
};
// A time to come, compactly: its time today, else its day.
const soon = iso => new Date(iso).toDateString() === new Date().toDateString() ? hhmm(iso) : new Date(iso).toLocaleDateString([], { day: 'numeric', month: 'short' });
const ago = iso => {
  const m = (Date.now() - Date.parse(iso)) / 60e3;
  return m < 1 ? 'now' : m < 60 ? `${m | 0}m` : m < 1440 ? `${m / 60 | 0}h` : m < 10080 ? `${m / 1440 | 0}d` : `${m / 10080 | 0}w`;
};

async function refresh() {
  me ??= await api('/me');
  const n = ++refreshes, [t, mine] = await Promise.all([api('/api'), api('/logins')]);
  const id = location.hash.slice(2), all = t.flatMap(w => [[w], ...w.series.flatMap(s => [[w, s], ...s.instances.map(i => [w, s, i])])]);
  let [w, s, i] = all.find(e => e.at(-1).id === id) ?? [t.find(w => !w.archived)];
  s ??= w?.series.filter(s => !s.archived).sort(byAct(sAct))[0];
  i ??= s?.instances.find(i => i.status === 'open') ?? s?.instances.at(-1);
  const path = i ? `/api/instances/${i.id}` : '', [d, st] = path ? await fetchInstance(path) : [null, null];
  if (n !== refreshes) return;
  [tree, expired, myLogins] = [t, mine.filter(l => l.expired), mine];
  land(w && { w, s, i }, path, d, st);
}

// Instances changed: each one's row in the sidebar, and the open one's data. One the sidebar lacks takes a full refresh.
async function patch(ids) {
  const rows = tree.flatMap(w => w.series.flatMap(s => s.instances)), others = ids.filter(id => id !== cur?.i?.id);
  const sums = await Promise.all(others.map(id => api(`/api/instances/${id}/summary`)));
  if (sums.some(x => !rows.some(r => r.id === x.id))) return refresh();
  for (const x of sums) Object.assign(rows.find(r => r.id === x.id), x);
  if (others.length === ids.length) return render();
  const n = ++refreshes, path = shown, [[d, st], sum] = await Promise.all([fetchInstance(path), api(`${path}/summary`)]);
  if (n !== refreshes) return;
  Object.assign(cur.i, sum);
  land(cur, path, d, st);
}

// An instance's data, and its trace while the audit shows and the trace may have moved.
async function fetchInstance(path) {
  const d = await api(path), key = `${path}:${d.log.length}`;
  return [d, ui.audit && (d.run || key !== linesKey) ? [await api(path + '/trace'), key] : null];
}

function land(next, path, d, st) {
  const was = data && path === shown ? lastDone()?.seq ?? 0 : undefined;
  // A new selection opens its rows in the sidebar; from then on only their chevrons fold and open them.
  if (next?.w && next.w.id !== cur?.w.id) expandRow(next.w.id, true);
  if (next?.s && next.s.id !== cur?.s?.id) expandRow(next.s.id, true);
  [cur, data, shown] = [next, d, path];
  if (cur?.i) cur.i.unread = false;
  threads = threadsOf();
  if (st) [lines, linesKey] = st;
  const done = data && lastDone();
  if (done && was !== undefined && done.seq > was) toast(done.error ? `Run ${done.run} failed: ${done.error}` : `Run ${done.run} finished`, done.error ? '' : 'ok');
  render();
}

function render() {
  const qs = tree.filter(w => !w.archived).flatMap(w => w.series.filter(s => !s.archived).flatMap(s => s.instances)).reduce((t, i) => t + i.asks.filter(e => e === me.email).length, 0);
  document.title = `${qs ? `(${qs}) ` : ''}${cur?.i ? cur.i.label + ' \u00b7 ' : ''}${me.brand.text ?? 'rollforward'}`;
  renderBrand();
  renderSide();
  renderBar();
  renderNeeds();
  renderPanes();
  renderAudit();
  renderPlayer();
  renderLog();
  renderCard();
}

// The deployment's brand (rf brand): its logo and text top the sidebar; the text titles the page, and the logo is its icon.
function renderBrand() {

// The sidebar's tree, folded as a file browser's: selecting a row opens it and leaves the others as they were, and its chevron folds
// it. Its menu shows your workspaces, those you own or worked in and the one you're in, or all, and archived ones or not, newest
// activity first or by name. The filter keeps the rows whose names match and what holds them, opened as it goes; a matching
// workspace or series shows its rows as ever.
const expanded = new Set(JSON.parse(localStorage.expanded ?? '[]'));
function expandRow(id, open = !expanded.has(id)) {

}

function renderSide() {
  if (editing) return;
  const listed = (x, on) => !x.archived || showArchived || on, mine = localStorage.workspaces !== 'all' && tree.some(w => w.mine), byName = localStorage.order === 'name';
  const q = $('#find').value.trim().toLowerCase(), hit = name => name.toLowerCase().includes(q), opened = new Set(), shut = id => !expanded.has(id) && !opened.has(id);
  const sorted = (xs, act, name) => [...xs].sort(byName ? (x, y) => name(x).localeCompare(name(y), undefined, { numeric: true }) : byAct(act));
  // A dot on a folded row: red for asks waiting on people, else blue for something new to you.
  const asks = s => !s.archived && s.instances.some(i => i.asks.length), news = s => !s.archived && s.instances.some(i => i.unread);
  const dot = (id, ss) => !shut(id) ? '' : ss.some(asks) ? '<span class="dot"></span>' : ss.some(news) ? '<span class="dot u"></span>' : '';

  const row = i => {
    const st = i.queued ? '\u29D7 queued' : i.asks.length ? `<span class="cnt" title="${i.asks.length} to answer">${i.asks.length}</span>` : i.wakes[0] ? `<span title="${when(i.wakes[0].at)}">wakes ${soon(i.wakes[0].at)}</span>` : i.status === 'open' ? ''
      : i.corrections ? `<span class="corr" title="Read with ${plural(i.corrections, 'correction')}">corrected</span>` : i.status;
    return `<a class="row inst ${i.status} ${cur?.i?.id === i.id ? 'on' : ''}" href="#/${i.id}" title="${esc(i.label)}"><span class="nm ${i.unread ? 'b' : ''}"><span class="l">${esc(i.label)}</span>${i.runner === me.email ? '' : `<span class="who" title="${esc(nameOf(i.runner))} runs it">${esc(initials(me.names[i.runner] ?? i.runner))}</span>`}${i.unread && !i.asks.length ? '<span class="dot u"></span>' : ''}</span><span class="n">${st}</span>${age(i.active, i.running)}</a>`;
  };
  const waits = waiting().length;
  let h = waits ? `<div class="row waits"><a class="nm" data-act="waiting">Waiting on you<span class="q"> ${waits}</span></a></div>` : '';
  let shown = 0;
  for (const w of sorted(tree, wAct, w => w.name)) {
    const won = cur?.w.id === w.id, wHit = !q || hit(w.name);
    if (!listed(w, won) || (mine && !w.mine && !won)) continue;
    // Each series with the instances that match, where only they do.
    const series = sorted(w.series.filter(s => !s.single && listed(s, cur?.s?.id === s.id)), sAct, s => s.name).map(s => [s, wHit || hit(s.name) ? null : s.instances.filter(i => hit(i.label))]).filter(([, found]) => !found || found.length);
    const tasks = sorted(w.series.filter(s => s.single && listed(s, cur?.s?.id === s.id)).flatMap(s => s.instances), recent, i => i.label).filter(i => wHit || hit(i.label));
    if (!wHit && !series.length && !tasks.length) continue;

    if (!wHit) opened.add(w.id);

      + `<span class="n">${w.archived ? 'archived' : ''}</span>${age(wAct(w), w.series.some(s => s.instances.some(i => i.running)))}` + btn('workspace-settings', 'Settings', '\u2699', w.id) + btn('new-task', 'New task', '+', w.id) + '</div>';
    if (shut(w.id)) continue;

  put($('#acct'), `<div class="me" tabindex="0"><span>${esc(me.name)}${me.role === 'user' ? '' : ' · ' + me.role}</span><span class="mail">${esc(me.email)}</span></div>`
    + `<span class="acts2"><button class="add" data-act="logins" title="Logins, tokens${me.role === 'admin' ? ', people' : ''}">\u2699</button><button class="quiet" data-act="signout">Sign out</button></span>`);
}

function lastDone() { return data.log.findLast(e => e.op === 'done'); }

const stepText = s => `${s.do}${s.target ? ` ${s.target}` : ''}${s.value !== undefined ? ` = "${s.value}"` : ''}`;

function renderBar() {
  if (editing) return;

  let h = `<button class="menu" data-act="menu">☰</button>`;

// The runner's chip: Yours, or their name; on hover or a click, what that means, since when, and the logins they ticked.
function owner() {
  const r = data.runner, mine = r.by === me.email, name = mine ? 'You' : person(r.by), e = data.log.findLast(e => ['create', 'duplicate', 'takeover'].includes(e.op));
  const how = { create: 'Made it', duplicate: `Copied it from ${esc(e.from)}`, takeover: `Took it over from ${who(e.from)}` }[e.op];
  return `<span class="owner" tabindex="0">${mine ? 'Yours' : name}<span class="about">`
    + (data.doc.status === 'open' ? `${name} run${mine ? '' : 's'} it: runs use ${mine ? 'your' : 'their'} logins, and only ${mine ? 'you' : 'they'} close it.` : `${name} ran it.`)
    + `<br>${how} ${when(e.at)}.<br>${r.ticked.length ? `Credentials: ${esc(r.ticked.join(', '))}` : 'No credentials ticked.'}</span></span>`
    + (mine && data.doc.status === 'open' ? `<button class="creds" data-act="ticks" title="${esc(r.ticked.join(', '))}">Credentials: ${credentials(r)}</button>` : '');

// The runner's ticks at a glance, by kind, such as "Mail · 2 folders".
function credentials(r) {
  const n = {}, say = { mail: ['Mail', 'mailboxes'], site: ['1 site', 'sites'], folder: ['1 folder', 'folders'], file: ['1 file', 'files'], website: ['1 website', 'websites'], warehouse: ['1 warehouse', 'warehouses'] };
  r.logins.forEach((id, k) => {
    const kind = id.startsWith('m365:mail:') ? 'mail' : id.startsWith('m365:site:') ? 'site' : id.startsWith('m365:') ? (r.ticked[k].startsWith('File ') ? 'file' : 'folder') : id.startsWith('web:') ? 'website' : 'warehouse';
    n[kind] = (n[kind] ?? 0) + 1;
  });
  return Object.entries(n).map(([k, c]) => (c === 1 ? say[k][0] : `${c} ${say[k][1]}`)).join(' \u00b7 ') || 'none';
}

function provenance(file) {
  if (file.startsWith('upload/')) {
    const e = data.log.find(e => e.op === 'upload' && e.file === file);
    return { person: true, by: e?.by ?? 'someone', at: e?.at };
  }
  const e = data.log.find(e => e.op === 'point' && e.file === file);
  return { person: false, by: 'Agent', at: e?.at };
}

function tile(item) {
  const on = talkOn(item.id), open = on.filter(t => t.waits).length, fixed = data.log.some(e => e.op === 'correction' && e.item === item.id);

  const corner = on.length ? `<span class="corner ${open ? 'ask' : ''}"></span>` : '';
  const mark = `${seen[item.id] !== sig(item) ? 'fresh' : ''} ${prevSigs[item.id] && prevSigs[item.id] !== sig(item) ? 'flash' : ''}`;
  if (!item.file) {
    return `<div class="tile ghost ${mark}" data-item="${esc(item.id)}">${corner}<div class="ext"><span>${esc(item.kind.toUpperCase())}</span><span class="nc ${open ? 'q' : ''}">${count}</span></div><div class="fn">${esc(item.name)}</div><div class="meta">${item.kind === 'input' ? 'Missing' : 'Not built yet'}</div></div>`;
  }
  const p = provenance(item.file), sent = data.log.findLast(e => e.op === 'delivered' && e.item === item.id);
  const v = data.log.filter(e => e.op === 'point' && e.item === item.id && e.file).length;
  return `<div class="tile ${p.person ? 'person' : 'agent'} ${openItem === item.id ? 'on' : ''} ${mark}" data-item="${esc(item.id)}">${corner}<div class="ext"><span>${esc(ext(item.file))}${v > 1 ? ' · v' + v : ''}</span><span class="nc ${open ? 'q' : ''}">${count}</span></div><div class="fn">${esc(item.name)}</div><div class="file">${esc(fname(item.file))}</div>${item.headline ? `<div class="hl">${esc(item.headline)}</div>` : ''}${item.source ? `<div class="src">${esc(item.source)}</div>` : ''}${item.destination ? `<div class="dst" title="${esc(item.destination)}">\u2192 ${esc(item.destination)}</div>` : ''}${sent ? `<div class="sent" title="${esc(sent.receipt)}">Sent ${hhmm(sent.at)} to ${esc(sent.to)}</div>` : ''}<div class="meta"><b>${person(p.by)}</b> · ${hhmm(p.at)}</div></div>`;
}

// The instance in three slices: Inputs, Outputs and Steps. On a desktop a toggle, kept in this browser, shows Inputs and Outputs as lists, each sorting by
// the column its heading names; a phone shows tiles, Outputs first.
function renderPanes() {
  $('#outs').hidden = $('#steps').hidden = $('#view').hidden = !data;
  if (!data) return put($('#ins'), `<div class="empty">${cur?.s ? 'No instance yet. Make one with + by the series.' : cur ? 'No series yet. Make one with + by the workspace.' : me.can.includes('create') ? 'No workspace yet. Make one with + by the filter.' : 'No workspace yet: an admin makes one or adds you to one.'}</div>`);
  const open = data.doc.status === 'open', stored = localStorage[`seen:${instPath()}`], items = data.doc.items, list = localStorage.view === 'list' && innerWidth > 800;
  seen = stored ? JSON.parse(stored) : {};
  if (!stored) markSeen(items);
  const ins = items.filter(i => i.kind === 'input'), outs = items.filter(i => i.kind === 'output'), steps = items.filter(i => i.kind === 'step');
  const head = (title, list, pane, count = list.length ? `${list.filter(i => i.file).length} of ${list.length}` : '') => `<div class="ph"><h2>${title}</h2><span class="c">${count}</span>${open && pane ? `<button class="btn" data-act="add" data-pane="${pane}">+ Add files</button>` : ''}</div>`;
  const adding = pane => uploads.filter(u => u.pane === pane && u.path === instPath()).map(u => `<div class="tile ghost"><div class="ext"><span>UPLOADING</span></div><div class="fn">${esc(u.f.name)}</div><div class="prog"><i style="width:${u.pct}%"></i></div></div>`).join('');
  const files = new Set(items.map(i => i.file)), also = new Map();
  for (const t of threads) for (const p of t.posts) for (const f of p.by === 'agent' ? p.files ?? [] : []) if (!files.has(f) && !also.has(f)) also.set(f, t);
  const via = t => t.item ? `on <a data-act="opencard" data-item="${esc(t.item)}">${esc(items.find(i => i.id === t.item)?.name ?? t.item)}</a>` : `in <a data-act="thread" data-thread="${esc(t.id)}">a comment</a>`;
  const alsoUsed = also.size ? `<div class="also"><div class="ah">Also used</div>${[...also].map(([f, t]) => `<div><a data-act="preview" data-file="${esc(f)}">${esc(fname(f))}</a> <span class="via">· cited ${via(t)}</span></div>`).join('')}</div>` : '';
  const body = (pane, xs) => `${list ? listHtml(pane, xs) : ''}<div class="tiles">${list ? '' : xs.map(tile).join('')}${adding(pane)}</div>`;
  $('#panes').classList.toggle('list', list);
  put($('#view'), `<span class="seg">${[['tiles', 'Tiles'], ['list', 'List']].map(([v, name]) => `<button class="${list === (v === 'list') ? 'sel' : ''}" data-act="view" data-id="${v}">${name}</button>`).join('')}</span>`);
  put($('#ins'), head('Inputs', ins, 'in') + body('in', ins) + alsoUsed + (open ? '<div class="hint">Drop files to add them. The agent decides what each one is.</div>' : ''));
  put($('#outs'), head('Outputs', outs, 'out') + body('out', outs) + (open ? '<div class="hint">Drop a revised output here.</div>' : ''));
  put($('#steps'), head('Steps', steps) + `<div class="tiles">${steps.map(tile).join('')}</div>`);
  $('#outs').classList.toggle('busy', !!data.run);
  prevSigs = Object.fromEntries(items.map(i => [i.id, sig(i)]));
  light();
}

// Inputs or Outputs as a dense list: a row an item, in the screen's order until a heading sorts it, a second click reversing it. A row
// with no file yet says only that, as its tile does.
function listHtml(pane, xs) {
  const s = ui.sort[pane], was = data.previous;
  const cols = [['name', 'Name'], ['where', pane === 'in' ? 'Source' : 'Destination'], ['as_of', 'As of'], ['by', 'By'], ['headline', pane === 'in' ? 'Rows · total' : 'Headline'], ['changed', 'Changed'], ['threads', 'Threads']];
  const row = i => {
    const p = i.file && provenance(i.file), on = talkOn(i.id), asks = on.filter(t => t.waits).length;
    return { i, p, on, asks, name: i.name, where: (p && (pane === 'in' ? i.source : i.destination)) ?? '', as_of: (p && i.as_of) ?? '', by: p ? nameOf(p.by) : '', headline: (p && i.headline) ?? '', changed: was?.changed[i.id] ?? '', threads: asks * 1e4 + on.length };
  };
  const rows = xs.map(row);
  if (s) rows.sort((a, b) => s.dir * (typeof a[s.key] === 'number' ? a[s.key] - b[s.key] : String(a[s.key]).localeCompare(String(b[s.key]), undefined, { numeric: true })));
  const tr = r => `<tr class="lrow ${!r.i.file ? 'ghost' : r.p.person ? 'person' : 'agent'} ${openItem === r.i.id ? 'on' : ''} ${seen[r.i.id] !== sig(r.i) ? 'fresh' : ''}" data-item="${esc(r.i.id)}">`
    + `<td><span class="fn">${esc(r.name)}</span>${r.i.file ? `<span class="file">${esc(fname(r.i.file))}</span>` : ''}</td><td>${esc(r.where)}</td><td>${esc(r.as_of)}</td>`
    + `<td>${r.i.file ? `<b>${person(r.p.by)}</b> ${hhmm(r.p.at)}` : r.i.kind === 'input' ? 'Missing' : 'Not built yet'}</td><td>${esc(r.headline)}</td><td>${r.changed}</td>`
    + `<td class="${r.asks ? 'q' : ''}">${r.asks ? `${r.asks} to answer` : r.on.length ? plural(r.on.length, 'comment') : ''}</td></tr>`;
  return `<table class="lst"><tr>${cols.map(([k, name]) => `<th data-act="sort" data-pane="${pane}" data-key="${k}" ${s?.key === k ? `aria-sort="${s.dir > 0 ? 'ascending' : 'descending'}"` : ''} ${k === 'changed' && was ? `title="Since ${esc(was.label)}"` : ''}>${name}</th>`).join('')}</tr>${rows.map(tr).join('')}</table>`;
}

// Hovering a tile or a row marks what it's made from, all the way back.
function light() {
  const up = new Set(), climb = id => { for (const f of data?.doc.items.find(i => i.id === id)?.from ?? []) if (!up.has(f)) { up.add(f); climb(f); } };
  if (hover) climb(hover);
  for (const el of document.querySelectorAll('#panes :is(.tile, .lrow)[data-item]')) el.classList.toggle('made', up.has(el.dataset.item));
}

const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
// People by name, with their email on hover, and Entra groups by label, with their id; a name that two of them share, with the email
// or id beside it, so no one passes for another; anyone the page has no name for, as they are. who and nameOf say you, and Agent;
// actor names the agent as its runner's at the time, on whose behalf it acted.
const called = id => Object.values(me.names).filter(n => n === me.names[id]).length > 1 ? `${me.names[id]} <${id}>` : me.names[id];
const person = id => me.names[id] ? `<span title="${esc(id)}">${esc(called(id))}</span>` : esc(id);
const who = id => id === 'agent' ? 'Agent' : id === me.email ? 'you' : person(id);
const nameOf = id => id === 'agent' ? 'Agent' : id === me.email ? 'you' : me.names[id] ? called(id) : id;
const actor = (by, at) => {
  const r = by === 'agent' && data.log.findLast(x => x.at <= at && ['create', 'duplicate', 'takeover'].includes(x.op)).by;
  return by === 'server' ? '<span class="w">Server</span>' : `<span class="w p" title="${esc(r ? `Acting for ${r}` : by)}">${esc(r ? (r === me.email ? 'Your agent' : `${nameOf(r)}'s agent`) : by === me.email ? 'You' : nameOf(by))}</span>`;
};
const shotsHtml = es => `<div class="shots">${es.map(e => `<img src="${fileUrl(e.file)}" loading="lazy" alt="" title="${esc(e.site)} \u00b7 ${hhmm(e.at)}" data-act="preview" data-file="${esc(e.file)}">`).join('')}</div>`;

function logText(e) {
  const w = actor(e.by, e.at);
  const item = id => esc(data.doc.items.find(i => i.id === id)?.name ?? id);
  const f = e.file ? `<div class="f"><a data-act="preview" data-file="${esc(e.file)}">${esc(e.file)}</a></div>` : '';
  return {
    create: () => `${w} opened the instance`,
    upload: () => `${w} uploaded ${e.pane === 'out' ? 'an output' : 'an input'}${e.onto ? ' onto ' + item(e.onto) : ''}${f}`,
    point: () => `${w} ${e.file ? 'showed' : 'cleared'} ${item(e.item)}${e.was ? `<div class="d">Replacing ${esc(fname(e.was))}</div>` : ''}${f}`,
    item: () => `${w} set up ${esc(e.name)}${e.from?.length ? `<div class="d">From ${e.from.map(item).join(', ')}</div>` : ''}${e.headline ? `<div class="d">${esc(e.headline)}</div>` : ''}${e.source ? `<div class="d">Source: ${esc(e.source)}</div>` : ''}${e.destination ? `<div class="d">Destination: ${esc(e.destination)}</div>` : ''}${e.as_of ? `<div class="d">As of ${esc(e.as_of)}</div>` : ''}`,
    remove: () => `${w} removed ${esc(e.item)} from the screen`,
    run: () => `Run ${e.run} started${data.run?.n === e.run ? ` \u00b7 ${usd(data.run.cost)} so far` : ''}`,
    done: () => `Run ${e.run} finished${e.aborted ? ' (stopped)' : ''} · ${took(e)} · ${usd(e.cost)}${e.error ? `<div class="d">${esc(e.error)}</div>` : ''}`,
    interrupt: () => `${w} interrupted the run`,
    close: () => `${w} closed the instance${e.accepted ? `<div class="d">Accepting what the agent did for ${e.accepted.length} ask${e.accepted.length > 1 ? 's' : ''} still waiting</div>` : ''}${e.commit ? `<div class="d">Commit <code>${e.commit.slice(0, 7)}</code></div>` : ''}`,
    signoff: () => `${w} ${e.approved === false ? 'rejected the sign-off' : 'signed off'}<div class="d">${e.text ? `${esc(e.text)} · ` : ''}Commit <code>${e.commit.slice(0, 7)}</code></div>`,
    commit: () => e.error ? `Run ${e.run}'s changes weren't committed<div class="d">${esc(e.error)}</div>` : `${w} committed the folder<div class="d">${esc(e.message)} · Commit <code>${e.commit.slice(0, 7)}</code></div>`,
    abandon: () => `${w} abandoned the instance`,
    correction: () => `${w} marked ${e.item ? item(e.item) : 'the instance'}${e.ref ? ` at ${esc(e.ref)}` : ''} ${e.kind}<div class="d">${esc(e.text)}${seeHtml(e.see)}</div>`,
    corrected: () => `${w} marked <a href="#/${esc(e.inst)}">${esc(e.label)}</a>${e.item ? ` ${esc(e.item)}` : ''} ${e.kind}`,
    comment: () => `${w} ${e.note ? `left a note for ${who(data.runner.by)}` : e.by !== 'agent' ? 'commented' : e.ask ? `asked${e.to ? ' ' + who(e.to) : ''}` : 'said'}${e.item ? ` on ${item(e.item)}${e.ref ? ` at ${esc(e.ref)}` : ''}` : ''}<div class="d">${esc(e.text)}</div>`,
    resolve: () => `${w} resolved a thread${e.text ? `<div class="d">${esc(e.text)}</div>` : ''}`,
    wake: () => `${e.note ? `${person(e.from)} would wake it: a note for ${who(data.runner.by)}` : `Woken${e.from ? ` by ${who(e.from)}` : ''}`}${e.reason ? `<div class="d">${esc(e.reason)}</div>` : ''}`,
    expired: () => e.left ? `${who(e.runner)} has left: Microsoft no longer signs them in, so someone takes the instance over` : `Waiting for ${who(e.runner)} ${e.login === 'openrouter' ? 'to save another OpenRouter key, or stop using their own, out of credits' : `to sign in to ${esc(e.name ?? (e.login === 'm365' ? 'Microsoft 365' : e.login))} again`}${e.runner === me.email && !data.log.some(x => x.seq > e.seq && x.op === 'wake' && x.login === e.login) ? `<div>${signInHtml(e.login, e.name ?? e.login)}</div>` : ''}`,
    takeover: () => `${w} took over from ${who(e.from)}${e.logins?.length ? `<div class="d">Logins: ${esc(e.logins.join(', '))}</div>` : ''}`,
    promote: () => `${w} made it a series, ${esc(e.series)}`,
    logins: () => `${w} ticked logins: ${esc(e.logins.join(', ') || 'none')}`,
    egress: () => `Run ${e.run} ${e.allowed ? 'reached' : 'was refused'} ${esc(e.host)}`,
    delivered: () => `${w} delivered ${item(e.item)} to ${esc(e.to)}<div class="d">${{ graph: 'Through Microsoft 365 · ', website: 'Through a website · ' }[e.via] ?? ''}${esc(e.receipt)}</div>`,
    send: () => `${w} sent ${esc(e.method)} ${esc(e.path)} to ${esc(e.name)}, with no answer logged`,
    call: () => `${w} ${e.model ? `asked ${esc(e.model)}` : `called ${esc(e.name)}: ${esc(e.method)} ${esc(e.path)}`}${e.cost ? ` \u00b7 $${e.cost.toFixed(4)}` : ''}${e.refused || e.failed ? `, ${e.refused ? 'refused' : 'failed'}<div class="d">${esc(e.refused ?? e.failed)}</div>` : e.status >= 300 ? `, which answered ${e.status}` : ''}`,
    graph: () => `${w} ${e.method ? `sent ${esc(e.method)} ${esc(e.path)} to` : `read ${esc(e.path)} from`} Microsoft 365${e.status >= 300 ? `, which answered ${e.status}` : ''}${e.to && e.to !== e.path ? `<div class="d">${esc(e.to)}</div>` : ''}${[e.body, e.file].filter(Boolean).map(f => `<div class="f"><a data-act="preview" data-file="${esc(f)}">${esc(f)}</a></div>`).join('')}`,
    move: () => `Moved from ${esc(e.from)} to ${esc(e.to)}, ${who(e.accepted_by)} accepting`,
    rename: () => e.by === 'server' ? `Named by its first prompt, from ${esc(e.from)}` : `${w} renamed the instance from ${esc(e.from)}`,
    duplicate: () => `${w} made this instance as a copy of ${esc(e.from)}`,
    browser: () => e.action === 'get' ? `${w} fetched ${esc(e.from)} from the browser on ${esc(e.site)}${f}`
      : e.action === 'wait' ? `Run ${e.run} waits for ${person(e.login)}'s ${esc(e.site)} browser, held by ${esc(e.held)}`
      : e.action === 'refused' ? `Run ${e.run} goes on without ${esc(e.site)}<div class="d">${esc(e.why)}</div>`
      : e.action === 'drive' ? `${w} took control of run ${e.run}'s browser on ${esc(e.site)}` : `${w} closed run ${e.run}'s browser${e.site ? ` on ${esc(e.site)}, in ${person(e.login)}'s login` : ''}<div class="d">${e.error ? esc(e.error) : `${e.requests} requests${e.writes ? `, ${e.writes} writes` : ''}${e.blocked ? `, ${e.blocked} blocked` : ''}`}</div>${f}`,
    shot: () => `Run ${e.run}'s browser on ${esc(e.site)}${shotsHtml([e])}`,
    browsers: () => `Run ${e.run}'s browsers did not all close<div class="d">${esc(e.error)}</div>`,
  }[e.op]?.() ?? `${w} ${esc(e.op)}`;
}

// What this instance waits on you for, above it: the threads that wait on you, an ask or a note, and your logins that
// expired under it. Most of the time there is nothing.
function renderNeeds() {
  const held = new Map(data?.log.filter(e => e.op === 'expired' && e.runner === me.email && !data.log.some(x => x.seq > e.seq && x.op === 'wake' && x.login === e.login)).map(e => [e.login, e]));
  const h = (data ? threads.filter(t => t.waits === me.email) : []).map(t => `<div><b>${t.last.note ? 'Note' : 'Ask'}</b><span>${esc(firstLine(t.last.text))}</span>`
    + `<button class="btn" data-act="thread" data-thread="${esc(t.id)}">Reply</button></div>`).join('')
    + [...held.values()].map(e => `<div><b>Login</b><span>${e.login === 'openrouter' ? 'Your OpenRouter key is out of credits' : `Your ${esc(e.name)} login has expired`}: this instance waits for it</span>${signInHtml(e.login, e.name)}</div>`).join('');
  $('#needs').hidden = !h;
  put($('#needs'), h);
  // A closed instance is read with the corrections it took since: what was wrong in it, or what superseded it, and where.
  const cs = data?.log.filter(e => e.op === 'correction') ?? [];
  $('#corrs').hidden = !cs.length;
  put($('#corrs'), `<b class="corr">Read with corrections (${cs.length})</b>` + cs.map(e => `<div><span><b>${e.item ? esc(data.doc.items.find(i => i.id === e.item)?.name ?? e.item) : 'The instance'}</b>`
    + `${e.ref ? ` at ${esc(e.ref)}` : ''} is ${e.kind}: ${esc(e.text)}${seeHtml(e.see)}</span><span class="by">${who(e.by)} \u00b7 ${when(e.at)}</span></div>`).join(''));
}

// Where a correction says the change is: a later instance, by its label then, and its thread.
const seeHtml = see => see ? ` \u00b7 see <a href="#/${esc(see.inst)}">${esc(see.label)}</a>${see.thread ? ` ${esc(see.thread)}` : ''}` : '';

function renderLog() {
  // Either side opens at its latest, as the panel does, and keeps there as posts come, unless the reader has scrolled up.
  if (ui.open && data && !$('#log').classList.contains('open')) $('#log').dataset.end = 'yes';
  $('#log').className = 'log' + (ui.open && data ? ' open' : '');
  if (!data || !ui.open) return;
  const key = `${cur.i.id}:${data.doc.rev}:${lastDone()?.seq}`;
  if (docs.key !== key) loadDocs(key);
  // A half-written comment or reply, or files picked for one, holds the conversation still until it's sent or cleared.
  const drafting = [...$('#conv').querySelectorAll('textarea')].some(t => t.value.trim()) || [...$('#conv').querySelectorAll('input[type=file]')].some(f => f.files.length);
  const focused = document.activeElement?.id === 'newcomment';
  // Its two sides, the conversation and the audit, one shown at a time: a half-written comment waits on the other's.
  put($('#lh'), `<span class="seg">${[['Conversation', !ui.audit], ['Audit', ui.audit]].map(([side, on]) => `<button class="${on ? 'sel' : ''}" ${on ? '' : 'data-act="audit"'}>${side}</button>`).join('')}</span>`
    + '<button class="x" data-act="panel" title="Close">\u00D7</button>');
  $('#conv').hidden = ui.audit;
  if (!drafting) put($('#conv'), conversationHtml());
  if (!ui.audit && $('#log').dataset.end !== 'no') $('#log').scrollTop = $('#log').scrollHeight;
  // Only on the instance it's for: a render for the one before, as the page catches up, leaves it. The box keeps the focus it had.
  if (focused) $('#newcomment')?.focus();
  if (ui.focus !== cur.i.id) return;
  $('#newcomment')?.focus();
  ui.focus = false;
}

// The audit, the panel's other side: the log and the agent's session, oldest first, one plain line each.
function renderAudit() {
  $('#audit').hidden = !(ui.audit && data);
  if ($('#audit').hidden) return;
  const res = s => s.result === undefined ? (data.run ? '<span class="spin"></span>' : 'no result') : s.error ? `<span class="bad">${esc(firstLine(s.result) || 'failed')}</span>`
    : s.kind === 'read' ? `${s.lines} lines` : firstLine(s.result) ? esc(firstLine(s.result)) + (s.lines > 1 ? ` +${s.lines - 1} lines` : '') : 'no output';
  const steps = lines.filter(s => s.kind !== 'user').map(s => ({ at: s.at, html: s.kind === 'say' ? `${actor('agent', s.at)} said ${esc(firstLine(s.text))}`
    : `<b>${VERB[s.kind] ?? esc(s.kind)}</b> <code>${esc(firstLine(s.kind === 'bash' ? s.text : s.text.split(`/${cur.s.name}/`).pop()))}</code> \u23BF ${res(s)}` }));
  const rows = [...data.log.map(e => ({ at: e.at, html: logText(e) })), ...steps].sort((a, b) => Date.parse(a.at) - Date.parse(b.at));
  const runs = data.log.filter(e => e.op === 'run').length, cost = data.log.reduce((t, e) => t + (e.op === 'done' ? e.cost : 0), 0) + (data.run?.cost ?? 0);
  put($('#audit'), `<div class="sub">${plural(runs, 'run')}, ${usd(cost)}</div>` + rows.map(r => `<div class="e"><span class="tm">${hhmm(r.at)}</span><div>${r.html}</div></div>`).join(''));
  if ($('#log').dataset.end !== 'no') $('#log').scrollTop = $('#log').scrollHeight;
}

// A run's browser, live while it's open, for anyone who sees the instance to watch, but on a website that lists its people only for
// them: one at a time, the others a click away, folded or open as the person last left it, in this browser. Stop browser interrupts
// the run, which closes its browsers. The person whose login it's in may take control of it, popped over the page with an orange
// border until they give it back, it closes or they go to another instance.
function renderPlayer() {
  const sites = data?.run?.browsers ?? [], site = sites.includes(ui.site) ? ui.site : sites[0], folded = localStorage.player === 'folded';
  if (!data?.run?.yours.includes(site) || ui.drive !== `${cur.i.id}/${site}`) ui.drive = null;
  const drive = !!ui.drive;
  $('#player').hidden = !site;
  $('#player').classList.toggle('drive', drive);
  // Emptied as it hides, so a browser opened again is a new view.
  put($('#player'), !site ? '' : `<div class="plh"><b>Run ${data.run.n}'s browser</b>${sites.length > 1 && !drive ? `<span class="seg">${sites.map(s => `<button class="${s === site ? 'sel' : ''}" data-act="watch" data-site="${esc(s)}">${esc(s)}</button>`).join('')}</span>` : `<span>on ${esc(site)}${drive ? ', in your control' : ''}</span>`}`
    + (drive ? '<button class="quiet" data-act="drive">Give back control</button></div>'
      : `${data.run.yours.includes(site) ? `<button class="quiet" data-act="drive" data-site="${esc(site)}" title="Pops it over the page for you to use, in your login, while the run goes on">Take control</button>` : ''}`
        + `<button class="quiet" data-act="interrupt" title="Interrupts the run, which closes its browsers">Stop browser</button><button class="x" data-act="player" title="${folded ? 'Open' : 'Fold'}">${folded ? '\u25B4' : '\u25BE'}</button></div>`)
    + (folded && !drive ? '' : `<iframe src="/runs/${cur.i.id}/${enc(site)}/view?${drive ? 'drive' : 'watch'}" title="Run ${data.run.n}'s browser on ${esc(site)}"></iframe>`));
}

// The audit shows with the session's steps, fetched for it.
async function toggleAudit() {
  ui.audit = !ui.audit;
  if (ui.audit) [lines, linesKey] = [await api(instPath() + '/trace'), `${instPath()}:${data.log.length}`];
  $('#log').dataset.end = 'yes';
  renderLog();
  renderAudit();
}

const VERB = { read: 'Read', bash: 'Ran', edit: 'Edited', write: 'Wrote' };
const firstLine = t => t.trim().split('\n')[0];
// An image in the agent's markdown, ![name](working/x.png), by its path in the instance, shows as a thread's file does.
const inline = s => s.replace(/!\[([^\]]*)\]\(([^)\s&]+\.(?:png|jpe?g|gif|webp|svg))\)/gi, (_, alt, f) => `<img class="md" src="${fileUrl(f)}" loading="lazy" alt="${alt}" title="${alt}" data-act="preview" data-file="${f}">`)
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');

// With an item's threads, each line but a heading or a table's is a point to comment on where it stands: a
// thread there names it by its opening words, its ref, and marks it.
function md(text, threads) {
  let h = '', rows = [];
  const table = () => { if (rows.length) h += `<table>${rows.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</table>`; rows = []; };
  for (const raw of text.split('\n')) {
    const l = esc(raw);
    if (l.trim().startsWith('|')) { if (!/^[\s|:-]+$/.test(l)) rows.push(l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim())); continue; }
    table();
    const line = inline(l.replace(/^(\s*)[-*] /, '$1\u2022 ').replace(/^#+ (.*)/, '<b>$1</b>')), point = threads && !/^\s*(#|$)/.test(raw) && raw.replace(/^\s*(?:[-*+]|\d+[.)])\s+/, '').replace(/\*\*|`/g, '').trim();
    if (!point) { h += line + '\n'; continue; }
    const ref = point.length > 60 ? point.slice(0, 60).replace(/\s+\S*$/, '') + '\u2026' : point, on = threads.filter(t => t.ref && point.startsWith(t.ref.replace(/\u2026$/, '')));
    h += `<span class="pt ${on.length ? 'noted' : ''} ${on.some(t => t.waits) ? 'q' : ''}" data-act="cell" data-ref="${esc(ref)}"${on.length ? ` data-thread="${esc(on[0].id)}" data-note="${esc(on.map(t => t.posts.map(p => `${nameOf(p.by)}: ${p.text}`).join('\n')).join('\n\n'))}"` : ''}>${line}</span>\n`;
  }
  table();
  return h.trimEnd();
}
// The process, the instance's working/process.md, redlined against the series' latest closed instance before it by label.
async function loadDocs(key) {
  // The instance's own, until they're read again, as after a run; another's never.
  docs = docs.key.startsWith(`${cur.i.id}:`) ? { ...docs, key } : { key };
  const prev = cur.s.instances.filter(i => i.status === 'closed' && i.label < cur.i.label).map(i => i.label).sort().at(-1);
  const get = async path => { const r = await fetch(fileUrl(path)); return r.ok ? r.text() : ''; };
  const [now, was] = await Promise.all([get('working/process.md'), prev ? get(`../${prev}/working/process.md`) : '']);
  if (docs.key !== key) return;
  // Until this instance's agent writes its own, the process is still the one before it.
  const lines = now ? redline(was, now) : redline('', was), changed = lines.some(([k]) => k);
  docs = {
    key, changed,
    process: (now || was) && `<div class="sub">${!now ? `As of ${esc(prev)}, until the agent updates it here.` : prev ? (changed ? `Changes since ${esc(prev)} are marked.` : `Unchanged since ${esc(prev)}.`) : 'The series\' first process.'}</div>`
      + `<div class="proc">${lines.map(([k, l]) => `<div class="${k}">${md(l) || '&nbsp;'}</div>`).join('')}</div>`,
  };
  renderLog();
}

function redline(a, b) {
  const x = a ? a.split('\n') : [], y = b ? b.split('\n') : [], n = x.length, m = y.length;
  const L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = x[i] === y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = [];
  for (let i = 0, j = 0; i < n || j < m;) {
    if (i < n && j < m && x[i] === y[j]) { out.push(['', y[j]]); i++; j++; }
    else if (j < m && (i === n || L[i][j + 1] >= L[i + 1][j])) out.push(['ins', y[j++]]);
    else out.push(['del', x[i++]]);
  }
  return a ? out : out.map(([, l]) => ['', l]);
}

// Threads from the log: a comment starts one, on an item (at a ref) or the instance, and later comments reply in it. In an open
// instance it waits on a person while its last word is the agent's ask, on whom the ask names or else the runner, and on the
// agent while its last word is a person's. A file a run cited is kept by its instance's id, and shown by that instance's label now.
function threadsOf() {
  const out = new Map(), open = data?.doc.status === 'open';
  for (const e of data?.log ?? []) {
    if (!['comment', 'resolve', 'signoff'].includes(e.op)) continue;
    if (!out.has(e.thread)) out.set(e.thread, { id: e.thread, item: e.item, ref: e.ref, posts: [] });
    const t = out.get(e.thread);
    if (e.op === 'comment') t.posts.push({ ...e, pinned: e.files?.some(f => f.sha256), files: e.files?.map(f => !f.inst ? f : f.inst === cur.i.id ? f.path : `../${cur.s.instances.find(i => i.id === f.inst)?.label}/${f.path}`) });
    if (e.op === 'signoff') t.posts.push({ ...e, text: `${e.approved === false ? 'Rejected' : 'Signed off'}${e.text ? `: ${e.text}` : ''}` });
    t.last = e;
  }
  for (const t of out.values()) Object.assign(t, {
    resolved: t.last.op === 'resolve',
    waits: open && (t.last.ask || t.last.note) ? t.last.to ?? data.runner.by : null,
    pending: open && t.last.op !== 'resolve' && t.last.by !== 'agent' && !t.last.note,
  });
  return [...out.values()];
}

const place = t => t.item ? `On <a data-act="opencard" data-item="${esc(t.item)}">${esc(data.doc.items.find(i => i.id === t.item)?.name ?? t.item)}</a>${t.ref ? ` at ${esc(t.ref)}` : ''}` : 'On the instance';

function threadHtml(t) {
  // The ask a sign-off here signs: the agent's latest that pins files, while this person hasn't signed it off.
  const off = data.run ? ' disabled title="Available when the run ends"' : '', ask = t.posts.findLast(p => p.ask && p.pinned);
  const signs = ask && !t.posts.some(p => p.op === 'signoff' && p.on === ask.seq && p.by === me.email);
  const state = t.waits ? ` \u00b7 waits on ${who(t.waits)}` : t.pending ? ' \u00b7 <span class="spin"></span> the agent picks it up next' : t.resolved ? ` \u00b7 resolved by ${who(t.last.by)}${t.last.text ? `: ${esc(t.last.text)}` : ''}` : '';
  return `<div class="thread ${t.resolved ? 'resolved' : ''} ${t.waits ? 'waits' : ''}" data-thread="${esc(t.id)}"><div class="on">${place(t)}${state}</div>`
    + data.log.filter(e => e.op === 'done' && e.rules && e.thread === t.id).map(processNote).join('')
    + t.posts.map(p => `<div class="post ${p.ask ? 'ask' : ''}"><b class="${p.by === 'agent' ? '' : 'p'}">${who(p.by)}</b> <span class="tm">${hhmm(p.at)}${p.to ? ` \u00b7 to ${who(p.to)}` : ''}${p.note ? ` \u00b7 a note for ${who(data.runner.by)}` : ''}${p.commit ? ` \u00b7 commit <code>${p.commit.slice(0, 7)}</code>` : ''}</span><div>${p.by === 'agent' ? md(p.text) : esc(p.text)}</div>${(p.files ?? []).map(f => `<div class="f">${/\.(png|jpe?g|gif|webp|svg)$/i.test(f) ? `<img src="${fileUrl(f)}" loading="lazy" alt="${esc(fname(f))}" title="${esc(fname(f))}" data-act="preview" data-file="${esc(f)}">` : `<a data-act="preview" data-file="${esc(f)}">${esc(fname(f))}</a>`}</div>`).join('')}</div>`).join('')
    + (data.doc.status !== 'open' || t.resolved ? ''
      : t.waits || replying.has(t.id) || signs ? `<textarea rows="2" placeholder="${signs ? 'Reply, or a note to sign off with' : 'Reply'}"></textarea><input type="file" multiple><div class="row2"><button class="btn" data-act="reply-thread" data-thread="${esc(t.id)}">Reply</button>${signs ? `<button class="btn commit" data-act="signoff" data-thread="${esc(t.id)}"${off} title="Commits the instance as it is now in your name, with the files the ask pins as it pinned them">Sign off</button>` : ''}<button class="btn" data-act="resolve" data-thread="${esc(t.id)}" title="Done with it, without waking the agent">Resolve</button></div>`
      : `<div class="row2"><button class="quiet" data-act="thread" data-thread="${esc(t.id)}">Reply</button><button class="quiet" data-act="resolve" data-thread="${esc(t.id)}" title="Done with it, without waking the agent">Resolve</button></div>`) + '</div>';
}

// The rules a run added to the process, or reworded, on the thread whose entry started it, or else on its line.
const processNote = d => `<div class="pnote"><a data-act="process">Process: +${plural(d.rules, 'rule')}</a> in run ${d.run}</div>`;

// A run, as one line among the threads: how it ended, how long it took and what it cost, opening to why it failed.
function runHtml(r, latest) {
  const d = data.log.find(e => e.op === 'done' && e.run === r.run);
  const line = `Run ${r.run} \u00b7 ${!d ? `<span class="spin"></span> going \u00b7 ${usd(data.run?.cost ?? 0)}` : `${d.error ? '<span class="bad">failed</span>' : d.aborted ? 'stopped' : 'done'} \u00b7 ${took(d)} \u00b7 ${usd(d.cost)}`}`;
  const body = (d?.error ? `<div class="post bad">${esc(d.error)}</div>` : '') + (d?.rules && !d.thread ? processNote(d) : '');
  return body ? `<details class="runl" data-key="run${r.run}" ${ui.sect[`run${r.run}`] ?? latest ? 'open' : ''}><summary>${line}</summary>${body}</details>` : `<div class="runl">${line}</div>`;
}

// The conversation, as a chat reads: the process, open for the runner, folded for others; the threads and the
// runs among them, oldest first, a thread where its last word is and a run where it ended; and at the panel's foot, kept there as it
// scrolls, the box to comment on the instance.
function conversationHtml() {
  const open = data.doc.status === 'open', name = id => esc(data.doc.items.find(i => i.id === id)?.name ?? id), mine = data.runner.by === me.email;
  const fold = (key, head, body) => `<details class="sect" data-key="${key}" ${ui.sect[key] ?? mine ? 'open' : ''}><summary>${head}</summary>${body}</details>`;
  const moved = data.log.findLast(e => e.op === 'move'), runs = data.log.filter(e => e.op === 'run');
  let h = moved ? `<div class="sub">Moved ${when(moved.at)} from ${esc(moved.from)} to ${esc(moved.to)}, ${who(moved.accepted_by)} accepting.</div>` : '';
  if (docs.process) h += fold('process', `<b>Process</b>${docs.changed ? ' \u00b7 changed' : ''}`, docs.process);
  const ended = r => data.log.find(e => e.op === 'done' && e.run === r.run)?.seq ?? Infinity;
  h += [...threads.map(t => [t.last.seq, threadHtml(t)]), ...runs.map(r => [ended(r), runHtml(r, r === runs.at(-1))])].sort((a, b) => a[0] - b[0]).map(([, x]) => x).join('');
  // Before its first run, its runner may tick its logins anew where they write its first prompt.
  const first = mine && !runs.length, lends = first && myLogins.some(l => l.offers.length);
  if (open) h += `<div class="compose"><h3>${ui.on ? `Comment on ${name(ui.on)}${ui.ref ? ` at ${esc(ui.ref)}` : ''}` : 'Comment on the instance'}</h3>`
    + (lends ? `<div class="ticks2">Credentials:${ticksHtml(myLogins, data.runner.logins)}</div>` : '')
    + `<textarea id="newcomment" rows="3" placeholder="${first ? 'What should the agent do? Drop files here too' : mine || cur.s.shared_by === data.runner.by ? 'The agent replies in the thread' : `A note for ${esc(nameOf(data.runner.by))}: the agent takes it up once they do`}"></textarea><input type="file" id="newfiles" multiple>${lends ? '<div class="consent">By clicking Comment, you agree that agents carry these credentials while acting as you.</div>' : ''}<div><button class="btn primary" data-act="comment">Comment</button></div></div>`;
  if (data.doc.status === 'closed') h += '<div class="compose"><div><button class="btn" data-act="correct">Add a correction</button></div></div>';
  return h;
}

function renderCard() {

  if (wide) h += `<div class="cpv">${cardPv.att ? `<div class="sub"><a data-act="attachment-back">\u2190 ${esc(cardPv.title)}</a> \u00b7 ${esc(cardPv.att.title)}</div>` : ''}${previewBody(cardPv.att ?? cardPv)}</div>`
    + `<div class="full"><a data-act="preview" data-file="${esc(item.file)}" data-item="${esc(item.id)}">Open full</a></div>`;

      + (p.files?.length ? `<div class="cites">${p.files.map(f => `<a data-act="preview" data-file="${esc(f)}">${esc(fname(f))}</a>`).join('')}</div>` : '')
      + `<div class="by">${more ? `${more} repl${more > 1 ? 'ies' : 'y'} \u00b7 ` : ''}${t.waits ? `Waits on ${who(t.waits)} \u00b7 ` : t.pending ? '<span class="spin"></span> the agent picks it up next \u00b7 ' : ''}<a data-act="thread" data-thread="${esc(t.id)}">${open ? 'Reply' : 'Open'}</a></div></div>`;
