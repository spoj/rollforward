function placeCard() {
  const card = $('#card'), t = !card.hidden && document.querySelector(`:is(.tile, .lrow)[data-item="${CSS.escape(openItem)}"]`);
  if (!t || innerWidth <= 800) return;
  const r = t.getBoundingClientRect(), w = card.offsetWidth, ch = card.offsetHeight;
  const right = r.right + 10 + w < innerWidth, left = !right && r.left - 10 - w >= 8;
  card.style.left = (right ? r.right + 10 : left ? r.left - 10 - w : Math.max(8, Math.min(r.left, innerWidth - w - 8))) + 'px';
  card.style.top = Math.max(8, Math.min(right || left ? r.top : r.bottom + 8, innerHeight - ch - 8)) + 'px';
}

const colName = c => (c >= 26 ? colName(Math.floor(c / 26) - 1) : '') + String.fromCharCode(65 + c % 26);
const num = v => v.toLocaleString(undefined, { maximumFractionDigits: 2 });

const cellText = v => v == null ? '' : typeof v === 'object' ? v.f : typeof v === 'number' ? num(v) : v;

function sheetTable(p, s, first) {
  const noted = new Map(), asks = new Set(), at = new Map();
  for (const t of p.threads ?? []) {
    const r = (t.ref ?? '').match(/^(?:'?([^'!]+)'?!)?\$?([A-Z]{1,3})\$?(\d+)/);
    if (!r || (r[1] ? r[1] !== s.name : !first)) continue;
    const key = `${+r[3] - 1},${[...r[2]].reduce((t, ch) => t * 26 + ch.charCodeAt(0) - 64, 0) - 1}`;
    noted.set(key, (noted.has(key) ? noted.get(key) + '\n\n' : '') + t.posts.map(p => `${nameOf(p.by)}: ${p.text}`).join('\n'));
    at.set(key, t.id);
    if (t.waits) asks.add(key);
  }
  const old = p.cmp && oldOf(p);
  const rows = Array.from({ length: Math.max(s.rows.length, old?.rows.length ?? 0) }, (_, r) => s.rows[r] ?? []);
  const width = Math.max(0, ...rows.map(r => r.length), ...(old?.rows ?? []).map(r => r.length));
  // As the workbook shows it: its number formats, bold, font colours and fills, column widths, merged cells, and no hidden rows or
  // columns.
  const look = s.look ?? {}, hidden = { rows: new Set(s.hidden?.rows), cols: new Set(s.hidden?.cols) }, span = new Map(), covered = new Set();
  const cols = Array.from({ length: width }, (_, c) => c).filter(c => !hidden.cols.has(c));
  for (const [r1, c1, r2, c2] of s.merged ?? []) {
    for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) if (r > r1 || c > c1) covered.add(`${r},${c}`);
    span.set(`${r1},${c1}`, [rows.slice(r1, r2 + 1).filter((_, k) => !hidden.rows.has(r1 + k)).length, cols.filter(c => c >= c1 && c <= c2).length]);
  }
  let h = `<table class="sh"><colgroup><col>${cols.map(c => s.widths?.[c] ? `<col style="width:${Math.round(s.widths[c] * 7 + 5)}px">` : '<col>').join('')}</colgroup>`
    + `<tr><th></th>${cols.map(c => `<th>${colName(c)}</th>`).join('')}</tr>`;
  rows.forEach((row, r) => {
    if (hidden.rows.has(r)) return;
    h += `<tr><td class="rn">${r + 1}</td>`;
    for (const c of cols) {
      if (covered.has(`${r},${c}`)) continue;
      const v = row[c], was = old?.rows[r]?.[c] ?? null, lk = look[`${r},${c}`] ?? {}, sp = span.get(`${r},${c}`);
      const changed = old && JSON.stringify(was) !== JSON.stringify(v ?? null);
      const note = [noted.get(`${r},${c}`), changed ? `Was: ${cellText(was) || '(empty)'}` : ''].filter(Boolean).join('\n\n');
      const cls = `${typeof v === 'number' || lk.r ? 'num' : ''} ${v && typeof v === 'object' ? 'fx' : ''} ${noted.has(`${r},${c}`) ? 'noted' : ''} ${asks.has(`${r},${c}`) ? 'q' : ''} ${changed ? 'chg' : ''}`.trim();
      const style = `${lk.b ? 'font-weight:600;' : ''}${lk.fg ? `color:${lk.fg};` : ''}${lk.bg && !changed ? `background:${lk.bg};` : ''}`;
      h += `<td${cls ? ` class="${cls}"` : ''}${sp ? ` rowspan="${sp[0]}" colspan="${sp[1]}"` : ''}${style ? ` style="${esc(style)}"` : ''} data-act="cell" data-ref="${esc(`${s.name}!${colName(c)}${r + 1}`)}"${note ? ` data-note="${esc(note)}"` : ''}${at.has(`${r},${c}`) ? ` data-thread="${esc(at.get(`${r},${c}`))}"` : ''}>${esc(lk.t ?? cellText(v))}</td>`;
    }
    h += '</tr>';
  });
  return h + '</table>' + (s.truncated ? `<div class="empty">Showing the first ${s.rows.length} rows.</div>` : '');
}

function renderPv() {
  const d = $('#pv');
  if (!pv) return void (d.open && d.close());
  d.className = 'pv' + (pv.settings ? ' small' : '');
  let h = `<div class="pvh"><b>${esc(pv.title)}</b><span class="saved"></span>${pv.sheets && /\.(xlsx|xlsm|xls|csv)$/i.test(pv.was ?? '') ? `<button class="btn ${pv.cmp ? 'sel' : ''}" data-act="compare">${pv.cmp ? `Changes since ${esc(fname(pv.was))}` : 'Compare with previous'}</button>` : ''}${(pv.att ?? pv).doc ? '<button class="btn" data-act="layout">Exact layout</button>' : ''}${pv.path ? `<a class="btn" href="${fileUrl(pv.path)}">Download</a>` : ''}${pv.signin ? '<button class="btn primary" data-act="signin-save">Save login</button>' : ''}<button class="btn" data-act="unpv">${pv.signin ? 'Cancel' : 'Close'}</button></div>`;
  // Your account's dialog: Logins and Tokens, as tabs.
  const account = [['logins', 'Logins'], ['tokens', 'Tokens']];
  if (account.some(([k]) => k === pv.settings?.kind)) h += `<div class="pvtabs">${account.map(([k, name]) => `<button class="tab ${pv.settings.kind === k ? 'sel' : ''}" data-act="${k}">${name}</button>`).join('')}</div>`;
  if (pv.att) h += `<div class="sub" style="padding:8px 14px"><a data-act="attachment-back">\u2190 ${esc(pv.title)}</a> \u00b7 ${esc(pv.att.title)}</div>` + previewBody(pv.att);
  else if (pv.path) h += previewBody(pv);
  else if (pv.signin) h += `<div class="sub" style="padding:8px 14px">Sign in as you always do, then Save login. Only you see this browser.${me.can.includes('keepalive') ? `<label style="display:block;margin-top:6px"><input type="checkbox" id="keep"> Keep the login alive until <input type="datetime-local" id="keep-until" value="${localInput(Date.now() + 7 * 864e5)}" max="${localInput(Date.now() + 7 * 864e5)}">, a week at most: the server opens the site every few minutes, so runs while you're away find you signed in.</label>` : ''}</div><div id="refused"></div><div class="pvb"><iframe src="/signins/${pv.signin}/view?drive" style="width:100%;height:100%;border:0"></iframe></div>`;
  else if (pv.settings?.kind === 'tokens') h += `<div class="pvb vl">${tokensHtml(pv.settings)}</div>`;
  else if (pv.settings?.kind === 'logins') h += `<div class="pvb vl">${loginsHtml(pv.settings)}</div>`;
  else if (pv.settings?.kind === 'wakes') h += `<div class="pvb vl">${wakesHtml(cur.i.id, cur.i.wakes, false)}</div>`;
  else if (pv.settings?.kind === 'waiting') h += `<div class="pvb vl">${waiting().join('') || '<div class="sub">Nothing waits on you.</div>'}</div>`;
  else if (pv.settings?.kind === 'start') h += `<div class="pvb vl">${startHtml(pv.settings)}</div>`;
  else if (pv.settings) {
    const s = pv.settings;
    h += '<div class="pvb vl">';
    if (s.kind === 'workspace') h += (s.manage ? `<h3>Name</h3><input type="text" id="wname" value="${esc(s.name)}">` : '') + peopleHtml(s)
      + (s.grants.length ? `<h3>Websites</h3><div class="sub">Whose logins to which websites runs here use, as its owners approved them, or are asked to.</div>`
        + s.grants.map(g => `<div class="lsub"><span>${person(g.person)} · ${esc(g.site)} <span class="sub">${g.state === 'approved' ? `approved by ${esc(nameOf(g.by))}` : 'asked'}: ${esc(g.reason)}${g.check?.risk ? ` · ${esc(g.check.risk)} risk` : ''}</span></span>${s.manage || g.person === me.email ? `<button class="quiet" data-act="grant-revoke" data-id="${esc(g.id)}">Revoke</button>` : ''}</div>`).join('') : '')
      + `<h3>Reading</h3><div class="sub">Agents here read every series of this workspace${s.reads.length ? `, and of ${esc(s.reads.join(', '))}, which ${s.reads.length > 1 ? 'have' : 'has'} everyone this one has` : ''}. They write only here.${s.read_by.length ? ` Agents in ${esc(s.read_by.join(', '))}, whose people are all here, read this one.` : ''}</div>`
      + agentsHtml(s, 'Every agent in this workspace reads it at the start of each run: its conventions, and changes that cut across its series, such as a renamed entity.', s.manage)
      + (s.manage && !s.archived ? moveHtml(s) : '')
      + (s.manage ? `<div class="row2"><button class="btn danger" data-act="archive-workspace">${s.archived ? 'Restore workspace' : 'Archive workspace'}</button></div>` : '');
    if (s.kind === 'series') h += `<h3>Name</h3><input type="text" id="sname" value="${esc(s.name)}">`
      + `<h3>Who starts runs</h3>${startsHtml(s)}<h3>Wakes</h3>${wakesHtml(s.id, s.wakes, true)}`
      + `<h3>Cost</h3><div class="sub">This series' runs have cost ${usd(s.cost)} so far, ${usd(s.cost / Math.max(1, s.closed))} per closed instance.</div>`
      + `<div class="row2"><button class="btn danger" data-act="archive-series">${s.archived ? 'Restore series' : 'Archive series'}</button></div>`;
    h += '</div>';
  }
  d.innerHTML = h + '<div class="pvn" id="pvn"></div>';
  if (!d.open) d.showModal();
  if ((pv.att ?? pv).pdf) watchPages(d, pv.att ?? pv);
}

// Sharing a series lends your logins to whoever starts its runs, so it takes two clicks, the second saying what you take on. Once it's
// yours, the ticks save as they change.
function startsHtml(s) {
  const mine = s.shared_by === me.email, ws = esc(cur.w.name), arm = `<button class="btn share ${pv.arming ? 'armed' : ''}" data-act="share-arm">${s.shared_by ? 'Have them wake it as me instead' : `Let ${ws} wake this series`}</button>`;
  return `<div>${s.shared_by ? `People in ${ws} and their agents wake this series, as ${mine ? 'you, with these credentials:' : person(s.shared_by) + '.'}` : "Each instance's runner, and nobody else: others' comments are notes for them, and a wake asks someone to start the instance."}</div>`
    + (mine ? ticksHtml(s.logins, s.shared_logins) + '<div class="row2"><button class="btn" data-act="share-off">Stop</button></div>' : `<div class="row2">${arm}</div>`)
    + (pv.arming ? `<div class="warn"><h3>Credentials</h3>${ticksHtml(s.logins)}<div class="consent">By allowing, people in ${ws} and their agents can wake this series: start or continue its instances, with a short reason, and add notes and files. Those runs act as you, using the selected credentials, and do the series' usual work.</div><div><button class="btn danger" data-act="share-on">Allow ${ws} to wake this series</button></div></div>` : '');
}

// Wakes for an instance or a series, each one-off or weekly on the days ticked at its time, editable in place, and a row to add one.
// A series' starts the instance it names, a weekly one's label holding the date it first fires or the one before it fires on.
const WEEK = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
function wakesHtml(target, list, series) {
  const row = (k = {}) => `<div class="wakerow row2" data-id="${k.id ?? ''}" data-target="${target}"><input type="datetime-local" class="wat" value="${k.at ? localInput(k.at) : ''}">`
    + (series ? `<input type="text" class="wlabel" placeholder="Label it starts" value="${esc(k.label ?? '')}">` : '')
    + WEEK.map(d => `<label class="sub"><input type="checkbox" value="${d}" ${k.days?.includes(d) ? 'checked' : ''}>${d[0].toUpperCase() + d.slice(1)}</label>`).join('')
    + `<button class="btn" data-act="wake-save">${k.id ? 'Save' : 'Add'}</button>${k.id ? '<button class="quiet" data-act="wake-delete">Delete</button>' : ''}</div>`;
  return `<div class="sub">${series ? 'Each starts the instance it names, or continues it if the series has it.' : 'Each continues this instance.'} Tick days to repeat it weekly at its time.</div>${list.map(row).join('')}${row()}`;
}

// A merge or move, as Waiting on you and the settings say it.
const proposalText = p => p.kind === 'merge' ? `to merge ${esc(p.from)} into ${esc(p.to)}` : `to move ${esc(p.series)} from ${esc(p.from)} to ${esc(p.to)}`;

// Merging this workspace into another you see, or moving one of its series there, once a manager of that one accepts within a week;
// or the proposal open, which its proposer's side withdraws.
function moveHtml(s) {
  const p = s.proposal, others = tree.filter(w => w.id !== s.id && !w.archived);
  if (p) return `<h3>Merge or move</h3><div class="sub">${person(p.by)} proposed ${when(p.at)} ${proposalText(p)}, for its owners to accept within a week.</div>`
    + (p.id === s.id ? `<div class="row2"><button class="btn" data-act="proposal-drop" data-id="${p.id}">Withdraw</button></div>` : '');
  return !others.length ? '' : '<h3>Merge or move</h3><div class="sub">All of it, or a series, into another workspace, once one of its owners accepts. A merge brings everyone here into that one; a series moved leaves behind whoever isn\'t in it.</div>'
    + `<div class="row2"><select id="mvwhat"><option value="">All of ${esc(s.name)}</option>${s.series.filter(x => !x.archived).map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>`
    + `<span class="sub">into</span><select id="mvto">${others.map(w => `<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select><button class="btn" data-act="propose">Propose</button></div>`;
}

// AGENTS.md, the company's or a workspace's: a text every agent in scope reads, which only admins, or the workspace's owners, change.
const agentsHtml = (s, sub, edit) => `<h3>AGENTS.md</h3><div class="sub">${sub}</div>`
  + (edit ? `<textarea id="agents" rows="8" placeholder="Such as: Fiscal months end on the last Saturday.">${esc(s.agents)}</textarea><div><button class="btn" data-act="save-agents">Save AGENTS.md</button></div>`
    : `<div class="sub">${s.agents ? esc(s.agents) : 'None yet.'}</div>`);

// A workspace's people, each an email or an Entra group's id: owners manage who is in it, and owners and members see and work in all
// of it.
function peopleHtml(s) {
  const row = (p, owner) => `<tr><td>${person(p)}${p.includes('@') ? '' : ' · group'}</td><td>${owner ? 'Owner' : 'Member'}</td>`
    + (s.manage ? `<td><div class="row2"><button class="btn" data-act="wrole" data-p="${esc(p)}">${owner ? 'Make member' : 'Make owner'}</button><button class="btn" data-act="wremove" data-p="${esc(p)}">Remove</button></div></td>` : '') + '</tr>';
  return `<h3>People</h3><div class="sub">Owners and members see and work in everything here, and its agents read across it. Owners manage who is in it.${s.owners.length + s.members.length ? '' : ' No one is in it yet, so only admins see it.'}</div>`
    + `<table class="ut">${s.owners.map(p => row(p, true)).join('')}${s.members.map(p => row(p, false)).join('')}</table>`
    + (s.manage ? `<div class="row2"><input type="text" id="wperson" list="known" autocomplete="off" placeholder="A name or email, or an Entra group's id, as Finance HK <id>" style="flex:1"><datalist id="known">${Object.entries(me.names).map(([id, n]) => `<option value="${esc(`${n} <${id}>`)}">`).join('')}</datalist><button class="btn primary" data-act="wadd">Add</button></div>` : '');
}

// A datetime-local input's value, in the browser's time zone.
const localInput = iso => new Date(new Date(iso).getTime() - new Date(iso).getTimezoneOffset() * 60e3).toISOString().slice(0, 16);

function openWorkspaceSettings() {
  pv = { title: 'Workspace settings', settings: { ...cur.w, kind: 'workspace' } };
  renderPv();
}

async function openSeriesSettings() {
  const s = cur.s, logins = await api('/logins');
  pv = { title: 'Series settings', settings: { ...s, kind: 'series', logins, cost: s.instances.reduce((t, i) => t + i.cost, 0), closed: s.instances.filter(i => i.status === 'closed').length } };
  renderPv();
}

// "Saved" in the dialog's header for a moment, after a change it saved as it was made.
let savedFor;
function saved() {
  $('#pv .saved').textContent = 'Saved';
  clearTimeout(savedFor);
  savedFor = setTimeout(() => { $('#pv .saved').textContent = ''; }, 2000);
}

// Personal tokens: rf, on your own machine or for your desktop agent, acts as you with one.
function tokensHtml(s) {
  return `<div class="sub">rf does what this page does, from a shell or your desktop agent, as you: list and pull what you can see, comment and reply, upload and wake${me.role === 'admin' ? ", and manage people, skills and the company's AGENTS.md" : me.can.includes('publish') ? ', and push skills' : ''}. Install it with <code>npm i -g @rfany/rf</code> (Node 22 or later), then <code>rf login ${esc(location.origin)}</code> and allow it on the page it opens; or make a token below and <code>rf login ${esc(location.origin)} TOKEN</code>.</div>`
    + (s.made ? `<h3>Your new token</h3><div class="sub">Copy it now: it isn't shown again.</div><input type="text" readonly value="${esc(s.made)}" onclick="this.select()">` : '')
    + (s.tokens.length ? `<h3>Your tokens</h3>` + s.tokens.map(t => `<div class="wt">${esc(t.name)} <span class="sub">made ${esc(when(t.created))}, ${t.expires < new Date().toISOString() ? 'expired' : 'until ' + esc(when(t.expires))}</span><button class="quiet" data-act="revoke-token" data-id="${esc(t.id)}">Revoke</button></div>`).join('') : '')
    + `<h3>New token</h3><div class="row2"><input type="text" id="tname" placeholder="Name, such as laptop" style="flex:1"><select id="tdays"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option></select><button class="btn primary" data-act="new-token">Make</button></div>`;
}

async function openTokens(made) {
  pv = { title: 'Tokens', settings: { kind: 'tokens', tokens: await api('/tokens'), made } };
  renderPv();
}

// Your logins, on one page: what needs you first, then a line for each, Microsoft 365, Databricks, the websites and the model key,
// whose detail opens in place.
function loginsHtml(s) {
  const entra = s.connections.filter(c => c.login.scope), sites = s.connections.filter(c => c.type === 'website').map(c => ({ id: c.name, name: c.title ?? c.name, url: c.url, hosts: c.hosts, header: c.header, owner: c.owner, off: c.off }));
  const mine = id => s.logins.find(l => l.id === id), k = mine('openrouter'), shown = id => pv.shown?.includes(id);
  const line = (name, sub, acts = '') => `<div class="lline"><b>${esc(name)}</b><span class="sub">${sub}</span>${acts}</div>`;
  const show = id => `<button class="quiet" data-act="logins-show" data-id="${id}">${shown(id) ? 'Hide \u25BE' : 'Show \u25B8'}</button>`;
  const connect = l => `<a class="btn primary" href="/logins/${enc(l.id)}/connect">${l.expired ? 'Sign in again' : 'Reconnect'}</a>`;
  const signOut = id => `<button class="quiet" data-act="signout-login" data-id="${esc(id)}">Sign out</button>`;
  const needs = [
    ...s.logins.filter(l => l.expired && l.kind !== 'key').map(l => line(l.name, '<span class="q">expired</span>', l.kind === 'website' ? signInHtml(l.id, l.name) : connect(l))),
    ...s.logins.filter(l => l.missing.length && !l.expired).map(l => line(l.name, `<span class="q">runs can't send or save</span>: Microsoft hasn't granted it ${esc(l.missing.join(', '))}, which this server now asks for`, connect(l))),
    ...(k?.enabled && k.expired ? [line('Model key', '<span class="q">your key is out of credits</span>: save another, or stop using it', '<button class="btn primary" data-act="logins-show" data-id="key">Change</button>')] : []),
  ];
  let h = `<div class="sub">Every login is yours alone. A run uses only its runner's logins, and only those ticked for its instance. Nothing here is a password: you sign in to each system yourself.</div>`
    + (needs.length ? `<h3>Needs you</h3>${needs.join('')}<h3>All</h3>` : '');
  for (const c of entra) {
    const l = mine(c.login.id);
    if (!l) {
      h += line(c.login.name, c.type === 'graph' ? 'Only what you add once connected: mailboxes, SharePoint sites, and folders or files in SharePoint or OneDrive. A run reaches nothing else, and shares nothing.' : `Runs reach ${esc(c.name)} as you, with your own permissions there.`, `<a class="btn primary" href="/logins/${enc(c.login.id)}/connect">Connect</a>`);
      continue;
    }
    // What each kind's login offers is what its person adds to it: Microsoft 365's sources, Databricks' SQL warehouses.
    const [what, hint, box] = l.kind === 'm365' ? ['source', "Add a mailbox by its address, yours or one you may read; a whole SharePoint site by its link; or a folder, with all under it, or a file, in SharePoint or anyone's OneDrive, by any link to it.", 'A mailbox or a link']
      : ['warehouse', "Add a SQL warehouse by its link, such as its page's in the workspace; runs use it as you, with your own grants there.", 'A link to a SQL warehouse'];
    h += line(l.name, `${l.account ? `${person(l.account)} · ` : ''}${l.expired ? 'expired' : `since ${esc(when(l.since))}`} · ${plural(l.offers.length, what).replace(/^0 (\w+)$/, 'no $1s')}`, show(l.id));
    if (shown(l.id)) h += l.offers.map(o => `<div class="lsub"><span>${esc(o.name)}</span><button class="quiet" data-act="unoffer" data-login="${esc(l.id)}" data-id="${esc(o.id)}">Remove</button></div>`).join('')
      + (l.kind === 'm365' && l.offers.length ? `<div class="sub">Each kept as an index, refreshed with your login while it's added.</div>` : '')
      + (l.expired ? '' : `<div class="sub">${hint}</div><div class="row2"><input type="text" id="offer-add-${esc(l.id)}" placeholder="${box}" style="flex:1"><button class="btn" data-act="offer-add" data-id="${esc(l.id)}">Add</button></div>`)
      + `<div class="row2">${signOut(l.id)}</div>`;
  }
  const ids = new Set([...s.connections.map(c => c.login.id), 'openrouter']), signed = sites.filter(w => mine(`web:${w.id}`) && !mine(`web:${w.id}`).expired).length;
  for (const l of s.logins.filter(l => !ids.has(l.id))) h += line(l.name, 'no longer a connection on this server, so no run uses it', signOut(l.id));
  h += line('Websites', sites.length ? `${signed} of ${sites.length} signed in` : me.browsers ? 'none yet: add one' : 'not set up on this server: website logins need the browser service (README, Websites)', sites.length || me.browsers ? show('web') : '');
  if (sites.length && shown('web')) h += `<div class="sub">Sign in yourself, in a browser shown here. Your login is what that browser keeps, its cookies, never your password; a run's browser starts from it and brings it back refreshed. It reaches only the hosts listed, but there it can do whatever you can: the agent is told only to read, and each run's log counts its writes.${sites.some(w => w.header) ? " Where a site's sign-in needs a token, give it in the box under its name: it goes only to that sign-in, never to a run's browser, and is kept, sealed, for the next." : ''}</div>`
    + `<div class="sub">A run uses your login only in a workspace whose owners approved it: once signed in, ask to use it there, saying what for. Until one approves it, your login is signed out a week after you signed in.</div>`
    + sites.map(w => {
      const l = mine(`web:${w.id}`), gs = s.grants.filter(g => g.person === me.email && g.site === w.id && ['pending', 'approved'].includes(g.state));
      const free = tree.filter(x => !x.archived && !gs.some(g => g.workspace === x.id));
      return `<div class="lsub"><span>${esc(w.name)} <span class="sub">${esc([new URL(w.url).hostname, ...w.hosts].join(', '))}${w.off ? ' · switched off' : ''}${l ? ` · ${l.expired ? 'expired' : `since ${esc(when(l.since))}${l.keepalive > new Date().toISOString() ? `, kept alive until ${esc(when(l.keepalive))}` : ''}`}` : ''}</span>`
        + `${w.header ? `<input type="password" id="hdr-${esc(w.id)}" placeholder="${l ? `New ${esc(w.header)}, if any` : `Your ${esc(w.header)}`}" autocomplete="off" style="display:block;width:100%;margin-top:6px">` : ''}</span>`
        + `${w.off ? '' : `<button class="btn" data-act="web-signin" data-id="${esc(w.id)}" data-name="${esc(w.name)}">${l ? 'Sign in again' : 'Sign in'}</button>`}${l ? signOut(l.id) : ''}`
        + `${w.owner === me.email || me.role === 'admin' ? `<button class="quiet" data-act="site-remove" data-id="${esc(w.id)}">Remove</button>` : ''}</div>`
        + gs.map(g => `<div class="lsub"><span class="sub">${g.state === 'approved' ? 'Approved' : 'Asked'} in ${esc(tree.find(x => x.id === g.workspace)?.name ?? g.workspace)}: ${esc(g.reason)}</span><button class="quiet" data-act="grant-revoke" data-id="${esc(g.id)}">${g.state === 'approved' ? 'Stop using' : 'Withdraw'}</button></div>`).join('')
        + (l && !l.expired && !w.off && free.length ? `<div class="row2"><select id="ask-ws-${esc(w.id)}">${free.map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select>`
          + `<input type="text" id="ask-why-${esc(w.id)}" placeholder="What runs there use it for" style="flex:1"><button class="btn" data-act="grant-ask" data-id="${esc(w.id)}">Ask to use</button></div>` : '');
    }).join('');
  if (me.browsers && shown('web')) h += `<div class="sub">A new website: its name and the https address where you sign in. The other hosts its pages need, such as single sign-on's, you allow as you sign in. At an address a website has already, it's that one.</div>`
    + '<div class="row2"><input type="text" id="site-name" placeholder="Name" style="width:30%"><input type="text" id="site-url" placeholder="https://… where you sign in" style="flex:1"><button class="btn" data-act="site-add">Add</button></div>';
  h += line('Model key', !k ? "the server's" : k.enabled ? `yours${k.expired ? ', out of credits' : ''}` : "the server's · yours saved",
    (k ? `<label><input type="checkbox" id="oruse" ${k.enabled ? 'checked' : ''}> use mine</label>` : '') + `<button class="quiet" data-act="logins-show" data-id="key">${k ? 'Change' : 'Add mine'}</button>`);
  if (shown('key')) h += `<div class="sub">Runs you run use the server's OpenRouter key, or your own: on yours, one that runs out of credits waits for you.</div>`
    + `<div class="row2"><input type="password" id="orkey" placeholder="${k ? 'A new OpenRouter key' : 'Your OpenRouter key'}" autocomplete="off" style="flex:1"><button class="btn" data-act="orkey-save">Save</button>${k ? signOut('openrouter').replace('Sign out', 'Remove') : ''}</div>`;
  return h;
}

// Ticks: which of your logins an instance may use, asked whenever you start, copy or take over one, or share a series, by kind:
// Microsoft 365's sources fold under a tick of its own, unless some are ticked and some not, and an expired login is flagged, its
// ticks off.
function ticksHtml(logins, on = []) {
  const n = l => l.expired ? 0 : l.offers.filter(o => on.includes(o.id)).length, tick = (l, o) => `<label><input type="checkbox" class="tick" value="${esc(o.id)}" ${on.includes(o.id) && !l.expired ? 'checked' : ''}> ${esc(o.name)}${l.expired ? ' <span class="q">expired</span>' : ''}</label>`;
  const h = [['m365', ''], ['databricks', 'Databricks'], ['website', 'Websites']].map(([kind, name]) => logins.filter(l => l.kind === kind && l.offers.length).map(l => kind === 'm365'
    ? `<details class="tgroup" ${n(l) && n(l) < l.offers.length ? 'open' : ''}><summary><label><input type="checkbox" class="tickall" ${n(l) === l.offers.length ? 'checked' : ''}> ${esc(l.name)}${l.expired ? ' <span class="q">expired</span>' : ''}</label><span class="sub">${l.offers.length} source${l.offers.length === 1 ? '' : 's'}</span></summary>${l.offers.map(o => tick(l, o)).join('')}</details>`
    : `<div class="tkind"><span class="sub">${name}</span>${l.offers.map(o => tick(l, o)).join('')}</div>`).join('')).join('');
  return h || '<div class="sub">You have no logins yet; add them under <a data-act="logins">Logins</a>. The agent can still work with the files people bring.</div>';
}
const ticked = () => [...document.querySelectorAll('#pv input.tick:checked')].map(i => i.value);

function startHtml(s) {
  return (s.label !== undefined ? `<h3>Label</h3><input type="text" id="slabel" value="${esc(s.label)}" placeholder="such as a date">` : '')
    + `<h3>Credentials</h3>` + ticksHtml(s.logins, s.on)
    + (s.logins.some(l => l.offers.length) ? `<div class="consent">By clicking ${esc(s.go)}, you agree that agents carry these credentials while acting as you.</div>` : '')
    + `<div><button class="btn primary" data-act="start-go">${esc(s.go)}</button></div>`;
}

// Signing in again, from wherever a login is said to have expired: Microsoft's own page, or a website's live browser.
const signInHtml = (id, name) => id === 'openrouter' ? '<button class="btn" data-act="logins">Your model key</button>'
  : id === 'entra' ? '<a class="btn" href="/auth/login">Sign in again</a>'
  : !id.startsWith('web:') ? `<a class="btn" href="/logins/${enc(id)}/connect">Sign in again</a>`
  : `<button class="btn" data-act="web-signin" data-id="${esc(id.slice(4))}" data-name="${esc(name)}">Sign in again</button>`;

// What waits on you: the agent's asks and the notes for you, requests to start a series you can see, proposals to merge or move
// into a workspace you manage, and requests to use a website there, and your expired logins.
function waiting() {
  const out = tree.filter(w => !w.archived && w.manage && w.proposal?.into === w.id).map(({ proposal: p }) => `<div class="wt">${person(p.by)} proposes ${proposalText(p)}`
    + ` <button class="btn" data-act="accept" data-id="${p.id}">Accept…</button><button class="btn" data-act="proposal-drop" data-id="${p.id}">Decline</button></div>`), at = (w, s, i) => `<a href="#/${i?.id ?? w.id}">${esc(w.name)}${s.single ? '' : ' · ' + esc(s.name)}${i ? ' · ' + esc(i.label) : ''}</a>`;
  for (const w of tree.filter(w => !w.archived)) for (const s of w.series.filter(s => !s.archived)) {
    for (const i of s.instances) {
      const n = i.asks.filter(e => e === me.email).length;
      if (n) out.push(`<div class="wt">${at(w, s, i)}: ${n} ask${n > 1 ? 's' : ''} for you</div>`);
      for (const r of i.refused) out.push(`<div class="wt">${at(w, s, i)}: run ${r.run}'s browser on ${esc(r.site)} was refused`
        + r.hosts.map(x => ` <span class="creds">${esc(x)} <a data-act="allow-host" data-site="${esc(r.site)}" data-host="${esc(x)}">Allow</a></span>`).join('') + '</div>');
      if (i.wrong && i.runner === me.email) out.push(`<div class="wt">${at(w, s, i)}: ${plural(i.wrong, 'correction')} say${i.wrong > 1 ? '' : 's'} it's wrong</div>`);
    }
    for (const r of s.requests.filter(r => (r.who ?? me.email) === me.email)) out.push(`<div class="wt">${at(w, s)}: ${r.from.includes('@') ? person(r.from) : esc(r.from.split('/').slice(-2).join(' · '))} asks to start ${esc(r.label)} <button class="btn" data-act="req-start" data-id="${esc(r.id)}">Start</button></div>`);
  }
  // Each with the server's check of the website: one it rates high only an admin approves.
  for (const w of tree.filter(w => !w.archived && w.manage)) for (const g of w.grants.filter(g => g.state === 'pending')) {
    const c = g.check, high = c?.risk === 'high' && me.role !== 'admin';
    out.push(`<div class="wt">${person(g.person)} asks to use their ${esc(g.site)} login in <a href="#/${w.id}">${esc(w.name)}</a>: ${esc(g.reason)}`
      + `<div class="sub">${!c || c.error ? `Not checked${c ? `: ${esc(c.error)}` : ''}.` : `Check: ${esc(c.risk)} risk${c.flags.length ? ` (${esc(c.flags.join('; '))})` : ''}. ${esc(c.summary)}${c.same ? ` It looks like ${esc(c.same)}, a website here already.` : ''}${c.hosts.length ? ` Approving lets it reach ${esc(c.hosts.join(', '))}.` : ''}`}</div>`
      + `${high ? '<span class="sub">An admin decides.</span>' : `<button class="btn" data-act="grant-approve" data-id="${esc(g.id)}">Approve</button>`}<button class="btn" data-act="grant-deny" data-id="${esc(g.id)}">Deny</button></div>`);
  }
  return [...out, ...expired.map(l => `<div class="wt">Your ${l.kind === 'key' ? 'OpenRouter key is out of credits' : `${esc(l.name)} login has expired`}. ${signInHtml(l.id, l.name)}</div>`)];
}

// A menu under the button that opened it. Items are [label, act, class, why it's off], or ['-'] for a rule; an item does what a
// button with its act does.
// The page's own dialog, to confirm or to ask for a name: it resolves with what act returns, or null if cancelled. Until act
// succeeds it stays open, saying why it didn't.
// A dialog's buttons that have a value act, with the text it asks for, if any, and that value; `html` may hold more of them.
function ask({ title, text = '', html = '', value, placeholder = '', ok, kind = 'primary', act }) {
  const d = $('#ask');
  d.innerHTML = `<form method="dialog"><h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ''}${html}`
    + (value === undefined ? '' : `<input type="text" value="${esc(value)}" placeholder="${esc(placeholder)}" required autocomplete="off">`)
    + `<div class="err"></div><div class="foot">${ok ? `<button class="btn ${kind}" value="ok">${esc(ok)}</button>` : ''}<button class="btn" formnovalidate>Cancel</button></div></form>`;
  d.showModal();
  const input = d.querySelector('form > input');
  input?.select();
  return new Promise(done => {
    d.onclose = () => done(null);
    d.querySelector('form').onsubmit = async e => {
      if (!e.submitter.value) return;
      e.preventDefault();
      e.submitter.setAttribute('aria-busy', 'true');
      try {
        done(await act(input?.value.trim(), e.submitter.value));
        d.close();
      } catch (err) {
        d.querySelector('.err').textContent = err.message;
      } finally {
        e.submitter.removeAttribute('aria-busy');
      }
    };
  });
}

// A name changes where it shows: Enter or leaving the field saves it, Escape keeps the old one. The bar and the sidebar wait.
let editing = null;
function editName(el, name, save) {
  const input = Object.assign(document.createElement('input'), { type: 'text', className: 'inline', value: name }), host = el.closest('#bar, #side');
  el.replaceWith(input);
  editing = input;
  input.select();
  const end = async keep => {
    if (editing !== input) return;
    editing = null;
    try {
      if (keep && input.value.trim() && input.value.trim() !== name) await save(input.value.trim()).then(refresh);
    } finally {
      drawn.delete(host);
      render();
    }
  };
  input.onkeydown = e => {
    if (e.key === 'Enter' && !e.isComposing) end(true);
    if (e.key === 'Escape') { e.stopPropagation(); end(false); }
  };
  input.onblur = () => end(true);
}

// The earlier file's sheet of the same name, compared with the one shown.
const oldOf = p => p.old.find(o => o.name === p.sheets[p.sheet].name) ?? p.old[p.sheet];

// A workbook's sheets are read as they're first shown, as is, comparing, the earlier file's.
async function loadSheets(p) {
  for (const [src, s] of [[p.src, p.sheets[p.sheet]], [p.was && fileUrl(p.was, 'preview'), p.cmp && oldOf(p)]]) if (s && !s.rows) Object.assign(s, await api(`${src}${src.includes('?') ? '&' : '?'}sheet=${s.at}`));
}

// What a preview shows of its file, or of an attachment in it: a workbook's sheets, an email in a frame that runs nothing and loads
// nothing, an image, or text.
function previewBody(p) {
  if (p.sheets) return (p.sheets.length > 1 ? `<div class="tabs">${p.sheets.map((s, k) => `<button class="btn ${k === p.sheet ? 'sel' : ''} ${s.state ? 'dim' : ''}" data-act="sheet" data-k="${k}"${s.state ? ' title="Hidden in the workbook"' : ''}>${esc(s.name)}</button>`).join('')}</div>` : '')
    + `<div class="pvb">${sheetTable(p, p.sheets[p.sheet], (p.sheets[p.sheet].at ?? p.sheet) === 0)}</div>`;
  if (p.email) {
    const m = p.email;
    return `<div class="mh">${Object.entries(m.headers).map(([k, v]) => `<div><b>${esc(k)}</b> ${esc(v)}</div>`).join('')}`
      + (m.attachments.length ? `<div class="atts">${m.attachments.map(a => `<a data-act="attachment" data-k="${a.k}">${esc(a.name)}</a>`).join('')}</div>` : '') + '</div>'
      + (m.html == null ? `<div class="pvb"><pre>${esc(m.text)}</pre></div>` : `<iframe class="pvb mail" sandbox="allow-popups allow-popups-to-escape-sandbox" srcdoc="${esc(MAIL + m.html)}"></iframe>`);
  }
  if (p.image) return `<div class="pvb"><img src="${esc(p.image)}" alt=""></div>`;
  if (p.doc) return `<div class="pvb doc">${p.doc.map(b => b.h ? `<h${b.h}>${esc(b.text)}</h${b.h}>` : b.table ? `<table>${b.table.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`
    : b.li !== undefined ? `<p class="li" style="margin-left:${18 + b.level * 18}px">${esc(b.li)}</p>` : `<p>${esc(b.p)}</p>`).join('')}</div>`;
  if (p.pdf) return `<div class="pvb pages">${Array.from({ length: p.pdf.pages }, (_, k) => `<img data-page="${k + 1}" alt="Page ${k + 1}"${p.pdf.shown[k + 1] ? ` src="${esc(p.pdf.shown[k + 1])}"` : ''}>`).join('')}</div>`;
  if (p.text !== undefined) return `<div class="pvb">${p.md ? `<div class="say">${md(p.text, p.item && talkOn(p.item))}</div>` : `<pre>${esc(p.text)}</pre>`}</div>`;
  return `<div class="pvb"><div class="empty">${p.loading ? 'Loading…' : p.error ? esc(p.error) : 'No preview for this kind of file. Download it instead.'}</div></div>`;
}
// A PDF's pages, each fetched as it scrolls into view and kept apart from those the preview came with, so a card drawn again on each
// event draws the same, keeping its place; each watched once.
function watchPages(at, p) {
  const more = p.pdf.more ??= {}, seen = new IntersectionObserver(es => es.forEach(async e => {
    if (!e.isIntersecting) return;
    seen.unobserve(e.target);
    e.target.src = more[e.target.dataset.page] = (await api(`${p.src}${p.src.includes('?') ? '&' : '?'}page=${e.target.dataset.page}`)).image;
  }), { root: at.querySelector('.pages'), rootMargin: '600px' });
  for (const img of at.querySelectorAll('.pages img:not([src]):not([data-w])')) {
    img.dataset.w = '';
    if (more[img.dataset.page]) img.src = more[img.dataset.page];
    else seen.observe(img);
  }
}
const MAIL = `<!doctype html><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'"><base target="_blank"><style>body { font: 14px/1.5 system-ui, sans-serif; margin: 14px 18px; }</style>`;

// A preview of a file, an item's or not, before what it shows is fetched (load), for the dialog or an item's card.
function previewOf(path, item) {
  return {
    title: fname(path), path, src: fileUrl(path, 'preview'), item: item?.id, threads: item ? talkOn(item.id) : [], sheet: 0, image: /\.(png|jpe?g|gif|webp|svg)$/i.test(path) && fileUrl(path),
    was: item && data.log.findLast(e => e.op === 'point' && e.item === item.id && e.file === path)?.was, md: /\.md$/i.test(path), loading: /\.(xlsx|xlsm|xls|csv|eml|msg|pdf|docx|md|txt|json|py|sql|log)$/i.test(path),
  };
}

// What a preview shows: a text file as it is, a file of a kind the server reads, or any attachment, as the server reads it.
async function load(p) {
  try {
    if (/\.(md|txt|json|py|sql|log)$/i.test(p.path)) p.text = await (await fetch(fileUrl(p.path))).text();
    else if (!p.path || /\.(xlsx|xlsm|xls|csv|eml|msg|pdf|docx)$/i.test(p.path)) Object.assign(p, await api(p.src));
    if (p.sheets) p.sheet = p.sheets.findIndex(s => s.rows);
  } catch (e) {
    p.error = e.message;
  } finally {
    p.loading = false;
  }
}

async function preview(path, item) {
  const p = pv = previewOf(path, item);
  renderPv();
  await load(p);
  if (pv === p) renderPv();
}

async function upload(files, pane, onto) {
  const path = instPath(), mine = files.map(f => ({ f, pane, path, pct: 0 })), before = new Set(data.doc.items.map(i => i.file));
  uploads.push(...mine);
  renderPanes();
  for (const u of mine) {
    await new Promise((ok, fail) => {
      const x = new XMLHttpRequest();
      x.open('POST', `${path}/upload?pane=${pane}&name=${enc(u.f.name)}${onto ? '&onto=' + enc(onto) : ''}`);
      x.upload.onprogress = e => { u.pct = 100 * e.loaded / e.total; renderPanes(); };
      x.onload = () => (x.status < 300 ? ok() : fail(new Error(x.responseText)));
      x.onerror = () => fail(new Error(`${u.f.name} didn't upload`));
      x.send(u.f);
    }).catch(e => toast(e.message));
    uploads = uploads.filter(x => x !== u);
  }
  await refresh();
  if (shown !== path) return;
  markSeen(data.doc.items.filter(i => i.file?.startsWith('upload/') && !before.has(i.file)));
  renderPanes();
}

document.addEventListener('click', async ev => {
  if (!ev.target.closest('#sorter')) $('#sorter').open = false;
  if (!ev.target.closest('#side, [data-act=menu]') || ev.target.closest('#side a')) $('#side').classList.remove('open');
  // A fold opened or closed stays so as the panel is drawn again, which, the page now differing from what was drawn, it next is.
  const sum = ev.target.closest('#log details[data-key] > summary');
  if (sum) {
    ui.sect[sum.parentElement.dataset.key] = !sum.parentElement.open;
    drawn.delete($('#conv'));
  }
  const el = ev.target.closest('[data-act], .tile, .lrow');
  if (!el) {
    if (!ev.target.closest('#card, dialog')) { openItem = null; renderCard(); renderPanes(); }
    return;
  }
  if (!el.dataset.act) {
    openItem = openItem === el.dataset.item ? null : el.dataset.item;
    markSeen(data.doc.items.filter(i => i.id === openItem));
    renderPanes();
    return renderCard();
  }
  // What a click starts holds its button until it's done, so a second click can't repeat it.
  el.setAttribute('aria-busy', 'true');
  try { await onAct(el.dataset.act, el); } finally { el.removeAttribute('aria-busy'); }
});

// The preview a control is in, the dialog's or an item card's, and what shows it again.
const holder = el => (el.closest('#card') ? [cardPv, renderCard] : [pv, renderPv]);

// What a click on an element with data-act does.
async function onAct(act, el) {
  if (act === 'menu') $('#side').classList.toggle('open');
  if (act === 'expand') { expandRow(el.dataset.id); renderSide(); }
  if (act === 'workspaces') { localStorage.workspaces = el.dataset.id; renderSide(); }
  if (act === 'order') { localStorage.order = el.dataset.id; renderSide(); }
  // A row's settings and + act on that row, which they open first: after the hash change's own refresh starts, which this one
  // supersedes, so it lands before they act.
  if (['workspace-settings', 'new-task', 'settings', 'new-instance'].includes(act) && el.dataset.id && ![cur?.w.id, cur?.s?.id].includes(el.dataset.id)) {
    location.hash = `#/${el.dataset.id}`;
    await new Promise(ok => addEventListener('hashchange', ok, { once: true }));
    await refresh();
  }
  if (act === 'audit') await toggleAudit();
  if (act === 'watch') { ui.site = el.dataset.site; renderPlayer(); }
  if (act === 'drive') { ui.drive = ui.drive ? null : `${cur.i.id}/${el.dataset.site}`; renderPlayer(); }
  if (act === 'player') { localStorage.player = localStorage.player === 'folded' ? 'open' : 'folded'; renderPlayer(); }
  // A rule the process gained: the Process fold, open, in view.
  if (act === 'process') {
    ui.sect.process = true;
    renderLog();
    $('#log details[data-key=process]').scrollIntoView({ block: 'start' });
  }
  if (act === 'panel') {
    Object.assign(ui, { open: !ui.open, on: null, ref: null });
    renderLog(); renderBar(); placeCard();
  }
  if (act === 'interrupt') { await api(`${instPath()}/interrupt`, { method: 'POST' }); await refresh(); }
  if (act === 'comment-on') { Object.assign(ui, { open: true, on: el.dataset.item, ref: null }); renderLog(); renderBar(); $('#newcomment')?.focus(); }
  if (act === 'comment' || act === 'reply-thread') {
    const box = act === 'comment' ? $('#newcomment') : el.closest('.thread').querySelector('textarea'), text = box.value.trim();
    const picked = act === 'comment' ? $('#newfiles') : el.closest('.thread').querySelector('input[type=file]');
    if (!text) return;
    const files = [];
    for (const f of picked.files) files.push((await api(`${instPath()}/attach?name=${enc(f.name)}`, { method: 'POST', body: f })).file);
    await api(`${instPath()}/comment`, { method: 'POST', body: JSON.stringify(act === 'comment' ? { text, files, ...(ui.on && { item: ui.on }), ...(ui.ref && { ref: ui.ref }) } : { thread: el.dataset.thread, text, files }) });
    box.value = '';
    thumbs(picked, new DataTransfer().files);
    replying.delete(el.dataset.thread);
    ui.on = ui.ref = null;
    await refresh();
  }
  if (act === 'resolve') {
    await api(`${instPath()}/resolve`, { method: 'POST', body: JSON.stringify({ thread: el.dataset.thread }) });
    await refresh();
  }
  if (act === 'signoff') {
    const box = el.closest('.thread').querySelector('textarea');
    await api(`${instPath()}/signoff`, { method: 'POST', body: JSON.stringify({ thread: el.dataset.thread, text: box.value.trim() }) });
    box.value = '';
    await refresh();
  }
  if (act === 'uncard') { openItem = null; renderCard(); renderPanes(); }
  if (act === 'view') { localStorage.view = el.dataset.id; renderPanes(); placeCard(); }
  if (act === 'sort') {
    const { pane, key } = el.dataset, was = ui.sort[pane];
    ui.sort[pane] = { key, dir: was?.key === key ? -was.dir : 1 };
    renderPanes();
  }
  if (act === 'opencard') { openItem = el.dataset.item; markSeen(data.doc.items.filter(i => i.id === openItem)); renderPanes(); renderCard(); }
  if (act === 'preview') await preview(el.dataset.file, data.doc.items.find(i => i.id === el.dataset.item));
  if (act === 'unpv') closePv();
  if (act === 'settings') await openSeriesSettings();
  if (act === 'workspace-settings') openWorkspaceSettings();
  if (act === 'signout') location.href = (await api('/auth/logout', { method: 'POST' })).next;
  if (act === 'wadd' || act === 'wremove' || act === 'wrole') {
    // An addition is an email or an Entra group's id, alone or as a suggestion shows it, NAME <ID>, where NAME labels a group.
    const [, label, inside] = act === 'wadd' && /^(.*?)\s*<(.+)>$/.exec($('#wperson').value.trim()) || [];
    const s = pv.settings, p = act === 'wadd' ? (inside ?? $('#wperson').value).trim().toLowerCase() : el.dataset.p;
    if (!p) return;
    const owners = s.owners.filter(x => x !== p), members = s.members.filter(x => x !== p);
    if (act === 'wadd') (s.owners.includes(p) ? owners : members).push(p);
    if (act === 'wrole') (s.owners.includes(p) ? members : owners).push(p);
    await api(`/api/workspaces/${cur.w.id}`, { method: 'PUT', body: JSON.stringify({ owners, members, ...(label && !p.includes('@') && { groups: { [p]: label } }) }) });
    me = await api('/me');
    await refresh();
    openWorkspaceSettings();
    saved();
  }
  if (act === 'archive-series' || act === 'archive-workspace') {
    const x = act === 'archive-series' ? cur.s : cur.w, flip = () => api(act === 'archive-series' ? seriesPath(cur) : `/api/workspaces/${cur.w.id}`, { method: 'PUT', body: JSON.stringify({ archived: !x.archived }) });
    if (x.archived) await flip();
    else if (!await ask({ title: `Archive ${x.name}?`, text: 'It leaves the sidebar, except under Show archived. Nothing in it changes.', ok: 'Archive', act: flip })) return;
    closePv();
    await refresh();
  }
  if (act === 'rename') editName($('#bar h1 .t'), cur.i.label, label => api(`${instPath()}/rename?as=${enc(label)}`, { method: 'POST' }));
  if (act === 'share-arm') { pv.arming = !pv.arming; renderPv(); }
  if (act === 'share-on' || act === 'share-off') {
    await api(seriesPath(cur), { method: 'PUT', body: JSON.stringify(act === 'share-on' ? { share: true, logins: ticked() } : { share: false }) });
    await refresh();
    await openSeriesSettings();
    saved();
  }
  // A wake edited is set anew, then the one it was cancelled, unless setting it moved that one.
  if (act === 'wake-save' || act === 'wake-delete') {
    const r = el.closest('.wakerow'), id = r.dataset.id, days = [...r.querySelectorAll('input:checked')].map(c => c.value).join(',');
    const made = act === 'wake-save' && await api(`/api/wakes/${r.dataset.target}`, { method: 'PUT', body: JSON.stringify({ at: new Date(r.querySelector('.wat').value).toISOString(), label: r.querySelector('.wlabel')?.value, days }) });
    if (id && made.id !== id) await api(`/api/wakes/${id}`, { method: 'DELETE' });
    await refresh();
    if (pv.settings.kind === 'series') await openSeriesSettings();
    else renderPv();
    saved();
  }
  if (act === 'wakes') {
    pv = { title: `Wakes of ${cur.i.label}`, settings: { kind: 'wakes' } };
    renderPv();
  }
  if (act === 'req-start') await openStart('Start the instance asked for', 'Start', ({ logins }) => api(`/api/requests/${el.dataset.id}`, { method: 'POST', body: JSON.stringify({ logins }) }));
  if (act === 'propose') {
    const series = $('#mvwhat').value;
    await api(`/api/proposals/${cur.w.id}`, { method: 'PUT', body: JSON.stringify({ kind: series ? 'move' : 'merge', series, to: $('#mvto').value }) });
    await refresh();
    openWorkspaceSettings();
  }
  if (act === 'proposal-drop') {
    await api(`/api/proposals/${el.dataset.id}`, { method: 'DELETE' });
    await refresh();
    if (pv.settings.kind === 'waiting') renderPv(); else openWorkspaceSettings();
  }
  // Accepting shows what it does now: the series coming and their names here, and who joins, as members unless made owners; for a
  // series, whoever runs its open instances but isn't here, whom you may leave out.
  if (act === 'accept') {
    const id = el.dataset.id, p = await api(`/api/proposals/${id}`), merge = p.kind === 'merge';
    const html = `<ul>${p.series.map(x => `<li>${esc(x.from)} \u2192 ${esc(x.to)}${x.since ? ', made since it was proposed' : ''}</li>`).join('')}</ul>`
      + (p.agents ? `<h3>Its AGENTS.md, added to ${esc(p.to)}'s</h3><pre class="agents">${esc(p.agents)}</pre>` : '')
      + p.people.map(x => `<div class="row2"><select data-p="${esc(x)}"><option value="members">Member</option><option value="owners">Owner</option>${merge ? '' : '<option value="">Not added</option>'}</select> ${person(x)}</div>`).join('');
    const text = merge ? "Its series come here, its people join as members, and its AGENTS.md is added to this one's. Shared series stop being shared until their sharers share them here."
      : `It comes here, and stops being shared, if it is, until its sharer shares it here.${p.people.length ? ` Who runs its open instances but isn't in ${p.to}: added, they go on; left out, their runs wait until someone here takes those over.` : ''}`;
    if (await ask({
      title: merge ? `Merge ${p.from} into ${p.to}` : `Move ${p.series[0].from} to ${p.to}`, text, html, ok: 'Accept',
      act: () => {
        const as = { owners: [], members: [] };
        for (const s of $('#ask').querySelectorAll('select[data-p]')) if (s.value) as[s.value].push(s.dataset.p);
        return api(`/api/proposals/${id}`, { method: 'POST', body: JSON.stringify(as) });
      },
    }) === null) return;
    await refresh();
    renderPv();
  }
  if (act === 'req-drop') {
    await api(`/api/requests/${el.dataset.id}`, { method: 'DELETE' });
    await refresh();
  }
  if (act === 'compare') {
    const p = pv;
    p.old ??= (await api(fileUrl(p.was, 'preview'))).sheets;
    p.cmp = !p.cmp;
    await loadSheets(p);

  const show = k => widths[k] ? $('.app').style.setProperty(`--${k}-w`, `${widths[k]}px`) : $('.app').style.removeProperty(`--${k}-w`);
  const keep = k => { show(k); localStorage.widths = JSON.stringify(widths); };
  for (const grip of document.querySelectorAll('.grip')) {
    const k = grip.dataset.pane;
    show(k);
    grip.addEventListener('pointerdown', e => {
      e.preventDefault();
      grip.setPointerCapture(e.pointerId);
      const from = panes[k].offsetWidth, x = e.clientX;
      grip.onpointermove = m => { widths[k] = from + (k === 'side' ? m.clientX - x : x - m.clientX); show(k); };
    });
    grip.addEventListener('lostpointercapture', () => {
      grip.onpointermove = null;
      if (widths[k]) widths[k] = panes[k].offsetWidth;
      keep(k);
    });
    grip.addEventListener('dblclick', () => { delete widths[k]; keep(k); });
  }
}
</script>
</body>
</html>
