<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rollforward</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Tokens and rules: docs/design.md. Blue = uploaded by a person, ink = made by the agent, red = a note. */
:root {
  --paper: #f6f7f8; --sheet: #ffffff; --rule: #e3e6ea; --rule-2: #cdd2d9;
  --ink: #15181d; --ink-2: #474e5b; --ink-3: #6b7280;
  --person: #1f48c7; --person-bg: #eef2fc; --note: #d42a1e; --edge: #a3aab4;
  --r1: 4px; --r2: 8px;
  --sans: "IBM Plex Sans", "Noto Sans", sans-serif; --mono: "IBM Plex Mono", "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; font: 14px/1.45 var(--sans); color: var(--ink); background: var(--paper); font-variant-numeric: tabular-nums; }
button { font: inherit; cursor: pointer; }
a { color: inherit; }
.app { display: grid; grid-template-columns: 236px 1fr auto; height: 100dvh; }

.side { border-right: 1px solid var(--rule); padding: 14px 10px; display: flex; flex-direction: column; overflow: auto; background: var(--paper); }
.row { display: flex; align-items: center; gap: 2px; min-height: 30px; padding: 0 4px 0 8px; border-radius: var(--r1); text-decoration: none; }
.row.adhoc { margin-top: 6px; border-top: 1px solid var(--rule); border-radius: 0; }
.row.adhoc .nm { font-style: italic; }
.row.wake, .row.req { font-size: 12px; color: var(--ink-2); }
.row .nm { flex: 0 1 auto; min-width: 45%; padding: 5px 0; text-decoration: none; overflow-wrap: anywhere; }
.row .n { flex: 1 1 0; min-width: 0; color: var(--ink-3); font-size: 12px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; padding-left: 6px; }
.head { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.ws { font-size: 14px; font-weight: 600; }
.tree { margin-left: 14px; padding-left: 4px; border-left: 1px solid var(--rule-2); }
.ser { font-size: 13.5px; color: var(--ink-2); }
.ser.on { color: var(--ink); font-weight: 600; }
.inst { font-size: 13px; color: var(--ink-2); }
.inst.on { background: #e7eaee; color: var(--ink); font-weight: 500; }
.inst .q, .waits .q { color: var(--note); }
.waits { margin-bottom: 8px; cursor: pointer; }
.wt { padding: 7px 0; border-bottom: 1px solid var(--rule); }
.wt .btn { margin-left: 8px; }
.inst.abandoned .nm { text-decoration: line-through; }
.archived .nm { color: var(--ink-3); }
.add { all: unset; cursor: pointer; flex: none; width: 24px; height: 24px; display: grid; place-items: center; border-radius: var(--r1); color: var(--ink-3); font-size: 17px; line-height: 1; }
.add:hover { background: var(--rule); color: var(--ink); }
.quiet { display: block; padding: 5px 8px; font-size: 12px; color: var(--ink-3); background: none; border: 0; text-align: left; }
.vl { padding: 14px 16px; display: grid; gap: 10px; align-content: start; font-size: 13.5px; }
.vl h3 { margin: 4px 0 0; font-size: 13px; font-weight: 600; }
.vl .sub { color: var(--ink-3); font-size: 12.5px; }
.vl hr { width: 100%; margin: 6px 0 0; border: 0; border-top: 1px solid var(--rule); }
.vl input[type=text] { font: inherit; padding: 7px 9px; border: 1px solid var(--rule-2); border-radius: var(--r1); }
.pv.small { inset: 12vh auto auto 50%; transform: translateX(-50%); width: min(420px, 92vw); max-height: 80dvh; }
.vl label { display: flex; align-items: center; gap: 8px; }
.adv-set { display: grid; gap: 10px; border-top: 1px solid var(--rule); padding-top: 10px; }
.adv-set summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
.twisty { all: unset; flex: none; width: 20px; height: 20px; display: grid; place-items: center; border-radius: var(--r1); color: var(--ink-2); font-size: 15px; cursor: pointer; }
button.twisty:hover { background: var(--rule); color: var(--ink); }
.vl textarea { font: 12.5px/1.5 var(--mono); padding: 7px 9px; border: 1px solid var(--rule-2); border-radius: var(--r1); resize: vertical; min-height: 4.5em; }
.vl :is(input[type=email], input[type=password], select) { font: inherit; padding: 7px 9px; border: 1px solid var(--rule-2); border-radius: var(--r1); background: var(--sheet); min-width: 0; max-width: 100%; }
.vl .row2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ut { border-collapse: collapse; font-size: 12.5px; width: 100%; }
.ut td, .ut th { border-top: 1px solid var(--rule); padding: 6px 6px 6px 0; text-align: left; vertical-align: top; }
.ut th { font-weight: 500; color: var(--ink-3); }
.ut select { max-width: 100px; }
.acct { padding: 14px 8px 0; font-size: 12.5px; color: var(--ink-2); border-top: 1px solid var(--rule); margin-top: 10px; }
.acct .mail { color: var(--ink-3); font-size: 12px; word-break: break-all; }
.acct .quiet { display: inline-block; padding: 4px 10px 0 0; }
@media (max-width: 560px) { .ut th:nth-child(3), .ut td:nth-child(3), .ut th:nth-child(4), .ut td:nth-child(4) { display: none; } }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--note); display: inline-block; margin-left: 6px; vertical-align: 1px; }
.dot.k { background: var(--ink); }
.legend { margin-top: auto; font-size: 12px; color: var(--ink-2); padding: 16px 8px 4px; display: grid; gap: 4px; }
.legend i { font-style: normal; font-weight: 600; }
.legend .p { color: var(--person); }
.legend .tri { display: inline-block; width: 0; height: 0; border-top: 9px solid var(--ink-3); border-left: 9px solid transparent; margin-right: 6px; }
.legend .dash { display: inline-block; width: 16px; height: 10px; border: 1px dashed var(--ink-3); border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

.main { display: flex; flex-direction: column; min-width: 0; height: 100dvh; position: relative; container: main / inline-size; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 28px; border-bottom: 1px solid var(--rule); background: var(--sheet); }
.menu { display: none; border: 1px solid var(--rule-2); background: var(--sheet); border-radius: var(--r1); padding: 6px 10px; }
.crumb { font-size: 13px; color: var(--ink-3); }
.bar h1 { margin: 2px 0 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.ren { all: unset; cursor: pointer; color: var(--ink-3); font-size: 15px; font-weight: 400; margin-left: 6px; }
.ren:hover { color: var(--ink); }
.state { margin-left: auto; font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
/* With a side panel open the bar's buttons come first; the run's state shows again on the sidebar and in Advanced. */
@container main (min-width: 801px) and (max-width: 940px) { .state { display: none; } .bar > div:first-of-type { margin-right: auto; } }
.btn { border: 1px solid var(--rule-2); background: var(--sheet); color: var(--ink); border-radius: var(--r1); padding: 7px 12px; font-size: 13px; font-weight: 500; white-space: nowrap; text-decoration: none; display: inline-block; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.commit { background: var(--person); border-color: var(--person); color: #fff; }
.btn.danger { color: var(--note); border-color: var(--note); }
.btn:disabled { background: var(--sheet); color: var(--ink-3); border-color: var(--rule-2); cursor: default; }
.btn.sel { background: var(--paper); box-shadow: inset 0 1px 2px rgba(0,0,0,.08); }

.panes { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: minmax(0, 1fr); position: relative; padding-bottom: 46px; }
.pane { padding: 22px 28px 20px; display: flex; flex-direction: column; position: relative; overflow: auto; min-width: 0; scrollbar-gutter: stable; }
/* Always-visible scrollbars, so a long list of inputs or outputs shows it goes on (Edge's overlay scrollbars hide until hovered). */
.pane::-webkit-scrollbar { width: 10px; height: 10px; }
.pane::-webkit-scrollbar-track { background: var(--rule); }
.pane::-webkit-scrollbar-thumb { background: var(--edge); border: 2px solid var(--rule); border-radius: 6px; }
.pane::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }
@supports not selector(::-webkit-scrollbar) { .pane { scrollbar-width: thin; scrollbar-color: var(--edge) var(--rule); } }
.flow { grid-area: 1 / 1; }
.outs { grid-area: 1 / 2; overflow: hidden auto; border-left: 1px solid var(--rule); }
.cols { display: flex; gap: 64px; align-items: start; }
.col { width: 216px; flex: none; display: grid; gap: 10px; align-content: start; }
.edges { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.edges path { fill: none; stroke: var(--edge); stroke-width: 1.25; }
.edges path.hot { stroke: var(--ink); stroke-width: 1.5; }
.edges marker path { fill: var(--edge); stroke: none; }
.edges #arrow-hot path { fill: var(--ink); }
.pane.busy::before { content: ''; position: absolute; top: 0; left: -30%; width: 30%; height: 2px; background: var(--ink); animation: stripe 1.4s ease-in-out infinite; }
@keyframes stripe { to { left: 100%; } }
.pane.drag::after { content: '+ Add'; position: absolute; top: 20px; right: 28px; font-weight: 600; color: var(--person); }
.pane.drag .ph .btn { visibility: hidden; }
.pane.drag { background: var(--person-bg); }
/* A pane's heading, with + Add files, stays in view while its tiles scroll under it. */
.ph { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; min-height: 26px; margin: -22px 0 4px; padding: 22px 0 6px; position: sticky; top: -22px; z-index: 4; background: var(--paper); }
.pane.drag .ph { background: var(--person-bg); }
.ph h2 { margin: 0; font-size: 15px; font-weight: 600; }
.ph .c { font-size: 13px; color: var(--ink-3); }
.ph .btn { margin-left: auto; padding: 4px 10px; font-size: 12px; }
.tile { position: relative; z-index: 2; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r1); padding: 11px 12px 10px; min-height: 96px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; text-align: left; }
.tile.on, .tile.drag { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.ext { font: 500 10px/1 var(--mono); letter-spacing: .04em; color: var(--ink-3); display: flex; justify-content: space-between; align-items: baseline; }
.nc { font: 500 11.5px/1 var(--sans); letter-spacing: 0; color: var(--ink-3); padding-right: 10px; }
.nc.q, .legend .tri.q { color: var(--note); border-top-color: var(--note); }
.fn { font-size: 13px; font-weight: 500; line-height: 1.32; word-break: break-word; }
.file { font-size: 12px; color: var(--ink-3); word-break: break-word; }
.from { display: none; font-size: 12px; color: var(--ink-3); }
.tile.person .fn, .tile.person .meta b { color: var(--person); }
.meta { margin-top: auto; font-size: 12px; color: var(--ink-3); }
.meta b { font-weight: 500; color: var(--ink); }
.corner { position: absolute; top: -1px; right: -1px; width: 0; height: 0; border-top: 12px solid var(--ink-3); border-left: 12px solid transparent; border-top-right-radius: var(--r1); }
.tile.ghost { background: transparent; border: 1px dashed var(--rule-2); }
.tile.ghost .fn { color: var(--ink-2); font-weight: 400; }
.tile.fresh::before { content: ''; position: absolute; top: 9px; left: -4px; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); }
.tile.flash { animation: flash 1.4s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 4px var(--rule-2); } }
.corner.ask { border-top-color: var(--note); animation: ask 1.6s ease-in-out infinite; }
@keyframes ask { 50% { opacity: .3; } }
.prog { margin-top: auto; height: 3px; background: var(--rule); border-radius: 2px; }
.prog i { display: block; height: 100%; background: var(--person); border-radius: 2px; }
#toasts { position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%); z-index: 60; display: grid; gap: 6px; justify-items: center; }
.toast { background: var(--note); color: #fff; padding: 9px 14px; border-radius: var(--r1); font-size: 13px; max-width: min(560px, 92vw); white-space: pre-wrap; animation: fade 6s forwards; }
.toast.ok { background: var(--ink); }
@keyframes fade { 85% { opacity: 1; } to { opacity: 0; } }
.hint { margin-top: auto; padding-top: 18px; font-size: 12px; color: var(--ink-3); }
.hl { font-size: 12px; line-height: 1.35; }
.src { font-size: 11.5px; color: var(--ink-3); word-break: break-all; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.also { margin-top: 16px; font-size: 12.5px; display: grid; gap: 4px; }
.also .ah { font-size: 12px; color: var(--ink-3); }
.also .via { color: var(--ink-3); }
a[data-act=preview], a[data-act=opencard] { text-decoration: underline; cursor: pointer; }
.cites { margin-top: 6px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.pv { position: fixed; inset: 4vh 4vw; z-index: 40; background: var(--sheet); border: 1px solid var(--rule-2); border-radius: var(--r2); box-shadow: 0 6px 24px rgba(21,24,29,.18); display: flex; flex-direction: column; }
.pvh { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--rule); }
.pvh b { font-size: 13px; word-break: break-all; margin-right: auto; }
.tabs { display: flex; gap: 6px; padding: 8px 14px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); }
.tabs .btn { padding: 4px 9px; font-size: 12px; }
.pvb { flex: 1; min-height: 0; overflow: auto; }
.pvb .say { padding: 14px 18px; white-space: pre-wrap; font-size: 13.5px; }
.pvb pre { white-space: pre-wrap; word-break: break-word; font: 12.5px/1.5 var(--mono); padding: 14px 16px; margin: 0; }
.pvb img { max-width: 100%; display: block; margin: 12px auto; }
.sh { border-collapse: collapse; font: 12px/1.3 var(--mono); }
.sh th, .sh td { border: 1px solid var(--rule); padding: 3px 6px; white-space: nowrap; }
.sh th { position: sticky; top: 0; background: var(--paper); color: var(--ink-3); font-weight: 500; z-index: 2; }
.sh th:first-child { left: 0; z-index: 3; }
.sh td.rn { position: sticky; left: 0; z-index: 1; background: var(--paper); color: var(--ink-3); text-align: right; }
.sh td.num { text-align: right; }
.sh td.fx { color: var(--ink-3); font-style: italic; }
.sh td.chg { background: #fdf0c4; cursor: pointer; }
.sh td.noted { position: relative; cursor: pointer; }
.sh td.noted::after { content: ''; position: absolute; top: -1px; right: -1px; border-top: 9px solid var(--ink-3); border-left: 9px solid transparent; }
.sh td.noted.q::after { border-top-color: var(--note); }
.pvn { padding: 10px 16px; border-top: 1px solid var(--rule); font-size: 13px; white-space: pre-wrap; }
.pvn:empty { display: none; }
.empty { color: var(--ink-3); font-size: 13px; padding: 40px 28px; }

.card { position: fixed; z-index: 20; width: 396px; max-height: 80dvh; overflow: auto; background: var(--sheet); border: 1px solid var(--rule-2); border-radius: var(--r2); box-shadow: 0 3px 10px rgba(21,24,29,.10); padding: 14px 16px 12px; }
.card .cf { font-weight: 600; font-size: 13px; word-break: break-word; }
.card .cp { font-size: 12px; color: var(--ink-3); margin: 2px 0 10px; }
.card .cp b { font-weight: 500; color: var(--ink); }
.card .cp b.p { color: var(--person); }
.nb { border-top: 1px solid var(--rule); padding: 10px 0 2px; font-size: 13px; white-space: pre-wrap; }
.ref { font: 500 11px/1.6 var(--mono); color: var(--ink); background: #eceff3; border-radius: 3px; padding: 1px 5px; margin-right: 6px; }
.choices { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 6px; white-space: normal; }
.choice { border: 1px solid var(--rule-2); background: var(--sheet); border-radius: var(--r1); padding: 6px 10px; font-size: 12.5px; font-weight: 500; color: var(--ink); text-align: left; }
.choice.def { border-color: var(--ink); }
.choice.picked { background: var(--ink); color: #fff; border-color: var(--ink); }
.choice:disabled:not(.picked) { color: var(--ink-3); }
.by { font-size: 11.5px; color: var(--ink-3); white-space: normal; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; border-top: 1px solid var(--rule); padding-top: 10px; margin-top: 8px; }

.adv { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--sheet); border-top: 1px solid var(--rule-2); font-size: 13px; color: var(--ink-2); }
.adv.open { box-shadow: 0 -6px 20px rgba(21,24,29,.08); }
.adv .ab { display: flex; flex-shrink: 0; align-items: center; gap: 14px; height: 46px; padding: 0 28px; cursor: pointer; white-space: nowrap; overflow: hidden; }
.adv .ab .t { color: var(--ink); font-weight: 600; }
.adv .ab .t::before { content: "▸ "; color: var(--ink-3); }
.adv.open .ab .t::before { content: "▾ "; }
.adv .ab .s { overflow: hidden; text-overflow: ellipsis; }
.adv .ab .r { margin-left: auto; color: var(--ink-3); font-size: 12px; }
.adv .body { display: none; height: min(476px, 60dvh); border-top: 1px solid var(--rule); grid-template-rows: 1fr auto; background: var(--paper); }
.adv.open .body { display: grid; }
.trace { overflow: auto; padding: 4px 28px 14px; }
.trace .rh { font-size: 12px; font-weight: 600; color: var(--ink-3); margin: 14px 0 6px; padding-top: 12px; border-top: 1px solid var(--rule); }
.trace .rh:first-child { border-top: 0; }
.trace .trig { font-size: 12.5px; color: var(--ink-2); margin: 2px 0 6px; }
.trace .say { margin: 10px 0; color: var(--ink); white-space: pre-wrap; }
.trace .say.reply { border-left: 3px solid var(--ink); padding-left: 12px; }
.say table { border-collapse: collapse; margin: 4px 0; white-space: normal; }
.say td { border: 1px solid var(--rule); padding: 3px 8px; font-size: 12.5px; }
.say tr:first-child td { font-weight: 600; background: var(--sheet); }
.trace details { font-size: 12.5px; color: var(--ink-2); margin: 4px 0; }
.trace details details { margin-left: 14px; }
.trace summary { cursor: pointer; list-style: none; }
.trace summary::-webkit-details-marker { display: none; }
.trace summary::before { content: '▸'; display: inline-block; width: 14px; color: var(--ink-3); vertical-align: top; }
.trace details[open] > summary::before { content: '▾'; }
.trace summary b { color: var(--ink); font-weight: 500; }
.trace .cmd { display: inline-block; max-width: calc(100% - 20px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: top; }
.trace code, .trace .res { font: 12px var(--mono); }
.trace .res { color: var(--ink-3); padding-left: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trace pre { margin: 4px 0 8px 14px; padding: 8px 10px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r1); white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; font: 11.5px/1.5 var(--mono); }
.trace .bad { color: var(--note); }
.spin { display: inline-block; width: 8px; height: 8px; border: 2px solid var(--rule-2); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; }
@keyframes spin { to { transform: rotate(360deg); } }
.compose { border-top: 1px solid var(--rule); background: var(--sheet); padding: 10px 28px 14px; display: flex; gap: 8px; }
.compose input { flex: 1; min-width: 0; background: var(--sheet); border: 1px solid var(--rule-2); border-radius: var(--r1); padding: 8px 10px; font: inherit; }

.log { display: none; width: 352px; border-left: 1px solid var(--rule); background: var(--sheet); height: 100dvh; overflow: auto; }
.log.open { display: block; }
.conv { padding: 4px 20px 20px; display: grid; gap: 8px; }
.proc div { white-space: pre-wrap; font-size: 13px; line-height: 1.5; padding: 0 4px; }
.proc .ins { background: #e6f4ea; }
.proc .del { background: #fdecea; text-decoration: line-through; color: var(--ink-3); }
.conv h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin: 12px 0 0; }
.conv textarea { font: inherit; padding: 7px 9px; border: 1px solid var(--rule-2); border-radius: var(--r1); resize: vertical; width: 100%; }
.conv input[type=file] { font-size: 12px; color: var(--ink-3); }
.conv .post { white-space: pre-wrap; }
.thread { border: 1px solid var(--rule); border-radius: var(--r1); padding: 8px 10px; display: grid; gap: 6px; }
.thread.resolved { opacity: .6; }
.thread .on, .post .tm { color: var(--ink-3); font-size: 12px; }
.post b.p { color: var(--person, #1d4ed8); }
.log .lh { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--sheet); }
.log .lh b { font-size: 15px; font-weight: 600; }
.e { display: grid; grid-template-columns: 46px 1fr; gap: 6px; padding: 10px 20px; border-bottom: 1px solid var(--rule); font-size: 13px; }
.e .tm { color: var(--ink-3); font-size: 12px; padding-top: 1px; }
:is(.e, .trig) .w { font-weight: 600; }
:is(.e, .trig) .w.p { color: var(--person); }
:is(.e, .trig) .d { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
:is(.e, .trig) .f { font: 11.5px var(--mono); color: var(--ink-3); margin-top: 3px; word-break: break-all; }

@media (max-width: 800px) {
  .app { display: block; }
  .side { position: fixed; inset: 0 auto 0 0; width: 280px; z-index: 30; display: none; box-shadow: 0 0 40px rgba(0,0,0,.2); }
  .side.open { display: flex; }
  .menu { display: inline-block; }
  .bar { padding: 10px 14px; }
  .bar h1 { font-size: 17px; }
  .state { margin-left: 0; order: 5; width: 100%; }
  .bar .btn.top { padding: 6px 9px; font-size: 12px; }
  .panes { display: block; overflow: auto; padding-bottom: 60px; }
  .pane { padding: 16px 14px; overflow: clip; }
  .ph { position: static; margin: 0 0 4px; padding: 0; background: none; }
  .outs { border-left: 0; border-bottom: 1px solid var(--rule); }
  .cols { display: block; }
  .col { width: auto; grid-template-columns: repeat(2, 1fr); }
  .col > :not(.tile) { grid-column: 1 / -1; }
  .col + .col { margin-top: 18px; }
  .ph:empty, .edges { display: none; }
  .from { display: block; }
  .hint { display: none; }
  .card { left: 0 !important; right: 0; bottom: 0; top: auto !important; width: auto; max-height: 75dvh; border-radius: 12px 12px 0 0; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  .adv { position: fixed; }
  .adv .ab { padding: 0 14px; }
  .adv.open { top: 0; display: flex; flex-direction: column; }
  .adv.open .body { height: auto; flex: 1; min-height: 0; }
  .trace, .compose { padding-left: 14px; padding-right: 14px; }
  .log.open { position: fixed; inset: 0; width: auto; z-index: 25; }
  .pv { inset: 0; border-radius: 0; }
  .sh td { max-width: 24ch; overflow: hidden; text-overflow: ellipsis; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main">
    <div class="bar" id="bar"></div>
    <div class="panes" id="panes">
      <section class="pane outs" id="outs" data-pane="out"></section>
      <section class="pane flow" id="flow" data-pane="in"></section>
      <svg class="edges" id="edges"></svg>
    </div>
    <div class="adv" id="adv">
      <div class="ab" id="advbar"></div>
      <div class="body">
        <div class="trace" id="trace"></div>
        <div class="compose" id="compose"><button class="btn" type="button" id="interrupt">Interrupt</button></div>
      </div>
    </div>
  </main>
  <aside class="log" id="log"></aside>
</div>
<div class="card" id="card" hidden></div>
<div class="pv" id="pv" hidden></div>
<input type="file" id="picker" multiple hidden>
<div id="toasts"></div>
<script>
const $ = s => document.querySelector(s);
const enc = encodeURIComponent;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const usd = n => '$' + n.toFixed(2);
function took(e) {
  const s = Math.round((Date.parse(e.at) - Date.parse(data.log.find(r => r.op === 'run' && r.run === e.run).at)) / 1000);
  return `${s >= 60 ? Math.floor(s / 60) + 'm ' : ''}${s % 60}s`;
}
const when = iso => new Date(iso).toLocaleString([], { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
const hhmm = iso => iso ? new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }) : '';
const fname = f => f.split('/').pop();
function fileUrl(path, kind = 'files') {
  const m = path.match(/^\.\.\/([^/]+)\/(.*)$/), id = m ? cur.s.instances.find(i => i.label === m[1])?.id : cur.i.id;
  return `/${kind}/${id}/${(m ? m[2] : path).split('/').map(enc).join('/')}`;
}
const ext = f => (f && f.includes('.') ? f.split('.').pop() : '').toUpperCase();

let tree = [], expired = [], cur = null, data = null, lines = [], linesKey = '', openItem = null, hover = null, showClosed = false, showArchived = false, pv = null, me = null;
let seen = {}, prevSigs = {}, uploads = [], shown = '', refreshes = 0;
const sig = i => `${i.file}|${i.notes?.length ?? 0}|${i.headline ?? ''}`;

function markSeen(items) {
  for (const i of items) seen[i.id] = sig(i);
  localStorage[`seen:${instPath()}`] = JSON.stringify(seen);
}

function toast(text, kind = '') {
  const el = Object.assign(document.createElement('div'), { className: `toast ${kind}`, textContent: text });
  $('#toasts').append(el);
  setTimeout(() => el.remove(), 6000);
}
const folds = new Map();
const ui = { adv: false, log: false, conv: false, on: null, proc: false };
let proc = { key: '', html: '' };
const drawn = new WeakMap();

function put(el, html) {
  if (drawn.get(el) !== html) el.innerHTML = html;
  drawn.set(el, html);
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  const t = await r.text();
  if (r.status === 401) location.reload();
  if (!r.ok) { toast(t); throw new Error(t); }
  try { return JSON.parse(t); } catch { return t; }
}

// The page's address is #/ID, of an instance, a series or a workspace; cur holds the tree's entries for them.
const seriesPath = c => `/api/series/${c.s.id}`;
const instPath = () => `/api/instances/${cur.i.id}`;
const go = id => { location.hash = '#/' + id; };

async function refresh() {
  me ??= await api('/me');
  const n = ++refreshes, [t, mine] = await Promise.all([api('/api'), api('/logins')]);
  const id = location.hash.slice(2), all = t.flatMap(w => [[w], ...w.series.flatMap(s => [[w, s], ...s.instances.map(i => [w, s, i])])]);
  let [w, s, i] = all.find(e => e.at(-1).id === id) ?? [t.find(w => !w.archived)];
  s ??= w?.series.find(s => !s.archived && !s.adhoc) ?? w?.series.find(s => !s.archived);
  i ??= s?.instances.find(i => i.status === 'open') ?? s?.instances.at(-1);
  const path = i ? `/api/instances/${i.id}` : '', [d, st] = path ? await fetchInstance(path) : [null, null];
  if (n !== refreshes) return;
  [tree, expired] = [t, mine.filter(l => l.expired)];
  land(w && { w, s, i }, path, d, st);
}

// Instances changed: each one's row in the sidebar, and the open one's data. One the sidebar lacks takes a full refresh.
async function patch(ids) {
  const rows = tree.flatMap(w => w.series.flatMap(s => s.instances)), others = ids.filter(id => id !== cur?.i?.id);
  const sums = await Promise.all(others.map(id => api(`/api/instances/${id}/summary`)));
  if (sums.some(x => !rows.some(r => r.id === x.id))) return refresh();
  for (const x of sums) Object.assign(rows.find(r => r.id === x.id), x);
  if (others.length === ids.length) return render();
  const n = ++refreshes, path = shown, [[d, st], sum] = await Promise.all([fetchInstance(path), api(`${path}/summary`)]);
  if (n !== refreshes) return;
  Object.assign(cur.i, sum);
  land(cur, path, d, st);
}

// An instance's data, and its trace when Advanced is open and the trace may have moved.
async function fetchInstance(path) {
  const d = await api(path), key = `${path}:${d.log.length}`;
  return [d, ui.adv && (d.run || key !== linesKey) ? [await api(path + '/trace'), key] : null];
}

function land(next, path, d, st) {
  const was = data && path === shown ? lastDone()?.seq ?? 0 : undefined;
  [cur, data, shown] = [next, d, path];
  if (st) [lines, linesKey] = st;
  const done = data && lastDone();
  if (done && was !== undefined && done.seq > was) toast(done.error ? `Run ${done.run} failed: ${done.error}` : `Run ${done.run} finished${done.summary ? ': ' + done.summary : ''}`, done.error ? '' : 'ok');
  if (data) localStorage[`rev:${path}`] = data.doc.rev;
  render();
}

function render() {
  const qs = tree.filter(w => !w.archived).flatMap(w => w.series.filter(s => !s.archived).flatMap(s => s.instances)).reduce((t, i) => t + i.questions.filter(e => e === me.email).length, 0);
  document.title = `${qs ? `(${qs}) ` : ''}${cur?.i ? cur.i.label + ' \u00b7 ' : ''}rollforward`;
  renderSide();
  renderBar();
  renderPanes();
  renderLog();
  renderAdv();
  renderCard();
}

function renderSide() {
  const listed = (x, on) => !x.archived || showArchived || on;
  const asks = s => !s.archived && s.instances.some(i => i.questions.length);
  const btn = (act, title, glyph) => `<button class="add" data-act="${act}" title="${title}">${glyph}</button>`;
  const waits = waiting().length;
  let h = waits ? `<div class="row waits"><a class="nm" data-act="waiting">Waiting on you<span class="q"> ${waits}</span></a></div>` : '';
  h += `<div class="row head"><span class="nm">Workspaces</span>${btn('new-workspace', 'New workspace', '+')}</div>`;
  for (const w of tree) {
    const won = cur?.w.id === w.id;
    if (!listed(w, won)) continue;
    h += `<div class="row ws ${w.archived ? 'archived' : ''}"><a class="nm" href="#/${w.id}">${esc(w.name)}${!won && w.series.some(asks) ? '<span class="dot"></span>' : ''}</a>`
      + (won ? btn('workspace-settings', 'Workspace settings', '\u22EF') + btn('new-series', 'New series', '+') : w.archived ? '<span class="n">archived</span>' : '') + '</div>';
    if (!won) continue;
    h += '<div class="tree">';
    for (const s of [...w.series.filter(s => !s.adhoc), ...w.series.filter(s => s.adhoc)]) {
      const on = cur.s?.id === s.id, open = s.instances.filter(i => i.status === 'open');
      if (!listed(s, on)) continue;
      // A series that wakes itself but has nothing open and no wake set has a broken chain.
      const broken = s.allow_wakes && !open.length && !s.wake && !s.requests.length;
      const note = s.archived ? 'archived' : broken ? '<span class="q">no wake set</span>' : s.requests.length ? `<span class="q">${s.requests.length} to start</span>` : open.length ? `${open.length} open` : s.wake ? `wakes ${when(s.wake.at)}` : '';
      h += `<div class="row ser ${on ? 'on' : ''} ${s.archived ? 'archived' : ''} ${s.adhoc ? 'adhoc' : ''}"><a class="nm" href="#/${s.id}">${esc(s.name)}${!on && asks(s) ? '<span class="dot"></span>' : ''}</a>`
        + (on ? btn('settings', 'Series settings', '\u22EF') + btn('new-instance', 'New instance', '+') : `<span class="n">${note}</span>`) + '</div>';
      if (!on) continue;
      const closed = s.instances.length - open.length;
      h += '<div class="tree">';
      if (s.wake) h += `<div class="row wake"><span class="nm">Starts ${esc(s.wake.label)} ${when(s.wake.at)}</span><span class="n" title="${esc(s.wake.reason)}">wake</span></div>`;
      for (const r of s.requests) h += `<div class="row req"><span class="nm" title="${esc(r.reason)}">${esc(r.from.split('/').slice(-2).join(' · '))} asks to start ${esc(r.label)}</span>`
        + `<button class="add" data-act="req-start" data-id="${r.id}" title="Start it">\u25B6</button><button class="add" data-act="req-drop" data-id="${r.id}" title="Dismiss">\u00D7</button></div>`;
      for (const i of s.instances.filter(i => i.status === 'open' || showClosed || i.id === cur.i?.id)) {
        const st = i.running ? '<span class="spin"></span> running' : i.queued ? '\u29D7 queued' : i.questions.length ? `<span class="q">${i.questions.length} question${i.questions.length > 1 ? 's' : ''}</span>` : i.wake ? `wakes ${when(i.wake)}` : i.status === 'open' ? '' : i.status;
        const k = `rev:/api/instances/${i.id}`;
        localStorage[k] ??= i.rev;
        h += `<a class="row inst ${i.status} ${cur.i?.id === i.id ? 'on' : ''}" href="#/${i.id}"><span class="nm">${esc(i.label)}${i.rev > +localStorage[k] ? '<span class="dot k"></span>' : ''}</span><span class="n">${st}</span></a>`;
      }
      if (closed) h += `<button class="quiet" data-act="toggle-closed">${showClosed ? 'Hide' : 'Show'} closed (${closed})</button>`;
      h += '</div>';
    }
    h += '</div>';
  }
  const archived = tree.filter(w => w.archived).length + (cur?.w.series.filter(s => s.archived).length ?? 0);
  if (archived) h += `<button class="quiet" data-act="toggle-archived">${showArchived ? 'Hide' : 'Show'} archived (${archived})</button>`;
  h += `<div class="legend"><div><i class="p">Blue</i> uploaded by a person</div><div><i>Black</i> made by the agent</div><div><span class="tri"></span>a note, for information</div><div><span class="tri q"></span>a question for you</div><div><span class="dash"></span>expected, not there yet</div></div>`;
  h += `<div class="acct"><div>${esc(me.name)}${me.role === 'user' ? '' : ' · ' + me.role}</div><div class="mail">${esc(me.email)}</div>`
    + '<button class="quiet" data-act="logins">Logins</button><button class="quiet" data-act="tokens">Tokens</button><button class="quiet" data-act="guidance">Guidance</button><button class="quiet" data-act="skills">Skills</button>' + (me.role === 'admin' ? '<button class="quiet" data-act="people">People</button>' : '') + '<button class="quiet" data-act="signout">Sign out</button></div>';
  put($('#side'), h);
}

function lastDone() { return data.log.findLast(e => e.op === 'done'); }

const stepText = s => `${s.do}${s.target ? ` ${s.target}` : ''}${s.value !== undefined ? ` = "${s.value}"` : ''}`;

function renderBar() {
  let h = `<button class="menu" data-act="menu">☰</button>`;
  h += `<div><div class="crumb">${esc(cur?.w.name ?? '')}${cur?.s ? ' · ' + esc(cur.s.name) : ''}</div><h1>${esc(cur?.i?.label ?? 'No instance')}${data?.doc.status === 'open' ? '<button class="ren" data-act="rename" title="Rename">\u270E</button>' : ''}</h1></div>`;
  if (data) {
    const d = lastDone();
    const state = data.doc.status !== 'open' ? `${data.doc.status === 'closed' ? 'Closed' : 'Abandoned'} · read-only` : data.run ? `<span class="spin"></span>Agent working · run ${data.run.n}` : data.queued ? '\u29D7 Queued' : d ? `Agent idle · last run ${hhmm(d.at)}` : 'Waiting for files';
    h += `<div class="state">${state}</div>`;
    const talk = threadsOf().filter(t => !t.resolved).length + openQuestions().length;
    h += `<button class="btn top ${ui.proc ? 'sel' : ''}" data-act="proc">Process</button><button class="btn top ${ui.conv ? 'sel' : ''}" data-act="conv">Conversation${talk ? ` (${talk})` : ''}</button><button class="btn top ${ui.log ? 'sel' : ''}" data-act="log">Ops log</button>`;
    const off = data.run ? 'disabled title="Available when the run ends"' : '';
    if (data.doc.status === 'open') h += `<button class="btn danger top" data-act="abandon" ${off}>Abandon</button>`
      + (data.runner.by === me.email ? `<button class="btn commit top" data-act="close" ${off}>Close instance</button>`
        : `<button class="btn top" data-act="takeover" title="${esc(data.runner.by)} runs it: their logins, their sign-off. Taking over makes it yours.">Take over</button>`);
    else h += `<button class="btn top" data-act="duplicate">Duplicate</button>`;
    if (cur.s.adhoc) h += `<button class="btn top" data-act="promote" title="Move this one-off into a new series, as its first instance">Make it a series</button>`;
  }
  put($('#bar'), h);
}

function questionState(note) {
  const a = data.log.findLast(e => e.op === 'answer' && e.note === note.id);
  return a ? a.choice : null;
}

function provenance(file) {
  if (file.startsWith('upload/')) {
    const e = data.log.find(e => e.op === 'upload' && e.file === file);
    return { person: true, by: e?.by ?? 'someone', at: e?.at };
  }
  const e = data.log.find(e => e.op === 'point' && e.file === file);
  return { person: false, by: 'Agent', at: e?.at };
}

function tile(item) {
  const notes = item.notes ?? [];
  const open = notes.filter(n => n.options && questionState(n) === null).length;
  const count = open ? `${open} question${open > 1 ? 's' : ''}` : notes.length ? `${notes.length} note${notes.length > 1 ? 's' : ''}` : '';
  const corner = notes.length ? `<span class="corner ${open ? 'ask' : ''}"></span>` : '';
  const mark = `${seen[item.id] !== sig(item) ? 'fresh' : ''} ${prevSigs[item.id] && prevSigs[item.id] !== sig(item) ? 'flash' : ''}`;
  const from = item.from?.length ? `<div class="from">from ${item.from.map(f => esc(data.doc.items.find(i => i.id === f).name)).join(', ')}</div>` : '';
  if (!item.file) {
    return `<div class="tile ghost ${mark}" data-item="${esc(item.id)}">${corner}<div class="ext"><span>${esc(item.kind.toUpperCase())}</span><span class="nc ${open ? 'q' : ''}">${count}</span></div><div class="fn">${esc(item.name)}</div>${from}<div class="meta">${item.kind === 'input' ? 'Missing' : 'Not built yet'}</div></div>`;
  }
  const p = provenance(item.file);
  const v = data.log.filter(e => e.op === 'point' && e.item === item.id && e.file).length;
  return `<div class="tile ${p.person ? 'person' : 'agent'} ${openItem === item.id ? 'on' : ''} ${mark}" data-item="${esc(item.id)}">${corner}<div class="ext"><span>${esc(ext(item.file))}${v > 1 ? ' · v' + v : ''}</span><span class="nc ${open ? 'q' : ''}">${count}</span></div><div class="fn">${esc(item.name)}</div><div class="file">${esc(fname(item.file))}</div>${item.headline ? `<div class="hl">${esc(item.headline)}</div>` : ''}${item.source ? `<div class="src">${esc(item.source)}</div>` : ''}${from}<div class="meta"><b>${esc(p.by)}</b> · ${hhmm(p.at)}</div></div>`;
}

function renderPanes() {
  $('#outs').hidden = !data;
  if (!data) {
    put($('#flow'), `<div class="empty">${cur?.s ? 'No instance yet. Make one with + by the series.' : cur ? 'No series yet. Make one with + by the workspace.' : 'No workspace yet. Make one with + by Workspaces.'}</div>`);
    return drawEdges();
  }
  const open = data.doc.status === 'open', stored = localStorage[`seen:${instPath()}`], items = data.doc.items;
  seen = stored ? JSON.parse(stored) : {};
  if (!stored) markSeen(items);
  const byId = new Map(items.map(i => [i.id, i])), depth = new Map();
  const d = i => {
    if (!depth.has(i.id)) depth.set(i.id, 1 + Math.max(0, ...(i.from ?? []).map(f => byId.get(f)).filter(p => p.kind === 'step').map(d)));
    return depth.get(i.id);
  };
  const cols = [items.filter(i => i.kind === 'input')], steps = items.filter(i => i.kind === 'step'), outs = items.filter(i => i.kind === 'output');
  for (const i of steps) (cols[d(i)] ??= []).push(i);
  const head = (title, list, pane) => `<div class="ph"><h2>${title}</h2><span class="c">${list.length ? `${list.filter(i => i.file).length} of ${list.length}` : ''}</span>${open && pane ? `<button class="btn" data-act="add" data-pane="${pane}">+ Add files</button>` : ''}</div>`;
  const adding = pane => uploads.filter(u => u.pane === pane && u.path === instPath()).map(u => `<div class="tile ghost"><div class="ext"><span>UPLOADING</span></div><div class="fn">${esc(u.f.name)}</div><div class="prog"><i style="width:${u.pct}%"></i></div></div>`).join('');
  const shown = new Set(items.map(i => i.file)), also = new Map();
  for (const i of items) for (const n of i.notes ?? []) for (const f of n.files ?? []) if (!shown.has(f) && !also.has(f)) also.set(f, i);
  const alsoUsed = also.size ? `<div class="also"><div class="ah">Also used</div>${[...also].map(([f, i]) => `<div><a data-act="preview" data-file="${esc(f)}">${esc(fname(f))}</a> <span class="via">· noted on <a data-act="opencard" data-item="${esc(i.id)}">${esc(i.name)}</a></span></div>`).join('')}</div>` : '';
  put($('#flow'), `<div class="cols">${cols.map((col, k) => `<div class="col">${k === 0 ? head('Inputs', col, 'in') : k === 1 ? head('Steps', steps) : '<div class="ph"></div>'}${col.map(tile).join('')}${k === 0 ? adding('in') + alsoUsed : ''}</div>`).join('')}</div>`
    + (open ? '<div class="hint">Drop files to add them. The agent decides what each one is.</div>' : ''));
  put($('#outs'), `<div class="col">${head('Outputs', outs, 'out')}${outs.map(tile).join('')}${adding('out')}</div>${open ? '<div class="hint">Drop a revised output here.</div>' : ''}`);
  $('#outs').classList.toggle('busy', !!data.run);
  prevSigs = Object.fromEntries(items.map(i => [i.id, sig(i)]));
  drawEdges();
}

function drawEdges() {
  if (!data || innerWidth <= 800) return void ($('#edges').innerHTML = '');
  const box = $('#panes').getBoundingClientRect(), items = data.doc.items, hot = hover ?? openItem, up = new Set(), down = new Set();
  const climb = id => { for (const f of items.find(i => i.id === id)?.from ?? []) if (!up.has(f)) { up.add(f); climb(f); } };
  const fall = id => { for (const i of items) if (i.from?.includes(id) && !down.has(i.id)) { down.add(i.id); fall(i.id); } };
  if (hot) { climb(hot); fall(hot); }
  const rects = new Map(items.map(i => [i.id, document.querySelector(`#panes .tile[data-item="${CSS.escape(i.id)}"]`).getBoundingClientRect()]));
  const mid = id => rects.get(id).top + rects.get(id).height / 2, byY = ids => ids.sort((p, q) => mid(p) - mid(q));
  const parents = new Map(items.map(i => [i.id, byY([...i.from ?? []])])), children = new Map(items.map(i => [i.id, byY(items.filter(c => c.from?.includes(i.id)).map(c => c.id))]));
  const port = (id, ends, other) => rects.get(id).top + rects.get(id).height * (ends.get(id).indexOf(other) + 1) / (ends.get(id).length + 1);
  const cols = [...document.querySelectorAll('#flow .col')].map(c => [...c.querySelectorAll('.tile')].map(t => t.getBoundingClientRect())).filter(ts => ts.length);
  let h = '';
  for (const i of items) for (const f of i.from ?? []) {
    const a = rects.get(f), b = rects.get(i.id), y1 = port(f, children, i.id), y2 = port(i.id, parents, f), lit = i.id === hot || up.has(i.id) || f === hot || down.has(f);
    let d;
    if (b.left > a.right) {
      // Cross each column in between at its nearest gap, so a line never seems to enter a tile it passes.
      const pts = [[a.right, y1]];
      for (const ts of cols.filter(ts => ts[0].left > a.right && ts[0].right < b.left)) {
        const y = pts.at(-1)[1], gaps = [ts[0].top - 14, ...ts.slice(1).map((t, k) => (ts[k].bottom + t.top) / 2), ts.at(-1).bottom + 14];
        const g = gaps.reduce((best, v) => (Math.abs(v - y) < Math.abs(best - y) ? v : best));
        pts.push([ts[0].left, g], [ts[0].right, g]);
      }
      pts.push([b.left, y2]);
      d = `M${pts[0][0] - box.left},${pts[0][1] - box.top}` + pts.slice(1).map(([x, y], k) => {
        const [px, py] = pts[k], mx = (px + x) / 2 - box.left;
        return k % 2 ? ` L${x - box.left},${y - box.top}` : ` C${mx},${py - box.top} ${mx},${y - box.top} ${x - box.left},${y - box.top}`;
      }).join('');
    } else {
      const x1 = a.right - box.left, x2 = b.right - box.left, c = Math.max(x1, x2) + 36;
      d = `M${x1},${y1 - box.top} C${c},${y1 - box.top} ${c},${y2 - box.top} ${x2},${y2 - box.top}`;
    }
    h += `<path class="${lit ? 'hot' : ''}" d="${d}" marker-end="url(#${lit ? 'arrow-hot' : 'arrow'})"/>`;
  }
  $('#edges').innerHTML = `<defs>${['arrow', 'arrow-hot'].map(id => `<marker id="${id}" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 8,4 0,8z"/></marker>`).join('')}</defs>${h}`;
}

const logLine = e => `<div class="e"><span class="tm">${hhmm(e.at)}</span><div>${logText(e)}</div></div>`;

function logText(e) {
  const person = e.by !== 'server' && e.by !== 'agent';
  const w = `<span class="w ${person ? 'p' : ''}">${esc(person ? e.by : e.by === 'agent' ? 'Agent' : 'Server')}</span>`;
  const item = id => esc(data.doc.items.find(i => i.id === id)?.name ?? id);
  const f = e.file ? `<div class="f"><a data-act="preview" data-file="${esc(e.file)}">${esc(e.file)}</a></div>` : '';
  return {
    create: () => `${w} opened the instance${e.from ? `<div class="d">Items carried over from ${esc(e.from)}.${e.fetch ? ' The agent starts fetching its inputs.' : ''}</div>` : ''}`,
    upload: () => `${w} uploaded ${e.pane === 'out' ? 'an output' : 'an input'}${e.onto ? ' onto ' + item(e.onto) : ''}${f}`,
    point: () => `${w} ${e.file ? 'showed' : 'cleared'} ${item(e.item)}${e.was ? `<div class="d">Replacing ${esc(fname(e.was))}</div>` : ''}${f}`,
    item: () => `${w} set up ${esc(e.name)}${e.from?.length ? `<div class="d">From ${e.from.map(item).join(', ')}</div>` : ''}${e.headline ? `<div class="d">${esc(e.headline)}</div>` : ''}${e.source ? `<div class="d">Source: ${esc(e.source)}</div>` : ''}`,
    note: () => `${w} noted on ${item(e.item)}<div class="d">${e.note.options ? 'Asked: ' : ''}${esc(e.note.text)}</div>`,
    unnote: () => `${w} removed a note on ${item(e.item)}`,
    remove: () => `${w} removed ${esc(e.item)} from the screen`,
    run: () => `Run ${e.run} started`,
    done: () => `Run ${e.run} finished${e.aborted ? ' (stopped)' : ''} · ${took(e)} · ${usd(e.cost)}${e.summary ? `<div class="d">${esc(e.summary)}</div>` : ''}${e.error ? `<div class="d">${esc(e.error)}</div>` : ''}`,
    answer: () => `${e.default ? 'Default applied' : w + ' answered'}<div class="d">${esc(e.text)}</div>`,
    interrupt: () => `${w} interrupted the run`,
    close: () => `${w} closed the instance`,
    abandon: () => `${w} abandoned the instance`,
    comment: () => e.by === 'agent' ? `${w} replied<div class="d">${esc(e.text)}</div>` : `${w} commented${e.item ? ` on ${item(e.item)}${e.ref ? ` at ${esc(e.ref)}` : ''}` : ''}<div class="d">${esc(e.text)}</div>`,
    say: () => `${w} replied<div class="d">${esc(e.text)}</div>`,
    steer: () => `${w} steered<div class="d">${esc(e.text)}</div>`,
    reply: () => `${w} replied<div class="d">${esc(e.text)}</div>`,
    resolve: () => `${w} resolved a thread`,
    report: () => `${w} reported on run ${e.run}<div class="d">${md(e.text)}</div>`,
    wake: () => `Woken${e.from ? ` by ${esc(e.from)}` : ''}<div class="d">${esc(e.reason)}</div>`,
    expired: () => `Waiting for ${esc(e.runner)} to sign in to ${e.login === 'm365' ? 'Microsoft 365' : esc(e.login)} again`,
    takeover: () => `${w} took over from ${esc(e.from)}${e.logins?.length ? `<div class="d">Logins: ${esc(e.logins.join(', '))}</div>` : ''}`,
    promote: () => `${w} made this one-off the first instance of ${esc(e.series)}`,
    egress: () => `Run ${e.run} ${e.allowed ? 'reached' : 'was refused'} ${esc(e.host)}`,
    files: () => `${w} ${e.action === 'get' ? `fetched ${esc(e.name)}` : `listed ${esc(e.target)}`} from Microsoft 365${e.file ? `<div class="f"><a data-act="preview" data-file="${esc(e.file)}">${esc(e.file)}</a></div>` : ''}`,
    mail: () => `${w} ${e.action === 'find' ? `looked in ${esc(e.mailbox)} for mail of ${esc(e.date)}: ${e.found} found` : `saved ${esc((e.saved ?? []).join(', '))}`}`,
    rename: () => `${w} renamed the instance from ${esc(e.from)}`,
    duplicate: () => `${w} made this instance as a copy of ${esc(e.from)}`,
    browser: () => e.action === 'get' ? `${w} fetched ${esc(e.from)} from the browser on ${esc(e.site)}${f}` : `${w} closed run ${e.run}'s browser${e.site ? ` on ${esc(e.site)}, in ${esc(e.login)}'s login` : ''}<div class="d">${e.error ? esc(e.error) : `${e.requests} requests${e.writes ? `, ${e.writes} writes` : ''}${e.blocked ? `, ${e.blocked} blocked` : ''}`}</div>${f}`,
    windows: () => `${w} ${{ open: 'opened a Windows machine', run: `ran ${esc(e.script)} on Windows: ${e.timed_out ? 'timed out' : `exit ${e.exit}`}`, put: `put ${esc(e.to)} on Windows`, get: `fetched ${esc(e.from)} from Windows`, screenshot: 'took a screenshot of Windows', close: `closed ${e.run ? `run ${e.run}'s` : 'the'} Windows machine` }[e.action]}${f}`,
    machines: () => `Run ${e.run}'s machines did not all close<div class="d">${esc(e.error)}</div>`,
    browse: () => `${w} used ${esc(e.system.toUpperCase())}<div class="d">${esc([e.action, ...e.args].join(' '))}</div>`,
    request: () => `${w} asked to write in ${esc(e.name)} (${esc(e.request)})<div class="d">${esc(e.description)}</div>${e.screenshot ? `<div class="f"><a data-act="preview" data-file="${esc(e.screenshot)}">${esc(e.screenshot)}</a></div>` : ''}`,
    approve: () => `${w} approved ${esc(e.request)}`,
    reject: () => `${w} rejected ${esc(e.request)}${e.reason ? `<div class="d">${esc(e.reason)}</div>` : ''}`,
    call: () => `${w} ${e.ok ? 'made' : 'could not make'} ${esc(e.request)} in ${esc(e.name)}<div class="d">${esc(e.error ?? e.text ?? '')}</div><div class="f"><a data-act="preview" data-file="${esc(e.screenshot)}">${esc(e.screenshot)}</a></div>`,
  }[e.op]?.() ?? `${w} ${esc(e.op)}`;
}

function renderLog() {
  $('#log').className = 'log' + ((ui.log || ui.conv || ui.proc) && data ? ' open' : '');
  if (!data) return;
  // A half-written comment or reply, or files picked for one, holds the conversation still until it's sent or cleared.
  const drafting = [...$('#log').querySelectorAll('textarea')].some(t => t.value.trim()) || [...$('#log').querySelectorAll('input[type=file]')].some(f => f.files.length);
  if (ui.conv) return drafting || put($('#log'), conversationHtml());
  if (ui.proc) {
    const key = `${cur.i.id}:${data.doc.rev}`;
    if (proc.key !== key) loadProcess(key);
    return put($('#log'), proc.html);
  }
  if (!ui.log) return;
  put($('#log'), `<div class="lh"><b>Ops log</b><button class="btn" data-act="log">Close</button></div>` + [...data.log].reverse().map(logLine).join(''));
}

function renderAdv() {
  $('#adv').className = 'adv' + (ui.adv ? ' open' : '');
  $('#adv').hidden = !data;
  if (!data) return;
  $('#compose').hidden = data.doc.status !== 'open';
  $('#interrupt').disabled = !data.run;
  const d = lastDone();
  const cost = data.log.reduce((t, e) => t + (e.cost ?? 0), 0) + (data.run?.cost ?? 0);
  const s = (data.run ? `Run ${data.run.n} running` : d ? `Run ${d.run} ${d.error ? 'failed' : 'finished'} ${hhmm(d.at)}${d.error ?? d.summary ? ' · ' + (d.error ?? d.summary) : ''}` : 'No runs yet') + (cost ? ` · ${usd(cost)} so far` : '');
  $('#advbar').innerHTML = `<span class="t">Advanced</span><span class="s">${esc(s)}</span><span class="r">${ui.adv ? 'Hide runs' : 'Show runs'}</span>`;
  if (!ui.adv) return;
  const trace = $('#trace'), atEnd = trace.scrollTop + trace.clientHeight >= trace.scrollHeight - 30;
  put(trace, traceHtml());
  if (atEnd) trace.scrollTop = trace.scrollHeight;
}

const VERB = { read: 'Read', bash: 'Ran', edit: 'Edited', write: 'Wrote' };
const NOUN = { read: 'file', bash: 'command', edit: 'file', write: 'file' };
const firstLine = t => t.trim().split('\n')[0];
const inline = s => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');

function md(text) {
  let h = '', rows = [];
  const table = () => { if (rows.length) h += `<table>${rows.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</table>`; rows = []; };
  for (const l of esc(text).split('\n')) {
    if (l.trim().startsWith('|')) { if (!/^[\s|:-]+$/.test(l)) rows.push(l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim())); continue; }
    table();
    h += inline(l.replace(/^(\s*)[-*] /, '$1\u2022 ').replace(/^#+ (.*)/, '<b>$1</b>')) + '\n';
  }
  table();
  return h.trimEnd();
}
const fold = (key, dflt, head, body) => `<details data-key="${key}" ${folds.get(key) ?? dflt ? 'open' : ''}><summary>${head}</summary>${body}</details>`;

function lineHtml(s, i) {
  const res = s.result === undefined ? (data.run ? '<span class="spin"></span>' : 'no result')
    : s.error ? `<span class="bad">${esc(firstLine(s.result) || 'failed')}</span>`
    : s.kind === 'read' ? `${s.lines} lines`
    : firstLine(s.result) ? esc(firstLine(s.result)) + (s.lines > 1 ? ` +${s.lines - 1} lines` : '') : 'no output';
  const target = s.kind === 'bash' ? s.text : s.text.split(`/${cur.s.name}/`).pop();
  return fold(`s${i}`, false, `<span class="cmd"><b>${VERB[s.kind] ?? esc(s.kind)}</b> <code>${esc(firstLine(target))}</code></span><div class="res">⎿ ${res}</div>`,
    `<pre>${esc(s.text)}</pre>${s.result ? `<pre class="${s.error ? 'bad' : ''}">${esc(s.result)}</pre>` : ''}`);
}

function groupHtml(g, live) {
  if (g.length === 1) return lineHtml(...g[0]);
  const counts = Object.entries(Object.groupBy(g, ([s]) => s.kind)).map(([k, xs]) => `${esc(VERB[k] ?? k).toLowerCase()} ${xs.length} ${NOUN[k] ?? 'call'}${xs.length > 1 ? 's' : ''}`).join(', ');
  const bad = g.filter(([s]) => s.error).length;
  const head = counts[0].toUpperCase() + counts.slice(1) + (bad ? ` · <span class="bad">${bad} failed</span>` : '') + (live ? ' <span class="spin"></span>' : '');
  return fold(`g${g[0][1]}`, live, head, g.map(x => lineHtml(...x)).join(''));
}

function traceHtml() {
  // The session files are the agent's to write: what they say of the log is only seqs, each shown from the log itself.
  let h = '', g = [], run = 0;
  const entry = text => data.log.find(e => e.seq === Number(text?.match(/\bseq"?:? ?(\d+)/)?.[1]));
  const flush = live => { if (g.length) h += groupHtml(g, live); g = []; };
  lines.forEach((s, i) => {
    const said = s.kind === 'bash' && /\brf say\b/.test(s.text);
    if (s.kind !== 'user' && s.kind !== 'say' && !said) return void g.push([s, i]);
    flush(false);
    if (said) return void (h += `<div class="say reply">${md(entry(s.result)?.text ?? s.text)}</div>`);
    if (s.kind === 'say') return void (h += `<div class="say">${md(s.text)}</div>`);
    const n = Number(s.text.match(/run (\d+)\./)?.[1]);
    if (n !== run) {
      const d = data.log.find(e => e.op === 'done' && e.run === n);
      h += `<div class="rh">Run ${n} · ${hhmm(s.at)}${d ? ` · ${took(d)} · ${usd(d.cost)}` : data.run?.n === n ? ' · running' : ''}</div>`;
      run = n;
    }
    for (const l of (s.text.split('New log entries:\n')[1] ?? '').split('\n')) {
      const e = entry(l);
      if (e && e.by !== 'server') h += `<div class="trig">${logText(e)}</div>`;
    }
  });
  flush(!!data.run);
  return h || '<div class="rh">No runs yet.</div>';
}

// Process: the instance's working/process.md, redlined against the instance it was made from, else the series' latest closed before it.
async function loadProcess(key) {
  proc.key = key;
  const from = data.log.find(e => e.op === 'create' || e.op === 'duplicate')?.from;
  const prev = from ?? cur.s.instances.filter(i => i.status === 'closed' && i.label < cur.i.label).map(i => i.label).sort().at(-1);
  const get = async path => { const r = await fetch(fileUrl(path)); return r.ok ? r.text() : ''; };
  const [now, was] = await Promise.all([get('working/process.md'), prev ? get(`../${prev}/working/process.md`) : '']);
  // Until this instance's agent writes its own, the process is still the one it starts from.
  const lines = now ? redline(was, now) : redline('', was), changed = lines.some(([k]) => k);
  proc.html = `<div class="lh"><b>Process</b><button class="btn" data-act="proc">Close</button></div><div class="conv">`
    + `<div class="sub">${!now && !was ? 'No process.md yet: the agent writes it as it learns the series.' : !now ? `As of ${esc(prev)}, until the agent updates it here.` : prev ? (changed ? `Changes since ${esc(prev)} are marked.` : `Unchanged since ${esc(prev)}.`) : 'The series\' first process.'}</div>`
    + `<div class="proc">${lines.map(([k, l]) => `<div class="${k}">${md(l) || '&nbsp;'}</div>`).join('')}</div></div>`;
  if (ui.proc && proc.key === key) renderLog();
}

function redline(a, b) {
  const x = a ? a.split('\n') : [], y = b ? b.split('\n') : [], n = x.length, m = y.length;
  const L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = x[i] === y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = [];
  for (let i = 0, j = 0; i < n || j < m;) {
    if (i < n && j < m && x[i] === y[j]) { out.push(['', y[j]]); i++; j++; }
    else if (j < m && (i === n || L[i][j + 1] >= L[i + 1][j])) out.push(['ins', y[j++]]);
    else out.push(['del', x[i++]]);
  }
  return a ? out : out.map(([, l]) => ['', l]);
}

// Threads from the log: a comment starts one, on an item (at a ref) or the instance; comments and the agent's `say` reply in it.
function threadsOf() {
  const out = new Map();
  for (const e of data?.log ?? []) {
    if (e.op === 'comment' && !out.has(e.thread)) out.set(e.thread, { id: e.thread, item: e.item, ref: e.ref, posts: [], resolved: false });
    if ((e.op === 'comment' || e.op === 'say') && out.has(e.thread)) Object.assign(out.get(e.thread), { resolved: false }).posts.push(e);
    if (e.op === 'resolve' && out.has(e.thread)) out.get(e.thread).resolved = true;
  }
  return [...out.values()];
}

const openQuestions = () => data?.doc.status === 'open' ? data.doc.items.flatMap(i => (i.notes ?? []).filter(n => n.options && questionState(n) === null).map(n => ({ i, n }))) : [];

// The conversation: what waits on people (questions first, then open threads), the agent's latest report, and every thread.
function conversationHtml() {
  const open = data.doc.status === 'open', ts = threadsOf().sort((a, b) => a.resolved - b.resolved), name = id => esc(data.doc.items.find(i => i.id === id)?.name ?? id);
  const report = data.log.findLast(e => e.op === 'report'), qs = openQuestions();
  let h = `<div class="lh"><b>Conversation</b><button class="btn" data-act="conv">Close</button></div><div class="conv">`;
  if (qs.length) h += `<h3>Open questions</h3>` + qs.map(({ i, n }) => `<div class="post"><a data-act="opencard" data-item="${esc(i.id)}">${esc(i.name)}</a>${n.ask ? ` (for ${esc(n.ask)})` : ''}: ${esc(n.text)}</div>`).join('');
  if (report) h += `<h3>Report, run ${report.run}</h3><div class="post">${md(report.text)}</div>`;
  for (const t of ts) {
    h += `<div class="thread ${t.resolved ? 'resolved' : ''}"><div class="on">${t.item ? `On <a data-act="opencard" data-item="${esc(t.item)}">${name(t.item)}</a>${t.ref ? ` at ${esc(t.ref)}` : ''}` : 'On the instance'}${t.resolved ? ' · resolved' : ''}</div>`
      + t.posts.map(p => `<div class="post"><b class="${p.op === 'say' || p.by === 'agent' ? '' : 'p'}">${esc(p.op === 'say' || p.by === 'agent' ? 'Agent' : p.by)}</b> <span class="tm">${hhmm(p.at)}</span><div>${p.op === 'say' ? md(p.text) : esc(p.text)}</div>${(p.files ?? []).map(f => `<div class="f"><a data-act="preview" data-file="${esc(f)}">${esc(fname(f))}</a></div>`).join('')}</div>`).join('')
      + (open && !t.resolved ? `<textarea rows="2" placeholder="Reply"></textarea><input type="file" multiple><div class="row2"><button class="btn" data-act="reply-thread" data-thread="${esc(t.id)}">Reply</button><button class="btn" data-act="resolve" data-thread="${esc(t.id)}">Resolve</button></div>` : '') + '</div>';
  }
  if (open) h += `<h3>${ui.on ? `Comment on ${name(ui.on)}${ui.ref ? ` at ${esc(ui.ref)}` : ''}` : 'Comment on the instance'}</h3><textarea id="newcomment" rows="3" placeholder="The agent replies in the thread"></textarea><input type="file" id="newfiles" multiple><div><button class="btn primary" data-act="comment">Comment</button></div>`;
  return h + '</div>';
}

function renderCard() {
  const card = $('#card');
  const item = openItem && data?.doc.items.find(i => i.id === openItem);
  if (!item) { card.hidden = true; return; }
  const open = data.doc.status === 'open';
  let h = `<div class="cf">${esc(item.file ? fname(item.file) : item.name)}</div>`;
  if (item.file) {
    const p = provenance(item.file);
    h += `<div class="cp"><b class="${p.person ? 'p' : ''}">${esc(p.by)}</b> ${p.person ? 'uploaded' : 'made'} it at ${hhmm(p.at)} · ${esc(item.name)}${item.source ? `<br>${esc(item.source)}` : ''}</div>`;
  } else h += `<div class="cp">${item.kind === 'input' ? 'Expected input, not there yet' : `${item.kind === 'step' ? 'Step' : 'Output'} not built yet`}</div>`;
  for (const n of item.notes ?? []) {
    h += `<div class="nb">${n.ref ? `<span class="ref">${esc(n.ref)}</span>` : ''}${esc(n.text)}`;
    if (n.files?.length) h += `<div class="cites">${n.files.map(f => `<a data-act="preview" data-file="${esc(f)}">${esc(fname(f))}</a>`).join('')}</div>`;
    if (n.options) {
      const picked = questionState(n);
      h += `<div class="choices">${n.options.map((o, k) => `<button class="choice ${k === (n.default ?? 0) ? 'def' : ''} ${picked === k ? 'picked' : ''}" data-act="answer" data-note="${esc(n.id)}" data-choice="${k}" ${picked !== null || !open ? 'disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
      const got = picked !== null && (lastDone()?.seen ?? 0) >= data.log.findLast(e => e.op === 'answer' && e.note === n.id).seq;
      h += `<div class="by">${picked !== null ? (got || !open ? 'Answered \u2713' : 'Answered \u00b7 <span class="spin"></span> the agent picks it up next') : `${n.ask ? `For ${esc(n.ask)}. ` : ''}If unanswered at close: ${esc(n.options[n.default ?? 0])}`}</div>`;
    }
    h += '</div>';
  }
  h += '<div class="acts">';
  if (item.file) h += `<button class="btn" data-act="preview" data-file="${esc(item.file)}" data-item="${esc(item.id)}">Preview</button><a class="btn" href="${fileUrl(item.file)}">Download</a>`;
  if (open) h += `<button class="btn" data-act="add" data-item="${esc(item.id)}" data-pane="${item.kind === 'output' ? 'out' : 'in'}">Upload…</button>`;
  const on = threadsOf().filter(t => t.item === item.id);
  if (open || on.length) h += `<button class="btn" data-act="${open ? 'comment-on' : 'conv'}" data-item="${esc(item.id)}">${on.length ? `Comments (${on.length})` : 'Comment'}</button>`;
  h += `<button class="btn" data-act="uncard" style="margin-left:auto">Close</button></div>`;
  put(card, h);
  card.hidden = false;
  placeCard();
}

function placeCard() {
  const card = $('#card'), t = !card.hidden && document.querySelector(`.tile[data-item="${CSS.escape(openItem)}"]`);
  if (!t || innerWidth <= 800) return;
  const r = t.getBoundingClientRect(), w = card.offsetWidth, ch = card.offsetHeight;
  const right = r.right + 10 + w < innerWidth, left = !right && r.left - 10 - w >= 8;
  card.style.left = (right ? r.right + 10 : left ? r.left - 10 - w : Math.max(8, Math.min(r.left, innerWidth - w - 8))) + 'px';
  card.style.top = Math.max(8, Math.min(right || left ? r.top : r.bottom + 8, innerHeight - ch - 8)) + 'px';
}

const colName = c => (c >= 26 ? colName(Math.floor(c / 26) - 1) : '') + String.fromCharCode(65 + c % 26);
const num = v => v.toLocaleString(undefined, { maximumFractionDigits: 2 });

const cellText = v => v == null ? '' : typeof v === 'object' ? v.f : typeof v === 'number' ? num(v) : v;

function sheetTable(s, first) {
  const noted = new Map(), asks = new Set();
  for (const n of pv.notes) {
    const r = (n.ref ?? '').match(/^(?:'?([^'!]+)'?!)?\$?([A-Z]{1,3})\$?(\d+)/);
    if (!r || (r[1] ? r[1] !== s.name : !first)) continue;
    const key = `${+r[3] - 1},${[...r[2]].reduce((t, ch) => t * 26 + ch.charCodeAt(0) - 64, 0) - 1}`;
    noted.set(key, (noted.has(key) ? noted.get(key) + '\n\n' : '') + n.text);
    if (n.options && questionState(n) === null) asks.add(key);
  }
  const old = pv.cmp && (pv.old.find(o => o.name === s.name) ?? pv.old[pv.sheets.indexOf(s)]);
  const rows = Array.from({ length: Math.max(s.rows.length, old?.rows.length ?? 0) }, (_, r) => s.rows[r] ?? []);
  const width = Math.max(0, ...rows.map(r => r.length), ...(old?.rows ?? []).map(r => r.length));
  let h = `<table class="sh"><tr><th></th>${Array.from({ length: width }, (_, c) => `<th>${colName(c)}</th>`).join('')}</tr>`;
  rows.forEach((row, r) => {
    h += `<tr><td class="rn">${r + 1}</td>`;
    for (let c = 0; c < width; c++) {
      const v = row[c], was = old?.rows[r]?.[c] ?? null;
      const changed = old && JSON.stringify(was) !== JSON.stringify(v ?? null);
      const note = [noted.get(`${r},${c}`), changed ? `Was: ${cellText(was) || '(empty)'}` : ''].filter(Boolean).join('\n\n');
      const cls = `${typeof v === 'number' ? 'num' : ''} ${v && typeof v === 'object' ? 'fx' : ''} ${noted.has(`${r},${c}`) ? 'noted' : ''} ${asks.has(`${r},${c}`) ? 'q' : ''} ${changed ? 'chg' : ''}`.trim();
      h += `<td${cls ? ` class="${cls}"` : ''} data-act="cell" data-ref="${esc(`${s.name}!${colName(c)}${r + 1}`)}"${note ? ` data-note="${esc(note)}"` : ''}>${esc(cellText(v))}</td>`;
    }
    h += '</tr>';
  });
  return h + '</table>' + (s.truncated ? `<div class="empty">Showing the first ${s.rows.length} rows.</div>` : '');
}

function renderPv() {
  $('#pv').hidden = !pv;
  if (!pv) return;
  $('#pv').className = 'pv' + (pv.settings ? ' small' : '');
  let h = `<div class="pvh"><b>${esc(pv.title)}</b>${pv.sheets && /\.(xlsx|xlsm|xls|csv)$/i.test(pv.was ?? '') ? `<button class="btn ${pv.cmp ? 'sel' : ''}" data-act="compare">${pv.cmp ? `Changes since ${esc(fname(pv.was))}` : 'Compare with previous'}</button>` : ''}${pv.path ? `<a class="btn" href="${fileUrl(pv.path)}">Download</a>` : ''}${pv.signin ? '<button class="btn primary" data-act="signin-save">Save login</button>' : ''}<button class="btn" data-act="unpv">${pv.signin ? 'Cancel' : 'Close'}</button></div>`;
  if (pv.sheets) {
    if (pv.sheets.length > 1) h += `<div class="tabs">${pv.sheets.map((s, k) => `<button class="btn ${k === pv.sheet ? 'sel' : ''}" data-act="sheet" data-k="${k}">${esc(s.name)}</button>`).join('')}</div>`;
    h += `<div class="pvb">${sheetTable(pv.sheets[pv.sheet], pv.sheet === 0)}</div>`;
  } else if (pv.email) {
    const m = pv.email;
    h += `<div class="pvb"><pre>${esc(Object.entries(m.headers).map(([k, v]) => `${k}: ${v}`).join('\n') + (m.attachments.length ? `\nAttachments: ${m.attachments.join(', ')}` : '') + '\n\n' + m.text)}</pre></div>`;
  } else if (pv.image) h += `<div class="pvb"><img src="${fileUrl(pv.path)}" alt=""></div>`;
  else if (pv.signin) h += `<div class="sub" style="padding:8px 14px">Take control, sign in as you always do, then Save login. Only you see this browser.</div><div class="pvb"><iframe src="/signins/${pv.signin}/view" style="width:100%;height:100%;border:0"></iframe></div>`;
  else if (pv.text !== undefined) h += `<div class="pvb">${pv.md ? `<div class="say">${md(pv.text)}</div>` : `<pre>${esc(pv.text)}</pre>`}</div>`;
  else if (pv.settings?.kind === 'skills') h += `<div class="pvb vl">${skillsHtml(pv.settings)}</div>`;
  else if (pv.settings?.kind === 'tokens') h += `<div class="pvb vl">${tokensHtml(pv.settings)}</div>`;
  else if (pv.settings?.kind === 'people') h += `<div class="pvb vl"><div class="sub">Everyone who can sign in. Admins manage people with rf (Tokens): rf users, rf user add|role|disable|enable|signout|remove.</div><table class="ut"><tr><th>Person</th><th>Role</th><th>Workspaces</th><th>Last in</th></tr>${pv.settings.users.map(u => `<tr><td>${esc(u.name ?? '')}<div class="sub">${esc(u.email)}${u.disabled ? ' · disabled' : ''}</div></td><td>${esc(u.role)}</td><td class="sub">${esc(u.workspaces.join(', ')) || 'none'}</td><td class="sub">${esc(u.last_login ? when(u.last_login) : 'never')}</td></tr>`).join('')}</table></div>`;
  else if (pv.settings?.kind === 'logins') h += `<div class="pvb vl">${loginsHtml(pv.settings)}</div>`;
  else if (pv.settings?.kind === 'waiting') h += `<div class="pvb vl">${waiting().join('') || '<div class="sub">Nothing waits on you.</div>'}</div>`;
  else if (pv.settings?.kind === 'guidance') h += `<div class="pvb vl">${guidanceHtml(pv.settings, "Every agent reads it at the start of each run, in every workspace: the company's conventions, and changes that cut across many series. Admins set it with rf.", false)}</div>`;
  else if (pv.settings?.kind === 'start') h += `<div class="pvb vl">${startHtml(pv.settings)}</div>`;
  else if (pv.settings) {
    const s = pv.settings;
    h += '<div class="pvb vl">';
    if (s.kind === 'workspace') h += peopleHtml(s) + guidanceHtml(s, 'Every agent in this workspace reads it at the start of each run: its conventions, and changes that cut across its series, such as a renamed entity.', s.manage) + '<hr>';
    if (s.kind === 'series') h += `<h3>Name</h3><input type="text" id="sname" value="${esc(s.name)}" ${s.adhoc ? 'disabled title="The Ad hoc series keeps its name"' : ''}>`
      + `<h3>Skill use</h3><div class="sub">What the agent may fetch or do for this series.</div>`
      + s.skillList.map(k => `<label class="skill-row"><input type="checkbox" class="skill" value="${esc(k.id)}" ${s.skills.includes(k.id) ? 'checked' : ''}> ${esc(k.name)}</label>`
        + `<div class="sub" style="margin:0 0 6px 22px">${esc(k.description.length > 180 ? k.description.slice(0, 180) + '…' : k.description)}</div>`).join('')
      + `<h3>Wakes</h3><label class="skill-row"><input type="checkbox" id="swakes" ${s.allow_wakes ? 'checked' : ''}> Allow wakes</label>`
      + `<div class="sub">${s.allow_wakes ? `Wakes start new instances of this series, run as ${esc(s.allow_wakes)}${s.allow_wakes === me.email ? ' (you)' : ''}. ` : 'An agent that wakes this series asks on this page instead, for someone to start the instance. Turned on, wakes run as you, with the logins ticked here.'}</div>`
      + ticksHtml(s.offers) + (s.allow_wakes && s.allow_wakes !== me.email ? '<div><button class="btn" data-act="wakes-mine">Run wakes as me, with these logins</button></div>' : '')
      + (s.wake ? `<div class="row2"><span class="sub">Next: starts ${esc(s.wake.label)}, ${esc(s.wake.reason)}</span></div><div class="row2"><input type="datetime-local" id="swake" value="${localInput(s.wake.at)}"><button class="btn" data-act="wake-move">Move</button><button class="btn" data-act="wake-cancel">Cancel wake</button></div>` : '<div class="sub">No wake pending. The agent sets the next one.</div>')
      + `<h3>Cost</h3><div class="sub">This series' runs have cost ${usd(s.cost)} so far, ${usd(s.cost / Math.max(1, s.closed))} per closed instance.</div>`
      + `<h3>Reading</h3><div class="sub">${s.reads.length ? `This series' agent can read ${esc(s.reads.join(', '))}: the other series of its workspace, and those of workspaces that have all its people.` : "This series' agent reads only this series."}</div>`
      + '<div><button class="btn primary" data-act="savesettings">Save</button></div><hr>';
    h += `<h3>Archive</h3><div class="sub">${s.archived ? 'Archived: in the sidebar only under Show archived.' : `Hides the ${s.kind} from the sidebar, except under Show archived. Nothing in it changes.`}</div><div><button class="btn" data-act="archive">${s.archived ? 'Restore' : 'Archive'} ${s.kind}</button></div></div>`;
  }
  else if (pv.loading) h += `<div class="pvb"><div class="empty">Loading…</div></div>`;
  else h += `<div class="pvb"><div class="empty">No preview for this kind of file. Download it instead.</div></div>`;
  $('#pv').innerHTML = h + '<div class="pvn" id="pvn"></div>';
}

// Guidance, the company's or a workspace's: a text every agent in scope reads, which only admins, or the workspace's owners, change.
const guidanceHtml = (s, sub, edit) => `<h3>Guidance</h3><div class="sub">${sub}</div>`
  + (edit ? `<textarea id="guidance" rows="8" placeholder="Such as: Fiscal months end on the last Saturday.">${esc(s.guidance)}</textarea><div><button class="btn" data-act="save-guidance">Save guidance</button></div>`
    : `<div class="sub">${s.guidance ? esc(s.guidance) : 'None yet.'}</div>`);

// A workspace's people, each an email or an Entra group's id: owners manage who is in it, and owners and members see and work in all
// of it.
function peopleHtml(s) {
  const row = (p, owner) => `<tr><td>${esc(p)}</td><td>${owner ? 'Owner' : 'Member'}</td>`
    + (s.manage ? `<td><div class="row2"><button class="btn" data-act="wrole" data-p="${esc(p)}">${owner ? 'Make member' : 'Make owner'}</button><button class="btn" data-act="wremove" data-p="${esc(p)}">Remove</button></div></td>` : '') + '</tr>';
  return `<h3>People</h3><div class="sub">Owners and members see and work in everything here, and its agents read across it. Owners manage who is in it.${s.owners.length + s.members.length ? '' : ' No one is in it yet, so only admins see it.'}</div>`
    + `<table class="ut">${s.owners.map(p => row(p, true)).join('')}${s.members.map(p => row(p, false)).join('')}</table>`
    + (s.manage ? `<div class="row2"><input type="text" id="wperson" placeholder="name@example.com, or an Entra group's id" style="flex:1"><button class="btn primary" data-act="wadd">Add</button></div>` : '');
}

// A datetime-local input's value, in the browser's time zone.
const localInput = iso => new Date(new Date(iso).getTime() - new Date(iso).getTimezoneOffset() * 60e3).toISOString().slice(0, 16);

async function openWorkspaceSettings() {
  const w = cur.w;
  pv = { title: 'Workspace settings', settings: { kind: 'workspace', archived: w.archived, owners: w.owners, members: w.members, manage: w.manage, guidance: w.guidance } };
  renderPv();
}

// Skills, read-only: publishers push them with rf; a series chooses which it uses under Skill use.
const skillsHtml = s => `<div class="sub">What each skill fetches or does, for every series that chooses it. Publishers push skills with rf (Tokens).</div>`
  + `<table class="ut"><tr><th>Skill</th><th>Version</th></tr>`
  + s.list.map(x => `<tr><td><b>${esc(x.name)}</b><div class="sub">${esc(x.description)}</div></td>`
    + `<td class="sub">${x.pushed.version}, ${esc(when(x.pushed.at))} by ${esc(x.pushed.by)}</td></tr>`).join('') + '</table>';

// Personal tokens: rf, on your own machine or for your desktop agent, acts as you with one.
function tokensHtml(s) {
  return `<div class="sub">rf does what this page does, from a shell or your desktop agent, as you: list and pull what you can see, comment, answer, upload and wake${me.role === 'user' ? '' : `, and ${me.role === 'admin' ? "manage people, skills and the company's guidance" : 'push skills'}`}. Get <a href="/rf.ts" download>rf.ts</a> (Node 22.18 or later), make a token, then: <code>node rf.ts login ${esc(location.origin)} TOKEN</code>.</div>`
    + (s.made ? `<h3>Your new token</h3><div class="sub">Copy it now: it isn't shown again.</div><input type="text" readonly value="${esc(s.made)}" onclick="this.select()">` : '')
    + (s.tokens.length ? `<h3>Your tokens</h3>` + s.tokens.map(t => `<div class="wt">${esc(t.name)} <span class="sub">made ${esc(when(t.created))}, ${t.expires < new Date().toISOString() ? 'expired' : 'until ' + esc(when(t.expires))}</span><button class="quiet" data-act="revoke-token" data-id="${esc(t.id)}">Revoke</button></div>`).join('') : '')
    + `<h3>New token</h3><div class="row2"><input type="text" id="tname" placeholder="Name, such as laptop" style="flex:1"><select id="tdays"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option></select><button class="btn primary" data-act="new-token">Make</button></div>`;
}
