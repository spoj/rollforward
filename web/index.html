<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rollforward</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side"><div class="brand" id="brand"></div><div class="find"><input type="search" id="find" placeholder="Filter" autocomplete="off" spellcheck="false" aria-label="Filter workspaces, series and instances"><button class="add mine" data-act="mine-only" title="Only the open instances you run">Mine</button><details class="sorter" id="sorter"><summary class="add" title="Show and sort"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 4h12M4.5 8h7M7 12h2"/></svg></summary><div class="pop" id="sortpop"></div></details><span id="newws"></span></div><div class="scroll" id="tree"></div><div class="sidefoot" id="sidefoot"></div></aside>
  <header class="masthead" id="masthead"></header>
  <main class="main">
    <div class="bar" id="bar"></div>
    <div class="draining" id="draining" hidden></div>
    <div class="needs" id="needs" hidden></div>
    <div class="corrs" id="corrs" hidden></div>
    <div class="panes" id="panes">
      <section class="pane outs" id="outs" data-pane="out"></section>
      <section class="pane ins" id="ins" data-pane="in"></section>
      <section class="pane steps" id="steps" data-pane="in" hidden></section>
      <div class="view" id="view"></div>
      <div class="key" tabindex="0">Key<div class="legend"><div><i class="sw p"></i>uploaded by a person</div><div><i class="sw"></i>made by the agent</div><div><span class="tri"></span>comments</div><div><span class="tri q"></span>waiting on a reply</div><div><span class="dash"></span>expected, not there yet</div><div class="keys"><div><kbd>j k</kbd> move through the sidebar, <kbd>h l</kbd> fold and open, <kbd>Enter</kbd> go</div><div><kbd>c</kbd> the comment box</div><div><kbd>Ctrl Enter</kbd> sends, <kbd>Esc</kbd> leaves a field, <kbd>?</kbd> shows this</div></div></div></div>
    </div>
    <div class="player" id="player" hidden></div>
  </main>
  <aside class="log" id="log"><div class="lh" id="lh"></div><div class="conv" id="conv"></div><section class="audit" id="audit" hidden></section></aside>
  <div class="grip" data-pane="side" title="Drag to resize; double-click to reset"></div><div class="grip" data-pane="panel" title="Drag to resize; double-click to reset"></div>
</div>
<div class="card" id="card" hidden></div>
<dialog class="pv" id="pv"></dialog>
<dialog class="dlg" id="ask"></dialog>
<input type="file" id="picker" multiple hidden>
<div id="toasts" popover="manual"></div>
<script>
const $ = s => document.querySelector(s);
const enc = encodeURIComponent;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const usd = (n, est) => `${est ? '~' : ''}${n < 0 ? '-$' + (-n).toFixed(2) : '$' + n.toFixed(2)}${est ? ' (est.)' : ''}`;
const signedUsd = n => `${n >= 0 ? '+$' : '-$'}${Math.abs(n).toFixed(2)}`;
const lowCreditText = lc => `Low OpenRouter credit: ${usd(lc.remaining)} remaining${lc.limit !== null ? ` of ${usd(lc.limit)} limit` : ''}${lc.reset ? ` (resets ${lc.reset})` : ''}`;
const APP = 'RollForward';
// The buttons' icons, line drawings in the colour of their text.
const icon = d => `<svg class="ico" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  edit: icon('<path d="M13 9v3.5a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1H7"/><path d="M10.9 2.1a1.2 1.2 0 0 1 1.7 0l1.3 1.3a1.2 1.2 0 0 1 0 1.7l-5.7 5.7-2.7.7.7-2.7z"/>'),
  alarm: icon('<circle cx="8" cy="9" r="5"/><path d="M8 6.5V9l1.6 1.5M2.5 3.6 4.4 2M13.5 3.6 11.6 2"/>'),
  hand: icon('<path d="M5 8.5V3.7a1 1 0 0 1 2 0v3.8M7 7.2V2.6a1 1 0 0 1 2 0v4.6M9 7.2V3.7a1 1 0 0 1 2 0v4.8M11 8.3V6.1a1 1 0 0 1 2 0v3.6a5 5 0 0 1-5 5h-.4a4 4 0 0 1-3.2-1.6L2.3 10.2a1 1 0 0 1 1.6-1.2L5 10.4"/>'),
  files: icon('<path d="M6 1.5h4.4l3.1 3.1v6.9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1z"/><path d="M10.4 1.5v3.1h3.1M2.8 4.6v8.9a1 1 0 0 0 1 1h6.6"/>'),
  chat: icon('<path d="M2.5 3.5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1H7.2L4 13.6V11h-.5a1 1 0 0 1-1-1z"/>'),
  person: icon('<circle cx="8" cy="5.4" r="2.6"/><path d="M2.8 13.8a5.2 5.2 0 0 1 10.4 0"/>'),
  up: icon('<path d="M4.5 10 8 6.5l3.5 3.5"/>'),
  down: icon('<path d="M4.5 6.5 8 10l3.5-3.5"/>'),
};
function took(e) {
  const s = Math.round((Date.parse(e.at) - Date.parse(data.log.find(r => r.op === 'run' && r.run === e.run).at)) / 1000);
  return `${s >= 60 ? Math.floor(s / 60) + 'm ' : ''}${s % 60}s`;
}
const when = iso => new Date(iso).toLocaleString([], { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
const hhmm = iso => iso ? new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }) : '';
const fname = f => f.split('/').pop();
function fileUrl(path, kind = 'files') {
  const m = path.match(/^\.\.\/([^/]+)\/(.*)$/), id = m ? cur.s.instances.find(i => i.label === m[1])?.id : cur.i.id;
  return `/${kind}/${id}/${(m ? m[2] : path).split('/').map(enc).join('/')}`;
}
const ext = f => (f && f.includes('.') ? f.split('.').pop() : '').toUpperCase();

let cardPv = null;
// showClosed holds the series, and the workspaces for their Ungrouped tasks, whose closed instances the sidebar lists.
let tree = [], expired = [], myLogins = [], cur = null, data = null, lines = [], linesKey = '', openItem = null, hover = null, showClosed = new Set(), showArchived = false, pv = null, me = null;
let seen = {}, prevSigs = {}, uploads = [], shown = '', refreshes = 0, threads = [];
// Each instance keeps its conversation's boxes, picked files and place to comment while the page stays open.
const drafts = new Map();
let draft = null;
// An item's threads; a new one shows on its tile as a change.
const talkOn = id => threads.filter(t => t.item === id);
const sig = i => `${i.file}|${data.sums[i.id] ?? ''}|${talkOn(i.id).length}|${i.headline ?? ''}`;

function markSeen(items) {
  for (const i of items) seen[i.id] = sig(i);
  localStorage[`seen:${instPath()}`] = JSON.stringify(seen);
}

// Toasts sit in the top layer, shown again for each one, so they come above a dialog that opened since.
function toast(text, kind = '') {
  const el = Object.assign(document.createElement('div'), { className: `toast ${kind}`, textContent: text }), box = $('#toasts');
  box.append(el);
  if (box.matches(':popover-open')) box.hidePopover();
  box.showPopover();
  setTimeout(() => { el.remove(); if (!box.children.length) box.hidePopover(); }, 6000);
}
// The side panel opens beside the instance where there's room for both; the audit is closed until asked for. sect holds which of the
// panel's folds are open, where someone opened or closed them; site, which of the run's browsers the player shows, and drive, the
// one you took control of, as instance/site; full, the long comments opened in full; alone, the comment the conversation shows
// alone, with what hangs under it, when a thread runs deeper than the panel shows; and withdrawn, those withdrawn opened to show
// what they said.
const ui = { open: innerWidth > 800, audit: false, sect: {}, site: null, drive: null, sort: {}, full: new Set(), alone: null, withdrawn: new Set() };
const drawn = new WeakMap();

function put(el, html) {
  if (drawn.get(el) !== html) el.innerHTML = html;
  drawn.set(el, html);
}

// A reload, as a lapsed session's, keeps the comments and replies being written in this tab, by instance, which come back as it opens
// each again.
addEventListener('pagehide', () => {
  if (!me) return;
  for (const [path, d] of drafts) sessionStorage[`drafts:${me.email}:${path}`] = JSON.stringify({
    on: d.on, ref: d.ref,
    boxes: { ...d.kept, ...Object.fromEntries([...d.el.querySelectorAll('textarea')].filter(t => !t.closest('.reply[hidden]') && t.value.trim())
      .map(t => [t.id || `${t.closest('.post').dataset.seq}:${t.closest('.reply').dataset.mode}`, t.value])) },
  });
});

// A call that fails throws the server's words; a toast shows them, unless the caller shows them itself.
async function api(path, opts) {
  const r = await fetch(path, opts);
  const t = await r.text();
  if (r.status === 401) location.reload();
  if (!r.ok) throw new Error(t);
  try { return JSON.parse(t); } catch { return t; }
}
addEventListener('unhandledrejection', e => toast(e.reason?.message ?? String(e.reason)));

// The page's address is #/ID, of an instance, a series or a workspace, or #/ID/cN, at a comment of an instance; cur holds the tree's
// entries for them.
const seriesPath = c => `/api/series/${c.s.id}`;
const instPath = () => `/api/instances/${cur.i.id}`;
const go = id => { location.hash = '#/' + id; };
const archived = (w = cur?.w, s = cur?.s) => !!(w?.archived || s?.archived);
const editable = () => data?.doc.status === 'open' && !archived();
// Whoever sees an instance watches its run; its runner, the workspace's owners and admins alone stop it.
const canStop = () => data?.runner.by === me.email || !!cur?.w.manage;

// Newest activity first, as in a chat: an instance's latest log entry, now while it runs; a series' newest instance's, and a
// workspace's newest series'. A series' instances keep their labels' order.
const recent = i => i.running ? new Date().toISOString() : i.active, newest = xs => xs.reduce((m, x) => x > m ? x : m, '');
const sAct = s => newest(s.instances.map(recent)), wAct = w => newest(w.series.map(sAct)), byAct = f => (a, b) => (f(b) > f(a)) - (f(b) < f(a));
const sorted = (xs, act, name) => [...xs].sort(localStorage.order === 'name' ? (x, y) => name(x).localeCompare(name(y), undefined, { numeric: true }) : byAct(act));
// How long ago, compactly, as a row's last activity: now, 5m, 3h, 2d, 7w.
const initials = name => {
  const w = name.replace(/^v-/i, '').match(/\p{L}+/gu);
  if (!w) return [...name].slice(0, 2).join('');
  return (w.length > 1 ? w[0][0] + w[1][0] : w[0].slice(0, 2)).toUpperCase();
};
// A time to come, compactly: its time today, else its day.
const soon = iso => new Date(iso).toDateString() === new Date().toDateString() ? hhmm(iso) : new Date(iso).toLocaleDateString([], { day: 'numeric', month: 'short' });
const ago = iso => {
  const m = (Date.now() - Date.parse(iso)) / 60e3;
  return m < 1 ? 'now' : m < 60 ? `${m | 0}m` : m < 1440 ? `${m / 60 | 0}h` : m < 10080 ? `${m / 1440 | 0}d` : `${m / 10080 | 0}w`;
};

async function refresh() {
  const n = ++refreshes, [t, mine, who] = await Promise.all([api('/api'), api('/logins'), api('/me')]);
  const [id, at] = location.hash.slice(2).split('/'), all = t.flatMap(w => [[w], ...w.series.flatMap(s => [[w, s], ...s.instances.map(i => [w, s, i])])]), found = all.find(e => e.at(-1).id === id);
  // An address that names nothing here opens the sidebar's first workspace, and then names what it shows.
  const ws = t.filter(w => !w.archived && (w.mine || localStorage.workspaces === 'all' || !t.some(w => w.mine)));
  let [w, s, i] = found ?? [sorted(ws, wAct, w => w.name)[0]];
  s ??= w?.series.filter(s => !s.archived).sort(byAct(sAct))[0];
  i ??= s?.instances.find(i => i.status === 'open') ?? s?.instances.at(-1);
  const path = i ? `/api/instances/${i.id}` : '', [d, st] = path ? await fetchInstance(path) : [null, null];
  if (n !== refreshes) return;
  if ((!found || at) && w) history.replaceState(null, '', `#/${(i ?? s ?? w).id}`);
  [tree, expired, myLogins, me] = [t, mine.filter(l => l.expired), mine, who];
  land(w && { w, s, i }, path, d, st);
  if (at && i) showComment(+at.slice(1));
}

// A comment brought into view and marked a moment: the panel open on the conversation, its thread unfolded and withdrawn asks opened
// down to it, shown alone from it if it's deeper than the conversation shows; a half-written reply holds the conversation still, as it was.
function showComment(seq) {
  const t = threads.find(t => t.posts.some(p => p.seq === seq)), k = `folds:${cur.i.id}`, folds = JSON.parse(localStorage[k] ?? '{}');
  if (!t) return;
  let depth = 0;
  for (let p = t.posts.find(p => p.seq === seq); p; p = t.posts.find(x => x.seq === p.under), depth++) {
    delete folds[p.seq];
    if (p.withdrawn) ui.withdrawn.add(p.seq);
  }
  localStorage[k] = JSON.stringify(folds);
  closePv();
  Object.assign(ui, { open: true, audit: false, alone: depth > 4 ? seq : null });
  renderLog(); renderBar(); renderAudit();
  const el = $(`#conv .post[data-seq="${seq}"]`);
  if (!el) return;
  el.scrollIntoView({ block: 'center' });
  $('#log').dataset.end = 'no';
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 2000);
}

// Instances changed: each one's row in the sidebar, and the open one's data. One the sidebar lacks takes a full refresh.
async function patch(ids) {
  const rows = tree.flatMap(w => w.series.flatMap(s => s.instances)), others = ids.filter(id => id !== cur?.i?.id);
  const n = others.length === ids.length ? refreshes : ++refreshes;
  const sums = await Promise.all(others.map(id => api(`/api/instances/${id}/summary`)));
  if (n !== refreshes) return;
  if (sums.some(x => !rows.some(r => r.id === x.id))) return refresh();
  for (const x of sums) Object.assign(rows.find(r => r.id === x.id), x);
  if (others.length === ids.length) return render();
  const path = shown, [[d, st], sum] = await Promise.all([fetchInstance(path), api(`${path}/summary`)]);
  if (n !== refreshes) return;
  Object.assign(cur.i, sum);
  land(cur, path, d, st);
}

// An instance's data, and its trace while the audit shows and the trace may have moved.
async function fetchInstance(path) {
  const d = await api(path), key = `${path}:${d.log.length}`;
  return [d, ui.audit && (d.run || key !== linesKey) ? [await api(path + '/trace'), key] : null];
}

function land(next, path, d, st) {
  const was = data && path === shown ? lastDone()?.seq ?? 0 : undefined, wasArchived = archived(), wasWorkspace = cur?.w.archived, wasSeries = cur?.s?.archived;
  // A new selection opens its rows in the sidebar; from then on only their chevrons fold and open them.
  if (next?.w && next.w.id !== cur?.w.id) expandRow(next.w.id, true);
  if (next?.s && next.s.id !== cur?.s?.id) expandRow(next.s.id, true);
  if (d && (path !== shown || wasArchived !== archived(next.w, next.s))) {
    if (!drafts.has(path)) {
      const raw = JSON.parse(sessionStorage[`drafts:${me.email}:${path}`] ?? '{}'), kept = raw.boxes ?? raw;
      drafts.set(path, { el: $('#conv').cloneNode(false), on: raw.on ?? null, ref: raw.ref ?? null, replying: new Map(Object.keys(kept).filter(k => k.includes(':')).map(k => [+k.split(':')[0], k.split(':')[1]])), kept });
    }
    draft = drafts.get(path);
    $('#conv').replaceWith(archived(next.w, next.s) ? draft.el.cloneNode(false) : draft.el);
  }
  [cur, data, shown] = [next, d, path];
  if ((wasWorkspace !== cur?.w.archived || wasSeries !== cur?.s?.archived) && ['workspace', 'series'].includes(pv?.settings?.kind)) {
    Object.assign(pv.settings, pv.settings.kind === 'workspace' ? cur.w : cur.s);
    renderPv();
  }
  // Seeing it sees what's new and an assignment to you, as the server now knows.
  if (cur?.i) Object.assign(cur.i, { unread: false, assigned: null });
  threads = threadsOf();
  if (st) [lines, linesKey] = st;
  const done = data && lastDone();
  if (done && was !== undefined && done.seq > was) toast(done.error ? `Run ${done.run} failed: ${done.error}` : `Run ${done.run} finished`, done.error ? '' : 'ok');
  render();
}

function render() {
  const qs = tree.filter(w => !w.archived).flatMap(w => w.series.filter(s => !s.archived).flatMap(s => s.instances)).reduce((t, i) => t + i.asks.filter(a => a.who === me.email).length, 0);
  document.title = `${qs ? `(${qs}) ` : ''}${cur?.i ? cur.i.label + ' \u00b7 ' : ''}${me.brand.text ?? 'rollforward'}`;
  renderBrand();
  renderTop();
  renderSide();
  renderBar();
  renderNeeds();
  renderPanes();
  renderAudit();
  renderPlayer();
  renderLog();
  renderCard();
}

// The deployment's brand (rf brand): its logo, else the theme's, and its text top the sidebar; the text titles the page, and its
// logo is the page's icon.
function renderBrand() {
  const { text, logo } = me.brand;
  put($('#brand'), `${logo ? '<img src="/brand/logo" alt="">' : me.themeLogo ? '<img class="theme" src="/css/logo" alt="">' : ''}${text ? `<span>${esc(text)}</span>` : ''}`);
  if (logo && !$('link[rel=icon]')) document.head.append(Object.assign(document.createElement('link'), { rel: 'icon', href: '/brand/logo' }));
}

// The top bar: the app and what the page shows, and your account, whose menu has your role and Sign out.
function renderTop() {
  const view = cur?.i ? 'Instance workspace' : cur?.s ? 'Series' : cur?.w ? 'Workspace' : '';
  const low = me.role === 'admin' && me.low_credit ? `<button class="lowcredit" id="low-credit" data-act="costs">${esc(lowCreditText(me.low_credit))}</button>` : '';
  put($('#masthead'), `<div class="app-name"><b>${APP}</b>${view ? `<span class="pagename">${view}</span>` : ''}</div>` + low
    + `<details class="user" id="user"><summary title="${esc(me.name)}"><span class="avatar">${esc(initials(me.name || me.email))}</span><span class="mail">${esc(me.email)}</span></summary>`
    + `<div class="upop"><b>${esc(me.name)}${me.role === 'user' ? '' : ' · ' + me.role}</b><span class="sub">${esc(me.email)}</span><button class="quiet" data-act="signout">Sign out</button></div></details>`);
}

// The sidebar's tree, folded as a file browser's: selecting a row opens it and leaves the others as they were, and its chevron folds
// it. Its menu shows your workspaces, those you own or worked in and the one you're in, or all, and archived ones or not, newest
// activity first or by name. The filter keeps the rows whose names match and what holds them, opened as it goes; a matching
// workspace or series shows its rows as ever.
const expanded = new Set(JSON.parse(localStorage.expanded ?? '[]'));
function expandRow(id, open = !expanded.has(id)) {
  if (open) expanded.add(id); else expanded.delete(id);
  localStorage.expanded = JSON.stringify([...expanded]);
}

function renderSide() {
  if (editing) return;
  // Mine, as this browser keeps it for you: only the open instances you run, and the one shown, with the rows that hold them, their
  // marks and counts theirs alone, and the series and workspace shown, though they hold none.
  const only = localStorage[`mine:${me.email}`] === 'on', ours = i => (i.status === 'open' && i.runner === me.email) || i.id === cur?.i?.id;
  const side = only ? tree.map(w => ({ ...w, series: w.series.map(s => ({ ...s, instances: s.instances.filter(ours) })).filter(s => s.instances.length || s.id === cur?.s?.id) })).filter(w => w.series.length || w.id === cur?.w.id) : tree;
  $('.find .mine').classList.toggle('on', only);
  const listed = (x, on) => !x.archived || showArchived || on, mine = localStorage.workspaces !== 'all' && side.some(w => w.mine), byName = localStorage.order === 'name';
  const q = $('#find').value.trim().toLowerCase(), hit = name => name.toLowerCase().includes(q), opened = new Set(), shut = id => !expanded.has(id) && !opened.has(id);
  // A dot on a folded row: red for asks waiting on people, else blue for something new to you.
  const asks = s => !s.archived && s.instances.some(i => i.asks.length), news = s => !s.archived && s.instances.some(i => i.unread);
  const dot = (id, ss) => !shut(id) ? '' : ss.some(asks) ? '<span class="dot"></span>' : ss.some(news) ? '<span class="dot u"></span>' : '';
  // A row's last activity, or a spinner while a run goes.
  const age = (iso, running) => `<span class="age">${running ? '<span class="spin"></span>' : iso ? ago(iso) : ''}</span>`;
  const btn = (act, title, glyph, id = '') => `<button class="add" data-act="${act}" data-id="${id}" title="${title}">${glyph}</button>`;
  const chev = id => `<button class="chev" data-act="expand" data-id="${id}">${shut(id) ? '\u25B8' : '\u25BE'}</button>`;
  const closedToggle = (id, n) => `<button class="quiet closed" data-act="toggle-closed" data-id="${id}">${showClosed.has(id) ? `${ICON.up}Hide` : `${ICON.down}Show`} closed<span class="tally">${n}</span></button>`;
  const row = i => {
    const st = i.queued ? '\u29D7 queued' : i.asks.length ? `<span class="cnt" title="${i.asks.length} to answer">${i.asks.length}</span>` : i.wakes[0] ? `<span title="${when(i.wakes[0].at)}">wakes ${soon(i.wakes[0].at)}</span>` : i.status === 'open' ? ''
      : i.deleted ? `<span title="Deleted by ${esc(nameOf(i.deleted.by))} ${when(i.deleted.at)}">deleted</span>`
      : i.corrections ? `<span class="corr" title="Read with ${plural(i.corrections, 'correction')}">corrected</span>` : i.status;
    return `<a class="row inst ${i.status} ${cur?.i?.id === i.id ? 'on' : ''}" href="#/${i.id}" title="${esc(i.label)}"><span class="nm ${i.unread ? 'b' : ''}"><span class="l">${esc(i.label)}</span>${i.runner === me.email || i.deleted ? '' : `<span class="who" title="${esc(nameOf(i.runner))} runs it">${esc(initials(me.names[i.runner] ?? i.runner))}</span>`}${i.unread && !i.asks.length ? '<span class="dot u"></span>' : ''}</span><span class="n">${st}</span>${age(i.active, i.running)}</a>`;
  };
  const waits = waiting().length;
  let h = waits ? `<div class="row waits"><a class="nm" data-act="waiting">Waiting on you<span class="q"> ${waits}</span></a></div>` : '';
  let shown = 0;
  for (const w of sorted(side, wAct, w => w.name)) {
    const won = cur?.w.id === w.id, wHit = !q || hit(w.name);
    if (!listed(w, won) || (mine && !w.mine && !won)) continue;
    // Each series with the instances that match, where only they do.
    const series = sorted(w.series.filter(s => !s.single && listed(s, cur?.s?.id === s.id)), sAct, s => s.name).map(s => [s, wHit || hit(s.name) ? null : s.instances.filter(i => hit(i.label))]).filter(([, found]) => !found || found.length);
    const tasks = sorted(w.series.filter(s => s.single && listed(s, cur?.s?.id === s.id)).flatMap(s => s.instances), recent, i => i.label).filter(i => wHit || hit(i.label));
    if (!wHit && !series.length && !tasks.length) continue;
    shown++;
    if (!wHit) opened.add(w.id);
    h += `<div class="row ws ${won ? 'on' : ''} ${w.archived ? 'archived' : ''}">${chev(w.id)}<a class="nm" href="#/${w.id}" title="${esc(w.name)}"><span class="l">${esc(w.name)}</span>${dot(w.id, w.series)}</a>`
      + `<span class="n">${w.archived ? 'archived' : ''}</span>${age(wAct(w), w.series.some(s => s.instances.some(i => i.running)))}` + btn('workspace-settings', 'Settings', '\u2699', w.id) + (w.archived ? '' : btn('new-task', 'New task', '+', w.id)) + '</div>';
    if (shut(w.id)) continue;
    h += '<div class="tree">';
    for (const [s, found] of series) {
      const on = cur?.s?.id === s.id, open = s.instances.filter(i => i.status === 'open');
      if (found) opened.add(s.id);
      const note = s.archived ? 'archived' : s.requests.length ? `<span class="q">${s.requests.length} to start</span>` : open.length && shut(s.id) ? `<span class="tally open" title="${open.length} open">${open.length}</span>` : s.wakes[0] && shut(s.id) ? `<span title="${when(s.wakes[0].at)}">wakes ${soon(s.wakes[0].at)}</span>` : '';
      h += `<div class="row ser ${on ? 'on' : ''} ${s.archived ? 'archived' : ''}">${chev(s.id)}<a class="nm" href="#/${s.id}" title="${esc(s.name)}"><span class="l">${esc(s.name)}</span>${dot(s.id, [s])}</a>`
        + `<span class="n">${note}</span>${age(sAct(s), s.instances.some(i => i.running))}` + btn('settings', 'Settings', '\u2699', s.id) + (archived(w, s) ? '' : btn('new-instance', 'New instance', '+', s.id)) + '</div>';
      if (shut(s.id)) continue;
      if (found) {
        h += `<div class="tree">${found.map(row).join('')}</div>`;
        continue;
      }
      const closed = s.instances.length - open.length;
      h += '<div class="tree">';
      for (const k of s.wakes) h += `<div class="row wake"><span class="nm" title="Starts ${esc(k.label)} ${when(k.at)}${k.text ? `: ${esc(k.text)}` : ''}"><span class="l">Starts ${esc(k.label)} ${soon(k.at)}</span></span><span class="n">${k.days ? 'weekly' : 'wake'}</span></div>`;
      for (const r of s.requests) h += `<div class="row req"><span class="nm" title="${esc(`${r.from} asks to ${r.target ? 'wake' : 'start'} ${r.label}${r.text ? `: ${r.text}` : ''}`)}"><span class="l">${r.from.includes('@') ? person(r.from) : esc(r.from.split('/').slice(-2).join(' · '))} asks to ${r.target ? 'wake' : 'start'} ${esc(r.label)}</span></span>`
        + (archived(w, s) ? '' : `${r.target && r.who !== me.email ? '' : `<button class="add" data-act="req-start" data-id="${r.id}"${r.target ? ` data-target="${r.target}"` : ''} title="${r.target ? 'Wake' : 'Start'} it">\u25B6</button>`}<button class="add" data-act="req-drop" data-id="${r.id}" title="Dismiss">\u00D7</button>`) + '</div>';
      h += s.instances.filter(i => i.status === 'open' || showClosed.has(s.id) || i.id === cur?.i?.id).map(row).join('');
      if (closed) h += closedToggle(s.id, closed);
      h += `<div class="row wake notes"><a class="nm" data-act="notes" data-id="${s.id}" title="Tell this series something for its runs"><span class="l">Notes</span></a><span class="n">${s.notes ? `${s.notes} open` : ''}</span></div>`;
      h += '</div>';
    }
    // A series moved to another workspace, for a week, where people who aren't in that one see it go.
    if (!q) for (const m of w.moved) h += `<div class="row wake"><span class="nm"><span class="l">${esc(m.name)} moved to ${esc(m.to)}</span></span><span class="n">${ago(m.at)}</span></div>`;
    // Tasks, each a series of its one instance, listed under a heading that is no series.
    const done = !wHit ? 0 : tasks.filter(i => i.status !== 'open').length;
    if (tasks.length) h += '<div class="row grp"><span class="nm">Ungrouped</span></div>' + tasks.filter(i => !wHit || i.status === 'open' || showClosed.has(w.id) || i.id === cur?.i?.id).map(row).join('')
      + (done ? closedToggle(w.id, done) : '');
    h += '</div>';
  }
  const archivedCount = side.filter(w => w.archived).length + side.filter(w => expanded.has(w.id)).flatMap(w => w.series).filter(s => s.archived).length;
  if (q && !shown) h += '<div class="empty">Nothing matches.</div>';
  const opt = (act, id, on, label) => `<button class="opt ${on ? 'sel' : ''}" data-act="${act}" data-id="${id}">${label}</button>`;
  put($('#sortpop'), '<div class="head">Show</div>' + opt('workspaces', 'mine', mine, 'My workspaces') + opt('workspaces', 'all', !mine, 'All workspaces')
    + (archivedCount ? opt('toggle-archived', '', showArchived, `Archived (${archivedCount})`) : '') + '<div class="head">Sort</div>' + opt('order', 'activity', !byName, 'Newest activity') + opt('order', 'name', byName, 'Name'));
  $('#sorter').classList.toggle('on', localStorage.workspaces === 'all' || showArchived || byName);
  put($('#newws'), me.can.includes('create') ? btn('new-workspace', 'New workspace', '+') : '');
  // Keys move a focus through the rows' links (j, k), which a new drawing keeps.
  const kf = $('#tree').contains(document.activeElement) && document.activeElement.getAttribute('href');
  put($('#tree'), h);
  if (kf) $(`#tree [href="${kf}"]`)?.focus();
  // The foot: Settings, the version the server runs, and « to fold the sidebar to a rail, as this browser keeps it.
  const folded = $('.app').classList.contains('folded');
  put($('#sidefoot'), `<button class="setting" data-act="logins" title="Logins and tokens"><span class="cog">\u2699</span>Settings<span class="go-on">\u203A</span></button>`
    + (me.role === 'admin' ? '<button class="setting" data-act="costs" title="Daily costs and model key">Costs<span class="go-on">\u203A</span></button>' : '')
    + (me.version ? `<div class="release">rollforward ${esc(me.version)}</div>` : '')
    + `<button class="sidefold" data-act="fold-side" title="${folded ? 'Open' : 'Fold'} the sidebar">${folded ? '\u00BB' : '\u00AB'}${folded && waits ? '<span class="dot"></span>' : ''}</button>`);
}

function lastDone() { return data.log.findLast(e => e.op === 'done'); }
// A deleted instance's delete entry, the only one its log keeps.
function gone() { return data?.doc.status === 'deleted' ? data.log[0] : null; }

const stepText = s => `${s.do}${s.target ? ` ${s.target}` : ''}${s.value !== undefined ? ` = "${s.value}"` : ''}`;

function renderBar() {
  if (editing) return;
  const open = editable();
  let h = `<button class="menu" data-act="menu">☰</button>`;
  h += `<div class="ttl"><div class="crumb">${esc(cur?.w.name ?? '')}${cur?.s ? ' · ' + esc(cur.s.single ? 'Ungrouped' : cur.s.name) : ''}${open && cur.s.notes ? ` · <a data-act="notes" data-id="${cur.s.id}">${plural(cur.s.notes, 'open note')}</a>` : ''}</div><h1>${data && !gone() ? `<span class="t"${archived() ? '' : ' data-act="rename" title="Rename"'}>${esc(cur.i.label)}</span>${archived() ? '' : '<button class="ren" data-act="rename" title="Rename">' + ICON.edit + '</button>'}` : esc(cur?.i?.label ?? 'No instance')}${data && !gone() ? owner() + `<span class="reacts">${reactHtml()}</span>` : ''}</h1></div>`;
  if (data) {
    const d = lastDone(), talk = data.waiting.length;
    const state = gone() ? `Deleted by ${esc(nameOf(gone().by))} · ${when(gone().at)}`
      : archived() ? 'Archived · read-only' : data.doc.status !== 'open' ? `${data.doc.status === 'closed' ? 'Closed' : 'Abandoned'} · read-only`
      : data.run ? `<span class="spin"></span>Agent working · run ${data.run.n}${canStop() ? '<button class="quiet" data-act="interrupt">Interrupt</button>' : ''}`
      : data.queued ? '\u29D7 Queued' : d?.error ? `<span class="bad" title="${esc(d.error)}">Run ${d.run} failed · ${hhmm(d.at)}</span>`
      : d ? `Agent idle · Last run ${hhmm(d.at)}` : 'Waiting for files';
    const next = open && cur.i.wakes[0];
    const wake = open ? `<button class="btn top wake" data-act="wakes"${next ? ` title="Next wake ${when(next.at)}"` : ''}>${ICON.alarm}${next ? `Wakes ${soon(next.at)}` : 'No wake'}</button>` : '';
    const del = cur.w.manage && !gone() ? '<a class="del" data-act="delete" title="For those who manage the workspace: delete it, and all the server holds of it">Delete\u2026</a>' : '';
    h += `<div class="state">${state}</div>${wake}${del}`;
    // Close for its runner; Take over for anyone else, while no run goes unless they may stop it; and Assign… for its runner and those
    // who manage the workspace, a run going stopped first.
    const off = data.run ? 'disabled title="Available when the run ends"' : '', mine = data.runner.by === me.email;
    if (open) h += `${mine ? `<button class="btn commit top" data-act="close" ${off}>Close</button>`
      : `<button class="btn top" data-act="takeover" ${data.run && !canStop() ? off : `title="${esc(nameOf(data.runner.by))} runs it, with their logins. Taking over makes it yours${data.run ? `, stopping run ${data.run.n}` : ''}."`}>${ICON.hand}Take over</button>`}`
      + `${mine || cur.w.manage ? `<button class="btn top" data-act="assign" title="Make someone else its runner${data.run ? `, stopping run ${data.run.n}` : ''}">Assign\u2026</button>` : ''}`;
    else if (cur.s.single && !archived() && !gone()) h += '<button class="btn top" data-act="start-series">Start series</button>';
    // One control opens and closes the side panel, where it stays, with what waits there as its badge.
    h += `<button class="ptog ${ui.open ? 'on' : ''}" data-act="panel" title="${ui.open ? 'Close' : 'Open'} the conversation"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M10 2.5v11"/>${ui.open ? '<rect x="10" y="2.5" width="4.5" height="11" fill="currentColor" stroke="none" opacity=".35"/>' : ''}</svg>${talk ? `<span class="badge">${talk}</span>` : ''}</button>`;
  }
  put($('#bar'), h);
}

// The runner's chip: Yours, or their name; on hover or a click, what that means, since when, and the logins they ticked.
function owner() {
  const r = data.runner, mine = r.by === me.email, name = mine ? 'You' : person(r.by), e = made();
  const how = { create: 'Made it', duplicate: `Copied it from ${esc(e.from)}`, takeover: `Took it over from ${who(e.from)}`, assign: e.by === e.to ? `Took it over from ${who(e.from)}` : `Assigned by ${who(e.by)}, from ${who(e.from)},` }[e.op];
  return `<span class="owner" tabindex="0">${mine ? 'Yours' : name}<span class="about">`
    + (editable() ? `${name} run${mine ? '' : 's'} it: runs use ${mine ? 'your' : 'their'} logins, and only ${mine ? 'you' : 'they'} close it.` : `${name} ran it.`)
    + `<br>${how} ${when(e.at)}.<br>${r.ticked.length ? `Credentials: ${esc(r.ticked.join(', '))}` : 'No credentials ticked.'}</span></span>`
    + (mine && editable() ? `<button class="creds" data-act="ticks" title="${esc(r.ticked.join(', '))}">Credentials: ${credentials(r)}</button>` : '');
}

// The runner's ticks at a glance, by kind, such as "Mail · 2 folders".
function credentials(r) {
  const n = {}, say = { mail: ['Mail', 'mailboxes'], site: ['1 site', 'sites'], folder: ['1 folder', 'folders'], file: ['1 file', 'files'], website: ['1 website', 'websites'], warehouse: ['1 warehouse', 'warehouses'] };
  r.logins.forEach((id, k) => {
    const kind = id.startsWith('m365:mail:') ? 'mail' : id.startsWith('m365:site:') ? 'site' : id.startsWith('m365:') ? (r.ticked[k].startsWith('File ') ? 'file' : 'folder') : id.startsWith('web:') ? 'website' : 'warehouse';
    n[kind] = (n[kind] ?? 0) + 1;
  });
  return Object.entries(n).map(([k, c]) => (c === 1 ? say[k][0] : `${c} ${say[k][1]}`)).join(' \u00b7 ') || 'none';
}

function provenance(file) {
  if (file.startsWith('upload/')) {
    const e = data.log.find(e => e.op === 'upload' && e.file === file);
    return { person: true, by: e?.by ?? 'someone', at: e?.at };
  }
  const e = data.log.find(e => e.op === 'point' && e.file === file);
  return { person: false, by: 'Agent', at: e?.at };
}

// A copy, which earlier versions made, starts its own history at its latest duplicate entry: what came before is the copied instance's, settled.
const copied = () => data.log.findLast(e => e.op === 'duplicate')?.seq ?? 0;

function tile(item) {
  const on = talkOn(item.id), open = on.filter(t => t.waits).length, fixed = data.log.some(e => e.op === 'correction' && e.item === item.id);
  const count = (fixed ? '<span class="corr">Corrected</span> ' : '') + (open ? `${open} to answer` : on.length ? `${on.length} comment${on.length > 1 ? 's' : ''}` : '');
  const corner = on.length ? `<span class="corner ${open ? 'ask' : ''}"></span>` : '';
  const mark = `${seen[item.id] !== sig(item) ? 'fresh' : ''} ${prevSigs[item.id] && prevSigs[item.id] !== sig(item) ? 'flash' : ''}`;
  if (!item.file) {
    return `<div class="tile ghost ${mark}" data-item="${esc(item.id)}">${corner}<div class="ext"><span>${esc(item.kind.toUpperCase())}</span><span class="nc ${open ? 'q' : ''}">${count}</span></div><div class="fn">${esc(item.name)}</div><div class="meta">${item.kind === 'input' ? 'Missing' : 'Not built yet'}</div></div>`;
  }
  const p = provenance(item.file), sent = data.log.findLast(e => e.op === 'delivered' && e.item === item.id && e.seq > copied());
  const v = data.log.filter(e => e.op === 'point' && e.item === item.id && e.file).length;
  return `<div class="tile ${p.person ? 'person' : 'agent'} ${openItem === item.id ? 'on' : ''} ${mark}" data-item="${esc(item.id)}">${corner}<div class="ext"><span>${esc(ext(item.file))}${v > 1 ? ' · v' + v : ''}</span><span class="nc ${open ? 'q' : ''}">${count}</span></div><div class="fn">${esc(item.name)}</div><div class="file">${esc(fname(item.file))}</div>${item.headline ? `<div class="hl">${esc(item.headline)}</div>` : ''}${item.source ? `<div class="src">${esc(item.source)}</div>` : ''}${item.destination ? `<div class="dst" title="${esc(item.destination)}">\u2192 ${esc(item.destination)}</div>` : ''}${sent ? `<div class="sent" title="${esc(sent.receipt)}">Sent ${hhmm(sent.at)} to ${esc(sent.to)}</div>` : ''}<div class="meta"><b>${person(p.by)}</b> · ${hhmm(p.at)}</div></div>`;
}

// The instance in three slices: Inputs, Steps and Outputs. On a desktop a toggle, kept in this browser, shows them as lists, each sorting by
// the column its heading names; a phone shows tiles, Outputs first.
function renderPanes() {
  $('#outs').hidden = $('#steps').hidden = $('#view').hidden = !data;
  if (!data) return put($('#ins'), `<div class="empty">${archived() ? 'Archived · read-only' : cur?.s ? 'No instance yet. Make one with + by the series.' : cur ? 'No series yet. Make one with + by the workspace.' : me.can.includes('create') ? 'No workspace yet. Make one with + by the filter.' : 'No workspace yet: an admin makes one or adds you to one.'}</div>`);
  if (gone()) {
    $('#outs').hidden = $('#steps').hidden = $('#view').hidden = true;
    return put($('#ins'), `<div class="empty">${esc(nameOf(gone().by))} deleted ${esc(cur.i.label)} ${when(gone().at)}. Nothing is left of it here but its place in ${esc(cur.s.single ? 'the workspace' : cur.s.name)}.</div>`);
  }
  const open = editable(), stored = localStorage[`seen:${instPath()}`], items = data.doc.items, list = localStorage.view === 'list' && innerWidth > 800;
  seen = stored ? JSON.parse(stored) : {};
  if (!stored) markSeen(items);
  const ins = items.filter(i => i.kind === 'input'), outs = items.filter(i => i.kind === 'output'), steps = items.filter(i => i.kind === 'step');
  const head = (title, list, pane, count = list.length ? `${list.filter(i => i.file).length} of ${list.length}` : '') => `<div class="ph"><h2>${title}</h2><span class="c">${count}</span>${open && pane ? `<button class="btn" data-act="add" data-pane="${pane}">${ICON.files}Add files</button>` : ''}</div>`;
  const adding = pane => uploads.filter(u => u.pane === pane && u.path === instPath()).map(u => `<div class="tile ghost"><div class="ext"><span>UPLOADING</span></div><div class="fn">${esc(u.f.name)}</div><div class="prog"><i style="width:${u.pct}%"></i></div></div>`).join('');
  const files = new Set(items.map(i => i.file)), also = new Map();
  for (const t of threads) for (const p of t.posts) for (const f of p.by === 'agent' ? p.files ?? [] : []) if (!files.has(f) && !also.has(f)) also.set(f, t);
  const via = t => t.item ? `on <a data-act="opencard" data-item="${esc(t.item)}">${esc(items.find(i => i.id === t.item)?.name ?? t.item)}</a>` : `in <a data-act="thread" data-thread="${esc(t.id)}">a comment</a>`;
  const alsoUsed = also.size ? `<div class="also"><div class="ah">Also used</div>${[...also].map(([f, t]) => `<div><a data-act="preview" data-file="${esc(f)}">${esc(fname(f))}</a> <span class="via">· cited ${via(t)}</span></div>`).join('')}</div>` : '';
  const body = (pane, xs) => `${list ? listHtml(pane, xs) : ''}<div class="tiles">${list ? '' : xs.map(tile).join('')}${adding(pane)}</div>`;
  $('#panes').classList.toggle('list', list);
  put($('#view'), `<span class="seg">${[['tiles', 'Tiles'], ['list', 'List']].map(([v, name]) => `<button class="${list === (v === 'list') ? 'sel' : ''}" data-act="view" data-id="${v}">${name}</button>`).join('')}</span>`);
  put($('#ins'), head('Inputs', ins, 'in') + body('in', ins) + alsoUsed);
  put($('#outs'), head('Outputs', outs, 'out') + body('out', outs));
  put($('#steps'), head('Steps', steps) + body('step', steps));
  prevSigs = Object.fromEntries(items.map(i => [i.id, sig(i)]));
  light();
}

// A slice as a dense list: a row an item, in the screen's order until a heading sorts it, a second click reversing it. A row with no
// file yet says only that, as its tile does.
function listHtml(pane, xs) {
  const s = ui.sort[pane], was = data.previous;
  const cols = [['name', 'Name'], ['where', { in: 'Source', step: 'Made from', out: 'Destination' }[pane]], ['by', 'By'], ...(pane === 'out' ? [['headline', 'Headline']] : []), ['changed', 'Changed'], ['threads', 'Threads']];
  const row = i => {
    const p = i.file && provenance(i.file), on = talkOn(i.id), asks = on.filter(t => t.waits).length;
    return { i, p, on, asks, name: i.name, where: (p && { in: i.source, step: i.from?.map(f => data.doc.items.find(x => x.id === f)?.name ?? f).join(', '), out: i.destination }[pane]) ?? '', by: p ? nameOf(p.by) : '', headline: (p && i.headline) ?? '', changed: was?.changed[i.id] ?? '', threads: asks * 1e4 + on.length };
  };
  const rows = xs.map(row);
  if (s) rows.sort((a, b) => s.dir * (typeof a[s.key] === 'number' ? a[s.key] - b[s.key] : String(a[s.key]).localeCompare(String(b[s.key]), undefined, { numeric: true })));
  const tr = r => `<tr class="lrow ${!r.i.file ? 'ghost' : r.p.person ? 'person' : 'agent'} ${openItem === r.i.id ? 'on' : ''} ${seen[r.i.id] !== sig(r.i) ? 'fresh' : ''}" data-item="${esc(r.i.id)}">`
    + `<td><span class="fn">${esc(r.name)}</span>${r.i.file ? `<span class="file">${esc(fname(r.i.file))}</span>` : ''}</td><td>${esc(r.where)}</td>`
    + `<td>${r.i.file ? `<b>${person(r.p.by)}</b> ${hhmm(r.p.at)}` : r.i.kind === 'input' ? 'Missing' : 'Not built yet'}</td>${pane === 'out' ? `<td class="headline">${esc(r.headline)}</td>` : ''}<td>${r.changed}</td>`
    + `<td class="${r.asks ? 'q' : ''}">${r.asks ? `${r.asks} to answer` : r.on.length ? plural(r.on.length, 'comment') : ''}</td></tr>`;
  return `<table class="lst"><tr>${cols.map(([k, name]) => `<th data-act="sort" data-pane="${pane}" data-key="${k}" ${s?.key === k ? `aria-sort="${s.dir > 0 ? 'ascending' : 'descending'}"` : ''} ${k === 'changed' && was ? `title="Since ${esc(was.label)}"` : ''}>${name}</th>`).join('')}</tr>${rows.map(tr).join('')}</table>`;
}

// Hovering a tile or a row marks what it's made from, and, fainter, what those are made from, all the way back.
function light() {
  const from = id => data?.doc.items.find(i => i.id === id)?.from ?? [], near = new Set(from(hover)), up = new Set(), climb = id => { for (const f of from(id)) if (!up.has(f)) { up.add(f); climb(f); } };
  if (hover) climb(hover);
  for (const el of document.querySelectorAll('#panes :is(.tile, .lrow)[data-item]')) {
    el.classList.toggle('made', up.has(el.dataset.item));
    el.classList.toggle('far', up.has(el.dataset.item) && !near.has(el.dataset.item));
  }
}

const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
// People by name, with their email on hover, and Entra groups by label, with their id; a name that two of them share, with the email
// or id beside it, so no one passes for another; anyone the page has no name for, as they are. who and nameOf say you, and Agent;
// actor names the agent as its runner's at the time, on whose behalf it acted.
const called = id => Object.values(me.names).filter(n => n === me.names[id]).length > 1 ? `${me.names[id]} <${id}>` : me.names[id];
const person = id => me.names[id] ? `<span title="${esc(id)}">${esc(called(id))}</span>` : esc(id);
const who = id => id === 'agent' ? 'Agent' : id === me.email ? 'you' : person(id);
const nameOf = id => id === 'agent' ? 'Agent' : id === me.email ? 'you' : me.names[id] ? called(id) : id;
// What made someone the instance's runner as of a time: making it, an earlier version's copy, or an assign, a takeover being one to
// oneself; and whom it made the runner.
const made = (at = '\uffff') => data.log.findLast(x => x.at <= at && ['create', 'duplicate', 'takeover', 'assign'].includes(x.op)), ranBy = e => e.op === 'assign' ? e.to : e.by;
const actor = (by, at) => {
  const r = by === 'agent' && ranBy(made(at));
  return by === 'server' ? '<span class="w">Server</span>' : `<span class="w p" title="${esc(r ? `Acting for ${r}` : by)}">${esc(r ? (r === me.email ? 'Your agent' : `${nameOf(r)}'s agent`) : by === me.email ? 'You' : nameOf(by))}</span>`;
};
// An instance by its label now, with its series' name where it's a series', else as an entry named it then.
const labelOf = (id, then) => tree.flatMap(w => w.series.flatMap(s => s.instances.filter(i => i.id === id).map(i => s.single ? i.label : `${s.name} \u00b7 ${i.label}`)))[0] ?? then;
// Another instance's agent, which left a note here or on the series, and whom it acted for.
const agentOf = e => `Agent of <a href="#/${esc(e.see.inst)}">${esc(labelOf(e.see.inst, e.see.label))}</a>, for ${person(e.runner)}`;
const shotsHtml = es => `<div class="shots">${es.map(e => `<img src="${fileUrl(e.file)}" loading="lazy" alt="" title="${esc(e.site)} \u00b7 ${hhmm(e.at)}" data-act="preview" data-file="${esc(e.file)}">`).join('')}</div>`;

function logText(e) {
  const w = e.see && e.op === 'comment' ? agentOf(e) : actor(e.by, e.at);
  const item = id => esc(data.doc.items.find(i => i.id === id)?.name ?? id);
  const f = e.file ? `<div class="f"><a data-act="preview" data-file="${esc(e.file)}">${esc(e.file)}</a></div>` : '';
  return {
    create: () => `${w} opened the instance`,
    upload: () => `${w} uploaded ${e.pane === 'out' ? 'an output' : 'an input'}${e.onto ? ' onto ' + item(e.onto) : ''}${f}`,
    point: () => `${w} ${e.file ? 'showed' : 'cleared'} ${item(e.item)}${e.was ? `<div class="d">Replacing ${esc(fname(e.was))}</div>` : ''}${f}`,
    item: () => `${w} set up ${esc(e.name)}${e.from?.length ? `<div class="d">From ${e.from.map(item).join(', ')}</div>` : ''}${e.headline ? `<div class="d">${esc(e.headline)}</div>` : ''}${e.source ? `<div class="d">Source: ${esc(e.source)}</div>` : ''}${e.destination ? `<div class="d">Destination: ${esc(e.destination)}</div>` : ''}`,
    remove: () => `${w} removed ${esc(e.item)} from the screen`,
    run: () => `Run ${e.run} started${data.run?.n === e.run ? ` \u00b7 ${usd(data.run.cost, data.run.estimated)} so far` : ''}`,
    done: () => `Run ${e.run} finished${e.aborted ? ' (stopped)' : ''} · ${took(e)} · ${usd(e.cost, e.estimated)}${e.error ? `<div class="d">${esc(e.error)}</div>` : ''}`,
    interrupt: () => `${w} interrupted the run${e.why ? `<div class="d">${esc(e.why)}</div>` : ''}`,
    close: () => `${w} closed the instance${e.accepted ? `<div class="d">Accepting what the agent did for ${e.accepted.length} ask${e.accepted.length > 1 ? 's' : ''} still waiting</div>` : ''}${e.commit ? `<div class="d">Commit <code>${e.commit.slice(0, 7)}</code></div>` : ''}`,
    signoff: () => `${w} ${e.approved === false ? 'rejected' : 'approved'}${e.on ? ` c${e.on}` : ''}<div class="d">${e.text ? `${esc(e.text)} · ` : ''}Commit <code>${e.commit.slice(0, 7)}</code></div>`,
    reject: () => `${w} rejected c${e.on}${e.text ? `<div class="d">${esc(e.text)}</div>` : ''}`,
    withdraw: () => `${w} withdrew c${e.on}${e.see ? `, answered in c${e.see}` : ''}<div class="d">${esc(e.text)}</div>`,
    commit: () => e.error ? `${e.run ? `Run ${e.run}'s changes weren't` : "What's above wasn't"} committed<div class="d">${esc(e.error)}</div>` : `${w} committed the folder<div class="d">${esc(e.message)} · Commit <code>${e.commit.slice(0, 7)}</code></div>`,
    abandon: () => `${w} abandoned the instance`,
    delete: () => `${w} deleted the instance, and all the server held of it`,
    correction: () => `${w} marked ${e.item ? item(e.item) : 'the instance'}${e.ref ? ` at ${esc(e.ref)}` : ''} ${e.kind}<div class="d">${esc(e.text)}${seeHtml(e.see)}</div>`,
    said: () => `${w} left a note in <a href="#/${esc(e.inst)}">${esc(labelOf(e.inst, e.label))}</a>, ${esc(e.thread)}`,
    corrected: () => `${w} marked <a href="#/${esc(e.inst)}">${esc(cur.s?.instances.find(i => i.id === e.inst)?.label ?? labelOf(e.inst, e.label))}</a>${e.item ? ` ${esc(e.item)}` : ''} ${e.kind}`,
    comment: () => `${w} ${data.standing[e.seq] === 'note' ? `left a note for ${who(data.runner.by)}` : e.by !== 'agent' ? 'commented' : e.ask ? `${e.ask === 'proposal' ? 'proposed' : 'asked'}${e.to ? ' ' + who(e.to) : ''}` : 'said'}${e.item ? ` on ${item(e.item)}${e.ref ? ` at ${esc(e.ref)}` : ''}` : ''}<div class="d">${esc(e.text)}</div>`,
    resolve: () => `${w} resolved a thread${e.text ? `<div class="d">${esc(e.text)}</div>` : ''}`,
    react: () => `${w} ${e.up === null ? 'took back a reaction' : e.up ? 'gave a thumbs up' : 'gave a thumbs down'} on ${e.on ? `comment c${e.on}` : 'the instance'}`,
    wake: () => `${data.standing[e.seq] === 'note' ? `${person(e.from)} would wake it: a note for ${who(data.runner.by)}` : `Woken${e.from ? ` by ${who(e.from)}` : ''}`}${[e.reason, e.text].filter(Boolean).map(t => `<div class="d">${esc(t)}</div>`).join('')}`,
    expired: () => e.left ? `${who(e.runner)} has left: Microsoft no longer signs them in, so someone takes the instance over` : `Waiting for ${who(e.runner)} ${e.login === 'openrouter' ? 'to save another OpenRouter key, or stop using their own, out of credits' : `to sign in to ${esc(e.name ?? (e.login === 'm365' ? 'Microsoft 365' : e.login))} again`}${data.runner.by === me.email && (data.held ?? []).includes(e.login) && e === data.log.findLast(x => x.op === 'expired' && !x.left && x.login === e.login && x.runner === me.email) ? `<div>${signInHtml(e.login, e.name ?? e.login)}</div>` : ''}`,
    takeover: () => `${w} took over from ${who(e.from)}${e.logins?.length ? `<div class="d">Logins: ${esc(e.logins.join(', '))}</div>` : ''}`,
    assign: () => `${w} ${e.to === e.by ? 'took over' : `assigned it to ${who(e.to)}`} from ${who(e.from)}${e.logins?.length ? `<div class="d">Logins: ${esc(e.logins.join(', '))}</div>` : ''}`,
    promote: () => `${w} made it a series, ${esc(e.series)}`,
    logins: () => `${w} ticked logins: ${esc(e.logins.join(', ') || 'none')}`,
    egress: () => `Run ${e.run} ${e.allowed ? 'reached' : 'was refused'} ${esc(e.host)}`,
    delivered: () => `${w} delivered ${item(e.item)} to ${esc(e.to)}<div class="d">${{ graph: 'Through Microsoft 365 · ', website: 'Through a website · ' }[e.via] ?? ''}${esc(e.receipt)}</div>`,
    send: () => `${w} sent ${esc(e.method)} ${esc(e.path)} to ${esc(e.name)}, with no answer logged`,
    call: () => `${w} ${e.model ? `asked ${esc(e.model)}` : `called ${esc(e.name)}: ${esc(e.method)} ${esc(e.path)}`}${e.cost ? ` \u00b7 ${e.estimated ? '~' : ''}$${e.cost.toFixed(4)}${e.estimated ? ' (est.)' : ''}` : ''}${e.refused || e.failed ? `, ${e.refused ? 'refused' : 'failed'}<div class="d">${esc(e.refused ?? e.failed)}</div>` : e.status >= 300 ? `, which answered ${e.status}` : ''}`,
    graph: () => `${w} ${e.method ? `sent ${esc(e.method)} ${esc(e.path)} to` : `read ${esc(e.path)} from`} Microsoft 365${e.status >= 300 ? `, which answered ${e.status}` : ''}${e.to && e.to !== e.path ? `<div class="d">${esc(e.to)}</div>` : ''}${[e.body, e.file].filter(Boolean).map(f => `<div class="f"><a data-act="preview" data-file="${esc(f)}">${esc(f)}</a></div>`).join('')}`,
    move: () => `Moved from ${esc(e.from)} to ${esc(e.to)}, ${who(e.accepted_by ?? e.by)} accepting`,
    rename: () => e.by === 'server' ? `Named by its first prompt, from ${esc(e.from)}` : `${w} renamed the instance from ${esc(e.from)}`,
    duplicate: () => `${w} made this instance as a copy of ${esc(e.from)}`,
    browser: () => e.action === 'get' ? `${w} fetched ${esc(e.from)} from the browser on ${esc(e.site)}${f}`
      : e.action === 'wait' ? `Run ${e.run} waits for ${person(e.login)}'s ${esc(e.site)} browser, held by ${esc(e.held)}`
      : e.action === 'refused' ? `Run ${e.run} goes on without ${esc(e.site)}<div class="d">${esc(e.why)}</div>`
      : e.action === 'allowed' ? `${w} let ${e.login ? `${person(e.login)}'s ` : ''}${esc(e.site)} reach ${esc(e.allowed.join(', '))}${Object.entries(e.why ?? {}).map(([h, y]) => `<div class="d">${esc(h)}: ${esc(y)}</div>`).join('')}`
      : e.action === 'drive' ? `${w} took control of run ${e.run}'s browser on ${esc(e.site)}` : `${w} closed run ${e.run}'s browser${e.site ? ` on ${esc(e.site)}, in ${person(e.login)}'s login` : ''}<div class="d">${e.error ? esc(e.error) : `${e.requests} requests${e.writes ? `, ${e.writes} writes` : ''}${e.blocked ? `, ${e.blocked} blocked` : ''}`}</div>${f}`,
    shot: () => `Run ${e.run}'s browser on ${esc(e.site)}${shotsHtml([e])}`,
    browsers: () => `Run ${e.run}'s browsers did not all close<div class="d">${esc(e.error)}</div>`,
  }[e.op]?.() ?? `${w} ${esc(e.op)}`;
}

// What this instance waits on you for, above it: the threads that wait on you, a question, a proposal, an ask from before those, or
// a note, and your logins that expired under it. Most of the time there is nothing.
function renderNeeds() {
  $('#draining').hidden = me.draining == null;
  put($('#draining'), me.draining == null ? '' : `An update is waiting for ${plural(me.draining, 'run')} to finish; new runs start after it.`);
  const held = data?.runner.by === me.email ? (data.held ?? []).map(l => data.log.findLast(e => e.op === 'expired' && !e.left && e.login === l && e.runner === me.email)).filter(Boolean) : [];
  const act = (e, mode, name) => `<button class="btn ${mode === 'reply' ? 'reply-to' : ''}" data-act="reply" data-mode="${mode}" data-seq="${e.seq}">${name}</button>`;
  const h = (data ? data.waiting.filter(w => w.who === me.email).map(w => data.log[w.seq - 1]) : []).map(e => `<div><b class="${e.ask === 'proposal' ? 'propose' : ''}">${{ question: 'Question', proposal: 'Proposal', true: 'Ask' }[e.ask] ?? 'Note'}</b><span>${esc(firstLine(e.text))}</span>`
    + (!editable() ? `<button class="btn" data-act="thread" data-thread="${e.thread}">Open</button>` : e.ask === 'proposal' ? act(e, 'approve', 'Approve\u2026') + act(e, 'reject', 'Reject\u2026') : act(e, 'reply', 'Reply')) + '</div>').join('')
    + held.map(e => `<div><b>Login</b><span>${e.login === 'openrouter' ? 'Your OpenRouter key is out of credits' : `Your ${esc(e.name)} login has expired`}: this instance waits for it</span>${signInHtml(e.login, e.name)}</div>`).join('');
  $('#needs').hidden = !h;
  put($('#needs'), h);
  // A closed instance is read with the corrections it took since: what was wrong in it, or what superseded it, and where.
  const cs = data?.log.filter(e => e.op === 'correction') ?? [];
  $('#corrs').hidden = !cs.length;
  put($('#corrs'), `<b class="corr">Read with corrections (${cs.length})</b>` + cs.map(e => `<div><span><b>${e.item ? esc(data.doc.items.find(i => i.id === e.item)?.name ?? e.item) : 'The instance'}</b>`
    + `${e.ref ? ` at ${esc(e.ref)}` : ''} is ${e.kind}: ${esc(e.text)}${seeHtml(e.see)}</span><span class="by">${who(e.by)} \u00b7 ${when(e.at)}</span></div>`).join(''));
}

// Where a correction says the change is: a later instance, by its label now, and its thread.
const seeHtml = see => see ? ` \u00b7 see <a href="#/${esc(see.inst)}">${esc(cur.s?.instances.find(i => i.id === see.inst)?.label ?? labelOf(see.inst, see.label))}</a>${see.thread ? ` ${esc(see.thread)}` : ''}` : '';

function renderLog() {
  // Either side opens at its latest, as the panel does, and keeps there as posts come, unless the reader has scrolled up.
  if (ui.open && data && !$('#log').classList.contains('open')) $('#log').dataset.end = 'yes';
  $('#log').className = 'log' + (ui.open && data ? ' open' : '');
  if (!data || !ui.open) return;
  // This instance's half-written comment or reply, or files picked for one, holds its conversation still until sent or cleared; a
  // closed box's, hidden, doesn't.
  const shown = s => [...$('#conv').querySelectorAll(s)].filter(f => !f.closest('.reply[hidden]'));
  const drafting = shown('textarea, input[type=text]').some(t => t.value.trim()) || shown('input[type=file]').some(f => f.files.length);
  const focused = document.activeElement?.id === 'newcomment';
  // Its two sides, the conversation and the audit, one shown at a time: a half-written comment waits on the other's.
  put($('#lh'), `<span class="seg">${[['Conversation', !ui.audit], ['Audit', ui.audit]].map(([side, on]) => `<button class="${on ? 'sel' : ''}" ${on ? '' : 'data-act="audit"'}>${ICON[side === 'Audit' ? 'person' : 'chat']}${side}</button>`).join('')}</span>`
    + '<button class="x" data-act="panel" title="Close">\u00D7</button>');
  $('#conv').hidden = ui.audit;
  if (!drafting) put($('#conv'), conversationHtml());
  for (const [k, v] of Object.entries(draft.kept)) {
    const [seq, mode] = k.split(':'), box = mode ? $(`#conv .post[data-seq="${seq}"] > .reply[data-mode="${mode}"] textarea`) : $(`#${k}`);
    if (box) { box.value = v; delete draft.kept[k]; }
  }
  if (!ui.audit && $('#log').dataset.end !== 'no') $('#log').scrollTop = $('#log').scrollHeight;
  // Only on the instance it's for: a render for the one before, as the page catches up, leaves it. The box keeps the focus it had.
  if (focused) $('#newcomment')?.focus();
  if (ui.focus !== cur.i.id) return;
  $('#newcomment')?.focus();
  ui.focus = false;
}

// The audit, the panel's other side: the log and the agent's session, oldest first, one plain line each.
function renderAudit() {
  $('#audit').hidden = !(ui.audit && data);
  if ($('#audit').hidden) return;
  const res = s => s.result === undefined ? (data.run ? '<span class="spin"></span>' : 'no result') : s.error ? `<span class="bad">${esc(firstLine(s.result) || 'failed')}</span>`
    : s.kind === 'read' ? `${s.lines} lines` : firstLine(s.result) ? esc(firstLine(s.result)) + (s.lines > 1 ? ` +${s.lines - 1} lines` : '') : 'no output';
  const steps = lines.filter(s => s.kind !== 'user').map(s => ({ at: s.at, html: s.kind === 'say' ? `${actor('agent', s.at)} said ${esc(firstLine(s.text))}`
    : `<b>${VERB[s.kind] ?? esc(s.kind)}</b> <code>${esc(firstLine(s.kind === 'bash' ? s.text : s.text.split(`/${cur.s.name}/`).pop()))}</code> \u23BF ${res(s)}` }));
  const rows = [...data.log.map(e => ({ at: e.at, html: logText(e) })), ...steps].sort((a, b) => Date.parse(a.at) - Date.parse(b.at));
  const runs = data.log.filter(e => e.op === 'run').length, cost = data.log.reduce((t, e) => t + (e.op === 'done' ? e.cost : 0), 0) + (data.run?.cost ?? 0);
  const est = data.log.some(e => e.op === 'done' && e.estimated) || data.run?.estimated;
  put($('#audit'), `<div class="sub">${plural(runs, 'run')}, ${usd(cost, est)}</div>` + rows.map(r => `<div class="e"><span class="tm">${hhmm(r.at)}</span><div>${r.html}</div></div>`).join(''));
  if ($('#log').dataset.end !== 'no') $('#log').scrollTop = $('#log').scrollHeight;
}

// A run's browser, live while it's open, for anyone who sees the instance to watch, but on a website that lists its people only for
// them: one at a time, the others a click away, folded or open as the person last left it, in this browser. Stop browser interrupts
// the run, which closes its browsers. The person whose login it's in may take control of it, popped over the page with an orange
// border until they give it back, it closes or they go to another instance.
function renderPlayer() {
  const sites = data?.run?.browsers ?? [], site = sites.includes(ui.site) ? ui.site : sites[0], folded = localStorage.player === 'folded';
  if (!data?.run?.yours.includes(site) || ui.drive !== `${cur.i.id}/${site}`) ui.drive = null;
  const drive = !!ui.drive;
  $('#player').hidden = !site;
  $('#player').classList.toggle('drive', drive);
  // Emptied as it hides, so a browser opened again is a new view.
  put($('#player'), !site ? '' : `<div class="plh"><b>Run ${data.run.n}'s browser</b>${sites.length > 1 && !drive ? `<span class="seg">${sites.map(s => `<button class="${s === site ? 'sel' : ''}" data-act="watch" data-site="${esc(s)}">${esc(s)}</button>`).join('')}</span>` : `<span>on ${esc(site)}${drive ? ', in your control' : ''}</span>`}`
    + (drive ? '<button class="quiet" data-act="drive">Give back control</button></div>'
      : `${data.run.yours.includes(site) ? `<button class="quiet" data-act="drive" data-site="${esc(site)}" title="Pops it over the page for you to use, in your login, while the run goes on">Take control</button>` : ''}`
        + `${canStop() ? '<button class="quiet" data-act="interrupt" title="Interrupts the run, which closes its browsers">Stop browser</button>' : ''}<button class="x" data-act="player" title="${folded ? 'Open' : 'Fold'}">${folded ? '\u25B4' : '\u25BE'}</button></div>`)
    + (folded && !drive ? '' : `<iframe src="/runs/${cur.i.id}/${enc(site)}/view?${drive ? 'drive' : 'watch'}" title="Run ${data.run.n}'s browser on ${esc(site)}"></iframe>`));
}

// The audit shows with the session's steps, fetched for it.
async function toggleAudit() {
  ui.audit = !ui.audit;
  if (ui.audit) [lines, linesKey] = [await api(instPath() + '/trace'), `${instPath()}:${data.log.length}`];
  $('#log').dataset.end = 'yes';
  renderLog();
  renderAudit();
}

const VERB = { read: 'Read', bash: 'Ran', edit: 'Edited', write: 'Wrote' };
const firstLine = t => t.trim().split('\n')[0];
// A link to comment cN of this instance or another of its series: a click shows it there; hovering names who wrote it and its first
// words, another instance's once its log is fetched.
const cref = (seq, text, inst = cur.i.id) => {
  const e = inst === cur.i.id && data.log[seq - 1];
  return `<a class="cref" data-act="cref" data-inst="${inst}" data-seq="${seq}"${e?.op === 'comment' ? ` title="${esc(`${nameOf(e.by)}: ${firstLine(e.text).slice(0, 80)}`)}"` : ''}>${text}</a>`;
};
// A bare cN in a post, a comment of this instance, links it, but not as part of an address, a query, an entity or a cell's; a link's or
// code's text stays as it is.
const crefs = h => h.replace(/(<a\b[^]*?<\/a>|<code>[^]*?<\/code>|<[^>]*>)|(?<![\w/.#=&;!:?-])c(\d+)\b(?![\w-]|\.\w)/g, (m, skip, n) => skip || data.log[n - 1]?.op !== 'comment' ? m : cref(+n, m));
// A file in the agent's markdown, by its path in the instance, or ../<label>/… in another of its series: [name](working/x.csv) links it,
// opening the preview, and an image, ![name](working/x.png), shows as a thread's file does; a path may hold spaces and one level of
// parentheses, as in TB (final).csv, and a link's an &, which the text holds escaped and data-file decodes. [name](#cN) links a comment, and
// [name](../<label>#cN) one of another instance, last, so what its title quotes of the comment is left as it is.
const inline = s => s.replace(/!\[([^\]]*)\]\(((?:[^()&]|\([^()&]*\))+\.(?:png|jpe?g|gif|webp|svg))\)/gi, (_, alt, f) => `<img class="md" src="${fileUrl(f)}" loading="lazy" alt="${alt}" title="${alt}" data-act="preview" data-file="${f}">`)
  .replace(/\[([^\]]+)\]\(((?:\.\.\/[^/)]+\/)?(?:upload|working)\/(?:[^()]|\([^()]*\))+)\)/g, (_, name, f) => `<a data-act="preview" data-file="${f}">${name}</a>`)
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\[([^\]]+)\]\((?:\.\.\/([^/)#]+))?#c(\d+)\)/g, (_, name, label, n) => {
    const id = label ? cur.s.instances.find(i => esc(i.label) === label)?.id : cur.i.id;
    return id ? cref(+n, name, id) : name;
  });

// With an item's threads, each line but a heading or a table's is a point to comment on where it stands: a
// thread there names it by its opening words, its ref, and marks it.
function md(text, threads) {
  let h = '', rows = [];
  const table = () => { if (rows.length) h += `<table>${rows.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</table>`; rows = []; };
  for (const raw of text.split('\n')) {
    const l = esc(raw);
    if (l.trim().startsWith('|')) { if (!/^[\s|:-]+$/.test(l)) rows.push(l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim())); continue; }
    table();
    const line = inline(l.replace(/^(\s*)[-*] /, '$1\u2022 ').replace(/^#+ (.*)/, '<b>$1</b>')), point = threads && !/^\s*(#|$)/.test(raw) && raw.replace(/^\s*(?:[-*+]|\d+[.)])\s+/, '').replace(/\*\*|`/g, '').trim();
    if (!point) { h += line + '\n'; continue; }
    const ref = point.length > 60 ? point.slice(0, 60).replace(/\s+\S*$/, '') + '\u2026' : point, on = threads.filter(t => t.ref && point.startsWith(t.ref.replace(/\u2026$/, '')));
    h += `<span class="pt ${on.length ? 'noted' : ''} ${on.some(t => t.waits) ? 'q' : ''}" data-act="cell" data-ref="${esc(ref)}"${on.length ? ` data-thread="${esc(on[0].id)}" data-note="${esc(on.map(t => t.posts.map(p => `${nameOf(p.by)}: ${p.text}`).join('\n')).join('\n\n'))}"` : ''}>${line}</span>\n`;
  }
  table();
  return h.trimEnd();
}
// Threads from the log: a comment starts one, on an item (at a ref) or the instance, and later comments reply in it. In an open
// instance it waits on a person while the server says so, on whom the agent's ask names or else the runner, and on the agent while
// its last word is a person's. A file a run cited is kept by its instance's id, and shown by that instance's label now.
function threadsOf() {
  const out = new Map(), open = editable(), waiting = new Map((data?.waiting ?? []).map(w => [w.seq, w.who]));
  for (const e of data?.log ?? []) {
    if (!['comment', 'resolve', 'signoff', 'reject', 'withdraw'].includes(e.op)) continue;
    if (!out.has(e.thread)) out.set(e.thread, { id: e.thread, item: e.item, ref: e.ref, posts: [] });
    const t = out.get(e.thread), root = +e.thread.slice(1);
    t.last = e;
    if (e.op === 'resolve') continue;
    if (e.op === 'withdraw') { t.posts.find(p => p.seq === e.on).withdrawn = e; continue; }
    // Where it hangs: under its parent, an approval or a rejection under its proposal; from before replies named what they answer,
    // under the first.
    const under = e.parent ?? e.on ?? (e.seq === root ? undefined : root);
    if (e.op === 'comment') t.posts.push({ ...e, under, waits: waiting.get(e.seq), files: e.files?.map(f => !f.inst ? f : f.inst === cur.i.id ? f.path : `../${cur.s.instances.find(i => i.id === f.inst)?.label}/${f.path}`) });
    // A sign-off with approved false is rf 0.12's reject.
    else t.posts.push({ ...e, under, text: `${e.op === 'reject' || e.approved === false ? 'Rejected' : 'Approved'}${e.text ? `: ${e.text}` : ''}` });
  }
  for (const t of out.values()) Object.assign(t, {
    waits: t.posts.find(p => p.waits)?.waits ?? null,
    pending: open && t.last.op !== 'resolve' && ['runner', 'answer'].includes(data.standing[t.last.seq]),
  });
  return [...out.values()];
}

const place = t => t.item ? `On <a data-act="opencard" data-item="${esc(t.item)}">${esc(data.doc.items.find(i => i.id === t.item)?.name ?? t.item)}</a>${t.ref ? ` at ${esc(t.ref)}` : ''}` : 'On the instance';

function threadHtml(t) {
  const state = t.waits ? ` \u00b7 waits on ${who(t.waits)}` : t.pending ? ' \u00b7 <span class="spin"></span> the agent picks it up next' : '';
  return `<div class="thread ${t.waits ? 'waits' : ''}" data-thread="${esc(t.id)}"><div class="on">${place(t)}${state}</div>`
    + data.log.filter(e => e.op === 'done' && e.rules && e.thread === t.id).map(processNote).join('') + postHtml(t, t.posts[0], 0) + '</div>';
}

// A comment, with its reactions, its cN, which copies a link to it, and Reply, and, for a proposal this person hasn't approved or
// rejected, Approve and Reject, each opening a box of its own, there all along so that it opens where it is, and how many runs went
// since, which may have changed what it links; then what hangs under it, three levels deep, past which a link opens the rest as a
// thread of its own. A long one folds until More. Its twisty collapses it, with what hangs under it, to its first line, as this
// browser keeps it until someone adds to it. One the agent withdrew shows as why, a line until a click opens it.
function postHtml(t, p, depth) {
  const kids = t.posts.filter(k => k.under === p.seq), open = editable(), off = data.run ? ' disabled title="Available when the run ends"' : '';
  // An ask from before questions and proposals, ask true, may have been either.
  const proposal = p.ask === 'proposal' || p.ask === true, kind = p.ask === 'proposal' ? 'propose' : p.ask ? 'ask' : '';
  const decides = open && proposal && p.seq > copied() && !p.withdrawn && !t.posts.some(k => k.on === p.seq && k.by === me.email), since = decides && data.log.filter(e => e.op === 'run' && e.seq > p.seq).length;
  const long = !ui.full.has(p.seq) && (p.text.length > 900 || p.text.split('\n').length > 12), all = n => t.posts.filter(k => k.under === n).reduce((c, k) => c + 1 + all(k.seq), 0);
  const end = q => Math.max(q.seq, ...t.posts.filter(k => k.under === q.seq).map(end)), head = `<b class="${p.by === 'agent' ? '' : 'p'}">${p.see ? agentOf(p) : who(p.by)}</b> <span class="tm">`;
  const gone = p.withdrawn && `withdrawn: ${esc(p.withdrawn.text)}${p.withdrawn.see ? ` \u00b7 see ${cref(p.withdrawn.see, `c${p.withdrawn.see}`)}` : ''}`;
  if (gone && !ui.withdrawn.has(p.seq)) return `<div class="post withdrawn folded" data-seq="${p.seq}" data-act="withdrawn" title="Show what it said"><span class="fold">\u25B8</span>${gone}${kids.length ? ` \u00b7 ${all(p.seq)} more` : ''}</div>`;
  if (JSON.parse(localStorage[`folds:${cur.i.id}`] ?? '{}')[p.seq] === end(p)) return `<div class="post folded ${kind} ${p.waits ? 'waits' : ''}" data-seq="${p.seq}"><button class="fold" data-act="fold" data-seq="${p.seq}" title="Expand">\u25B8</button>${head}${hhmm(p.at)}</span> ${esc(firstLine(p.text))}${kids.length ? `<span class="tm"> \u00b7 ${all(p.seq)} more</span>` : ''}</div>`;
  const box = (mode, hint, placeholder, button) => `<div class="reply" data-mode="${mode}" ${draft.replying.get(p.seq) === mode ? '' : 'hidden'}>${hint ? `<div class="hint">${hint}</div>` : ''}<textarea rows="2" placeholder="${placeholder}"></textarea>${mode === 'reply' ? '<input type="file" multiple>' : ''}<div class="row2">${button}<button class="quiet" data-act="reply" data-mode="${mode}" data-seq="${p.seq}">Cancel</button></div></div>`;
  let h = `<div class="post ${kind} ${gone ? 'withdrawn' : ''} ${p.waits ? 'waits' : ''}" data-seq="${p.seq}">${gone ? `<div class="gone" data-act="withdrawn" data-seq="${p.seq}" title="Fold it again"><span class="fold">\u25BE</span>${gone}</div>` : ''}<button class="fold" data-act="fold" data-seq="${p.seq}" data-end="${end(p)}" title="Collapse">\u25BE</button>${head}${hhmm(p.at)}${p.op === 'comment' ? ` <a class="cn" data-act="copylink" data-seq="${p.seq}" title="Copy a link to this comment">c${p.seq}</a>` : ''}${p.to ? ` \u00b7 to ${who(p.to)}` : ''}${data.standing[p.seq] === 'note' ? ` \u00b7 a note for ${who(data.runner.by)}` : ''}${p.waits ? ` \u00b7 waits on ${who(p.waits)}` : ''}${since ? ` \u00b7 <span title="What it links may have changed since: check it before approving">${since} run${since > 1 ? 's' : ''} since</span>` : ''}${p.commit ? ` \u00b7 commit <code>${p.commit.slice(0, 7)}</code>` : ''}</span>`
    + `<div class="pb ${long ? 'long' : ''}">${p.see ? esc(p.text) : crefs(p.by === 'agent' && p.op === 'comment' ? md(p.text) : esc(p.text))}</div>${long ? `<a class="more" data-act="more" data-seq="${p.seq}">More</a>` : ''}`
    + (p.files ?? []).map(f => `<div class="f">${/\.(png|jpe?g|gif|webp|svg)$/i.test(f) ? `<img src="${fileUrl(f)}" loading="lazy" alt="${esc(fname(f))}" title="${esc(fname(f))}" data-act="preview" data-file="${esc(f)}">` : `<a data-act="preview" data-file="${esc(f)}">${esc(fname(f))}</a>`}</div>`).join('');
  if (p.op === 'comment') h += `<div class="pa">${reactHtml(p.seq)}${open ? `<button class="quiet reply-to" data-act="reply" data-seq="${p.seq}">Reply</button>` : ''}`
    + `${decides ? `<button class="quiet" data-act="reply" data-mode="approve" data-seq="${p.seq}">Approve\u2026</button><button class="quiet" data-act="reply" data-mode="reject" data-seq="${p.seq}">Reject\u2026</button>` : ''}</div>`;
  if (open && p.op === 'comment') h += box('reply', proposal && 'A reply approves nothing: for the agent to go ahead, approve it.', 'Reply', `<button class="btn" data-act="reply-post" data-seq="${p.seq}">Reply</button>`);
  if (decides) h += box('approve', 'The agent will go ahead with this. Approving commits the instance as it is now, in your name.', 'A note, if you like', `<button class="btn commit" data-act="approve" data-seq="${p.seq}"${off}>Approve: go ahead</button>`)
    + box('reject', "The agent won't do this, and carries on as your note says.", 'What to do instead, if you like', `<button class="btn" data-act="reject" data-seq="${p.seq}">Reject</button>`);
  if (kids.length) h += depth < 3 ? `<div class="kids">${kids.map(k => postHtml(t, k, depth + 1)).join('')}</div>` : `<a class="more" data-act="alone" data-seq="${p.seq}">Continue this thread \u2192 ${all(p.seq)} more</a>`;
  return h + '</div>';
}

// Thumbs up and down on a comment, or, with no seq, on the instance: each person's last say, the names on hover, yours marked.
function reactHtml(seq) {
  const last = new Map();
  for (const e of data.log) if (e.op === 'react' && e.on === seq) last.set(e.by, e.up);
  const names = up => [...last].filter(([, u]) => u === up).map(([by]) => nameOf(by)), tag = archived() ? 'span' : 'button';
  return [[true, '\u{1F44D}'], [false, '\u{1F44E}']].map(([up, icon]) => `<${tag} class="react ${last.get(me.email) === up ? 'on' : ''}"${archived() ? '' : ` data-act="react" data-up="${up}"${seq === undefined ? '' : ` data-seq="${seq}"`}`} title="${esc(names(up).join(', '))}">${icon}${names(up).length ? ` ${names(up).length}` : ''}</${tag}>`).join('');
}

// The rules a run added to the process, or reworded, on the thread whose entry started it, or else on its line.
const processNote = d => `<div class="pnote"><a data-act="preview" data-file="working/process.md">Process: +${plural(d.rules, 'rule')}</a> in run ${d.run}</div>`;

// A run, as one line among the threads: how it ended, how long it took and what it cost, opening to why it failed.
function runHtml(r, latest) {
  const d = data.log.find(e => e.op === 'done' && e.run === r.run);
  const line = `Run ${r.run} \u00b7 ${!d ? `<span class="spin"></span> going \u00b7 ${usd(data.run?.cost ?? 0, data.run?.estimated)}` : `${d.error ? '<span class="bad">failed</span>' : d.aborted ? 'stopped' : 'done'} \u00b7 ${took(d)} \u00b7 ${usd(d.cost, d.estimated)}`}`;
  const body = (d?.error ? `<div class="post bad">${esc(d.error)}</div>` : '') + (d?.rules && !d.thread ? processNote(d) : '');
  return body ? `<details class="runl" data-key="run${r.run}" ${ui.sect[`run${r.run}`] ?? latest ? 'open' : ''}><summary>${line}</summary>${body}</details>` : `<div class="runl">${line}</div>`;
}

// The conversation, as a chat reads: the threads and the runs among them, oldest first, a thread where its last word is and a run
// where it ended; and at the panel's foot, kept there as it scrolls, the box to comment on the instance.
function conversationHtml() {
  const open = editable(), name = id => esc(data.doc.items.find(i => i.id === id)?.name ?? id), mine = data.runner.by === me.email;
  const moved = data.log.findLast(e => e.op === 'move'), runs = data.log.filter(e => e.op === 'run');
  let h = moved ? `<div class="sub">Moved ${when(moved.at)} from ${esc(moved.from)} to ${esc(moved.to)}, ${who(moved.accepted_by ?? moved.by)} accepting.</div>` : '';
  const alone = ui.alone && threads.find(t => t.posts.some(p => p.seq === ui.alone));
  if (alone) {
    // The comments it hangs under, a line each, any opening the rest from there, then it and what hangs under it.
    const p = alone.posts.find(p => p.seq === ui.alone), up = [];
    for (let a = alone.posts.find(x => x.seq === p.under); a; a = alone.posts.find(x => x.seq === a.under)) up.unshift(a);
    return `<a class="more" data-act="alone">\u2190 Back to the conversation</a><div class="thread"><div class="on">${place(alone)}</div>`
      + up.map(a => `<a class="up" data-act="alone" data-seq="${a.seq}">${who(a.by)}: ${esc(firstLine(a.text))}</a>`).join('') + postHtml(alone, p, 0) + '</div>';
  }
  const ended = r => data.log.find(e => e.op === 'done' && e.run === r.run)?.seq ?? Infinity;
  h += [...threads.map(t => [t.last.seq, threadHtml(t)]), ...runs.map(r => [ended(r), runHtml(r, r === runs.at(-1))])].sort((a, b) => a[0] - b[0]).map(([, x]) => x).join('');
  // Before its first run, its runner may tick its logins anew where they write its first prompt.
  const first = mine && !runs.length, lends = first && myLogins.some(l => l.offers.length);
  if (open) h += `<div class="compose"><h3>${draft.on ? `Comment on ${name(draft.on)}${draft.ref ? ` at ${esc(draft.ref)}` : ''}` : 'Comment on the instance'}</h3>`
    + (lends ? `<div class="ticks2">Credentials:${ticksHtml(myLogins, data.runner.logins, cur.w)}</div>` : '')
    + `<textarea id="newcomment" rows="3" placeholder="${first ? 'What should the agent do? Drop files here too' : data.starts ? 'The agent replies in the thread' : `A note for ${esc(nameOf(data.runner.by))}: the agent takes it up once they do`}"></textarea><input type="file" id="newfiles" multiple>${lends ? '<div class="consent">By clicking Comment, you agree that agents carry these credentials while acting as you.</div>' : ''}<div><button class="btn primary" data-act="comment">Comment</button></div></div>`;
  if (data.doc.status === 'closed' && !archived()) h += '<div class="compose"><div><button class="btn" data-act="correct">Add a correction</button></div></div>';
  return h;
}

function renderCard() {
  const card = $('#card');
  const item = openItem && data?.doc.items.find(i => i.id === openItem);
  if (!item) {
    card.hidden = true;
    cardPv = null;
    return;
  }
  // On a desktop, the card shows its file's preview, which scrolls inside it; a phone's opens it in full.
  const open = editable(), wide = item.file && innerWidth > 800;
  if (wide && cardPv?.path !== item.file) {
    const p = cardPv = previewOf(item.file, item);
    load(p).then(() => cardPv === p && renderCard());
  }
  card.classList.toggle('wide', !!wide);
  let h = `<div class="cf">${esc(item.file ? fname(item.file) : item.name)}</div>`;
  if (item.file) {
    const p = provenance(item.file);
    h += `<div class="cp"><b class="${p.person ? 'p' : ''}">${person(p.by)}</b> ${p.person ? 'uploaded' : 'made'} it at ${hhmm(p.at)} · ${esc(item.name)}${item.source ? `<br>${esc(item.source)}` : ''}`
      + (item.kind === 'output' ? `<br>Destination: ${item.destination ? esc(item.destination) : 'stays here'}` : '')
      + data.log.filter(e => e.op === 'delivered' && e.item === item.id && e.seq > copied()).map(e => `<br><span class="sent">Sent to ${esc(e.to)} ${when(e.at)} · ${esc(e.receipt)}</span>`).join('') + '</div>';
  } else h += `<div class="cp">${item.kind === 'input' ? 'Expected input, not there yet' : `${item.kind === 'step' ? 'Step' : 'Output'} not built yet`}</div>`;
  const from = (item.from ?? []).map(f => data.doc.items.find(i => i.id === f)).filter(Boolean);
  if (from.length) h += `<div class="cp">Made from ${from.map(f => `<a data-act="opencard" data-item="${esc(f.id)}">${esc(f.name)}</a>`).join(', ')}</div>`;
  if (wide) h += `<div class="cpv">${cardPv.att ? `<div class="sub"><a data-act="attachment-back">\u2190 ${esc(cardPv.title)}</a> \u00b7 ${esc(cardPv.att.title)}</div>` : ''}${previewBody(cardPv.att ?? cardPv)}</div>`;
  // The item's open threads, each as it began, with where it stands.
  for (const t of talkOn(item.id)) {
    const p = t.posts[0], more = t.posts.length - 1;
    h += `<div class="nb ${t.waits ? 'waits' : ''}">${t.ref ? `<span class="ref">${esc(t.ref)}</span>` : ''}${p.by === 'agent' ? '' : `<b>${who(p.by)}</b>: `}${esc(p.text)}`
      + (p.files?.length ? `<div class="cites">${p.files.map(f => `<a data-act="preview" data-file="${esc(f)}">${esc(fname(f))}</a>`).join('')}</div>` : '')
      + `<div class="by">${more ? `${more} repl${more > 1 ? 'ies' : 'y'} \u00b7 ` : ''}${t.waits ? `Waits on ${who(t.waits)} \u00b7 ` : t.pending ? '<span class="spin"></span> the agent picks it up next \u00b7 ' : ''}<a data-act="thread" data-thread="${esc(t.id)}"${open ? ' class="reply-to"' : ''}>${open ? 'Reply' : 'Open'}</a></div></div>`;
  }
  h += '<div class="acts">';
