# The tests on every push and pull request. A tag's run, once they pass, makes its GitHub Release, which the hosts' updaters
# deploy (docs/deploy.md); a tag whose message has a line starting "Manual:" makes a prerelease, which they stop at.
name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: astral-sh/setup-uv@v6
      # Runs are bubblewrap sandboxes, which Ubuntu's AppArmor keeps from making user namespaces unless told.
      - run: |
          sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: |
          npm ci
          npx playwright install --with-deps chromium
          uv venv --python 3.13 .venv && uv pip install --python .venv/bin/python -r requirements.txt
      - run: node --test test/*.test.ts
        env:
          RF_SANDBOX_SCOPE: ''
          RF_MIN_FREE_GB: 0
          RF_SCRATCH: ${{ runner.temp }}/rollforward
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q -f origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "$notes" $(grep -q '^Manual:' <<< "$notes" && echo --prerelease)
